<!doctype html>
<html lang="en" data-ts="m">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cpp Hero</title>
<meta name="description" content="Learn C++ from zero and defend your code. A game-like app with Curlo the brace-bean.">
<meta name="theme-color" content="#F2641B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cpp Hero">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=DM+Mono:wght@400;500&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<!--INLINE:styles.css-->
</head>
<body>
<!-- Ambient background (decorative) -->
<div class="world" aria-hidden="true"><div class="amb a"></div><div class="amb b"></div><div class="amb c"></div></div>

<div class="app" id="app">
  <a class="skip-link" href="#stage">Skip to content</a>
  <header class="topbar">
    <div class="brand" id="brandMark"><span class="brand-c" aria-hidden="true"></span><span>Cpp Hero</span></div>
    <button class="ibtn" id="btnStats" aria-label="Stats" title="Stats"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" fill="none" stroke="#2A2140" stroke-width="2.6" stroke-linecap="round"/></svg></button>
    <button class="ibtn" id="btnSettings" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2" fill="#FFC62E" stroke="#2A2140" stroke-width="2.2"/><path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3M5.5 5.5l2.1 2.1M16.4 16.4l2.1 2.1M5.5 18.5l2.1-2.1M16.4 7.6l2.1-2.1" stroke="#2A2140" stroke-width="2.4" stroke-linecap="round"/></svg></button>
  </header>
  <div class="hud" id="hud" aria-label="Player status"></div>

  <main class="stage" id="stage" tabindex="-1">
    <div class="splash" id="splash" aria-hidden="true"><div class="splash-dot"></div></div>
  </main>

  <nav class="tabs" aria-label="Main">
    <button class="tab" data-go="map"><span class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20c3-1 3-5 8-6s5-5 8-8"/><circle cx="20" cy="6" r="2" fill="currentColor"/><circle cx="4" cy="20" r="2" fill="currentColor"/></svg></span>Map</button>
    <button class="tab" data-go="buddy"><span class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><rect x="6" y="4" width="12" height="16" rx="6"/><circle cx="10" cy="11" r="1.2" fill="currentColor"/><circle cx="14" cy="11" r="1.2" fill="currentColor"/><path d="M3 8c-1 2-1 6 0 8M21 8c1 2 1 6 0 8"/></svg></span>Curlo</button>
    <button class="tab" data-go="practice"><span class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/></svg></span>Practice</button>
    <button class="tab" data-go="vault"><span class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11M9 8h6"/></svg></span>Vault</button>
    <button class="tab" data-go="bestiary"><span class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" aria-hidden="true"><ellipse cx="12" cy="14" rx="5.5" ry="6.5"/><path d="M12 8v12M6.5 11H3M21 11h-3.5M6.5 16H3.5M20.5 16H17.5M9 6L7 3.5M15 6l2-2.5"/></svg></span>Bestiary</button>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="flash" id="flash" aria-hidden="true"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>
  <div id="overlay-root"></div>
</div>

<noscript><p style="padding:24px;font-family:sans-serif">Cpp Hero needs JavaScript to run.</p></noscript>

<!-- Engine core first (namespace, utils, events), then save store -->
<!--INLINE:engine/core.js-->
<!--INLINE:engine/store.js-->
<!-- Content: pure data. Adding a world = one file + one line here. -->
<!--INLINE?:content/shared.js-->
<!--INLINE?:content/world01.js-->
<!--INLINE?:content/world02.js-->
<!--INLINE?:content/world03.js-->
<!-- Engine modules -->
<!--INLINE:engine/audio.js-->
<!--INLINE:engine/fx.js-->
<!--INLINE:engine/art.js-->
<!--INLINE:engine/curlo.js-->
<!--INLINE:engine/progress.js-->
<!--INLINE:engine/ui.js-->
<!--INLINE:engine/codeview.js-->
<!--INLINE:engine/arena.js-->
<!--INLINE:engine/challenges.js-->
<!--INLINE:engine/session.js-->
<!--INLINE:engine/project.js-->
<!--INLINE:engine/boss.js-->
<!--INLINE:engine/screens.js-->
<!--INLINE:engine/onboarding.js-->
<!--INLINE:engine/main.js-->
</body>
</html>
