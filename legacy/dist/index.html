        over = true;
        clearInterval(timer);
        document.removeEventListener('visibilitychange', vis);
        document.removeEventListener('keydown', keys);
        var right = answers.filter(function (a) { return a && a.good; }).length, total = items.length;
        var pass = right >= Math.ceil(total * 2 / 3);
        cardWrap.innerHTML = '<div class="tdone">' + icon(timeout ? 'clock' : 'bolt') + '<b>' + (timeout ? 'Time!' : 'Done!') + '</b> ' + right + ' / ' + total + ' right</div>';
        count.textContent = right + ' / ' + total + ' right';
        feedback(sh, pass, cardWrap);
        var det = '<ul class="why">' + items.map(function (it, k) {
          var a = answers[k], ok = a && a.good;
          return '<li class="' + (ok ? 'yes' : 'nope') + '">' + icon(ok ? 'ok' : 'no') + '<div>' + cfg.recap(it, a) + '</div></li>';
        }).join('') + '</ul>' + (pass ? '' : '<p class="small muted">Get at least ' + Math.ceil(total * 2 / 3) + ' right to pass the round.</p>');
        showResult(ch, ctx, sh, state, { correct: pass, assisted: false, score: right / total, right: right, total: total, hints: 0 }, det).then(resolve);
      }
    });
  }

  R.safe = function (ch, ctx, sh, state) {
    return timed(ch, ctx, sh, state, {
      seconds: 30,
      help: 'Is each snippet safe or unsafe? Keys: S = safe, U = unsafe.',
      key: function (e) { var k = e.key.toLowerCase(); return k === 's' || k === 'arrowleft' ? 1 : k === 'u' || k === 'arrowright' ? 0 : null; },
      card: function (it) {
        var c = U.h('<div><div class="tcode-wrap"></div><div class="su-btns">' +
          '<button class="pbtn teal" data-k="1">' + icon('shield') + 'Safe <kbd>S</kbd></button>' +
          '<button class="pbtn coral" data-k="0">' + icon('alert') + 'Unsafe <kbd>U</kbd></button></div></div>');
        c.querySelector('.tcode-wrap').appendChild(CH.code.block(it.code, { label: 'Snippet' }));
        return c;
      },
      isRight: function (it, k) { return (k === 1) === !!it.safe; },
      recap: function (it, a) {
        return '<code class="snip">' + U.esc(String(it.code).split('\n').map(function (s) { return s.trim(); }).join(' ')) + '</code><span class="wl"><b>' + (it.safe ? 'Safe.' : 'Unsafe.') + '</b> ' +
          (a ? '' : '<i>(no answer)</i> ') + U.md(it.why || '') + '</span>';
      }
    });
  };

  R.speed = function (ch, ctx, sh, state) {
    return timed(ch, ctx, sh, state, {
      seconds: 45,
      help: 'Tap an answer (or press 1–4). Go go go!',
      key: function (e) { return /^[1-8]$/.test(e.key) ? +e.key - 1 : null; },
      card: function (it) {
        var c = U.h('<div><div class="tq">' + U.md(it.q || '') + '</div><div class="tcode-wrap"></div><div class="opts single tight"></div></div>');
        if (it.code) c.querySelector('.tcode-wrap').appendChild(CH.code.block(it.code, { label: 'Snippet' }));
        var o = c.querySelector('.opts');
        (it.options || []).forEach(function (op, k) {
          o.insertAdjacentHTML('beforeend', '<button class="opt" data-k="' + k + '"><span class="key" aria-hidden="true">' + (k + 1) + '</span><span class="otxt mono">' + U.esc(optText(op)) + '</span></button>');
        });
        return c;
      },
      isRight: function (it, k) { return k === it.answer; },
      recap: function (it, a) {
        var right = optText((it.options || [])[it.answer]);
        return '<span class="wl"><b>' + U.md(it.q || '') + '</b> Answer: <code class="i">' + U.esc(right) + '</code>' +
          (a && !a.good ? ' <span class="muted">(you: ' + U.esc(optText(it.options[a.k])) + ')</span>' : '') + (a ? '' : ' <i>(no answer)</i>') + '</span>';
      }
    });
  };

  /* ======================================================================
     Public entry
     ====================================================================== */
  function render(ch, host, ctx) {
    ctx = ctx || {};
    var sh = shell(ch, ctx);
    host.appendChild(sh.el);
    var state = { answered: false, hints: 0, assisted: false };
    if (CH.dev) CH._cur = { ch: ch, el: sh.el };   // dev/test hook
    var fn = R[ch.type];
    if (!fn) {
      sh.body.innerHTML = '<p>Unknown challenge type: ' + U.esc(ch.type) + '</p>';
      var b = U.h('<button class="pbtn">Skip</button>'); sh.actions.appendChild(b);
      return new Promise(function (res) { b.onclick = function () { res({ correct: true, assisted: true, skipped: true }); }; });
    }
    if (ch.type !== 'safe' && ch.type !== 'speed') hints(ch, ctx, sh, state);
    CH.fx.slideUp(sh.el);
    return fn(ch, ctx, sh, state);
  }

  CH.challenges = {
    TYPES: TYPES,
    DEFENSIVE: DEFENSIVE,
    HINT_COST: HINT_COST,
    validate: validate,
    normalize: normalize,
    matches: matches,
    answerText: answerText,
    render: render
  };
})();
</script>
<script>
/* engine/session.js */
/* ==========================================================================
   Cpp Hero — engine/session.js  (CH.session)
   The immersive "session" shell shared by lessons, projects, bosses, reviews,
   practice and placement: quit button, progress bar, combo + hearts chips,
   card-slide pages, challenge scoring (XP × combo multiplier, hint costs,
   hearts), and the no-dead-end out-of-hearts refill round.
   Also: the Lesson player (concept → demo → challenges → recap → results)
   and simple review / practice runners.
   ========================================================================== */
(function () {
  'use strict';
  var CH = window.CH, U = CH.util, G = function () { return CH.game; };
  function S() { return CH.store.state; }
  var icon = function (n, c) { return CH.ui.icon(n, c); };

  var BASE_XP = { lesson: 10, boss: 12, project: 8, practice: 15, review: 8, refill: 5, placement: 0 };
  var HEART_MODES = ['lesson', 'boss'];
  var RETRY_MODES = ['lesson', 'project', 'practice', 'review', 'refill'];   // never boss / placement
  var RETRY_XP = 2;

  /* ======================================================================
     Session shell
     ====================================================================== */
  function Session(opts) {
    this.opts = opts;
    this.mode = opts.mode;
    this.xp = 0;           // XP earned this session (net)
    this.right = 0; this.total = 0;
    this.bestCombo = 0;
    this.t0 = Date.now();
    this.quit = false;
    var self = this;
    var el = U.h('<section class="session mode-' + opts.mode + '" aria-label="' + U.esc(opts.title || 'Session') + '">' +
      '<header class="sess-top">' +
        '<button class="xbtn sess-quit" aria-label="Quit">' + icon('x') + '</button>' +
        '<div class="sess-prog" role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></div>' +
        '<div class="chip combo" aria-live="polite">' + icon('bolt') + '<span>x0</span></div>' +
        (HEART_MODES.indexOf(opts.mode) >= 0 ? '<div class="chip sess-hearts" aria-label="Hearts">' + icon('heart') + '<span></span></div>' : '') +
      '</header>' +
      '<div class="scroll sess-scroll"><div class="sess-stage"></div></div></section>');
    this.el = el;
    this.stage = el.querySelector('.sess-stage');
    this.scroller = el.querySelector('.sess-scroll');
    el.querySelector('.sess-quit').onclick = function () { self.askQuit(); };
    this._onKey = function (e) {
      if (e.key === 'Escape' && !U.$('#overlay-root').children.length) { e.preventDefault(); self.askQuit(); }
    };
    document.addEventListener('keydown', this._onKey);
    G().combo = 0;
    this.updateHearts();
    this.updateCombo(true);
  }

  Session.prototype.dispose = function () { document.removeEventListener('keydown', this._onKey); };

  Session.prototype.askQuit = function () {
    var self = this;
    if (this._asking) return;
    this._asking = true;
    CH.ui.confirm(this.opts.quitTitle || 'Leave this ' + (this.opts.noun || 'session') + '?',
      this.opts.quitText || 'Your progress in this ' + (this.opts.noun || 'session') + ' won’t be saved.', 'Leave', 'Keep going', true)
      .then(function (yes) {
        self._asking = false;
        if (!yes) return;
        self.quit = true;
        self.dispose();
        if (self.opts.onQuit) self.opts.onQuit();
        CH.router.go('map', {}, { dir: 'down', root: true });
      });
  };

  Session.prototype.setProgress = function (p) {
    var bar = this.el.querySelector('.sess-prog');
    p = U.clamp(p, 0, 1);
    bar.querySelector('i').style.transform = 'scaleX(' + p + ')';
    bar.setAttribute('aria-valuenow', Math.round(p * 100));
  };

  Session.prototype.updateHearts = function () {
    var h = this.el.querySelector('.sess-hearts span');
    if (h) { h.textContent = S().hearts.n; this.el.querySelector('.sess-hearts').setAttribute('aria-label', S().hearts.n + ' hearts'); }
  };

  Session.prototype.updateCombo = function (silent) {
    var c = this.el.querySelector('.combo'), n = G().combo, m = G().multiplier();
    c.querySelector('span').textContent = 'x' + n + (m > 1 ? ' · ' + m + '× XP' : '');
    c.classList.toggle('hot', n >= 3);
    c.classList.toggle('blaze', n >= 6);
    c.style.setProperty('--heat', Math.min(1, n / 10));
    if (!silent && n > 0) CH.fx.anim(c, [{ transform: 'scale(1)' }, { transform: 'scale(1.3) rotate(-6deg)' }, { transform: 'scale(1)' }], { duration: 450, easing: CH.fx.SPRING });
  };

  /** Replace the page with a card-slide transition. Returns the new page element. */
  Session.prototype.page = function (content) {
    var old = this.stage.querySelector('.sess-page:not(.leaving)');
    var pg = U.h('<div class="sess-page"></div>');
    if (content) pg.appendChild(content);
    this.stage.appendChild(pg);
    this.scroller.scrollTop = 0;
    if (old) {
      old.classList.add('leaving');
      var rm = CH.fx.reduced();
      CH.fx.anim(old, rm ? [{ opacity: 1 }, { opacity: 0 }] : [{ transform: 'none', opacity: 1 }, { transform: 'translate(-12%, -2%) scale(.9)', opacity: 0 }],
        { duration: rm ? 120 : 220, easing: 'cubic-bezier(.5,0,.75,0)', fill: 'forwards', rm: 'keep' }).then(function () { old.remove(); });
      setTimeout(function () { old.remove(); }, 500);
      CH.fx.anim(pg, rm ? [{ opacity: 0 }, { opacity: 1 }] : [{ transform: 'translateX(34%) translateY(3%) scale(.94) rotate(2deg)', opacity: 0 }, { transform: 'translateX(-1.5%) scale(1.005)', opacity: 1, offset: 0.68 }, { transform: 'none', opacity: 1 }],
        { duration: rm ? 140 : 380, easing: 'cubic-bezier(.22,.9,.3,1.05)', rm: 'keep' });
    }
    return pg;
  };

  /**
   * Run one challenge on a new page with full scoring.
   * extra: { eyebrow, base (XP), noHearts, onAnswer(res) }
   */
  Session.prototype.challenge = function (ch, extra) {
    extra = extra || {};
    var self = this, mode = extra.mode || this.mode;
    var pg = this.page();
    if (extra.before) pg.appendChild(extra.before);
    var usesHearts = HEART_MODES.indexOf(mode) >= 0 && !extra.noHearts;
    return CH.challenges.render(ch, pg, {
      mode: mode,
      eyebrow: extra.eyebrow,
      noHints: mode === 'placement' || extra.noHints,
      allowRetry: RETRY_MODES.indexOf(mode) >= 0 && !extra.noRetry,
      continueLabel: extra.continueLabel,
      onHint: function (tier, cost, btn) {
        var d = G().addXP(-cost, 'hint');
        self.xp += d;
        if (d) CH.fx.floatText(btn, d + ' XP', 'neg');
      },
      onAnswer: function (res, sh) {
        var out = {};
        if (res.retry) {
          // Second try after a miss: no hearts, no combo, tiny consolation XP.
          if (res.correct) {
            var dr = G().addXP(RETRY_XP, 'retry');
            self.xp += dr;
            if (dr) out.xpText = '+' + dr + ' XP';
          }
          self.updateCombo(true);
          if (extra.onAnswer) extra.onAnswer(res);
          return out;
        }
        self.total++;
        G().recordAnswer(ch, res.correct, mode === 'refill' ? 'review' : mode, res.assisted, res.hints);
        if (res.correct) {
          self.right++;
          if (!res.assisted) {
            var base = extra.base != null ? extra.base : BASE_XP[mode] || 10;
            if (res.score != null) base = Math.round(base * 1.5);
            var gain = Math.round(base * G().multiplier());
            if (gain > 0) {
              var d = G().addXP(gain, 'correct');
              self.xp += d;
              out.xpText = '+' + d + ' XP';
              setTimeout(function () { CH.fx.floatText(sh.el.querySelector('.rh') || sh.el, '+' + d + ' XP', 'pos'); }, 120);
            }
          }
        } else if (usesHearts) {
          G().loseHeart();
          var hc = self.el.querySelector('.sess-hearts');
          if (hc) { CH.audio.play('heart'); CH.fx.anim(hc, [{ transform: 'none' }, { transform: 'scale(1.35) rotate(-10deg)' }, { transform: 'none' }], { duration: 420, easing: CH.fx.SPRING }); CH.fx.floatText(hc, '−1 ♥', 'neg'); }
          out.xpText = '−1 heart';
        }
        self.bestCombo = Math.max(self.bestCombo, G().combo);
        self.updateCombo(!res.correct);
        self.updateHearts();
        if (extra.onAnswer) extra.onAnswer(res);
        return out;
      }
    }).then(function (res) {
      if (usesHearts && S().hearts.n <= 0 && !self.quit) return self.refill().then(function () { return res; });
      return res;
    });
  };

  /** Out of hearts mid-session: offer a quick review round (+1 heart) or quit. No dead end. */
  Session.prototype.refill = function () {
    var self = this;
    return CH.ui.dialog({
      title: 'Out of hearts!', mood: 'worried',
      html: '<p>' + CH.curlo.line('noHearts') + '</p>' + CH.ui.heartClockHTML() + '<p class="muted small">Or answer 3 quick review questions to earn one now. No hearts lost there.</p>',
      onMount: CH.ui.bindHeartClock,
      buttons: [{ label: icon('practice') + 'Earn a heart', value: 'refill', cls: 'teal' }, { label: 'Quit to map', value: 'quit', cls: 'ghost' }],
      dismissValue: 'refill'
    }).then(function (v) {
      if (v === 'quit') {
        self.quit = true; self.dispose();
        CH.router.go('map', {}, { dir: 'down', root: true });
        return Promise.reject(new Error('quit'));
      }
      var set = G().reviewSet(3, true);
      if (set.length < 3 && self.opts.fallbackPool) {
        U.shuffle(self.opts.fallbackPool).forEach(function (c) { if (set.length < 3 && set.indexOf(c) < 0 && G().TIMED.indexOf(c.type) < 0) set.push(c); });
      }
      if (!set.length) { G().gainHeart(1); self.updateHearts(); return; }
      var got = 0, i = 0;
      function next() {
        if (i >= set.length) {
          if (got > 0) {
            G().gainHeart(1); CH.audio.play('heal'); self.updateHearts();
            CH.fx.toast('+1 heart! Back to it!', { icon: icon('heart') });
            return;
          }
          return CH.ui.dialog({ title: 'So close!', mood: 'thinking', html: '<p>Get at least one right to earn the heart. Let’s try another round!</p>', buttons: [{ label: 'Try again', value: 1 }] })
            .then(function () { set = U.shuffle(set); i = 0; return next(); });
        }
        var ch = set[i++];
        return self.challenge(ch, { mode: 'refill', eyebrow: 'Heart refill · ' + i + ' of ' + set.length, noHearts: true })
          .then(function (r) { if (r.correct) got++; return next(); });
      }
      return next();
    });
  };

  /** Standard "results" page. opts: { title, sub, tiles:[{label, value, fmt}], extraEl, button, mood } */
  Session.prototype.results = function (o) {
    var self = this;
    var secs = Math.round((Date.now() - this.t0) / 1000);
    var el = U.h('<div class="results">' +
      '<div class="res-curlo"></div>' +
      '<h2 class="res-title">' + U.esc(o.title) + '</h2>' + (o.sub ? '<p class="res-sub">' + o.sub + '</p>' : '') +
      '<div class="tiles"></div><div class="res-extra"></div>' +
      '<button class="pbtn big" data-autofocus>' + U.esc(o.button || 'Continue') + icon('next') + '</button></div>');
    var c = CH.curlo.mount(el.querySelector('.res-curlo'), { mood: o.mood || 'celebrate' });
    var tiles = el.querySelector('.tiles');
    var list = o.tiles || [
      { label: 'XP earned', value: Math.max(0, this.xp), cls: 'sun', icon: 'bolt', fmt: function (n) { return '+' + n; } },
      { label: 'Accuracy', value: this.total ? Math.round(100 * this.right / this.total) : 100, cls: 'teal', icon: 'target', fmt: function (n) { return n + '%'; } },
      { label: 'Best combo', value: this.bestCombo, cls: 'tang', icon: 'flame', fmt: function (n) { return 'x' + n; } },
      { label: 'Time', value: secs, cls: 'sky', icon: 'clock', fmt: U.fmtDuration }
    ];
    list.forEach(function (t, i) {
      var tile = U.h('<div class="tile-stat ' + (t.cls || '') + '"><div class="ts-l">' + icon(t.icon || 'star') + U.esc(t.label) + '</div><div class="ts-v">0</div></div>');
      tiles.appendChild(tile);
      CH.fx.popIn(tile, 250 + i * 110);
      setTimeout(function () { CH.fx.countUp(tile.querySelector('.ts-v'), 0, t.value, 900, t.fmt); }, CH.fx.reduced() ? 0 : 350 + i * 110);
    });
    if (o.extraEl) el.querySelector('.res-extra').appendChild(o.extraEl);
    var pg = this.page(el);
    this.setProgress(1);
    setTimeout(function () { CH.curlo.react(c, o.mood || 'celebrate', 1500); if (o.mood !== 'worried') { CH.fx.burstAt(el.querySelector('.res-curlo'), { n: 140 }); CH.fx.rain(80); } CH.audio.play(o.mood === 'worried' ? 'wrong' : 'levelup'); }, CH.fx.reduced() ? 50 : 420);
    return new Promise(function (resolve) {
      var btn = el.querySelector('.pbtn.big');
      btn.onclick = function () { CH.audio.play('tap'); CH.fx.clearConfetti(); self.dispose(); resolve(); };
      setTimeout(function () { try { btn.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }, 600);
      // Big overlays (level-up, achievements...) queue up and show over the results.
      setTimeout(function () { CH.ui.flushCelebrations(); }, CH.fx.reduced() ? 200 : 1500);
      pg.addEventListener('pointerdown', function () { CH.fx.clearConfetti(); }, { once: true });
    });
  };

  /** A simple "info card" page with a primary button; resolves on click. */
  Session.prototype.card = function (el, btnLabel, btnCls) {
    var pg = this.page(el);
    var btn = U.h('<button class="pbtn ' + (btnCls || '') + ' big page-next" data-autofocus>' + btnLabel + icon('next') + '</button>');
    pg.appendChild(btn);
    setTimeout(function () { try { btn.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }, 300);
    return new Promise(function (resolve) { btn.onclick = function () { CH.audio.play('tap'); resolve(); }; });
  };

  CH.Session = Session;

  /* ======================================================================
     Lesson player
     ====================================================================== */
  function playLesson(lesson, world) {
    var s = new Session({ mode: 'lesson', title: lesson.title, noun: 'lesson', fallbackPool: lesson.challenges });
    var el = s.el;
    var chs = (lesson.challenges || []).slice();
    var inter = G().interleaveFor(lesson);
    // Interleave older topics: one in the middle, one before the end.
    var queue = chs.map(function (c) { return { ch: c, review: false }; });
    inter.forEach(function (c, k) {
      var pos = k === 0 ? Math.ceil(queue.length / 2) : queue.length - 1;
      queue.splice(Math.max(1, pos), 0, { ch: c, review: true });
    });
    var total = queue.length + 3;   // intro, demo, recap
    var done = 0, firstTry = {}, retried = {};
    function prog() { s.setProgress(done / total); }

    function intro() {
      var c = lesson.concept || {};
      // Short by default: 'short' (big) + one-line analogy from Curlo.
      // Body paragraphs + pitfall live behind a 'Tell me more' expander.
      var short = c.short || firstSentence((c.body || [])[0] || '');
      var el2 = U.h('<div class="lesson-intro">' +
        '<div class="eyebrow">World ' + world.num + ' · Lesson ' + (lesson._i + 1) + (lesson.shield ? ' <span class="badge shieldb">' + icon('shield') + 'Shield lesson</span>' : '') + '</div>' +
        '<h2>' + U.esc(lesson.title) + '</h2>' +
        (short ? '<p class="concept-short">' + U.md(short) + '</p>' : '') +
        (c.analogy ? '<div class="card analogy"><div class="mini"></div><div class="bubble tail-l">' + U.md(c.analogy) + '</div></div>' : '<div class="analogy" hidden><div class="mini"></div></div>') +
        '</div>');
      var moreEl = U.h('<div>' + ((c.body || []).length ? '<div class="card concept">' + c.body.map(function (p) { return '<p>' + U.md(p) + '</p>'; }).join('') + '</div>' : '') +
        (c.pitfall ? '<div class="pitfall" role="note">' + icon('warn') + '<div><b>Common mistake</b><p>' + U.md(c.pitfall) + '</p></div></div>' : '') + '</div>');
      if (moreEl.children.length) el2.appendChild(CH.ui.expander('Tell me more', moreEl).el);
      var m = CH.curlo.mount(el2.querySelector('.analogy .mini'), { mood: 'happy' });
      setTimeout(function () { CH.curlo.react(m, 'celebrate', 900); }, 500);
      return s.card(el2, lesson.demo ? 'Show me the code' : 'Let’s practice').then(function () { done++; prog(); });
    }
    function demo() {
      if (!lesson.demo || !lesson.demo.code) { done++; return Promise.resolve(); }
      var el2 = U.h('<div class="lesson-demo"><div class="eyebrow">Watch it run</div><h2>' + U.esc(lesson.title) + '</h2></div>');
      var d = CH.code.demo(lesson.demo, {});
      el2.appendChild(d.el);
      var p = s.card(el2, 'Let’s practice!', 'teal');
      setTimeout(function () { d.start(); }, CH.fx.reduced() ? 0 : 450);
      return p.then(function () { d.stop(); done++; prog(); });
    }
    function challenges() {
      var i = 0;
      function next() {
        if (s.quit) return Promise.reject(new Error('quit'));
        if (i >= queue.length) return Promise.resolve();
        var item = queue[i++];
        var n = chs.length;
        var label = (item.review ? 'Review · ' : '') + (CH.challenges.TYPES[item.ch.type] || 'Challenge') + (item.retry ? ' · Try again' : '');
        return s.challenge(item.ch, { eyebrow: label }).then(function (res) {
          if (!item.retry) {
            firstTry[item.ch.id] = res.correct && !res.assisted;
            done++;
          }
          // Missed first time: re-queue once at the end so it's practiced again.
          if (!res.correct && !item.retry && !retried[item.ch.id]) {
            retried[item.ch.id] = true;
            queue.push({ ch: item.ch, review: item.review, retry: true });
            total++;
          } else if (item.retry) done++;
          prog();
          return next();
        });
      }
      return next();
    }
    function recap() {
      var el2 = U.h('<div class="recap"><div class="eyebrow">Recap</div><h2>What you learned</h2>' +
        '<ul class="recap-list">' + (lesson.recap || []).map(function (r) { return '<li>' + icon('ok') + '<span>' + U.md(r) + '</span></li>'; }).join('') + '</ul></div>');
      var cards = (lesson.vault || []);
      if (cards.length) {
        var v = U.h('<div class="vault-new"><div class="eyebrow">' + icon('vault') + ' New in your Code Vault</div></div>');
        cards.forEach(function (card) { v.appendChild(CH.screensUtil.vaultCard(card)); });
        el2.appendChild(v);
      }
      U.$$('.recap-list li', el2).forEach(function (li, k) { CH.fx.slideUp(li, 120 + k * 90); });
      return s.card(el2, 'Finish lesson', 'sun').then(function () { done++; prog(); });
    }
    function finish() {
      var ids = Object.keys(firstTry);
      var acc = ids.length ? ids.filter(function (k) { return firstTry[k]; }).length / ids.length : 1;
      var bonus = G().addXP(10 + (acc >= 1 ? 10 : 0), 'lesson');
      s.xp += bonus;
      var r = G().completeLesson(lesson, acc);
      var extra = U.h('<div></div>');
      if (acc >= 1) extra.appendChild(U.h('<div class="perfect">' + icon('star') + ' Perfect lesson! +10 bonus XP</div>'));
      var sk = lesson.shield ? 'defense' : lesson.skill;
      if (r.first) extra.appendChild(U.h('<div class="stat-gain">' + icon('chart') + ' ' + U.esc(cap(sk)) + ' stat up!</div>'));
      if (r.newCards.length) extra.appendChild(U.h('<div class="stat-gain">' + icon('vault') + ' ' + U.plural(r.newCards.length, 'new Code Vault card') + '</div>'));
      s.total = ids.length; s.right = ids.filter(function (k) { return firstTry[k]; }).length;
      return s.results({ title: 'Lesson complete!', sub: CH.curlo.line('lessonDone'), extraEl: extra }).then(function () {
        CH.screensUtil.returnToMap({ justDone: lesson.id });
      });
    }
    CH.screens._session = { el: s.el };
    var p = intro().then(demo).then(challenges).then(recap).then(finish).catch(function (e) { if (e && e.message !== 'quit') console.error(e); });
    return s;
  }
  function firstSentence(t) { t = String(t || '').trim(); var m = /^(.+?[.!?])(\s|$)/.exec(t); return m ? m[1] : t; }
  function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }

  /* ======================================================================
     Generic challenge-list runner (review / practice / placement-less)
     opts: { mode, title, list, eyebrow(i,ch), onDone(session) }
     ====================================================================== */
  function playList(o) {
    var s = new Session({ mode: o.mode, title: o.title, noun: o.noun || 'practice', fallbackPool: o.list });
    var i = 0, n = o.list.length;
    function next() {
      if (s.quit) return;
      s.setProgress(i / n);
      if (i >= n) return o.onDone(s);
      var ch = o.list[i++];
      return s.challenge(ch, { eyebrow: o.eyebrow ? o.eyebrow(i, ch) : (CH.challenges.TYPES[ch.type] + ' · ' + i + ' of ' + n) }).then(next);
    }
    setTimeout(next, 0);
    return s;
  }

  CH.session = { Session: Session, playLesson: playLesson, playList: playList, BASE_XP: BASE_XP };
})();
</script>
<script>
/* engine/project.js */
/* ==========================================================================
   Cpp Hero — engine/project.js
   Mini-project player: guided build in validated steps (the program grows on
   screen as you go; progress is saved per step), a "program complete" reveal,
   then the Stress Test: Curlo throws hostile input at your program, it
   crashes, and you harden it until the shield deflects the attack.
   ========================================================================== */
(function () {
  'use strict';
  var CH = window.CH, U = CH.util;
  function S() { return CH.store.state; }
  var icon = function (n, c) { return CH.ui.icon(n, c); };

  /** "Your program so far": reveal the first part of the final program. */
  function growing(program, frac) {
    if (!program) return null;
    var lines = program.split('\n'), n = Math.max(1, Math.round(lines.length * frac));
    var el = U.h('<details class="growing"' + (frac > 0 ? ' open' : '') + '><summary>' + icon('project') + ' Your program so far <span class="muted small">(' + Math.round(frac * 100) + '%)</span></summary></details>');
    var shown = lines.slice(0, n).join('\n');
    el.appendChild(CH.code.block(shown + (n < lines.length ? '\n// … more to build' : ''), { label: 'Program so far' }));
    return el;
  }

  function playProject(world) {
    var p = world.project, steps = p.steps || [];
    var attacks = (p.stress && p.stress.attacks) || [];
    var rec = S().projects[p.id] || { done: false, step: 0 };
    var startAt = rec.done ? 0 : U.clamp(rec.step || 0, 0, steps.length);
    var s = new CH.Session({ mode: 'project', title: p.title, noun: 'project',
      quitText: 'Your finished build steps are saved, so you can pick up where you left off.' });
    var total = steps.length + attacks.length + 2;
    var done = startAt;
    function prog() { s.setProgress(done / total); }
    prog();

    function intro() {
      var el = U.h('<div class="proj-intro"><div class="eyebrow">World ' + world.num + ' · Mini-project</div><h2>' + U.esc(p.title) + '</h2></div>');
      var cs = CH.ui.curloSays(CH.ui.story(p.intro || 'Let’s build something real!'), 'celebrate');
      el.appendChild(cs.el);
      var list = U.h('<ol class="proj-steps"></ol>');
      steps.forEach(function (st, i) {
        list.appendChild(U.h('<li class="' + (i < startAt ? 'done' : '') + '">' + icon(i < startAt ? 'ok' : 'project') + '<span>Step ' + (i + 1) + ': ' + U.esc(CH.challenges.TYPES[st.type] || 'Build') + '</span></li>'));
      });
      list.appendChild(U.h('<li class="stress">' + icon('swords') + '<span>Stress Test: ' + U.plural(attacks.length, 'attack') + '</span></li>'));
      el.appendChild(list);
      setTimeout(function () { CH.curlo.react(cs.curlo, 'celebrate', 900); }, 400);
      return s.card(el, startAt > 0 ? 'Resume at step ' + (startAt + 1) : 'Start building', 'teal');
    }

    function buildSteps() {
      var i = startAt;
      function next() {
        if (s.quit) return Promise.reject(new Error('quit'));
        if (i >= steps.length) return Promise.resolve();
        var ch = steps[i];
        var before = growing(p.program, i / steps.length);
        return s.challenge(ch, { eyebrow: 'Build step ' + (i + 1) + ' of ' + steps.length + ' · ' + (CH.challenges.TYPES[ch.type] || ''), before: before,
          continueLabel: 'Continue' }).then(function (res) {
          if (res.correct) {
            i++; done++; prog();
            S().projects[p.id] = { done: !!(S().projects[p.id] && S().projects[p.id].done), step: i };
            CH.store.save();
          } else {
            CH.fx.toast('Let’s fix this step before moving on.', { icon: icon('project') });
          }
          return next();
        });
      }
      return next();
    }

    function reveal() {
      var el = U.h('<div class="proj-done"><div class="eyebrow">' + icon('ok') + ' Build complete</div><h2>' + U.esc(p.title) + ' works!</h2><p class="muted">Here’s your whole program. Nice building!</p></div>');
      var blk = CH.code.block(p.program || '', { label: 'Your finished program' });
      el.appendChild(blk);
      var pr = s.card(el, attacks.length ? 'Start the Stress Test' : 'Finish project', attacks.length ? 'coral' : 'sun');
      setTimeout(function () { CH.code.type(blk._code, p.program || '').then(function () { CH.audio.play('correct'); CH.fx.burstAt(blk, { n: 80 }); }); }, CH.fx.reduced() ? 0 : 450);
      return pr.then(function () { done++; prog(); });
    }

    function stress() {
      if (!attacks.length) return Promise.resolve();
      var arena = CH.arena.create({ cellsLabel: 'your program' });
      var i = 0;
      function introCard() {
        var el = U.h('<div class="stress-intro"><div class="eyebrow">' + icon('swords') + ' Stress Test</div><h2>Break-in attempt!</h2></div>');
        var cs = CH.ui.curloSays(CH.ui.story(p.stress.intro || 'Curlo throws bad input at your program!'), 'bracing');
        el.appendChild(cs.el);
        el.appendChild(U.h('<p class="muted">Users type anything. See what breaks, then harden it.</p>'));
        return s.card(el, 'Bring it on!', 'coral');
      }
      function attack() {
        if (s.quit) return Promise.reject(new Error('quit'));
        if (i >= attacks.length) return Promise.resolve();
        var a = attacks[i];
        var head = U.h('<div class="attack-head"><div class="eyebrow">Attack ' + (i + 1) + ' of ' + attacks.length + '</div>' +
          '<div class="dhead"><span class="atk-label">' + icon('alert') + U.esc(a.label || 'Hostile input') + '</span><span class="hostile">' + U.esc(a.input === '' ? '""' : a.input) + '</span></div></div>');
        head.appendChild(arena.el);
        var runRow = U.h('<div class="row"><button class="pbtn coral">' + icon('play') + 'Run with this input</button></div>');
        head.appendChild(runRow);
        var pg = s.page(head);
        arena.reset();
        setTimeout(function () { arena.setAttack(a.input); }, 250);
        return new Promise(function (resolve) {
          var btn = runRow.querySelector('.pbtn');
          setTimeout(function () { try { btn.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }, 300);
          btn.onclick = function () {
            btn.disabled = true;
            arena.crash().then(function () {
              runRow.innerHTML = '<p class="crash-note">' + icon('no') + ' <b>Crashed!</b> The program can’t handle <code class="i">' + U.esc(a.input === '' ? '""' : a.input) + '</code>. Fix it below.</p>';
              CH.curlo.react(arena.curlo, 'worried');
              resolve();
            });
          };
        }).then(function () {
          return fixLoop(a, pg);
        }).then(function () { i++; done++; prog(); return attack(); });
      }
      function fixLoop(a, pg) {
        var host = U.h('<div class="fix-host"></div>');
        pg.appendChild(host);
        return CH.challenges.render(a.challenge, host, {
          mode: 'project', eyebrow: 'Fix it · ' + (CH.challenges.TYPES[a.challenge.type] || ''),
          onHint: function (t, cost, b) { var d = CH.game.addXP(-cost, 'hint'); s.xp += d; if (d) CH.fx.floatText(b, d + ' XP', 'neg'); },
          allowRetry: true,
          onAnswer: function (res) {
            var out = {};
            if (!res.retry) {
              s.total++;
              CH.game.recordAnswer(a.challenge, res.correct, 'project', res.assisted, res.hints);
            }
            s.updateCombo(!res.correct || res.retry);
            if (res.correct) {
              if (!res.retry) s.right++;
              if (res.retry) { var d0 = CH.game.addXP(2, 'retry'); s.xp += d0; out.xpText = '+' + d0 + ' XP'; }
              else if (!res.assisted) { var d = CH.game.addXP(Math.round(12 * CH.game.multiplier()), 'stress'); s.xp += d; out.xpText = '+' + d + ' XP'; }
              try { arena.el.scrollIntoView({ block: 'center', behavior: CH.fx.reduced() ? 'auto' : 'smooth' }); } catch (e) { /* ignore */ }
              arena.setAttack(a.input);
              setTimeout(function () { arena.block(); }, 350);
            } else {
              arena.setAttack(a.input);
              setTimeout(function () { arena.crash(); }, 300);
            }
            s.bestCombo = Math.max(s.bestCombo, CH.game.combo);
            return out;
          }
        }).then(function (res) {
          if (res.correct) return;
          host.remove();
          CH.fx.toast('Still breakable! Try the fix again.', { icon: icon('warn') });
          return fixLoop(a, pg);
        });
      }
      return introCard().then(attack);
    }

    function finish() {
      var bonus = CH.game.addXP(30, 'project');
      s.xp += bonus;
      var r = CH.game.completeProject(world);
      var extra = U.h('<div><div class="stat-gain">' + icon('shield') + ' Stress Test passed: every attack blocked!</div>' +
        (r.first ? '<div class="stat-gain">' + icon('chart') + ' Defense stat up!</div>' : '') + '</div>');
      return s.results({ title: 'Project complete!', sub: 'The boss of World ' + world.num + ' is awake…', extraEl: extra }).then(function () {
        CH.screensUtil.returnToMap({ justDone: p.id });
      });
    }

    intro().then(buildSteps).then(reveal).then(stress).then(finish).catch(function (e) { if (e && e.message !== 'quit') console.error(e); });
    return s;
  }

  CH.project = { play: playProject };
})();
</script>
<script>
/* engine/boss.js */
/* ==========================================================================
   Cpp Hero — engine/boss.js
   Boss battle: dramatic entrance, HP bar that drops one segment per correct
   answer, taunts on mistakes (costs a heart), then the Defense Phase where
   the boss hurls hostile inputs (negatives, empty strings, huge values,
   nullptr, invalid text) at Curlo and you block them by hardening code, and
   finally a victory sequence with rewards and the next world unlocking.
   ========================================================================== */
(function () {
  'use strict';
  var CH = window.CH, U = CH.util;
  var icon = function (n, c) { return CH.ui.icon(n, c); };

  function playBoss(world) {
    var b = world.boss, maxHp = Math.max(1, b.hp || (b.rounds || []).length || 1);
    var hp = maxHp;
    var s = new CH.Session({ mode: 'boss', title: b.name, noun: 'battle', fallbackPool: b.rounds,
      quitText: 'Retreat? The boss will be back at full health next time.' });
    s.el.classList.add('boss-session');
    var defense = b.defense || [];
    var total = maxHp + defense.length + 1;
    var done = 0;
    function prog() { s.setProgress(done / total); }

    /* ---- persistent boss header (sticky) ---- */
    var head = U.h('<div class="boss-head" hidden>' +
      '<div class="boss-art"></div>' +
      '<div class="boss-meta"><div class="boss-name">' + U.esc(b.name) + '</div>' +
        '<div class="hpbar" role="meter" aria-label="Boss health" aria-valuemin="0" aria-valuemax="' + maxHp + '" aria-valuenow="' + maxHp + '"></div>' +
        '<div class="boss-say" aria-live="polite"></div></div></div>');
    var hpbar = head.querySelector('.hpbar');
    for (var k = 0; k < maxHp; k++) hpbar.insertAdjacentHTML('beforeend', '<i class="seg"></i>');
    s.scroller.insertBefore(head, s.stage);
    var art = head.querySelector('.boss-art');
    function drawArt(hurt) { art.innerHTML = CH.art.boss(b.art || 'gremlin', { hurt: !!hurt }); }
    drawArt(false);
    var say = head.querySelector('.boss-say');
    function taunt(txt) {
      say.textContent = txt;
      CH.fx.anim(say, [{ transform: 'scale(.8)', opacity: 0 }, { transform: 'scale(1.05)', opacity: 1 }, { transform: 'none', opacity: 1 }], { duration: 360, easing: CH.fx.SPRING, rm: 'fade' });
    }
    function setHP(n) {
      U.$$('.seg', hpbar).forEach(function (seg, i) { seg.classList.toggle('gone', i >= n); });
      hpbar.setAttribute('aria-valuenow', n);
      hpbar.setAttribute('aria-valuetext', n + ' of ' + maxHp + ' health left');
    }

    /** Correct answer: the boss takes a hit. */
    function hit() {
      hp = Math.max(0, hp - 1);
      done++; prog();
      CH.audio.play('hit');
      var segs = U.$$('.seg', hpbar), seg = segs[hp];
      if (seg) CH.fx.anim(seg, [{ transform: 'none' }, { transform: 'scaleY(1.6) translateY(-4px)', opacity: 1 }, { transform: 'translateY(10px) scale(.4) rotate(20deg)', opacity: 0 }], { duration: 480, easing: 'ease-in' });
      setTimeout(function () { setHP(hp); }, CH.fx.reduced() ? 0 : 420);
      art.classList.remove('hurtflash'); void art.offsetWidth; art.classList.add('hurtflash');
      setTimeout(function () { art.classList.remove('hurtflash'); }, 600);
      CH.fx.shake(art, 12);
      CH.fx.floatText(art, '−1 HP', 'dmg');
      CH.fx.burstAt(art, { n: 30, colors: ['#FFC62E', '#fff', '#FF5A70'], speed: 0.8 });
      taunt(hp > 0 ? U.pick(['Ow! Lucky shot!', 'Grr… that stung!', 'Hmph. You’re better than I thought.', 'Not so fast!']) : 'No… NO! My HP!');
    }
    /** Wrong answer: the boss lunges and laughs. */
    function boast() {
      CH.fx.anim(art, [{ transform: 'none' }, { transform: 'translateY(8px) scale(1.12,.9)' }, { transform: 'translateY(-14px) scale(.95,1.08)' }, { transform: 'none' }], { duration: 520, easing: CH.fx.SPRING });
      taunt(U.pick(b.taunt && b.taunt.length ? b.taunt : ['Ha! Missed me!']));
    }

    /* ---- 0. dramatic entrance: dim + name card slam + shake (tap to skip) ---- */
    function dim() {
      if (CH.fx.reduced()) return Promise.resolve();
      return new Promise(function (resolve) {
        var ov = U.h('<div class="boss-dim" aria-hidden="true"><div class="bd-card"><small>Boss battle</small><b>' + U.esc(b.name) + '</b></div></div>');
        s.el.appendChild(ov);
        var done = false;
        function end() {
          if (done) return; done = true;
          CH.fx.anim(ov, [{ opacity: 1 }, { opacity: 0 }], { duration: 200, fill: 'forwards', rm: 'keep' }).then(function () { ov.remove(); });
          setTimeout(function () { ov.remove(); }, 400);
          resolve();
        }
        ov.addEventListener('click', end);
        CH.audio.play('boss');
        CH.fx.anim(ov, [{ opacity: 0 }, { opacity: 1 }], { duration: 180, rm: 'keep' });
        CH.fx.anim(ov.querySelector('.bd-card'), [{ transform: 'scale(2.4) rotate(-8deg)', opacity: 0 }, { transform: 'scale(.94) rotate(1deg)', opacity: 1, offset: 0.6 }, { transform: 'none', opacity: 1 }], { duration: 380, delay: 120, fill: 'backwards', easing: 'ease-out' })
          .then(function () { CH.fx.shake(s.el, 10); });
        setTimeout(end, 1150);
      });
    }

    /* ---- 1. entrance ---- */
    function entrance() {
      var el = U.h('<div class="boss-intro"><div class="boss-stage-in"><div class="boss-big"></div><div class="boss-banner"><small>Boss battle · World ' + world.num + '</small><b>' + U.esc(b.name) + '</b></div></div></div>');
      el.querySelector('.boss-big').innerHTML = CH.art.boss(b.art || 'gremlin');
      var cs = CH.ui.curloSays(CH.ui.story((world.story && world.story.bossIntro) || CH.curlo.line('boss')), 'bracing');
      el.appendChild(cs.el);
      if (b.intro) el.appendChild(U.h('<div class="bubble boss-bubble"><b>' + U.esc(b.name) + ':</b> ' + U.md([].concat(b.intro)[0]) + '</div>'));
      el.appendChild(U.h('<p class="muted small center">' + icon('heart') + ' Wrong answers cost a heart. Land ' + U.plural(maxHp, 'hit') + ', then survive the Defense Phase!</p>'));
      var pr = s.card(el, icon('swords') + ' Fight!', 'coral');
      var big = el.querySelector('.boss-big'), banner = el.querySelector('.boss-banner');
      CH.fx.anim(big, [{ transform: 'translateY(-120%) scale(.7)', opacity: 0 }, { transform: 'translateY(6%) scale(1.1,.86)', opacity: 1, offset: 0.55 }, { transform: 'translateY(-4%) scale(.96,1.05)', offset: 0.75 }, { transform: 'none', opacity: 1 }], { duration: 900, easing: 'ease-out', rm: 'fade' })
        .then(function () { CH.fx.shake(s.el, 8); });
      CH.fx.anim(banner, [{ transform: 'scale(.3) rotate(-8deg)', opacity: 0 }, { transform: 'scale(1.15) rotate(2deg)', opacity: 1, offset: 0.7 }, { transform: 'none', opacity: 1 }], { duration: 600, delay: 600, fill: 'backwards', rm: 'fade' });
      setTimeout(function () { CH.curlo.react(cs.curlo, 'bracing'); }, 700);
      return pr.then(function () { head.hidden = false; setHP(hp); taunt(U.pick(b.taunt && b.taunt.length ? b.taunt : ['Come at me!'])); CH.fx.slideUp(head); });
    }

    /* ---- 2. rounds ---- */
    function rounds() {
      var queue = (b.rounds || []).slice(), missed = [], i = 0;
      function next() {
        if (s.quit) return Promise.reject(new Error('quit'));
        if (hp <= 0) return Promise.resolve();
        if (i >= queue.length) {
          queue = U.shuffle(missed.length ? missed : (b.rounds || []));
          missed = []; i = 0;
          if (!queue.length) return Promise.resolve();
          CH.fx.toast('The boss is still standing! Round two!', { icon: icon('swords') });
        }
        var ch = queue[i++];
        return s.challenge(ch, {
          eyebrow: 'Round ' + (maxHp - hp + 1) + ' · ' + (CH.challenges.TYPES[ch.type] || ''),
          onAnswer: function (res) { if (res.correct && !res.assisted) setTimeout(hit, 200); else if (res.correct) setTimeout(hit, 200); else { missed.push(ch); setTimeout(boast, 200); } }
        }).then(next);
      }
      return next();
    }

    /* ---- 3. defense phase ---- */
    function defensePhase() {
      if (!defense.length) return Promise.resolve();
      var el = U.h('<div class="def-intro"><div class="phase-banner"><small>Phase 2</small><b>Defense!</b></div></div>');
      el.appendChild(CH.ui.curloSays('Hostile inputs incoming! Harden the code so my shield holds!', 'bracing').el);
      var pr = s.card(el, icon('shield') + ' Shields up!', 'teal');
      drawArt(false);
      taunt('Enough! Eat THIS input!');
      CH.audio.play('boss');
      CH.fx.anim(el.querySelector('.phase-banner'), [{ transform: 'scale(2.2) rotate(-6deg)', opacity: 0 }, { transform: 'scale(.95)', opacity: 1, offset: 0.7 }, { transform: 'none', opacity: 1 }], { duration: 600, rm: 'fade' });
      return pr.then(function () {
        var arena = CH.arena.create({ cellsLabel: 'Curlo’s code', bossArt: CH.art.boss(b.art || 'gremlin') });
        head.hidden = true;
        var i = 0;
        function attack() {
          if (s.quit) return Promise.reject(new Error('quit'));
          if (i >= defense.length) return Promise.resolve();
          var d = defense[i];
          var top = U.h('<div class="attack-head"><div class="dhead"><span class="atk-label">' + icon('alert') + U.esc(d.label || 'Hostile input!') + '</span><span class="hostile">' + U.esc(d.attack === '' ? '""' : d.attack) + '</span></div></div>');
          top.appendChild(arena.el);
          arena.reset();
          setTimeout(function () { arena.setAttack(d.attack); taunt(U.pick(['Take this: ' + (d.attack === '' ? '""' : d.attack) + '!', 'Incoming!', 'Try blocking THIS!'])); }, 300);
          return s.challenge(d.challenge, {
            before: top,
            eyebrow: 'Block attack ' + (i + 1) + ' of ' + defense.length + ' · ' + (CH.challenges.TYPES[d.challenge.type] || ''),
            onAnswer: function (res) {
              try { arena.el.scrollIntoView({ block: 'center', behavior: CH.fx.reduced() ? 'auto' : 'smooth' }); } catch (e) { /* ignore */ }
              if (res.correct) setTimeout(function () { arena.block(); }, 250);
              else setTimeout(function () { arena.crash(); boast(); }, 250);
            }
          }).then(function (res) {
            if (res.correct) { i++; done++; prog(); }
            else CH.fx.toast('It got through! Block it this time.', { icon: icon('shield') });
            return attack();
          });
        }
        return attack();
      });
    }

    /* ---- 4. victory ---- */
    function victory() {
      drawArt(true);
      taunt('Nooo! I’ll be back in a patch release…');
      var el = U.h('<div class="victory"><div class="vic-boss"></div><div class="phase-banner win"><small>Victory!</small><b>' + U.esc(b.name) + ' defeated</b></div></div>');
      el.querySelector('.vic-boss').innerHTML = CH.art.boss(b.art || 'gremlin', { hurt: true });
      var cs = CH.ui.curloSays(CH.ui.story((world.story && world.story.victory) || b.victory || 'We did it!'), 'celebrate');
      el.appendChild(cs.el);
      if (b.victory && world.story && world.story.victory) el.appendChild(U.h('<div class="bubble boss-bubble"><b>' + U.esc(b.name) + ':</b> ' + U.md([].concat(b.victory)[0]) + '</div>'));
      var r = b.reward || {};
      var rw = U.h('<div class="rewards"><div class="eyebrow">Rewards</div></div>');
      if (r.xp) rw.appendChild(U.h('<div class="reward">' + icon('bolt') + '<b>+' + r.xp + ' XP</b></div>'));
      var cdef = r.cosmetic && CH.game.cosmeticDef(r.cosmetic);
      if (cdef) rw.appendChild(U.h('<div class="reward">' + icon('gift') + '<b>' + U.esc(cdef.name) + '</b><span class="muted">new gear</span></div>'));
      var bdef = r.bug && CH.game.bugDef(r.bug);
      if (bdef) rw.appendChild(U.h('<div class="reward">' + icon('bug') + '<b>' + U.esc(bdef.name) + '</b><span class="muted">bestiary</span></div>'));
      el.appendChild(rw);
      head.hidden = true;
      var pr = s.card(el, 'Claim rewards', 'sun');
      CH.audio.play('levelup');
      var vb = el.querySelector('.vic-boss');
      CH.fx.anim(vb, [{ transform: 'none', opacity: 1 }, { transform: 'rotate(-12deg) scale(1.1)', opacity: 1, offset: 0.3 }, { transform: 'rotate(380deg) scale(.1)', opacity: 0 }], { duration: 1200, delay: 500, easing: 'ease-in', fill: 'forwards', rm: 'skip' })
        .then(function () { CH.fx.burstAt(vb, { n: 160 }); CH.fx.rain(100); if (!CH.fx.reduced()) vb.style.opacity = 0; });
      setTimeout(function () { CH.curlo.react(cs.curlo, 'celebrate', 1500); }, 900);
      return pr.then(function () {
        var before = s.xp;
        var res = CH.game.beatBoss(world);
        if (r.xp && res.first) s.xp += r.xp;
        var extra = U.h('<div></div>');
        if (res.unlocked) extra.appendChild(U.h('<div class="stat-gain">' + icon('map') + ' World ' + res.unlocked.num + ' unlocked: <b>' + U.esc(res.unlocked.title) + '</b></div>'));
        else if (!res.first) extra.appendChild(U.h('<div class="stat-gain">' + icon('star') + ' Rematch won! Great practice.</div>'));
        void before;
        return s.results({ title: 'Boss defeated!', sub: U.esc(b.name) + ' won’t bug this world again.', extraEl: extra }).then(function () {
          CH.screensUtil.returnToMap({ justDone: b.id, unlocked: res.unlocked && res.unlocked.id });
        });
      });
    }

    dim().then(entrance).then(rounds).then(defensePhase).then(victory).catch(function (e) { if (e && e.message !== 'quit') console.error(e); });
    return s;
  }

  CH.boss = { play: playBoss };
})();
</script>
<script>
/* engine/screens.js */
/* ==========================================================================
   Cpp Hero — engine/screens.js
   Tabbed screens: World Map, Curlo (stats, gear, evolution, wardrobe),
   Practice (SRS review + Practice Arena), Code Vault (+ Defense Rules),
   Bug Bestiary, Stats (+ achievements), Settings. Plus the session screen
   wrappers (lesson / project / boss / practice runs) and shared helpers.
   ========================================================================== */
(function () {
  'use strict';
  var CH = window.CH, U = CH.util, G = function () { return CH.game; };
  function S() { return CH.store.state; }
  var icon = function (n, c) { return CH.ui.icon(n, c); };
  var screens = (CH.screens = CH.screens || {});
  var SKILL_COLORS = { logic: 'var(--sky)', structure: 'var(--teal)', memory: 'var(--sun)', toolkit: 'var(--tang)', defense: 'var(--coral)' };
  var SKILL_NAMES = { logic: 'Logic', structure: 'Structure', memory: 'Memory', toolkit: 'Toolkit', defense: 'Defense' };

  /* ======================================================================
     Shared helpers
     ====================================================================== */
  var SU = (CH.screensUtil = {});

  SU.vaultCard = function (v) {
    var el = U.h('<article class="vcard' + (v.defense ? ' def' : '') + '"><header>' + (v.defense ? '<span class="badge safe">' + icon('shield') + 'Defense rule</span>' : '') +
      '<h3>' + U.esc(v.title) + '</h3></header></article>');
    if (v.code) el.appendChild(CH.code.block(v.code, { label: v.title }));
    if (v.note) el.appendChild(U.h('<p class="vnote">' + U.md(v.note) + '</p>'));
    return el;
  };

  SU.returnToMap = function (params) {
    CH.router.go('map', params || {}, { dir: 'down', root: true });
  };

  /** Start a map node (with hearts check + world story intro). */
  SU.startNode = function (node, originEl) {
    var s = S();
    if ((node.kind === 'lesson' || node.kind === 'boss') && s.hearts.n <= 0) {
      return CH.ui.dialog({
        title: 'Out of hearts', mood: 'worried',
        html: '<p>' + CH.curlo.line('noHearts') + '</p>' + CH.ui.heartClockHTML() + '<p class="muted small">A 3-question review earns a heart right away.</p>',
        onMount: CH.ui.bindHeartClock,
        buttons: [{ label: icon('practice') + 'Earn a heart', value: 'p', cls: 'teal' }, { label: 'Wait for it', value: 0, cls: 'ghost' }]
      }).then(function (v) { if (v === 'p') CH.router.go('practice', { autoReview: true }); });
    }
    var w = node.world;
    // Expand from the tapped map node (collapses back into it on exit).
    var tx = originEl && document.body.contains(originEl) ? { dir: 'expand', origin: { el: originEl, id: node.id } } : { dir: 'up' };
    function go() {
      if (node.kind === 'lesson') CH.router.go('lesson', { id: node.id }, tx);
      else if (node.kind === 'project') CH.router.go('project', { world: w.id }, tx);
      else if (node.kind === 'boss') CH.router.go('boss', { world: w.id }, tx);
    }
    if (node.kind === 'lesson' && node.i === 0 && !node.done && w.story && w.story.intro) {
      return CH.ui.dialog({ title: 'World ' + w.num + ': ' + w.title, mood: 'celebrate', el: CH.ui.story(w.story.intro), buttons: [{ label: 'Let’s go!', value: 1 }], dismissValue: 0 })
        .then(function (v) { if (v) go(); });
    }
    go();
  };

  /* ======================================================================
     MAP
     ====================================================================== */
  var OFFS = [0, -0.72, -0.12, 0.68, 0.82, 0.08, -0.55, -0.8, 0.2];
  var NODE_ICON = {
    done: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    cur: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.8 6 6.5.7-4.9 4.4 1.4 6.4L12 16.8 6.2 20l1.4-6.4L2.7 9.2l6.5-.7z" fill="#fff"/></svg>',
    lock: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="3" fill="#A89C8C"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" fill="none" stroke="#A89C8C" stroke-width="2.6"/></svg>',
    shield: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z" fill="#fff"/><path d="M9 7.5Q7 7.5 7.3 10Q7.3 11.3 6 11.8Q7.3 12.3 7.3 13.6Q7 16.2 9 16.2M15 7.5Q17 7.5 16.7 10Q16.7 11.3 18 11.8Q16.7 12.3 16.7 13.6Q17 16.2 15 16.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
    project: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20l3-8 5-5 6 6-5 5z" fill="#FFC62E" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><path d="M14 4l6 6" stroke="#fff" stroke-width="2.8" stroke-linecap="round"/></svg>'
  };

  function nodeLabel(n) {
    if (n.kind === 'lesson') return n.lesson.title;
    if (n.kind === 'project') return n.project.title || 'Mini-project';
    return n.boss.name;
  }
  function nodeKindLabel(n) {
    if (n.kind === 'lesson') return (n.lesson.shield ? 'Shield lesson ' : 'Lesson ') + (n.i + 1);
    return n.kind === 'project' ? 'Project' : 'Boss';
  }

  screens.map = {
    tab: 'map',
    render: function (params) {
      var s = S();
      var el = U.h('<section class="screen" aria-label="World map"><div class="scroll map-scroll">' +
        '<div class="para p1" aria-hidden="true"><div class="blob" style="left:-40px;top:360px;width:120px;height:120px;background:var(--sun-l)"></div><div class="blob" style="right:-30px;top:720px;width:150px;height:150px;background:var(--teal-l);animation-delay:-3s"></div><div class="blob" style="left:20px;top:1260px;width:90px;height:90px;background:var(--coral-l);animation-delay:-5s"></div><div class="blob" style="right:10px;top:1800px;width:110px;height:110px;background:var(--sun-l);animation-delay:-2s"></div></div>' +
        '<div class="para p2" aria-hidden="true"><span class="glyph" style="right:18px;top:300px">{ }</span><span class="glyph" style="left:12px;top:800px;animation-delay:-4s">;</span><span class="glyph" style="right:30px;top:1340px;animation-delay:-2s">&lt;&gt;</span><span class="glyph" style="left:24px;top:1900px;animation-delay:-6s">::</span></div>' +
        '<div class="map-inner"></div></div></section>');
      var inner = el.querySelector('.map-inner');

      /* greeting card */
      CH.game.ensureDaily();
      var goal = s.profile.dailyGoalMin || 10, mins = Math.floor(s.daily.minutes);
      var due = G().srsDue().length;
      var intro = U.h('<div class="card intro">' +
        '<div class="eyebrow">' + (s.streak.days ? U.plural(s.streak.days, 'day') + ' streak' : 'Welcome back') + '</div>' +
        '<h1>Hi, hero!</h1><p class="greet"></p>' +
        '<div class="goalbar" role="progressbar" aria-label="Daily goal" aria-valuemin="0" aria-valuemax="' + goal + '" aria-valuenow="' + Math.min(mins, goal) + '"><i style="--p:' + Math.min(1, s.daily.minutes / goal) + '"></i><span>' + Math.min(mins, goal) + ' / ' + goal + ' min today</span></div>' +
        (due ? '<button class="pbtn sun small review-btn">' + icon('practice') + 'Review ' + U.plural(due, 'concept') + '</button>' : '') +
        '<button class="mini poke" aria-label="Poke ' + U.esc(s.profile.name) + '"></button></div>');
      intro.querySelector('.greet').innerHTML = U.esc(s.profile.name) + ': ' + CH.curlo.line('greet');
      var mini = CH.curlo.mount(intro.querySelector('.mini'));
      intro.querySelector('.mini').onclick = function () {
        CH.audio.play('pop'); CH.fx.springPoke(intro.querySelector('.mini'));
        CH.curlo.react(mini, U.pick(['celebrate', 'worried', 'thinking', 'bracing']), 1100);
        CH.curlo.say(intro.querySelector('.greet'), U.esc(s.profile.name) + ': ' + CH.curlo.line('poke'));
      };
      var rb = intro.querySelector('.review-btn');
      if (rb) rb.onclick = function () { CH.router.go('practice', { autoReview: true }); };
      inner.appendChild(intro);

      /* worlds */
      var cur = G().currentNode();
      var ws = G().worlds();
      ws.forEach(function (w) {
        var nodes = G().nodes(w), unlocked = G().worldUnlocked(w);
        var doneN = nodes.filter(function (n) { return n.done; }).length;
        var banner = U.h('<div class="unit' + (unlocked ? '' : ' locked') + '" id="world-' + U.esc(w.id) + '">' +
          '<div class="unit-ic" aria-hidden="true">' + CH.art.icon(w.icon || 'star') + '</div>' +
          '<div class="unit-t"><small>WORLD ' + w.num + '</small><b>' + U.esc(w.title) + '</b></div>' +
          '<span>' + (unlocked ? doneN + ' / ' + nodes.length : icon('lock') + ' Locked') + '</span></div>');
        banner.title = w.blurb || '';
        inner.appendChild(banner);
        if (w.blurb && unlocked) inner.appendChild(U.h('<p class="unit-blurb">' + U.md(w.blurb) + '</p>'));
        var path = U.h('<div class="path" data-world="' + U.esc(w.id) + '"></div>');
        inner.appendChild(path);
        path._nodes = nodes; path._cur = cur;
      });
      if (ws.length < 16) {
        inner.appendChild(U.h('<div class="card more-card"><div class="more-ic" aria-hidden="true">' + CH.art.icon('castle', { color: '#A89C8C' }) + '</div><div><b>More worlds on the way</b><p class="muted">Worlds ' + (ws.length + 1) + '–16 are being forged: decisions, loops, functions, memory, classes, templates and the STL. Beat every boss to be ready!</p></div></div>'));
      }
      el._params = params;
      return el;
    },
    onShow: function (el, params) {
      buildPaths(el);
      var sc = el.querySelector('.map-scroll');
      sc.addEventListener('scroll', function () {
        if (CH.fx.reduced()) return;
        var y = sc.scrollTop;
        el.querySelector('.p1').style.transform = 'translateY(' + (y * 0.35) + 'px)';
        el.querySelector('.p2').style.transform = 'translateY(' + (y * 0.6) + 'px)';
      }, { passive: true });
      // Scroll the current node into view (centered), then celebrate.
      var curEl = el.querySelector('.node.cur');
      if (curEl) {
        var target = curEl.offsetTop + curEl.closest('.path').offsetTop - sc.clientHeight / 2 + 40;
        sc.scrollTop = Math.max(0, target - (params.justDone ? 160 : 0));
        if (params.justDone && !CH.fx.reduced()) {
          setTimeout(function () { try { sc.scrollTo({ top: Math.max(0, target), behavior: 'smooth' }); } catch (e) { sc.scrollTop = target; } }, 500);
          curEl.style.opacity = 0;
          setTimeout(function () {
            curEl.style.opacity = '';
            CH.fx.anim(curEl, [{ transform: 'scale(.2)', opacity: 0 }, { transform: 'scale(1.25)', opacity: 1, offset: 0.6 }, { transform: 'scale(.92)', offset: 0.8 }, { transform: 'none', opacity: 1 }], { duration: 700 });
            CH.audio.play('unlock');
            CH.fx.burstAt(curEl, { n: 60 });
          }, 1100);
        }
      }
      if (params.unlocked) {
        var b = el.querySelector('#world-' + params.unlocked);
        if (b) setTimeout(function () { CH.fx.toast('New world unlocked!', { icon: icon('map') }); CH.fx.bounce(b); }, 1500);
      }
      // Pending notices (streak freeze used, storage notice...).
      setTimeout(function () {
        var n = G().pendingNotes.shift();
        if (n) CH.fx.toast(n.msg, { icon: icon(n.icon) });
      }, 900);
      setTimeout(function () { CH.ui.flushCelebrations(); }, params.justDone ? 1900 : 500);
      clearTimeout(resizeT);
      window.removeEventListener('resize', onResize);
      window.addEventListener('resize', onResize);
    },
    onHide: function () { window.removeEventListener('resize', onResize); }
  };
  var resizeT = 0;
  function onResize() {
    clearTimeout(resizeT);
    resizeT = setTimeout(function () {
      var cur = CH.router.current;
      if (cur && cur.name === 'map') buildPaths(cur.el);
    }, 150);
  }

  /** Lay out the winding paths (needs real widths, so runs after insertion). */
  function buildPaths(el) {
    U.$$('.path', el).forEach(function (wrap) {
      var nodes = wrap._nodes || [], cur = wrap._cur;
      var W = wrap.clientWidth || 340, cx = W / 2, amp = Math.min(96, W * 0.27);
      var pts = nodes.map(function (n, i) {
        var o = n.kind === 'boss' ? 0 : OFFS[i % OFFS.length];
        return { x: cx + o * amp, y: 84 + i * 118, o: o };
      });
      var H = (pts.length ? pts[pts.length - 1].y : 0) + 86;
      wrap.style.height = H + 'px';
      function seg(list) {
        return list.map(function (p, i) {
          if (!i) return 'M' + p.x + ' ' + p.y;
          var q = list[i - 1], dy = (p.y - q.y) / 2;
          return 'C' + q.x + ' ' + (q.y + dy) + ' ' + p.x + ' ' + (p.y - dy) + ' ' + p.x + ' ' + p.y;
        }).join(' ');
      }
      var lastLit = -1;
      nodes.forEach(function (n, i) { if (n.done || (cur && cur.id === n.id)) lastLit = i; });
      var html = '<svg class="lines" viewBox="0 0 ' + W + ' ' + H + '" aria-hidden="true"><path class="dots" d="' + seg(pts) + '"/>' +
        (lastLit > 0 ? '<path class="path-glow" d="' + seg(pts.slice(0, lastLit + 1)) + '"/><path class="path-prog" d="' + seg(pts.slice(0, lastLit + 1)) + '"/>' : '') + '</svg>';
      var s = S();
      nodes.forEach(function (n, i) {
        var p = pts[i], isCur = cur && cur.id === n.id;
        var st = n.done ? 'done' : isCur ? 'cur' : n.open ? 'open' : 'lock';
        var cls = 'node ' + st + (n.kind === 'boss' ? ' boss' : '') + (n.kind === 'project' ? ' proj' : '') + (n.lesson && n.lesson.shield ? ' shield' : '');
        var ic;
        if (n.kind === 'boss') ic = '<span class="boss-mini">' + CH.art.boss(n.boss.art || 'gremlin') + '</span>' + (st === 'lock' ? '<span class="lock-badge">' + NODE_ICON.lock + '</span>' : st === 'done' ? '<span class="lock-badge ok">' + NODE_ICON.done + '</span>' : '');
        else if (st === 'lock') ic = NODE_ICON.lock;
        else if (n.kind === 'project') ic = NODE_ICON.project;
        else if (st === 'done') ic = NODE_ICON.done;
        else if (n.lesson && n.lesson.shield) ic = NODE_ICON.shield;
        else ic = NODE_ICON.cur;
        var stateTxt = st === 'done' ? 'complete' : st === 'cur' ? 'you are here' : st === 'open' ? 'open' : 'locked';
        var best = n.kind === 'lesson' && s.lessons[n.id] ? ', best ' + Math.round((s.lessons[n.id].best || 0) * 100) + '%' : '';
        html += '<button class="' + cls + '" style="left:' + p.x + 'px;top:' + p.y + 'px" data-i="' + i + '" data-origin-id="' + U.esc(n.id) + '" aria-label="' + U.esc(nodeKindLabel(n) + ': ' + nodeLabel(n) + ', ' + stateTxt + best) + '">' + ic + '</button>';
        var right = p.o <= 0.05, off = n.kind === 'boss' ? 62 : isCur ? 54 : 48;
        html += '<div class="nlabel ' + st + '" style="top:' + p.y + 'px;' + (right ? 'left:' + (p.x + off) + 'px' : 'right:' + (W - p.x + off) + 'px') + '" aria-hidden="true"><small>' + U.esc(nodeKindLabel(n)) + (n.done ? ' · ' + (n.kind === 'lesson' ? Math.round((s.lessons[n.id].best || 0) * 100) + '%' : 'done') : '') + '</small>' + U.esc(nodeLabel(n)) + '</div>';
        if (isCur) html += '<div class="start-tip" style="left:' + p.x + 'px;top:' + (p.y - (n.kind === 'boss' ? 62 : 52)) + 'px" aria-hidden="true">' + (n.kind === 'boss' ? 'FIGHT!' : 'START') + '</div>';
      });
      wrap.innerHTML = html;
      U.$$('.node', wrap).forEach(function (b) {
        b.onclick = function () { onNode(nodes[+b.dataset.i], b); };
      });
      var pp = wrap.querySelector('.path-prog');
      if (pp && !CH.fx.reduced() && pp.getTotalLength) {
        try {
          var L = pp.getTotalLength();
          pp.style.strokeDasharray = L;
          CH.fx.anim(pp, [{ strokeDashoffset: L }, { strokeDashoffset: 0 }], { duration: 1400, easing: 'cubic-bezier(.3,1.2,.5,1)', delay: 300, fill: 'backwards' });
        } catch (e) { /* ignore */ }
      }
    });
  }

  function onNode(n, btn) {
    if (!n.open) {
      CH.audio.play('tap');
      CH.fx.wiggle(btn);
      var w = n.world, msg;
      if (!G().worldUnlocked(w)) msg = 'Beat the previous world’s boss to unlock World ' + w.num + '.';
      else if (n.kind === 'project') msg = 'Finish every lesson in World ' + w.num + ' to unlock the project.';
      else if (n.kind === 'boss') msg = 'Complete the mini-project to face ' + n.boss.name + '.';
      else msg = 'Finish the previous lesson first.';
      CH.fx.toast(msg, { icon: icon('lock') });
      return;
    }
    CH.audio.play('pop');
    var s = S();
    var body = '';
    if (n.kind === 'lesson') {
      var l = n.lesson, rec = s.lessons[l.id];
      body = '<div class="node-sheet"><div class="ns-tags"><span class="pill" style="--c:' + (SKILL_COLORS[l.shield ? 'defense' : l.skill] || 'var(--teal)') + '">' + U.esc(SKILL_NAMES[l.shield ? 'defense' : l.skill] || l.skill) + '</span>' + (l.shield ? '<span class="badge safe">' + icon('shield') + 'Shield lesson</span>' : '') + '</div>' +
        '<p>' + U.md((l.concept && l.concept.analogy) || '') + '</p>' +
        '<p class="muted small">' + U.plural((l.challenges || []).length, 'challenge') + ' · about 4 minutes' + (rec ? ' · best ' + Math.round(rec.best * 100) + '%' : '') + '</p></div>';
    } else if (n.kind === 'project') {
      body = '<div class="node-sheet"><p>' + U.md([].concat(n.project.intro || '')[0]) + '</p><p class="muted small">' + U.plural((n.project.steps || []).length, 'build step') + ' + a Stress Test</p></div>';
    } else {
      body = '<div class="node-sheet boss-sheet"><div class="bs-art">' + CH.art.boss(n.boss.art || 'gremlin') + '</div><p>' + U.md([].concat(n.boss.intro || '')[0]) + '</p><p class="muted small">' + (n.boss.hp || 1) + ' HP · Defense Phase · wrong answers cost hearts</p></div>';
    }
    var el = U.h('<div>' + body + '<div class="row"><button class="pbtn ' + (n.kind === 'boss' ? 'coral' : n.done ? 'ghost' : '') + '" data-autofocus>' +
      (n.kind === 'boss' ? icon('swords') + (n.done ? 'Rematch' : 'Fight!') : n.done ? icon('retype') + 'Practice again' : icon('play') + 'Start') + '</button></div></div>');
    var sh = CH.ui.sheet({ title: nodeLabel(n), el: el });
    el.querySelector('.pbtn').onclick = function () { sh.close(); setTimeout(function () { SU.startNode(n, btn); }, 120); };
  }

  /* ======================================================================
     Session screen wrappers
     ====================================================================== */
  screens.lesson = { chrome: 'immersive', render: function (p) {
    var l = G().index.lesson[p.id];
    if (!l) throw new Error('Lesson not found: ' + p.id);
    return CH.session.playLesson(l, l._world).el;
  } };
  screens.project = { chrome: 'immersive', render: function (p) { return CH.project.play(G().index.world[p.world]).el; } };
  screens.boss = { chrome: 'immersive', render: function (p) { return CH.boss.play(G().index.world[p.world]).el; } };
  screens.run = { chrome: 'immersive', render: function (p) { return p.session.el; } };

  /* ======================================================================
     CURLO (buddy): stats, gear, evolution, wardrobe
     ====================================================================== */
  screens.buddy = {
    tab: 'buddy',
    render: function () {
      var s = S(), tier = CH.curlo.tier(), form = CH.curlo.form(), T = CH.curlo.TIERS[tier], F = CH.curlo.FORMS[form];
      var el = U.h('<section class="screen" aria-label="' + U.esc(s.profile.name) + '"><div class="scroll">' +
        '<div class="hero"><div class="halo"><span class="spark" style="left:18px;top:40px"></span><span class="spark" style="right:22px;top:24px;animation-delay:-.8s"></span><span class="spark" style="right:10px;bottom:52px;animation-delay:-1.6s"></span>' +

  function startReview() {
    var list = G().reviewSet(5);
    if (!list.length) { CH.fx.toast('Finish a lesson first. Then there’s something to review!', { icon: icon('practice') }); return; }
    var s = CH.session.playList({
      mode: 'review', title: 'Review', noun: 'review', list: list,
      eyebrow: function (i, ch) { return 'Review · ' + i + ' of ' + list.length + ' · ' + (CH.challenges.TYPES[ch.type] || ''); },
      onDone: function (sess) {
        var gained = G().gainHeart(1);
        G().questEvent('practice.done', 1);
        G().markActive();
        var extra = U.h('<div class="stat-gain">' + icon('heart') + (gained ? ' +1 heart for reviewing!' : ' Hearts are full. Nice upkeep!') + '</div>');
        return sess.results({ title: 'Review complete!', sub: 'Spaced repetition keeps concepts fresh.', extraEl: extra }).then(function () { SU.returnToMap(); });
      }
    });
    CH.router.go('run', { session: s }, { dir: 'up' });
  }
  function startPractice(type) {
    var idx = G().index.challenge;

      mode: 'practice', title: 'Practice: ' + CH.challenges.TYPES[type], noun: 'practice run', list: list,
      eyebrow: function (i) { return 'Practice Arena · ' + CH.challenges.TYPES[type] + ' · ' + i + ' of ' + list.length + ' · bonus XP'; },
      onDone: function (sess) {
        G().questEvent('practice.done', 1);
        G().markActive();
        return sess.results({ title: 'Practice complete!', sub: 'Bonus XP earned in the Arena.' }).then(function () { CH.router.go('practice', {}, { dir: 'down', root: true }); });
      }
    });
    CH.router.go('run', { session: s }, { dir: 'up' });
  }
