        document.removeEventListener('pointercancel', up);
        if (!moved) return;
        var v = dy / Math.max(1, Date.now() - t0);
        panel.style.transition = '';
        if (dy > 90 || v > 0.7) { panel.style.transform = ''; onDismiss(); }
        else {
          panel.style.transition = 'transform .35s cubic-bezier(.34,1.56,.64,1)';
          panel.style.transform = '';
          setTimeout(function () { panel.style.transition = ''; }, 400);
        }
      }
      document.addEventListener('pointermove', mv);
      document.addEventListener('pointerup', up);
      document.addEventListener('pointercancel', up);
    });
  }

  /** Confirm helper: resolves true/false. */
  ui.confirm = function (title, html, yes, no, danger) {
    return ui.dialog({ title: title, html: html, mood: danger ? 'worried' : 'thinking', dismissValue: false,
      buttons: [{ label: yes || 'Yes', value: true, cls: danger ? 'coral' : '' }, { label: no || 'Cancel', value: false, cls: 'ghost' }] });
  };

  /** Bottom sheet. opts: { title, html | el }. Returns { el, close }. */
  ui.sheet = function (opts) {
    var root = U.$('#overlay-root'), prevFocus = document.activeElement, id = U.uid('sh');
    var wrap = U.h('<div class="sheet-wrap"><div class="scrim"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="' + id + '">' +
      '<div class="grab" aria-hidden="true"></div><h3><span id="' + id + '">' + U.esc(opts.title || '') + '</span><button class="xbtn" aria-label="Close">' + ui.icon('x') + '</button></h3>' +
      '<div class="sheet-body"></div></div></div>');
    var body = wrap.querySelector('.sheet-body');
    if (opts.el) body.appendChild(opts.el); else body.innerHTML = opts.html || '';
    root.appendChild(wrap);
    var sheet = wrap.querySelector('.sheet'), scrim = wrap.querySelector('.scrim');
    requestAnimationFrame(function () { scrim.classList.add('open'); sheet.classList.add('open'); });
    setTimeout(function () { scrim.classList.add('open'); sheet.classList.add('open'); }, 30);
    var closed = false;
    function close() {
      if (closed) return; closed = true;
      document.removeEventListener('keydown', onKey, true);
      sheet.classList.remove('open'); scrim.classList.remove('open');
      setTimeout(function () { wrap.remove(); }, 420);
      try { if (prevFocus && prevFocus.focus) prevFocus.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
    }
    function onKey(e) { if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); close(); } else trapFocus(sheet, e); }
    document.addEventListener('keydown', onKey, true);
    scrim.onclick = close;
    wrap.querySelector('.xbtn').onclick = close;
    swipeDown(sheet, sheet.querySelector('.grab'), close);
    swipeDown(sheet, sheet.querySelector('h3'), close);
    CH.audio.play('tap');
    setTimeout(function () { var f = sheet.querySelector('.sheet-body ' + FOCUSABLE) || wrap.querySelector('.xbtn'); if (f) f.focus({ preventScroll: true }); }, 80);
    return { el: wrap, body: body, close: close };
  };

  /* ======================================================================
     Celebration overlays (queued by CH.game; flushed at safe moments)
     ====================================================================== */
  var flushing = false;
  ui.flushCelebrations = function () {
    if (flushing) return Promise.resolve();
    flushing = true;
    function nextOne() {
      var item = CH.game.queue.shift();
      if (!item) { flushing = false; ui.renderHUD(); return Promise.resolve(); }
      var p;
      if (item.type === 'levelup') p = celebrate(levelHTML(item), 'lvl', function () { CH.audio.play('levelup'); });
      else if (item.type === 'achievement') p = celebrate(achHTML(item.def), 'ach', function () { CH.audio.play('unlock'); });
      else if (item.type === 'bug') p = celebrate(bugHTML(item.def), 'bugc', function () { CH.audio.play('unlock'); });
      else if (item.type === 'cosmetic') p = celebrate(cosHTML(item.def), 'cos', function () { CH.audio.play('unlock'); }, item.def);
      else if (item.type === 'tier') p = celebrate(tierHTML(item.tier), 'tierc', function () { CH.audio.play('shield'); });
      else if (item.type === 'evolve') p = CH.curlo.evolve(item.from, item.to);
      else p = Promise.resolve();
      return p.then(nextOne, nextOne);
    }
    return nextOne();
  };

  function levelHTML(item) {
    var cos = CH.game.LEVEL_COSMETICS[item.level], def = cos && CH.game.cosmeticDef(cos);
    return { t1: 'LEVEL UP!', big: String(item.level), mascot: true, mood: 'celebrate',
      text: 'You reached <b>level ' + item.level + '</b>!' + (def ? '<br>Unlocked: <b>' + U.esc(def.name) + '</b>' : ''), btn: 'Awesome!' };
  }
  function achHTML(def) {
    return { t1: 'ACHIEVEMENT!', art: '<div class="medal">' + ui.icon('trophy') + '</div>', text: '<b class="ach-name">' + U.esc(def.name) + '</b><br>' + U.esc(def.desc || ''), btn: 'Nice!' };
  }
  function bugHTML(def) {
    return { t1: 'BUG DEFEATED!', art: '<div class="bug-reveal">' + CH.art.beast(def.art || 'bug', { color: def.color }) + '</div>',
      text: '<b>' + U.esc(def.name) + '</b> joins your Bug Bestiary.' + (def.prevent ? '<br><span class="small">' + U.md(def.prevent) + '</span>' : ''), btn: 'Collect' };
  }
  function cosHTML(def) {
    return { t1: 'NEW GEAR!', mascot: true, mood: 'celebrate', hat: def.slot === 'hat' ? def.id : undefined,
      text: 'You unlocked <b>' + U.esc(def.name) + '</b>!', btn: def.slot === 'hat' ? 'Wear it!' : 'Nice!', btn2: def.slot === 'hat' ? 'Later' : null };
  }
  function tierHTML(t) {
    return { t1: 'SHIELD UPGRADE!', mascot: true, mood: 'bracing', tier: t,
      text: 'Your Defense stat grew! Shield: <b>' + CH.curlo.TIERS[t].name + '</b>', btn: 'Shields up!' };
  }

  /** Generic celebration overlay; tap anywhere to skip; resolves when closed. */
  function celebrate(c, kind, sfx, cosDef) {
    return new Promise(function (resolve) {
      var root = U.$('#overlay-root');
      var el = U.h('<div class="lvl ' + kind + ' open" role="dialog" aria-modal="true" aria-label="' + U.esc(c.t1) + '" tabindex="-1">' +
        '<div class="rays" aria-hidden="true"></div><div class="lvl-in">' +
        '<div class="t1">' + c.t1 + '</div>' + (c.big ? '<div class="big">' + c.big + '</div>' : '') +
        (c.mascot ? '<div class="lm"></div>' : '') + (c.art || '') +
        '<div class="t2">' + c.text + '</div>' +
        '<div class="row"><button class="pbtn" data-v="1">' + c.btn + '</button>' + (c.btn2 ? '<button class="pbtn ghost" data-v="0">' + c.btn2 + '</button>' : '') + '</div>' +
        '<div class="skip">Tap anywhere to continue</div></div></div>');
      root.appendChild(el);
      var m = null;
      if (c.mascot) m = CH.curlo.mount(el.querySelector('.lm'), { hat: c.hat, tier: c.tier, fixed: !!(c.hat || c.tier), mood: c.mood });
      el.focus();
      sfx && sfx();
      var inner = el.querySelector('.lvl-in');
      CH.fx.anim(inner, [{ transform: 'translateY(60px)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 500, easing: CH.fx.SPRING, rm: 'fade' });
      var big = el.querySelector('.big');
      if (big) CH.fx.anim(big, [{ transform: 'scale(0) rotate(-20deg)' }, { transform: 'scale(1.3) rotate(6deg)', offset: 0.6 }, { transform: 'scale(.92)', offset: 0.8 }, { transform: 'none' }], { duration: 800 });
      var art = el.querySelector('.medal, .bug-reveal');
      if (art) CH.fx.anim(art, [{ transform: 'scale(.2) rotate(-30deg)', opacity: 0 }, { transform: 'scale(1.2) rotate(8deg)', opacity: 1, offset: 0.6 }, { transform: 'none', opacity: 1 }], { duration: 700, delay: 150, fill: 'backwards', rm: 'fade' });
      setTimeout(function () { if (m) CH.curlo.react(m, c.mood || 'celebrate'); CH.fx.burstAt(art || m || inner, { n: 120 }); }, 250);
      var closed = false;
      function close(v) {
        if (closed) return; closed = true;
        document.removeEventListener('keydown', onKey, true);
        CH.fx.clearConfetti();
        if (cosDef && v) CH.game.equip('hat', cosDef.id);
        CH.fx.anim(el, [{ opacity: 1 }, { opacity: 0 }], { duration: 200, rm: 'keep', fill: 'forwards' }).then(function () { el.remove(); resolve(); });
        setTimeout(function () { if (el.parentNode) el.remove(); resolve(); }, 500);
      }
      function onKey(e) {
        if (e.key === 'Escape' || e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); close(e.key !== 'Escape'); }
      }
      document.addEventListener('keydown', onKey, true);
      el.addEventListener('click', function (e) {
        var b = e.target.closest('[data-v]');
        close(b ? b.dataset.v === '1' : false);
      });
    });
  }

  /* ======================================================================
     Misc helpers used by several screens
     ====================================================================== */
  /** A Curlo + speech bubble header. Returns { el, curlo, bubble }. */
  ui.curloSays = function (html, mood, cls) {
    var el = U.h('<div class="qhead ' + (cls || '') + '"><div class="mini"></div><div class="bubble tail-l" aria-live="polite"></div></div>');
    var c = CH.curlo.mount(el.querySelector('.mini'), { mood: mood || 'happy' });
    if (html && html.nodeType) el.querySelector('.bubble').appendChild(html);
    else el.querySelector('.bubble').innerHTML = html;
    return { el: el, curlo: c, bubble: el.querySelector('.bubble') };
  };

  /**
   * 'Tell me more' expander (keyboard accessible, aria-expanded, springy open).
   * content: element or HTML string. Returns { el, body, open() }.
   */
  ui.expander = function (label, content, opts) {
    opts = opts || {};
    var id = U.uid('more');
    var el = U.h('<div class="more-wrap"><button type="button" class="more-btn" aria-expanded="false" aria-controls="' + id + '"><span>' + U.esc(label || 'Tell me more') + '</span>' + ui.icon('down', 'chev') + '</button><div class="more-body" id="' + id + '" hidden></div></div>');
    var body = el.querySelector('.more-body'), btn = el.querySelector('.more-btn');
    if (typeof content === 'string') body.innerHTML = content; else if (content) body.appendChild(content);
    function set(open) {
      btn.setAttribute('aria-expanded', String(open));
      btn.querySelector('span').textContent = open ? (opts.lessLabel || 'Show less') : (label || 'Tell me more');
      body.hidden = !open;
      if (open) {
        CH.fx.anim(body, [{ opacity: 0, transform: 'translateY(-10px) scaleY(.96)' }, { opacity: 1, transform: 'translateY(2px) scaleY(1.01)', offset: 0.7 }, { opacity: 1, transform: 'none' }], { duration: 380, easing: CH.fx.EASE_OUT, rm: 'fade' });
        if (opts.onOpen) opts.onOpen(body);
      }
    }
    btn.onclick = function () { CH.audio.play('tap'); set(btn.getAttribute('aria-expanded') !== 'true'); };
    return { el: el, body: body, open: function () { set(true); } };
  };

  /**
   * Long story text → first sentence (or two, if short) by default, the rest
   * in a native <details> "Tell me more" (keyboard accessible out of the box).
   */
  ui.storyHTML = function (text) {
    var t = String(text || '').trim();
    var parts = t.match(/[^.!?]+[.!?]+["\u201D')]*\s*|[^.!?]+$/g) || [t];
    var first = parts[0], k = 1;
    while (k < parts.length && (first + parts[k]).split(/\s+/).length <= 22) { first += parts[k]; k++; }
    var rest = parts.slice(k).join('').trim();
    return '<p class="story-short">' + U.md(first.trim()) + '</p>' +
      (rest ? '<details class="more-details"><summary>Tell me more</summary><p>' + U.md(rest) + '</p></details>' : '');
  };
  /**
   * Story text as an element. Accepts a string (short + "Tell me more") or an
   * ARRAY of short lines shown one bubble at a time (tap / Next to advance).
   */
  ui.story = function (text) {
    var arr = Array.isArray(text) ? text.filter(Boolean) : [text];
    if (arr.length <= 1) return U.h('<div class="story">' + ui.storyHTML(arr[0] || '') + '</div>');
    var el = U.h('<div class="story story-seq"><p class="story-line" aria-live="polite"></p>' +
      '<div class="story-nav"><span class="story-dots" aria-hidden="true">' + arr.map(function () { return '<i></i>'; }).join('') + '</span>' +
      '<button type="button" class="more-btn story-next"><span>Next</span>' + ui.icon('next', 'chev') + '</button></div></div>');
    var i = 0, line = el.querySelector('.story-line'), btn = el.querySelector('.story-next');
    function show() {
      line.innerHTML = U.md(arr[i]);
      U.$$('.story-dots i', el).forEach(function (d, k) { d.classList.toggle('on', k <= i); });
      btn.hidden = i >= arr.length - 1;
      CH.fx.anim(line, [{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }], { duration: 260, easing: CH.fx.EASE_OUT, rm: 'fade' });
    }
    function next(e) { if (e) e.stopPropagation(); if (i < arr.length - 1) { i++; CH.audio.play('pop'); show(); } }
    btn.onclick = next;
    line.onclick = next;
    show();
    return el;
  };

  // Springy reveal for any <details> opening.
  document.addEventListener('toggle', function (e) {
    var d = e.target;
    if (!d || d.tagName !== 'DETAILS' || !d.open) return;
    var body = d.querySelector(':scope > :not(summary)');
    if (body) CH.fx.anim(body, [{ opacity: 0, transform: 'translateY(-8px)' }, { opacity: 1, transform: 'none' }], { duration: 320, easing: CH.fx.EASE_OUT, rm: 'fade' });
  }, true);

  /** Keep the HUD fresh when progress changes. */
  E.on('hearts', function () { if (!U.$('#app').classList.contains('immersive')) ui.renderHUD(); });
  E.on('quests', function () { if (!U.$('#app').classList.contains('immersive')) ui.renderHUD(); });
  E.on('xp', function () { if (!U.$('#app').classList.contains('immersive')) ui.animateXP(); });
})();
</script>
<script>
/* engine/codeview.js */
/* ==========================================================================
   Cpp Hero — engine/codeview.js  (CH.code)
   C++ syntax highlighter, code blocks (line numbers, UNSAFE badge, tappable
   lines, inline blanks, diff marks), typing effect, and the animated demo
   player: line-by-line execution with a live output console, variable boxes
   that fill/update, themed crash (glitch + corrupted console) and shield
   deflect visuals.
   ========================================================================== */
(function () {
  'use strict';
  var CH = window.CH, U = CH.util;

  var KW = new Set(('return if else for while do switch case default break continue const constexpr consteval constinit true false auto nullptr new delete ' +
    'class struct public private protected virtual override final template typename namespace using try catch throw noexcept static explicit ' +
    'this operator enum sizeof static_assert static_cast dynamic_cast reinterpret_cast const_cast inline friend mutable typedef goto volatile extern ' +
    'co_await co_return co_yield requires concept decltype alignas alignof thread_local export import module').split(' '));
  var TY = new Set('int bool char double float void long short unsigned signed size_t wchar_t char8_t char16_t char32_t int8_t int16_t int32_t int64_t uint8_t uint16_t uint32_t uint64_t ptrdiff_t'.split(' '));

  /** Tokenize one line of C++ → [[type, text], ...]. */
  function tokLine(src) {
    var out = [];
    var re = /(\/\/.*$)|(\/\*.*?\*\/)|(#\s*\w+(?:\s*<[^>]*>)?)|("(?:\\.|[^"\\])*"?)|('(?:\\.|[^'\\])*'?)|(\b\d[\d']*\.?\d*(?:[eE][+-]?\d+)?[fFuUlL]*\b|\.\d+\b)|(___)|([A-Za-z_]\w*)|(\s+)|(.)/g;
    var m;
    while ((m = re.exec(src))) {
      var t;
      if (m[1] || m[2]) t = 'cm';
      else if (m[3]) t = 'pp';
      else if (m[4] || m[5]) t = 'st';
      else if (m[6]) t = 'nu';
      else if (m[7]) t = 'blank';
      else if (m[8]) {
        var w = m[8];
        t = KW.has(w) ? 'kw' : TY.has(w) ? 'ty' : w === 'std' ? 'ns' : 'id';
        if (t === 'id') {
          var n = out.length;
          if (n >= 3 && out[n - 1][1] === ':' && out[n - 2][1] === ':' && out[n - 3][0] === 'ns') t = 'lib';
        }
      }
      else if (m[9]) t = 'ws';
      else t = 'pu';
      out.push([t, m[0]]);
      if (m[0] === '') re.lastIndex++;
    }
    return out;
  }

  /** Highlight a line; optionally truncated to `limit` chars (typing effect). */
  var SHELL = /^\s*(\$\s|g\+\+\s|clang\+\+\s|c\+\+\s|\.\/|cmake\s|make\b)/;
  var BLANK_MARK = '\u0001';
  /**
   * Highlight a line. A "___" blank can appear anywhere (even inside a string
   * literal), so it is swapped for a marker char before tokenizing and turned
   * into the blank element afterwards.
   */
  function lineHTML(src, limit, blankHTML) {
    src = String(src);
    if (src.indexOf('___') < 0) return lineHTMLRaw(src, limit, blankHTML);
    var marked = src.replace(/___/g, BLANK_MARK);
    var lim = limit == null ? null : Math.max(0, limit - (src.slice(0, limit).split('___').length - 1) * 2);
    var html = lineHTMLRaw(marked, lim, blankHTML);
    var bh = blankHTML != null ? blankHTML : '<span class="blank" aria-label="blank">___</span>';
    return html.split(BLANK_MARK).join(bh);
  }
  function lineHTMLRaw(src, limit, blankHTML) {
    // Shell command lines (e.g. "g++ -Wall main.cpp") get a plain shell style.
    if (SHELL.test(src)) {
      var shown = limit == null ? src : src.slice(0, limit);
      var esc = U.esc(shown);
      if (/___/.test(shown)) esc = esc.replace('___', blankHTML != null ? blankHTML : '<span class="blank" aria-label="blank">___</span>');
      return '<span class="t-sh">' + esc + '</span>';
    }
    var toks = tokLine(src), body = '', left = limit == null ? Infinity : limit;
    for (var i = 0; i < toks.length; i++) {
      if (left <= 0) break;
      var t = toks[i][0], v = toks[i][1], part = v.slice(0, left);
      left -= part.length;
      if (t === 'blank') body += blankHTML != null ? blankHTML : '<span class="blank" aria-label="blank">___</span>';
      // Leading indentation is drawn with padding (hanging indent), so the
      // spaces themselves are kept in the DOM (copy/paste) but not rendered.
      else if (t === 'ws' && i === 0) body += '<span class="lead">' + U.esc(part) + '</span>';
      else if (t === 'ws' || t === 'id') body += U.esc(part);
      else body += '<span class="t-' + t + '">' + U.esc(part) + '</span>';
    }
    return body;
  }

  var code = (CH.code = { tokLine: tokLine, lineHTML: lineHTML });

  /**
   * Build a code block element.
   * opts: { unsafe, safe, label, tappable (lines become buttons), blankHTML,
   *         diffAgainst (other source: lines not in it get a "+" mark), caption }
   */
  code.block = function (src, opts) {
    opts = opts || {};
    src = String(src == null ? '' : src).replace(/\r\n?/g, '\n');
    var lines = src.split('\n');
    var other = opts.diffAgainst != null ? String(opts.diffAgainst).split('\n').map(function (s) { return s.trim(); }) : null;
    var wrap = U.h('<div class="codewrap"></div>');
    if (opts.unsafe || opts.safe || opts.caption) {
      wrap.appendChild(U.h('<div class="dhead">' +
        (opts.unsafe ? '<span class="badge unsafe">' + CH.ui.icon('warn') + 'Unsafe \u2014 don\u2019t copy</span>' : '') +
        (opts.safe ? '<span class="badge safe">' + CH.ui.icon('shield') + 'Hardened</span>' : '') +
        (opts.caption ? '<span class="dcap">' + U.esc(opts.caption) + '</span>' : '') + '</div>'));
    }
    var el = U.h('<div class="code' + (opts.unsafe ? ' is-unsafe' : '') + (opts.tappable ? ' tappable' : '') + '" role="' + (opts.tappable ? 'group' : 'region') + '" aria-label="' + U.esc(opts.label || (opts.unsafe ? 'Unsafe C++ code' : 'C++ code')) + '"></div>');
    lines.forEach(function (ln, i) {
      var added = other && ln.trim() && other.indexOf(ln.trim()) < 0;
      // Wrapped lines get a hanging indent: continuation rows start 2ch past the line's own indentation.
      var ind = (/^[ \t]*/.exec(ln)[0] || '').replace(/\t/g, '    ').length;
      var inner = '<span class="no" aria-hidden="true">' + (i + 1) + '</span><span class="cd" style="--ind:' + ind + '">' + (lineHTML(ln, null, opts.blankHTML) || ' ') + '</span>' + (added ? '<span class="dmark" aria-label="changed line">+</span>' : '');
      var row = opts.tappable
        ? '<button type="button" class="ln" data-l="' + i + '" aria-pressed="false" aria-label="Line ' + (i + 1) + ': ' + U.esc(ln.trim() || 'blank line') + '">' + inner + '</button>'
        : '<div class="ln' + (added ? ' added' : '') + (/___/.test(ln) ? ' has-blank' : '') + '" data-l="' + i + '">' + inner + '</div>';
      el.insertAdjacentHTML('beforeend', row);
    });
    wrap.appendChild(el);
    wrap._code = el;
    return wrap;
  };

  /** Highlight line index `l` (or -1 for none) in a .code element. */
  code.hl = function (codeEl, l) {
    U.$$('.ln', codeEl).forEach(function (x) { x.classList.toggle('hl', +x.dataset.l === l); });
    var t = codeEl.querySelector('.ln.hl');
    if (t && t.scrollIntoView && codeEl.scrollHeight > codeEl.clientHeight) {
      try { t.scrollIntoView({ block: 'nearest' }); } catch (e) { /* ignore */ }
    }
  };

  /**
   * Typing effect into an existing .code element built by code.block().
   * Resolves when done; tapping the code skips to the end.
   */
  code.type = function (codeEl, src) {
    return new Promise(function (resolve) {
      var lines = String(src).split('\n');
      var rows = U.$$('.ln', codeEl);
      var total = lines.reduce(function (a, l) { return a + l.length; }, 0);
      function render(n) {
        var left = n, caretDone = false;
        rows.forEach(function (row, i) {
          var ln = lines[i] || '';
          var cd = row.querySelector('.cd');
          if (left <= 0 && i > 0 && !caretDone) { row.style.visibility = 'hidden'; return; }
          var show = Math.min(ln.length, left);
          left -= ln.length;
          cd.innerHTML = (lineHTML(ln, show) || ' ') + (!caretDone && left <= 0 ? '<span class="caret"></span>' : '');
          if (left <= 0) caretDone = true;
          row.style.visibility = '';
        });
      }
      function finish() {
        clearInterval(timer);
        codeEl.removeEventListener('click', finish);
        rows.forEach(function (row, i) { row.style.visibility = ''; row.querySelector('.cd').innerHTML = lineHTML(lines[i] || '') || ' '; });
        codeEl.classList.remove('typing');
        resolve();
      }
      if (CH.fx.reduced() || !total) { finish(); return; }
      codeEl.classList.add('typing');
      var n = 0, stepN = Math.max(2, Math.ceil(total / 60)), timer;
      render(0);
      timer = setInterval(function () {
        n += stepN;
        if (n >= total) { finish(); return; }
        render(n);
      }, 22);
      codeEl.addEventListener('click', finish);
    });
  };

  /* ======================================================================
     Demo player
     demo: { code, steps: [{ line, note, out, vars:{name:"val"}, crash, shield }] }
     ====================================================================== */
  code.demo = function (demo, opts) {
    opts = opts || {};
    var steps = (demo && demo.steps) || [];
    var varNames = [];
    steps.forEach(function (s) { Object.keys(s.vars || {}).forEach(function (k) { if (varNames.indexOf(k) < 0) varNames.push(k); }); });
    var hasDefense = steps.some(function (s) { return s.crash || s.shield; });

    var el = U.h('<div class="demo">' +
      '<div class="demo-code"></div>' +
      '<div class="demo-note"><div class="mini"></div><div class="stepnote bubble tail-l" aria-live="polite">Watch the code type itself, then run it.</div></div>' +
      '<div class="exec' + (varNames.length ? '' : ' novars') + '">' +
        '<div class="console" role="log" aria-label="Output console"><div class="ch"><i></i><i></i><i></i>&nbsp;Output</div><div class="out"><span class="dim">waiting to run\u2026</span></div></div>' +
        (varNames.length ? '<div class="vars" aria-label="Variables"></div>' : '') +
      '</div>' +
      '<div class="row demo-btns">' +
        '<button class="pbtn teal" data-a="run">' + CH.ui.icon('play') + 'Run it</button>' +
        '<button class="pbtn ghost" data-a="step">' + CH.ui.icon('step') + 'Step</button>' +
        '<button class="pbtn ghost" data-a="retype" aria-label="Retype the code">' + CH.ui.icon('retype') + 'Retype</button>' +
      '</div></div>');
    var block = code.block(demo.code, { label: 'Demo C++ code', unsafe: opts.unsafe });
    el.querySelector('.demo-code').appendChild(block);
    var codeEl = block._code;
    var mini = CH.curlo.mount(el.querySelector('.demo-note .mini'), { mood: 'happy' });
    var note = el.querySelector('.stepnote'), outEl = el.querySelector('.out'), varsEl = el.querySelector('.vars');
    var boxes = {};
    if (varsEl) varNames.forEach(function (n) {
      var b = U.h('<div class="varbox"><div class="vl">' + U.esc(n) + '</div><div class="vv" aria-live="polite">&nbsp;</div></div>');
      varsEl.appendChild(b); boxes[n] = b.querySelector('.vv');
    });

    var idx = -1, running = false, typed = false, buffer = '', stepsRun = 0;
    var ctl = { el: el, stepsRun: function () { return stepsRun; } };

    function reset() {
      idx = -1; running = false; buffer = '';
      code.hl(codeEl, -1);
      codeEl.classList.remove('glitch');
      outEl.innerHTML = '<span class="dim">waiting to run\u2026</span>';
      Object.keys(boxes).forEach(function (k) { boxes[k].innerHTML = '&nbsp;'; boxes[k].className = 'vv'; });
      note.textContent = 'Press Run, or Step through one line at a time.';
      CH.curlo.react(mini, 'happy');
      el.querySelector('[data-a=run]').disabled = false;
    }
    function writeOut(txt, cls) {
      if (idx === 0 && !cls) { /* first output clears prompt */ }
      var span = document.createElement('span');
      if (cls) span.className = cls;
      span.textContent = txt;
      outEl.appendChild(span);
      outEl.parentNode.scrollTop = outEl.parentNode.scrollHeight;
    }
    function doStep() {
      if (idx >= steps.length - 1) reset();
      if (idx === -1) { outEl.innerHTML = ''; writeOut('$ ./hero\n', 'dim'); }
      idx++;
      stepsRun++;
      var s = steps[idx];
      code.hl(codeEl, typeof s.line === 'number' ? s.line : -1);
      note.innerHTML = U.md(s.note || '');
      CH.audio.play('tap');
      if (s.vars) Object.keys(s.vars).forEach(function (k) {
        var b = boxes[k]; if (!b) return;
        var v = String(s.vars[k]), garbage = v === '?';
        b.textContent = v;
        b.className = 'vv ' + (garbage ? 'garbage' : 'full');
        b.setAttribute('aria-label', k + ' = ' + (garbage ? 'uninitialized (garbage)' : v));
        CH.fx.anim(b, [{ transform: 'scale(.4) rotate(-12deg)' }, { transform: 'scale(1.25) rotate(4deg)' }, { transform: 'scale(.94)' }, { transform: 'none' }], { duration: 560 });
        CH.curlo.react(mini, garbage ? 'worried' : 'happy', 700);
      });
      if (s.out != null && s.out !== '') { writeOut(String(s.out)); CH.audio.play('pop'); }
      if (s.crash) {
        CH.audio.play('crash');
        CH.curlo.react(mini, 'worried', 2200);
        CH.fx.cssPulse(codeEl, 'glitch', 1600);
        CH.fx.shake(el.querySelector('.console'), 6);
        var junk = '', G = '\u2592\u2593\u2591#@!?%&';
        for (var j = 0; j < 14; j++) junk += G[U.rand(G.length)];
        writeOut(junk + '\n', 'bad');
        writeOut('\u26A0 ' + s.crash + '\n', 'bad');
        Object.keys(boxes).forEach(function (k) { if (boxes[k].classList.contains('full')) { boxes[k].classList.add('scramble'); } });
        setTimeout(function () { Object.keys(boxes).forEach(function (k) { boxes[k].classList.remove('scramble'); }); }, 900);
      }
      if (s.shield) {
        CH.audio.play('shield');
        CH.curlo.react(mini, 'bracing', 1500);
        var r = mini.getBoundingClientRect(), hr = el.getBoundingClientRect();
        CH.fx.shock(el, r.left - hr.left + r.width * 0.8, r.top - hr.top + r.height * 0.6);
        CH.fx.burstAt(mini, { n: 30, colors: ['#0FA898', '#C4F1EA', '#FFC62E'] });
        writeOut('\uD83D\uDEE1 ' + s.shield + '\n', 'ok');
      }
      if (idx === steps.length - 1) {
        var crashed = steps.some(function (x) { return x.crash; }) && !steps.some(function (x) { return x.shield; });
        writeOut(crashed ? '[program misbehaved]\n' : '[exited with code 0]\n', crashed ? 'bad' : 'ok');
        if (!crashed) CH.curlo.react(mini, 'celebrate', 1100);
        el.dispatchEvent(new CustomEvent('demo-done'));
      }
      return idx < steps.length - 1;
    }
    function ensureTyped() {
      if (!typed) { typed = true; return typing.then(function () {}); }
      return typing;
    }
    function runAll() {
      if (running) return;
      ensureTyped().then(function () {
        reset();
        running = true;
        el.querySelector('[data-a=run]').disabled = true;
        (function loop() {
          if (!running) return;
          var more = doStep();
          if (!more) { running = false; el.querySelector('[data-a=run]').disabled = false; return; }
          setTimeout(loop, CH.fx.reduced() ? 600 : 950);
        })();
      });
    }
    var typing = Promise.resolve();
    function retype() {
      running = false;
      reset();
      note.textContent = 'Watch the code type itself, then run it.';
      typing = code.type(codeEl, demo.code);
      typed = true;
      return typing;
    }
    el.querySelector('[data-a=run]').onclick = runAll;
    el.querySelector('[data-a=step]').onclick = function () { ensureTyped().then(function () { running = false; el.querySelector('[data-a=run]').disabled = false; doStep(); }); };
    el.querySelector('[data-a=retype]').onclick = retype;
    if (!steps.length) { el.querySelector('[data-a=run]').hidden = true; el.querySelector('[data-a=step]').hidden = true; }
    ctl.start = retype;
    ctl.stop = function () { running = false; };
    ctl.hasDefense = hasDefense;
    return ctl;
  };

  /** Side-by-side (stacked on narrow) unsafe vs hardened comparison. */
  code.sideBySide = function (sb) {
    var el = U.h('<div class="sbs"><div class="sbs-title">' + CH.ui.icon('shieldO') + ' Unsafe vs. hardened</div><div class="sbs-grid"></div></div>');
    var g = el.querySelector('.sbs-grid');
    var a = code.block(sb.unsafe, { unsafe: true, label: 'Unsafe version' });
    var b = code.block(sb.hardened, { safe: true, label: 'Hardened version', diffAgainst: sb.unsafe, caption: '+ marks the fix' });
    g.appendChild(a); g.appendChild(b);
    return el;
  };

  /** UB reminder note. */
  code.ubNote = function () {
    return U.h('<div class="ubnote" role="note">' + CH.ui.icon('info') + '<span>Undefined behavior doesn\u2019t guarantee a crash. It can seem to work, then fail later or on another compiler.</span></div>');
  };
})();
</script>
<script>
/* engine/arena.js */
/* ==========================================================================
   Cpp Hero — engine/arena.js  (CH.arena)
   The defense arena (from the design's "Defense drill"): Curlo on the left,
   a hostile input on the right and a strip of memory cells. Used by the
   project Stress Test and the boss Defense Phase.
     crash(): the input hits → glitch, scrambled memory, worried Curlo
     block(): shield up → the input bounces off with a shock ring + sparks
   All sequences resolve via timers (never only on animation events).
   ========================================================================== */
(function () {
  'use strict';
  var CH = window.CH, U = CH.util;

  var HEX = '0123456789ABCDEF';
  function junk() { return HEX[U.rand(16)] + HEX[U.rand(16)]; }

  CH.arena = {
    /** opts: { cellsLabel } → controller */
    create: function (opts) {
      opts = opts || {};
      var el = U.h('<div class="arena' + (opts.bossArt ? ' has-boss' : '') + '" aria-hidden="true">' +
        '<div class="floor"></div><div class="dm"></div>' +
        '<div class="attack" hidden></div>' +
        (opts.bossArt ? '<div class="arena-boss">' + opts.bossArt + '</div>' : '') +
        '<div class="cells"' + (opts.bossArt ? ' hidden' : '') + '><span class="cl">' + U.esc(opts.cellsLabel || 'memory') + '</span></div></div>');
      var cells = el.querySelector('.cells');
      var BYTES = ['2A', '00', '00', '00'];
      BYTES.forEach(function (b) { cells.insertAdjacentHTML('beforeend', '<div class="cell">' + b + '</div>'); });
      var curlo = CH.curlo.mount(el.querySelector('.dm'), { mood: 'happy' });
      var atk = el.querySelector('.attack');
      var busy = false;

      function setCells(arr, cls) {
        U.$$('.cell', el).forEach(function (c, i) { c.textContent = arr[i]; c.className = 'cell' + (cls ? ' ' + cls : ''); });
      }
      function resetAtk() { CH.fx.cancel(atk); atk.style.opacity = 1; atk.style.transform = ''; }

      var api = {
        el: el, curlo: curlo,
        /** Show the incoming hostile input. */
        setAttack: function (text) {
          resetAtk();
          atk.hidden = false;
          atk.textContent = text === '' ? '""' : text;
          setCells(BYTES);
          CH.curlo.react(curlo, 'thinking');
          CH.fx.anim(atk, [{ transform: 'translateX(80px) scale(.6)', opacity: 0 }, { transform: 'translateX(-6px) scale(1.08)', opacity: 1, offset: 0.7 }, { transform: 'none', opacity: 1 }],
            { duration: 420, easing: 'ease-out', rm: 'fade' });
          CH.audio.play('whoosh');
        },
        /** Unsafe code: the input breaks through. */
        crash: function () {
          if (busy) return Promise.resolve();
          busy = true;
          var rm = CH.fx.reduced();
          var W = el.clientWidth;
          var fly = rm ? Promise.resolve() : CH.fx.anim(atk, [{ transform: 'none' }, { transform: 'translate(' + (-(W * 0.35)) + 'px,-24px) rotate(-20deg)', offset: 0.45 }, { transform: 'translate(' + (-(W * 0.55)) + 'px,40px) scale(.5)', opacity: 0 }],
            { duration: 520, easing: 'cubic-bezier(.5,0,.8,.6)', fill: 'forwards' });
          return fly.then(function () {
            atk.style.opacity = 0;
            CH.audio.play('crash');
            CH.curlo.react(curlo, 'worried');
            CH.fx.cssPulse(el, 'glitch', 1600);
            var k = 0, iv = setInterval(function () { setCells(BYTES.map(junk), 'bad'); if (++k > 12) clearInterval(iv); }, 60);
            return U.sleep(rm ? 200 : 760).then(function () {
              clearInterval(iv);
              setCells(['??', '▒▒', 'FF', '??'], 'bad');
              busy = false;
            });
          });
        },
        /** Hardened code: the shield deflects it. */
        block: function () {
          if (busy) return Promise.resolve();
          busy = true;
          var rm = CH.fx.reduced();
          CH.curlo.react(curlo, 'bracing');
          setCells(BYTES, 'safe');
          var W = el.clientWidth, dmW = el.querySelector('.dm').offsetWidth;
          var dx = -(W - 14 - atk.offsetWidth - 14 - dmW * 0.95);
          var p = rm ? U.sleep(150) : U.sleep(220).then(function () {
            return CH.fx.anim(atk, [{ transform: 'none' }, { transform: 'translate(' + dx + 'px,40px) rotate(-30deg)' }], { duration: 360, easing: 'cubic-bezier(.5,0,.9,.5)', fill: 'forwards' });
          });
          return p.then(function () {
            CH.audio.play('shield');
            var r = el.querySelector('.dm').getBoundingClientRect(), ar = el.getBoundingClientRect();
            CH.fx.shock(el, r.right - ar.left - 8, r.top - ar.top + r.height * 0.62);
            CH.fx.burstAt(el.querySelector('.dm'), { n: 36, colors: ['#FFC62E', '#0FA898', '#fff'], speed: 0.8 });
            var out = rm ? Promise.resolve() : CH.fx.anim(atk, [{ transform: 'translate(' + dx + 'px,40px) rotate(-30deg)' }, { transform: 'translate(' + (dx + 90) + 'px,-30px) rotate(200deg) scale(1.1)', offset: 0.45 }, { transform: 'translate(' + (dx + 170) + 'px,120px) rotate(420deg) scale(.6)', opacity: 0 }],
              { duration: 650, easing: 'cubic-bezier(.2,.8,.4,1)', fill: 'forwards' });
            return out;
          }).then(function () {
            atk.style.opacity = 0;
            CH.curlo.react(curlo, 'celebrate', 1200);
            busy = false;
          });
        },
        reset: function () { resetAtk(); atk.hidden = true; setCells(BYTES); CH.curlo.react(curlo, 'happy'); }
      };
      return api;
    }
  };
})();
</script>
<script>
/* engine/challenges.js */
/* ==========================================================================
   Cpp Hero — engine/challenges.js  (CH.challenges)
   Renderers for every challenge type in the content schema:
     mcq, predict, fill, order, write, bug, breakit, harden, review, edge,
     safe (timed Safe/Unsafe), speed (timed mini-MCQs)
   Plus: validation, answer normalization, tiered hints, and the explanation
   panel shown after EVERY answer (per-option "why", side-by-side unsafe vs.
   hardened for defensive types). Right/wrong is never shown by color alone:
   every mark has an icon and a text label.

   render(ch, host, ctx) → Promise<{ correct, assisted, score, hints }>
     ctx: { mode, eyebrow, onAnswer(result) → { xpText }, onHint(tier, cost),
            noHints, continueLabel }
   The promise resolves when the learner presses Continue.
   ========================================================================== */
(function () {
  'use strict';
  var CH = window.CH, U = CH.util;
  var icon = function (n, c) { return CH.ui.icon(n, c); };

  var TYPES = {
    mcq: 'Concept check', predict: 'Predict the output', fill: 'Fill in the blank', order: 'Put the lines in order',
    write: 'Write a line', bug: 'Spot & fix the bug', breakit: 'Break it', harden: 'Harden it', review: 'Code review',
    edge: 'Edge case hunt', safe: 'Safe or unsafe?', speed: 'Speed round'
  };
  var DEFENSIVE = ['bug', 'breakit', 'harden', 'review', 'edge', 'safe'];
  var HINT_COST = [2, 3, 5];
  var KEYS = 'ABCDEFGH';

  /* ======================================================================
     Validation (dev aid: warns in the console, never throws)
     ====================================================================== */
  function validate(ch) {
    var p = [];
    function need(c, msg) { if (!c) p.push(msg); }
    need(ch.id, 'missing id');
    need(TYPES[ch.type], 'unknown type "' + ch.type + '"');
    need(ch.prompt || ch.type === 'safe' || ch.type === 'speed', 'missing prompt');
    var opts = ch.options || [];
    switch (ch.type) {
      case 'mcq': case 'predict': case 'breakit':
        need(opts.length >= 2, 'needs options'); need(ch.answer >= 0 && ch.answer < opts.length, 'answer out of range'); break;
      case 'harden':
        need(opts.length >= 2, 'needs options'); need(ch.answer >= 0 && ch.answer < opts.length, 'answer out of range');
        need(/___/.test(ch.code || ''), 'harden code needs ___'); break;
      case 'fill':
        need((String(ch.code || '').match(/___/g) || []).length === 1, 'fill code needs exactly one ___');
        need(Array.isArray(ch.accept) && ch.accept.length, 'fill needs accept[]'); break;
      case 'write': need((ch.accept && ch.accept.length) || (ch.acceptRe && ch.acceptRe.length), 'write needs accept/acceptRe'); break;
      case 'order': need(Array.isArray(ch.lines) && ch.lines.length >= 2, 'order needs lines'); break;
      case 'bug':
        need(ch.code, 'bug needs code'); need(typeof ch.bugLine === 'number', 'bug needs bugLine');
        need(opts.length >= 2 && ch.answer >= 0 && ch.answer < opts.length, 'bug needs options/answer'); break;
      case 'review': need(ch.code && Array.isArray(ch.dangerous) && ch.dangerous.length, 'review needs code + dangerous[]'); break;
      case 'edge': need(opts.length >= 2 && Array.isArray(ch.answers) && ch.answers.length, 'edge needs options + answers[]'); break;
      case 'safe': need(Array.isArray(ch.items) && ch.items.length, 'safe needs items'); break;
      case 'speed': need(Array.isArray(ch.items) && ch.items.length, 'speed needs items'); break;
    }
    if (DEFENSIVE.indexOf(ch.type) >= 0 && ch.type !== 'safe') need(ch.sideBySide && ch.sideBySide.unsafe && ch.sideBySide.hardened, 'defensive type needs sideBySide');
    if (p.length) console.warn('[content] challenge ' + (ch.id || '?') + ': ' + p.join('; '));
    return p;
  }

  /* ======================================================================
     Normalization for fill / write:
     trim, straighten smart quotes, collapse whitespace, drop spaces around
     punctuation (){}[];,<>=+-*\/&|!:
     ====================================================================== */
  function normalize(s) {
    return String(s == null ? '' : s)
      .replace(/[“”„″]/g, '"').replace(/[‘’′]/g, "'")
      .replace(/ /g, ' ')
      .trim()
      .replace(/\s+/g, ' ')
      .replace(/\s*([(){}\[\];,<>=+\-*\/&|!:])\s*/g, '$1');
  }
  function matches(input, ch) {
    var n = normalize(input);
    if (!n) return false;
    if ((ch.accept || []).some(function (a) { return normalize(a) === n; })) return true;
    return (ch.acceptRe || []).some(function (r) {
      try { return new RegExp(r).test(n); } catch (e) { console.warn('[content] bad acceptRe in', ch.id, r); return false; }
    });
  }

  function optText(o) { return typeof o === 'string' ? o : (o && o.t != null ? String(o.t) : ''); }
  function optWhy(o) { return o && typeof o === 'object' ? o.why : ''; }

  /** Tier-3 hint text: the answer itself. */
  function answerText(ch) {
    var o = ch.options || [];
    switch (ch.type) {
      case 'mcq': return '<b>' + U.md(optText(o[ch.answer])) + '</b>';
      case 'breakit': case 'harden': return '<code class="i">' + U.esc(optText(o[ch.answer])) + '</code>';
      case 'predict': return '<span class="mono">' + U.visibleWS(optText(o[ch.answer])) + '</span>';
      case 'fill': case 'write': return '<code class="i">' + U.esc((ch.accept && ch.accept[0]) || '') + '</code>';
      case 'order': return '<ol class="ans-lines">' + ch.lines.map(function (l) { return '<li><code class="i">' + U.esc(l.trim()) + '</code></li>'; }).join('') + '</ol>';
      case 'bug': return 'Line ' + (ch.bugLine + 1) + ' is the bug. Fix: <code class="i">' + U.esc(optText(o[ch.answer])) + '</code>';
      case 'review': return 'Dangerous line' + (ch.dangerous.length > 1 ? 's' : '') + ': ' + ch.dangerous.map(function (i) { return i + 1; }).join(', ');
      case 'edge': return (ch.answers || []).map(function (i) { return '<code class="i">' + U.esc(optText(o[i])) + '</code>'; }).join(' ');
      default: return '';
    }
  }

  /* ======================================================================
     Shared building blocks
     ====================================================================== */
  function shell(ch, ctx) {
    var el = U.h('<div class="chal" data-type="' + U.esc(ch.type) + '">' +
      '<div class="eyebrow">' + U.esc(ctx.eyebrow || TYPES[ch.type] || 'Challenge') + '</div></div>');
    var head = CH.ui.curloSays('<div class="react-line" hidden></div><div class="prompt">' + U.md(ch.prompt || defaultPrompt(ch)) + '</div>', 'thinking');
    el.appendChild(head.el);
    var body = U.h('<div class="chal-body"></div>');
    el.appendChild(body);
    var actions = U.h('<div class="chal-actions"></div>');
    el.appendChild(actions);
    var hintbox = U.h('<div class="hintbox" aria-live="polite" hidden></div>');
    el.appendChild(hintbox);
    var result = U.h('<div class="result" aria-live="polite"></div>');
    el.appendChild(result);
    return { el: el, head: head, body: body, actions: actions, hintbox: hintbox, result: result };
  }
  function defaultPrompt(ch) { return ch.type === 'safe' ? 'Safe or unsafe? Decide fast!' : ch.type === 'speed' ? 'Answer as many as you can!' : ''; }

  function codeFor(ch, opts) {
    if (!ch.code) return null;
    return CH.code.block(ch.code, Object.assign({ unsafe: !!ch.unsafe }, opts || {}));
  }

  /** Big 3D "Check" button. */
  function checkBtn(label) {
    return U.h('<button class="pbtn check-btn" disabled>' + (label || 'Check') + '</button>');
  }

  /** Tiered hint button wiring. */
  function hints(ch, ctx, sh, state) {
    if (ctx.noHints) return;
    var list = (ch.hints || []).slice(0, 2);
    var tiers = list.length + 1;           // + answer tier
    var btn = U.h('<button class="pbtn ghost hint-btn" aria-describedby="">' + icon('bulb') + '<span>Hint</span><small>−' + HINT_COST[0] + ' XP</small></button>');
    sh.actions.insertBefore(btn, sh.actions.firstChild);
    btn.onclick = function () {
      if (state.answered) return;
      var t = state.hints;                 // 0-based tier to reveal
      if (t >= tiers) return;
      var cost = HINT_COST[Math.min(t, 2)];
      state.hints++;
      var isAnswer = t === tiers - 1;
      if (isAnswer) state.assisted = true;
      var html = isAnswer
        ? '<div class="hint answer"><b>' + icon('bulb') + ' Answer:</b> ' + answerText(ch) + (ch.explain ? '<div class="hx">' + U.md(ch.explain) + '</div>' : '') + '</div>'
        : '<div class="hint"><b>' + icon('bulb') + ' Hint ' + (t + 1) + ':</b> ' + U.md(list[t]) + '</div>';
      sh.hintbox.hidden = false;
      var h = U.h(html);
      sh.hintbox.appendChild(h);
      CH.fx.slideUp(h);
      if (ctx.onHint) ctx.onHint(t + 1, cost, btn);
      CH.audio.play('pop');
      CH.curlo.react(sh.head.curlo, 'thinking');
      var rl = sh.el.querySelector('.react-line');
      rl.hidden = false;
      rl.innerHTML = ['Here’s a little nudge…', 'Okay, a bigger clue…', 'Here’s the full answer. Let’s understand it!'][isAnswer ? 2 : Math.min(t, 1)];
      if (state.hints >= tiers) { btn.disabled = true; btn.querySelector('span').textContent = 'No more hints'; btn.querySelector('small').textContent = ''; }
      else {
        var nextIsAnswer = state.hints === tiers - 1;
        btn.querySelector('span').textContent = nextIsAnswer ? 'Show answer' : 'Bigger hint';
        btn.querySelector('small').textContent = '−' + HINT_COST[Math.min(state.hints, 2)] + ' XP';
      }
    };
    state.hintBtn = btn;
  }

  /** Option buttons (mcq-like). Returns { el, buttons }. */
  function optionGrid(options, o) {
    o = o || {};
    var texts = options.map(optText);
    var short = texts.every(function (t) { return t.length <= 14 && t.indexOf('\n') < 0; });
    var grid = U.h('<div class="opts' + (short && !o.single ? '' : ' single') + (o.mono ? ' mono' : '') + '" role="group" aria-label="Answer options"></div>');
    var buttons = texts.map(function (t, i) {
      var inner = o.ws ? '<span class="otxt ws-out">' + (t === '' ? '<span class="ws">(nothing)</span>' : U.visibleWS(t)) + '</span>'
        : o.mono ? '<span class="otxt">' + U.esc(t) + '</span>' : '<span class="otxt">' + U.md(t) + '</span>';
      var b = U.h('<button class="opt" data-i="' + i + '"' + (o.toggle ? ' aria-pressed="false"' : '') + '><span class="key" aria-hidden="true">' + KEYS[i] + '</span>' +

  /** Mark option buttons after answering. rightSet: indexes that are correct; picked: indexes chosen. */

  /** First sentence of a text (fallback when `short` is missing). */

  /**
   * Show the feedback panel. Default view is SHORT: verdict + `short` (or the

   * Everything longer (full explain, per-option whys, details, side-by-side
   * when it doesn't fit compactly, UB note) sits behind "Tell me more".
   * o: { pickedWhy, visible (html shown by default) }
   * Resolves on Continue.
   */
  function showResult(ch, ctx, sh, state, res, detailHTML, o) {
    o = o || {};

      state.answered = true;
      if (state.hintBtn) state.hintBtn.hidden = true;
      U.$$('.check-btn', sh.actions).forEach(function (b) { b.hidden = true; });
      var info = o.info || (ctx.onAnswer && ctx.onAnswer(res, sh)) || {};
      var good = res.correct;
      var r = sh.result;

      var hdr = good ? (res.retried ? 'Got it on try two!' : res.assisted ? 'Correct (with help)' : 'Correct!') : (res.score != null && res.score > 0 ? 'Almost!' : 'Not quite');
      var short = ch.short || firstSentence(ch.explain);
      r.innerHTML = '<div class="rh">' + icon(good ? 'ok' : 'no') + '<span>' + hdr + '</span>' + (info.xpText ? '<span class="rxp">' + U.esc(info.xpText) + '</span>' : '') + '</div>' +
        (res.score != null && res.total ? '<div class="rscore">' + res.right + ' of ' + res.total + ' right</div>' : '') +
        (short ? '<div class="rshort">' + U.md(short) + '</div>' : '') +
        (o.pickedWhy ? '<div class="rpick">' + icon(good ? 'ok' : 'no') + '<span>' + U.md(o.pickedWhy) + '</span></div>' : '') +
        (o.visible || '');

      if (isDef) {

        var lines = Math.max(String(ch.sideBySide.unsafe).split('\n').length, String(ch.sideBySide.hardened).split('\n').length);
        if (lines <= 6) { sbs.classList.add('compact'); r.appendChild(sbs); } else more.appendChild(sbs);
      }
      if (ch.unsafe || isDef) more.appendChild(CH.code.ubNote());
      if (more.children.length) r.appendChild(CH.ui.expander('Tell me more', more).el);
      var cont = U.h('<button class="pbtn ' + (good ? 'teal' : 'coral') + ' cont-btn" data-autofocus>' + (ctx.continueLabel || 'Continue') + icon('next') + '</button>');
      r.appendChild(cont);
      // Curlo reacts (one short line).
      var rl = sh.el.querySelector('.react-line');
      rl.hidden = false;
      rl.innerHTML = good ? (CH.game.combo >= 3 && !res.assisted ? CH.curlo.line('combo', { n: CH.game.combo }) : CH.curlo.line('correct')) : CH.curlo.line('wrong');

        try { r.scrollIntoView({ block: 'nearest', behavior: CH.fx.reduced() ? 'auto' : 'smooth' }); } catch (e) { /* ignore */ }

        if (done) return; done = true;

  /* ======================================================================

     or boss rounds). First wrong answer → "Not quite" + feedback on the
     picked option WITHOUT revealing the answer, with [Try again] and
     [Show answer]. The heart is lost only on that first wrong answer; a
     correct retry is "assisted" (small consolation XP, combo stays broken).
     o: { reveal(), soft(), reset(), pickedWhy, softMsg, visible }

  function retryAllowed(ch, ctx, state) {

  }

  function conclude(ch, ctx, sh, state, res, detailHTML, o) {

    if (o.reveal) o.reveal();
    if (state.retried) {
      var fin = { correct: res.correct, assisted: true, retried: true, hints: state.hints };
      var info = (ctx.onAnswer && ctx.onAnswer({ correct: res.correct, assisted: true, retried: true, retry: true, hints: state.hints }, sh)) || {};
      return showResult(ch, ctx, sh, state, fin, detailHTML, Object.assign({}, o, { info: info }));
    }
    return showResult(ch, ctx, sh, state, res, detailHTML, o);
  }

  function softResult(ch, ctx, sh, state, res, detailHTML, o) {
    return new Promise(function (resolve) {

      if (state.hintBtn) state.hintBtn.hidden = true;
      U.$$('.check-btn', sh.actions).forEach(function (b) { b.hidden = true; });
      var info = (ctx.onAnswer && ctx.onAnswer(res, sh)) || {};
      if (o.soft) o.soft();
      var nudge = !o.pickedWhy && !o.softMsg && state.hints === 0 && ch.hints && ch.hints[0] ? ch.hints[0] : '';
      var r = sh.result;
      r.className = 'result show bad soft';
      r.innerHTML = '<div class="rh">' + icon('no') + '<span>Not quite</span>' + (info.xpText ? '<span class="rxp">' + U.esc(info.xpText) + '</span>' : '') + '</div>' +
        (o.pickedWhy ? '<div class="rpick">' + icon('no') + '<span>' + U.md(o.pickedWhy) + '</span></div>' : '') +
        (o.softMsg ? '<div class="rpick">' + icon('info') + '<span>' + U.md(o.softMsg) + '</span></div>' : '') +
        (nudge ? '<div class="rpick">' + icon('bulb') + '<span>' + U.md(nudge) + '</span></div>' : '') +
        '<div class="soft-btns"><button class="pbtn sun try-btn">' + icon('retype') + 'Try again</button><button class="pbtn ghost show-btn">Show answer</button></div>';
      var rl = sh.el.querySelector('.react-line');
      rl.hidden = false;
      rl.textContent = 'Not quite. Give it another go!';

        try { r.scrollIntoView({ block: 'nearest', behavior: CH.fx.reduced() ? 'auto' : 'smooth' }); } catch (e) { /* ignore */ }
        try { tryBtn.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
      }, 260);
      tryBtn.onclick = function () {
        CH.audio.play('pop');

        CH.fx.anim(r, [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(16px) scale(.96)' }], { duration: 180, fill: 'forwards', rm: 'keep' }).then(function () {

      };
    });
  }

  /** Feedback FX at answer time. */
  function feedback(sh, good, anchor) {

  /* ======================================================================

  /* ---- mcq / predict / breakit / harden: tap an option to answer ---- */

  /* ---- fill: one inline blank in the code ---- */

  /**

  /* ---- order: drag & drop with lift shadow + snap bounce, plus tap/keyboard ---- */

    return new Promise(function (resolve) {
