      var s = S(), st = s.settings;
      function toggle(key, label, ic, desc) {
        return '<div class="set-row"><span class="set-ic">' + icon(ic) + '</span><div class="set-t"><b id="lb-' + key + '">' + label + '</b>' + (desc ? '<small>' + desc + '</small>' : '') + '</div>' +
          '<button class="switch" role="switch" aria-checked="' + !!st[key] + '" aria-labelledby="lb-' + key + '" data-k="' + key + '"><i></i></button></div>';
      }
      var el = U.h('<section class="screen" aria-label="Settings"><div class="scroll">' +
        '<div class="eyebrow">Settings</div><h2 class="scr-title">Make it yours</h2>' +
        (CH.store.persistent ? '' : '<div class="notice" role="note">' + icon('info') + '<span>Progress can’t be saved on this device (storage is blocked). Use Export to keep a copy.</span></div>') +
        '<div class="card">' +
          (CH.config.SOUND_ENABLED ? toggle('sound', 'Sound effects', 'sound') + toggle('music', 'Music', 'music', 'Gentle generated ambient loop') : '') +
          toggle('reduceMotion', 'Reduce motion', 'motion', 'Fades instead of bounces; no confetti') +
          '<div class="set-row"><span class="set-ic">' + icon('text') + '</span><div class="set-t"><b id="lb-ts">Text size</b></div><div class="seg small" role="radiogroup" aria-labelledby="lb-ts">' +
            ['s', 'm', 'l'].map(function (z) { return '<button role="radio" aria-checked="' + (st.textSize === z) + '" data-ts="' + z + '">' + z.toUpperCase() + '</button>'; }).join('') + '</div></div>' +
          '<div class="set-row"><span class="set-ic">' + icon('target') + '</span><div class="set-t"><b id="lb-goal">Daily goal</b></div><div class="seg small" role="radiogroup" aria-labelledby="lb-goal">' +
            [5, 10, 20].map(function (g) { return '<button role="radio" aria-checked="' + (s.profile.dailyGoalMin === g) + '" data-goal="' + g + '">' + g + 'm</button>'; }).join('') + '</div></div>' +
        '</div>' +
        '<div class="card"><h3>Your progress</h3><p class="muted small">Back up your save as a file, or move it to another device.</p>' +
          '<div class="row"><button class="pbtn teal" data-a="export">' + icon('download') + 'Export</button>' +
          '<button class="pbtn ghost" data-a="import">' + icon('upload') + 'Import</button></div>' +
          '<input type="file" accept="application/json,.json" class="sr" tabindex="-1" aria-hidden="true">' +
          '<div class="row" style="margin-top:12px"><button class="pbtn coral" data-a="reset">' + icon('trash') + 'Reset progress</button></div></div>' +
        '<div class="card about"><div class="about-c"></div><div><b>Cpp Hero</b><p class="muted small">Learn C++ from zero. Defend your code.<br>Build ' + U.esc(CH.VERSION) + '</p></div></div>' +
        (CH.dev ? '<div class="card dev"><h3>Developer tools</h3><div class="sgrid">' +
          '<button class="pbtn ghost" data-dev="xp">+150 XP</button><button class="pbtn ghost" data-dev="hearts">Hearts 0 / refill</button>' +
          '<button class="pbtn ghost" data-dev="unlock">Unlock all worlds</button><button class="pbtn ghost" data-dev="evolve">Evolution sequence</button>' +
          '<button class="pbtn ghost" data-dev="defense">Defense +20</button><button class="pbtn ghost" data-dev="ach">Achievement pop</button>' +
          '<button class="pbtn ghost" data-dev="srs">Make 3 reviews due</button><button class="pbtn ghost" data-dev="onboard">Replay onboarding</button></div></div>' : '') +
        '</div></section>');
      CH.curlo.mount(el.querySelector('.about-c'));
      U.$$('.switch', el).forEach(function (b) {
        b.onclick = function () {
          var k = b.dataset.k; st[k] = !st[k];
          b.setAttribute('aria-checked', String(st[k]));
          CH.store.save();
          if (k === 'reduceMotion') { CH.fx.syncReduced(); CH.fx.toast(st[k] ? 'Reduce motion on: fades only.' : 'Full springy motion is back!'); }
          if (k === 'sound' && st[k]) { CH.audio.unlock(); CH.audio.play('pop'); }
          if (k === 'music') CH.audio.sync();
          CH.audio.play('tap');
        };
      });
      U.$$('[data-ts]', el).forEach(function (b) {
        b.onclick = function () {
          st.textSize = b.dataset.ts; CH.store.save(); applyTextSize();
          U.$$('[data-ts]', el).forEach(function (x) { x.setAttribute('aria-checked', String(x === b)); });
          CH.audio.play('tap');
        };
      });
      U.$$('[data-goal]', el).forEach(function (b) {
        b.onclick = function () {
          s.profile.dailyGoalMin = +b.dataset.goal; CH.store.save();
          U.$$('[data-goal]', el).forEach(function (x) { x.setAttribute('aria-checked', String(x === b)); });
          CH.audio.play('tap');
        };
      });
      var file = el.querySelector('input[type=file]');
      el.querySelector('[data-a=export]').onclick = function () {
        CH.audio.play('tap');
        CH.store.exportFile().then(function (ok) {
          if (ok === 'declined') return;
          if (ok) CH.fx.toast('Save exported. Keep it somewhere safe!', { icon: icon('download') });
          else CH.fx.toast('Export failed on this device.', { icon: icon('warn') });
        });
      };
      el.querySelector('[data-a=import]').onclick = function () { CH.audio.play('tap'); file.value = ''; file.click(); };
      file.onchange = function () {
        var f = file.files && file.files[0];
        if (!f) return;
        CH.store.readImport(f).then(function (data) {
          var lessons = Object.keys(data.lessons || {}).length;
          return CH.ui.confirm('Import this save?', '<p>This replaces your current progress with the file’s: <b>level ' + data.level + '</b>, ' + U.plural(lessons, 'lesson') + ' done, ' + data.xp + ' XP.</p><p class="muted small">Tip: export your current save first if you might want it back.</p>', 'Import', 'Cancel', true)
            .then(function (yes) {
              if (!yes) return;
              CH.store.replace(data);
              CH.fx.toast('Progress imported!', { icon: icon('upload') });
            });
        }).catch(function (e) {
          CH.ui.dialog({ title: 'Couldn’t import', mood: 'worried', html: '<p>' + U.esc(e.message || 'That file didn’t work.') + '</p>', buttons: [{ label: 'OK', value: 1 }] });
        });
      };
      el.querySelector('[data-a=reset]').onclick = function () {
        CH.ui.confirm('Reset all progress?', '<p>This erases your XP, lessons, streak, collection and settings on this device. <b>It can’t be undone.</b></p>', 'Reset everything', 'Keep my progress', true)
          .then(function (yes) {
            if (!yes) return;
            return CH.ui.confirm('Are you really sure?', '<p>Last chance! Curlo will forget everything.</p>', 'Yes, reset', 'No, wait', true);
          }).then(function (yes2) {
            if (!yes2) return;
            CH.store.reset();
            CH.fx.toast('Progress reset. Fresh start!');
          });
      };
      U.$$('[data-dev]', el).forEach(function (b) {
        b.onclick = function () {
          var k = b.dataset.dev;
          if (k === 'xp') { G().addXP(150, 'dev'); CH.ui.flushCelebrations(); }
          if (k === 'hearts') { if (s.hearts.n > 0) { s.hearts.n = 0; } else { s.hearts.n = s.hearts.max; } CH.store.save(); CH.ui.renderHUD(); CH.fx.toast('Hearts: ' + s.hearts.n); }
          if (k === 'unlock') { G().worlds().forEach(function (w) { if (s.worldsUnlocked.indexOf(w.id) < 0) s.worldsUnlocked.push(w.id); }); CH.store.save(); CH.fx.toast('All worlds unlocked'); }
          if (k === 'evolve') { var f = CH.curlo.form(); CH.curlo.evolve(f, f >= 3 ? 1 : f + 1).then(function () { CH.curlo.devForm = f >= 3 ? 1 : f + 1; CH.curlo.refreshAll(); }); }
          if (k === 'defense') { G().gainStat('defense', 20); CH.ui.flushCelebrations(); CH.curlo.refreshAll(); }
          if (k === 'ach') { G().queue.push({ type: 'achievement', def: { name: 'Null and Void', desc: 'Test achievement popup' } }); G().queue.push({ type: 'bug', def: CH.content.bestiary[0] || { name: 'Bug', art: 'bug' } }); CH.ui.flushCelebrations(); }
          if (k === 'srs') { G().seenChallengeIds().concat(Object.keys(G().index.challenge)).slice(0, 3).forEach(function (id) { G().srsRecord(id, false); }); CH.store.save(); CH.fx.toast('3 reviews due'); }
          if (k === 'onboard') { s.profile.onboarded = false; CH.store.save(); CH.router.go('onboarding', {}, { root: true }); }
        };
      });
      return el;
    }
  };

  /** Apply text size S/M/L to the root. */
  function applyTextSize() {
    var z = (S().settings.textSize || 'm');
    document.documentElement.setAttribute('data-ts', z);
  }
  SU.applyTextSize = applyTextSize;

  /** "More" = small hub (tab) for Stats + Settings. */
  screens.more = {
    tab: 'more',
    render: function () {
      var el = U.h('<section class="screen" aria-label="More"><div class="scroll"><div class="eyebrow">More</div><h2 class="scr-title">Menu</h2>' +
        '<div class="menu-list">' +
        '<button class="menu-item" data-go="stats">' + icon('chart') + '<span><b>Stats</b><small>Time, accuracy, strengths, achievements</small></span>' + icon('next') + '</button>' +
        '<button class="menu-item" data-go="settings">' + icon('gear') + '<span><b>Settings</b><small>Sound, motion, text size, backup</small></span>' + icon('next') + '</button>' +
        '</div></div></section>');
      U.$$('[data-go]', el).forEach(function (b) { b.onclick = function () { CH.router.go(b.dataset.go); }; });
      return el;
    }
  };
})();
</script>
<script>
/* engine/onboarding.js */
/* ==========================================================================
   Cpp Hero — engine/onboarding.js
   First-run flow: animated intro (Curlo introduces itself + the story),
   name + starting look, daily goal (5/10/20 min), and an optional placement
   quiz that can unlock later worlds (a few questions per world, pulled from
   content; pass 2 of 3 to test out of a world).
   ========================================================================== */
(function () {
  'use strict';
  var CH = window.CH, U = CH.util, G = function () { return CH.game; };
  function S() { return CH.store.state; }
  var icon = function (n, c) { return CH.ui.icon(n, c); };

  var STORY = [   // Curlo lines: 15 words max each
    'Hi hi hi! I’m <b>Curlo</b>, a brace-bean: half curly brace <b>{ }</b>, all heart!',
    'I live in the <b>Codebase</b>, and sneaky <b>bugs</b> keep breaking in!',
    'Learn <b>C++</b> with me, and we’ll write code no bug can break.',
    'I’ll explain, cheer, and tell terrible jokes. Ready, <b>Cpp Hero</b>?'
  ];

  function screen() {
    var el = U.h('<section class="screen onboarding" aria-label="Welcome to Cpp Hero"><div class="scroll ob-scroll"><div class="ob-stage"></div></div></section>');
    var stage = el.querySelector('.ob-stage');
    var st = { name: S().profile.name || 'Curlo', variant: S().profile.variant || 'classic', goal: S().profile.dailyGoalMin || 10 };

    function page(html) {
      var old = stage.firstElementChild;
      var pg = U.h('<div class="ob-page">' + html + '</div>');
      stage.appendChild(pg);
      if (old) {
        CH.fx.anim(old, [{ transform: 'none', opacity: 1 }, { transform: 'translateX(-30%) scale(.92)', opacity: 0 }], { duration: 240, fill: 'forwards', rm: 'keep' }).then(function () { old.remove(); });
        setTimeout(function () { old.remove(); }, 450);
        CH.fx.anim(pg, [{ transform: 'translateX(100%) rotate(3deg)', opacity: 0.5 }, { transform: 'translateX(-2%)', opacity: 1, offset: 0.65 }, { transform: 'none', opacity: 1 }], { duration: 520, easing: CH.fx.EASE_OUT, rm: 'fade' });
      }
      el.querySelector('.ob-scroll').scrollTop = 0;
      var f = pg.querySelector('[data-autofocus]');
      setTimeout(function () { if (f) try { f.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }, 300);
      return pg;
    }

    /* ---- 1. story intro ---- */
    function intro() {
      var i = 0;
      var pg = page('<div class="ob-brand"><span class="ob-logo">Cpp Hero</span></div>' +
        '<div class="ob-hero"><div class="halo big"><span class="spark" style="left:18px;top:40px"></span><span class="spark" style="right:22px;top:24px;animation-delay:-.8s"></span><span class="spark" style="right:10px;bottom:52px;animation-delay:-1.6s"></span><div class="ob-curlo"></div></div></div>' +
        '<div class="bubble tail-b ob-say" aria-live="polite"></div>' +
        '<div class="ob-dots" aria-hidden="true">' + STORY.map(function () { return '<i></i>'; }).join('') + '</div>' +
        '<div class="row"><button class="pbtn big" data-autofocus>Next' + icon('next') + '</button></div>' +
        '<button class="linkbtn ob-skip">Skip intro</button>');
      var c = CH.curlo.mount(pg.querySelector('.ob-curlo'), { mood: 'happy' });
      var say = pg.querySelector('.ob-say'), btn = pg.querySelector('.pbtn');
      var hc = pg.querySelector('.ob-curlo');
      CH.fx.anim(hc, [{ transform: 'translateY(-160%) scale(.8)', opacity: 0 }, { transform: 'translateY(8%) scale(1.14,.84)', opacity: 1, offset: 0.55 }, { transform: 'translateY(-6%) scale(.95,1.06)', offset: 0.75 }, { transform: 'none', opacity: 1 }], { duration: 900, delay: 200, fill: 'backwards', rm: 'fade' })
        .then(function () { CH.fx.burstAt(hc, { n: 60 }); });
      function show() {
        CH.curlo.say(say, STORY[i]);
        U.$$('.ob-dots i', pg).forEach(function (d, k) { d.classList.toggle('on', k <= i); });
        CH.curlo.react(c, ['celebrate', 'worried', 'bracing', 'celebrate'][i] || 'happy', 1200);
        btn.innerHTML = (i === STORY.length - 1 ? 'Let’s do this!' : 'Next') + icon('next');
      }
      setTimeout(show, CH.fx.reduced() ? 0 : 700);
      return new Promise(function (resolve) {
        btn.onclick = function () {
          CH.audio.play('pop');
          if (i < STORY.length - 1) { i++; show(); } else resolve();
        };
        pg.querySelector('.ob-skip').onclick = function () { CH.audio.play('tap'); resolve(); };
        hc.onclick = function () { CH.fx.springPoke(hc); CH.audio.play('pop'); CH.curlo.react(c, 'celebrate', 900); };
      });
    }

    /* ---- 2. name + look ---- */
    function nameLook() {
      var id = U.uid('nm');
      var pg = page('<div class="eyebrow">Step 1 of 3</div><h2>Name your companion</h2>' +
        '<p class="muted">Keep <b>Curlo</b> or pick your own name, then choose a starting look.</p>' +
        '<div class="ob-preview"><div class="ob-curlo"></div></div>' +
        '<label for="' + id + '" class="lbl">Name</label><input id="' + id + '" class="text-in" maxlength="16" autocomplete="off" value="' + U.esc(st.name) + '">' +
        '<div class="lbl">Look</div><div class="variant-grid" role="radiogroup" aria-label="Starting look"></div>' +
        '<div class="row"><button class="pbtn big">Continue' + icon('next') + '</button></div>');
      var prev = CH.curlo.mount(pg.querySelector('.ob-curlo'), { variant: st.variant, fixed: true, mood: 'celebrate' });
      var grid = pg.querySelector('.variant-grid');
      G().STARTER_COLORS.forEach(function (v) {
        var def = G().cosmeticDef(v) || { name: v };
        var b = U.h('<button role="radio" class="variant' + (v === st.variant ? ' on' : '') + '" aria-checked="' + (v === st.variant) + '" data-v="' + v + '"><span class="vsw" style="background:' + CH.curlo.variantColor(v) + '"></span><small>' + U.esc(def.name) + '</small></button>');
        b.onclick = function () {
          st.variant = v;
          U.$$('.variant', grid).forEach(function (x) { x.classList.toggle('on', x === b); x.setAttribute('aria-checked', String(x === b)); });
          prev = CH.curlo.mount(pg.querySelector('.ob-curlo'), { variant: v, fixed: true, mood: 'celebrate' });
          CH.curlo.react(prev, 'celebrate', 900);
          CH.audio.play('select');
          CH.fx.bounce(b);
        };
        grid.appendChild(b);
      });
      var input = pg.querySelector('input');
      setTimeout(function () { try { input.focus({ preventScroll: true }); input.select(); } catch (e) { /* ignore */ } }, 350);
      return new Promise(function (resolve) {
        function go() { st.name = (input.value || '').trim().slice(0, 16) || 'Curlo'; CH.audio.play('pop'); resolve(); }
        pg.querySelector('.pbtn.big').onclick = go;
        input.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); go(); } });
      });
    }

    /* ---- 3. daily goal ---- */
    function goal() {
      var pg = page('<div class="eyebrow">Step 2 of 3</div><h2>Pick a daily goal</h2><p class="muted">A little every day beats a lot once a week. You can change this later.</p>' +
        '<div class="goal-grid" role="radiogroup" aria-label="Daily goal"></div><div class="row"><button class="pbtn big">Continue' + icon('next') + '</button></div>');
      var grid = pg.querySelector('.goal-grid');
      [[5, 'Casual', 'A quick lesson a day'], [10, 'Regular', 'Two lessons a day'], [20, 'Serious', 'Level up fast']].forEach(function (g) {
        var b = U.h('<button role="radio" class="goal-card' + (st.goal === g[0] ? ' on' : '') + '" aria-checked="' + (st.goal === g[0]) + '"><b>' + g[0] + ' min</b><span>' + g[1] + '</span><small>' + g[2] + '</small></button>');
        b.onclick = function () {
          st.goal = g[0];
          U.$$('.goal-card', grid).forEach(function (x) { x.classList.toggle('on', x === b); x.setAttribute('aria-checked', String(x === b)); });
          CH.audio.play('select'); CH.fx.bounce(b);
        };
        grid.appendChild(b);
      });
      setTimeout(function () { var f = grid.querySelector('.on'); if (f) f.focus({ preventScroll: true }); }, 350);
      return new Promise(function (resolve) { pg.querySelector('.pbtn.big').onclick = function () { CH.audio.play('pop'); resolve(); }; });
    }

    /* ---- 4. placement offer ---- */
    function offer() {
      var worlds = G().worlds().filter(function (w) { return w.id !== 'wdev'; });
      var canPlace = worlds.length > 1;
      var pg = page('<div class="eyebrow">Step 3 of 3</div><h2>Know some C++ already?</h2>' +
        '<div class="ob-preview small"><div class="ob-curlo"></div></div>' +
        '<p class="muted">' + (canPlace ? 'Take a short placement quiz (3 questions per world) to skip worlds you already know. No hearts, no pressure.' : 'Start from the beginning. Placement unlocks once more worlds arrive.') + '</p>' +
        '<div class="row col"><button class="pbtn big" data-v="scratch" data-autofocus>' + icon('play') + 'Start from scratch</button>' +
        (canPlace ? '<button class="pbtn ghost big" data-v="place">' + icon('target') + 'Take the placement quiz</button>' : '') + '</div>');
      CH.curlo.mount(pg.querySelector('.ob-curlo'), { variant: st.variant, fixed: true, mood: 'thinking' });
      return new Promise(function (resolve) {
        U.$$('[data-v]', pg).forEach(function (b) { b.onclick = function () { CH.audio.play('pop'); resolve(b.dataset.v); }; });
      });
    }

    function commit() {
      var s = S();
      s.profile.name = st.name;
      s.profile.variant = st.variant;
      s.profile.dailyGoalMin = st.goal;
      if (s.cosmetics.owned.indexOf(st.variant) < 0) s.cosmetics.owned.push(st.variant);
      s.cosmetics.equipped.color = st.variant;
      s.profile.onboarded = true;
      CH.store.saveNow();
      CH.curlo.refreshAll();
    }

    function finish(placed) {
      commit();
      CH.router.go('map', { justDone: placed ? 'placement' : null }, { root: true, dir: 'up' });
      setTimeout(function () {
        CH.fx.toast(placed ? 'Placement done! Your worlds are unlocked.' : 'Welcome, hero! Tap START to begin.', { icon: icon('sparkle') });
      }, 800);
    }

    intro().then(nameLook).then(goal).then(offer).then(function (v) {
      if (v === 'place') { commit(); placement(); }
      else finish(false);
    });
    return el;
  }

  /* ---- 5. placement quiz (runs as a session) ---- */
  function placement() {
    var worlds = G().worlds().filter(function (w) { return w.id !== 'wdev'; });
    var testable = worlds.slice(0, Math.max(0, worlds.length - 1));   // passing world N unlocks N+1
    var s = new CH.Session({ mode: 'placement', title: 'Placement quiz', noun: 'placement quiz', quitText: 'You can start from World 1 and play normally.' });
    var passed = [], wi = 0;
    var totalQ = testable.length * 3, asked = 0;
    function pickFor(w) {
      var pool = [];
      (w.lessons || []).forEach(function (l) {
        (l.challenges || []).forEach(function (c) { if (['mcq', 'predict', 'fill', 'breakit', 'harden'].indexOf(c.type) >= 0) pool.push(c); });
      });
      return U.shuffle(pool).slice(0, 3);
    }
    function nextWorld() {
      if (s.quit) return;
      if (wi >= testable.length) return done();
      var w = testable[wi++], qs = pickFor(w), right = 0, qi = 0;
      if (!qs.length) { passed.push(w); return nextWorld(); }
      var intro = U.h('<div class="place-intro"><div class="eyebrow">Placement</div><h2>World ' + w.num + ': ' + U.esc(w.title) + '</h2><div class="unit-ic big" aria-hidden="true">' + CH.art.icon(w.icon || 'star') + '</div><p class="muted">' + U.md(w.blurb || '') + '</p><p>Get <b>2 of ' + qs.length + '</b> right to test out of this world.</p></div>');
      return s.card(intro, 'Start', 'teal').then(function ask() {
        if (qi >= qs.length) {
          var ok = right >= Math.min(2, qs.length);
          if (ok) passed.push(w);
          var res = U.h('<div class="place-res center"><div class="pr-ic">' + icon(ok ? 'ok' : 'no') + '</div><h2>' + (ok ? 'Tested out of World ' + w.num + '!' : 'World ' + w.num + ' is a good place to start') + '</h2><p class="muted">' + right + ' of ' + qs.length + ' right.</p></div>');
          if (ok) setTimeout(function () { CH.fx.burstAt(res, { n: 80 }); CH.audio.play('unlock'); }, 300);
          return s.card(res, ok && wi < testable.length ? 'Next world' : 'See my map', ok ? 'teal' : '').then(function () { if (ok) return nextWorld(); return done(); });
        }
        var ch = qs[qi++];
        asked++;
        s.setProgress(asked / Math.max(1, totalQ));
        return s.challenge(ch, { mode: 'placement', eyebrow: 'Placement · World ' + w.num + ' · ' + qi + ' of ' + qs.length }).then(function (r) { if (r.correct) right++; return ask(); });
      });
    }
    function done() {
      s.dispose();
      var start = passed.length ? G().placementUnlock(passed) : null;
      if (!passed.length) { S().profile.placementDone = true; CH.store.save(); }
      CH.router.go('map', { justDone: 'placement', unlocked: start && start.id }, { root: true, dir: 'down' });
      setTimeout(function () {
        CH.fx.toast(passed.length ? 'You start in World ' + start.num + ': ' + start.title + '!' : 'Starting at World 1. Let’s go!', { icon: icon('map') });
      }, 800);
    }
    CH.router.go('run', { session: s }, { dir: 'up', root: true });
    setTimeout(nextWorld, 0);
  }

  CH.screens.onboarding = { chrome: 'immersive', render: function () { return screen(); } };
  CH.onboarding = { placement: placement };
})();
</script>
<script>
/* engine/main.js */
/* ==========================================================================
   Cpp Hero — engine/main.js
   Boot: (optionally) load the #dev sample world, load the save, build the
   content index, wire global UI (tabs, top bar, notices), register the
   service worker (guarded: skipped on file://, in iframes without support,
   or if registration throws), then show onboarding or the map.
   ========================================================================== */
(function () {
  'use strict';
  var CH = window.CH, U = CH.util;

  /** In #dev mode, load the developer sample world from the repo (not part of dist). */
  function loadDev() {
    if (!CH.dev) return Promise.resolve();
    return new Promise(function (resolve) {
      var s = document.createElement('script');
      s.src = '../src/content/_dev-sample.js';
      s.onload = function () { resolve(); };
      s.onerror = function () { console.warn('[dev] _dev-sample.js not found (serve the repo root to use #dev).'); resolve(); };
      document.head.appendChild(s);
      setTimeout(resolve, 3000);
    });
  }

  function registerSW() {
    try {
      if (!('serviceWorker' in navigator)) return;
      if (!/^https?:$/.test(location.protocol)) return;
      if (CH.dev) return; // keep dev iterations uncached
      window.addEventListener('load', function () {
        try {
          navigator.serviceWorker.register('./sw.js').catch(function (e) { console.info('[sw] not registered:', e && e.message); });
        } catch (e) { console.info('[sw] registration skipped:', e && e.message); }
      });
    } catch (e) { /* no SW: the app still works */ }
  }

  function wireChrome() {
    U.$$('.tab').forEach(function (t) {
      t.addEventListener('click', function () {
        var cur = CH.router.current;
        if (cur && cur.name === t.dataset.go) return;
        var order = ['map', 'buddy', 'practice', 'vault', 'bestiary'];
        var dir = cur && order.indexOf(t.dataset.go) < order.indexOf(cur.def.tab || cur.name) ? -1 : 1;
        CH.audio.play('tap');
        CH.router.go(t.dataset.go, {}, { dir: dir, root: true });
      });
    });
    // Header toggles: open Stats / Settings (expanding from the button); the
    // icon morphs into an X, and tapping it again (or Esc) closes the panel.
    var PANELS = { stats: U.$('#btnStats'), settings: U.$('#btnSettings') };
    function isPanel(n) { return n === 'stats' || n === 'settings'; }
    function closePanel() { CH.router.back('map', { dir: 'close' }); }
    Object.keys(PANELS).forEach(function (name) {
      var btn = PANELS[name];
      btn.onclick = function () {
        CH.audio.play('tap');
        var c = CH.router.current;
        if (c && c.name === name) { closePanel(); return; }
        if (c && isPanel(c.name)) CH.router.go(name, {}, { dir: 'fade', replace: true, origin: { el: btn, id: 'hdr-' + name } });
        else CH.router.go(name, {}, { dir: 'expand', origin: { el: btn, id: 'hdr-' + name } });
      };
    });
    CH.events.on('screen', function (d) {
      Object.keys(PANELS).forEach(function (name) {
        var open = d.name === name, btn = PANELS[name], label = name === 'stats' ? 'Stats' : 'Settings';
        btn.classList.toggle('is-open', open);
        btn.setAttribute('aria-label', open ? 'Close ' + label.toLowerCase() : label);
        btn.title = open ? 'Close' : label;
      });
    });
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape' || U.$('#overlay-root').children.length) return;
      var c = CH.router.current;
      if (c && isPanel(c.name)) { e.preventDefault(); closePanel(); }
    });
    CH.curlo.mount(U.$('#brandMark .brand-c'));
  }

  function applySettings() {
    CH.fx.syncReduced();
    CH.screensUtil.applyTextSize();
    CH.audio.sync();
  }

  function start() {
    var s = CH.store.state;
    CH.game.ensureDaily();
    CH.game.regenHearts();
    CH.game.checkStreak();
    CH.game.checkAchievements();
    CH.game.queue = CH.game.queue.filter(function (q) { return q.type !== 'cosmetic'; }); // silent on boot
    if (!s.profile.onboarded) CH.router.go('onboarding', {}, { root: true });
    else CH.router.go('map', {}, { root: true });
  }

  function boot() {
    loadDev().then(function () {
      CH.store.load();
      CH.game.buildIndex();
      if (CH.dev) console.info('[dev] content:', CH.game.worlds().map(function (w) { return w.id; }).join(', '), '—', Object.keys(CH.game.index.challenge).length, 'challenges');
      applySettings();
      wireChrome();
      CH.events.on('store.notice', function (d) { setTimeout(function () { CH.fx.toast(d.msg, { icon: CH.ui.icon('info'), ms: 5000 }); }, 1200); });
      if (!CH.store.persistent) CH.fx.toast('Progress can’t be saved on this device. You can still play, and export from Settings.', { icon: CH.ui.icon('info'), ms: 5000 });
      CH.events.on('store.replaced', function () {
        CH.game.combo = 0; CH.game.queue = [];
        applySettings();
        CH.curlo.refreshAll();
        start();
      });
      CH.game.startClock();
      start();
      U.$('#app').classList.add('ready');
      var sp = U.$('#splash'); if (sp) { sp.classList.add('gone'); setTimeout(function () { sp.remove(); }, 500); }
    }).catch(function (e) {
      console.error('[boot] failed', e);
      var st = U.$('#stage');
      if (st) st.innerHTML = '<div class="card" style="margin:16px"><h3>Cpp Hero couldn’t start</h3><p>' + U.esc(e.message) + '</p></div>';
    });
  }

  registerSW();
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
</body>
</html>
