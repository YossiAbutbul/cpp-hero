<!doctype html>
<html lang="en" data-ts="m">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cpp Hero</title>
<meta name="description" content="Learn C++ from zero and defend your code. A game-like app with Curlo the brace-bean.">
<meta name="theme-color" content="#F2641B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cpp Hero">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=DM+Mono:wght@400;500&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* styles.css */
/* ==========================================================================
   Cpp Hero — styles.css
   Visual direction: "Pop Path" (designs/5-springboard.html). Tokens, chunky
   pressable 3D buttons, springy motion, and the ORIGINAL Curlo CSS (verbatim
   block below). Text sizes are rem-based so the S/M/L setting scales them
   (M = 16px body text).
   ========================================================================== */

/* ---------- tokens ---------- */
:root{
  color-scheme:light;
  --bg:#FFF4E6;--bg2:#FFE6C7;--card:#FFFFFF;--cream:#FFFAF3;
  --ink:#2A2140;--ink2:#564E6C;--muted:#716A84;--line:#F0DFC9;
  --tang:#F2641B;--tang-d:#BF4808;--tang-l:#FFD2B3;
  --sun:#FFC62E;--sun-d:#D69500;--sun-l:#FFEDB0;
  --coral:#FF5A70;--coral-d:#D0324C;--coral-l:#FFD6DC;
  --teal:#0FA898;--teal-d:#077A6F;--teal-l:#C4F1EA;
  --sky:#3D8BFF;--sky-d:#2463C4;--sky-l:#D6E6FF;
  --grape:#7A4FD0;
  --lock:#E6DED3;--lock-d:#C6BBAC;
  --console:#2A2140;--console-t:#FFE9A8;
  --spring:cubic-bezier(.34,1.56,.64,1);
  --elastic:cubic-bezier(.25,1.7,.45,1);
  --sh:0 1px 2px rgba(90,45,10,.06),0 4px 10px rgba(90,45,10,.06),0 16px 32px -8px rgba(90,45,10,.14);
  --f-ui:'Nunito',ui-rounded,'Segoe UI',system-ui,sans-serif;
  --f-disp:'Baloo 2','Nunito',ui-rounded,'Segoe UI',system-ui,sans-serif;
  --f-code:'DM Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;
}
html{font-size:16px;-webkit-text-size-adjust:100%}
html[data-ts="s"]{font-size:14.5px}
html[data-ts="l"]{font-size:18px}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:1rem;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
button:not(:disabled){cursor:pointer}
input,textarea{font:inherit}
/* No visible scrollbars anywhere; scrolling (touch, wheel, keys) still works. */
html,body,*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
:focus-visible{outline:3px solid var(--sky);outline-offset:3px;border-radius:12px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:-1px;padding:0;border:0}
.skip-link{position:absolute;left:12px;top:-60px;z-index:100;background:var(--ink);color:#fff;padding:8px 12px;border-radius:10px;font-weight:800}
.skip-link:focus{top:8px}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.center{text-align:center}
.mono{font-family:var(--f-code)}
code.i{font-family:var(--f-code);font-size:.92em;background:var(--sun-l);padding:1px 6px;border-radius:7px;word-break:break-word}
kbd{font-family:var(--f-code);font-size:.72em;border:1.5px solid currentColor;border-radius:5px;padding:0 4px;opacity:.75;margin-left:4px}
.ic{width:1.15em;height:1.15em;flex:none;vertical-align:-.2em}

/* ---------- surroundings + app frame ---------- */
.world{position:fixed;inset:0;overflow:hidden;background:radial-gradient(circle at 1px 1px,rgba(242,100,27,.13) 1.4px,transparent 0) 0 0/22px 22px,var(--bg)}
.amb{position:absolute;border-radius:50%;filter:blur(2px);opacity:.55;animation:drift 18s ease-in-out infinite alternate}
.amb.a{width:420px;height:420px;background:var(--sun-l);left:-120px;top:-100px}
.amb.b{width:360px;height:360px;background:var(--tang-l);right:-100px;bottom:-80px;animation-delay:-6s}
.amb.c{width:220px;height:220px;background:var(--teal-l);right:12%;top:8%;animation-delay:-11s}
@keyframes drift{to{transform:translate(40px,30px) scale(1.08)}}
.app{position:relative;margin:0 auto;width:100%;max-width:480px;height:100%;height:100dvh;background:var(--cream);display:flex;flex-direction:column;overflow:hidden;isolation:isolate}
@media (min-width:600px) and (min-height:700px){
  body{display:grid;place-items:center}
  .app{height:min(900px,calc(100vh - 40px));border-radius:44px;border:9px solid #fff;box-shadow:0 2px 0 var(--line),0 30px 80px -20px rgba(120,60,10,.35),0 8px 24px rgba(120,60,10,.12)}
}
.splash{position:absolute;inset:0;display:grid;place-items:center;background:var(--cream);z-index:3;transition:opacity .4s}
.splash.gone{opacity:0;pointer-events:none}
.splash-dot{width:26px;height:26px;border-radius:50%;background:var(--tang);animation:bob 0.6s ease-in-out infinite alternate}

/* ---------- top bar + HUD ---------- */
.topbar{display:flex;align-items:center;gap:8px;padding:10px 16px 4px;padding-top:max(10px,env(safe-area-inset-top))}
.brand{display:flex;align-items:center;gap:6px;font-family:var(--f-disp);font-weight:800;font-size:1.3rem;color:var(--tang-d);margin-right:auto;line-height:1}
.brand-c{width:30px;height:30px;display:block}
.ibtn{width:42px;height:42px;border-radius:14px;border:2px solid var(--line);background:#fff;display:grid;place-items:center;box-shadow:0 3px 0 var(--line);transition:transform .15s var(--spring),box-shadow .15s var(--spring)}
.ibtn:hover{transform:translateY(-1px)}
.ibtn:active{transform:translateY(3px);box-shadow:0 0 0 var(--line)}
.ibtn svg{width:20px;height:20px}
.ibtn.small{width:34px;height:34px;border-radius:11px}
.hud{padding:4px 16px 10px;display:grid;gap:8px}
.hud-row{display:flex;align-items:center;gap:8px}
.chip{display:flex;align-items:center;gap:5px;background:#fff;border-radius:999px;padding:5px 10px 5px 7px;font-weight:900;font-size:.95rem;box-shadow:0 2px 0 var(--line);border:2px solid var(--line);transition:transform .15s var(--spring)}
button.chip:active{transform:translateY(2px);box-shadow:none}
.chip .ic{width:18px;height:18px}
.chip.quests{margin-left:auto}
.chip.hot{background:var(--sun);border-color:var(--sun-d);box-shadow:0 2px 0 var(--sun-d)}
.frz{display:inline-flex;align-items:center;gap:2px;color:var(--sky-d);font-size:.8rem;margin-left:2px}
.frz .ic{width:14px;height:14px}
.hearts{display:flex;gap:1px}
.hearts svg{width:18px;height:18px;transition:transform .3s var(--spring)}
.hearts .empty path{fill:var(--lock);stroke:var(--lock-d)}
.hearts .empty ellipse{opacity:0}
.flame{width:22px;height:22px;transform-origin:50% 90%;transform:scale(var(--fs,1));transition:transform .5s var(--spring)}
.flame .fo{animation:flick 1.2s ease-in-out infinite alternate;transform-origin:50% 90%}
.flame.big{width:72px;height:72px;display:block;margin:0 auto 6px}
@keyframes flick{to{transform:scale(.92,1.06) skewX(-3deg)}}
.xp{display:flex;align-items:center;gap:8px}
.lvl-badge{font-family:var(--f-disp);font-weight:800;font-size:.9rem;background:var(--teal);color:#fff;border-radius:10px;padding:2px 8px;box-shadow:0 2px 0 var(--teal-d);white-space:nowrap}
.xpbar{flex:1;height:14px;background:var(--lock);border-radius:999px;overflow:hidden;position:relative}
.xpfill{position:absolute;inset:0;background:linear-gradient(180deg,#FFD65C,var(--sun) 55%,#F5B000);border-radius:999px;transform-origin:left;transform:scaleX(var(--p,0));transition:transform 1s var(--elastic)}
.xpfill::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:3px;border-radius:3px;background:rgba(255,255,255,.6)}
.xpnum{font-weight:900;font-size:.875rem;min-width:78px;text-align:right;color:var(--ink2);font-variant-numeric:tabular-nums}

/* ---------- stage + screens ---------- */
.stage{position:relative;flex:1;min-height:0;overflow:hidden;outline:none}
.screen{position:absolute;inset:0;will-change:transform;background:var(--cream)}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:6px 16px 32px;overscroll-behavior:contain}
.card{background:var(--card);border-radius:24px;box-shadow:var(--sh);padding:16px;margin-bottom:14px;border:2px solid #fff}
h1,h2,h3,h4{font-family:var(--f-disp);line-height:1.1;margin:0}
h2{font-size:1.6rem;font-weight:800}
h3{font-size:1.2rem;font-weight:800}
h4{font-size:1.05rem;font-weight:800;margin:12px 0 4px;display:flex;gap:6px;align-items:center}
.eyebrow{font-weight:900;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--tang-d);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.scr-title{margin:2px 0 14px}
.sec-h{margin:18px 0 10px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
p{margin:6px 0}
.app.immersive .topbar,.app.immersive .hud,.app.immersive .tabs{display:none}

/* ---------- 3D pressable buttons ---------- */
.pbtn{--c:var(--tang);--cd:var(--tang-d);font:900 1rem/1.1 var(--f-ui);color:#fff;background:var(--c);border:0;border-radius:18px;padding:14px 16px;letter-spacing:.03em;text-transform:uppercase;min-height:50px;
  box-shadow:0 5px 0 var(--cd),0 10px 18px -6px rgba(90,40,10,.35);transition:transform .14s var(--spring),box-shadow .14s var(--spring),filter .15s;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.pbtn:hover{filter:brightness(1.05)}
.pbtn:active,.pbtn.pressed{transform:translateY(4px) scale(1.02,.96);box-shadow:0 1px 0 var(--cd),0 3px 6px -2px rgba(90,40,10,.3)}
.pbtn.teal{--c:var(--teal);--cd:var(--teal-d)}
.pbtn.coral{--c:var(--coral-d);--cd:#9E1F35}
.pbtn.sun{--c:var(--sun);--cd:var(--sun-d);color:var(--ink)}
.pbtn.ghost{--c:#fff;--cd:var(--line);color:var(--ink);border:2px solid var(--line)}
.pbtn:disabled{--c:var(--lock);--cd:var(--lock-d);color:var(--muted);cursor:not-allowed;filter:none}
.pbtn .ic{width:20px;height:20px}
.pbtn.big{width:100%;min-height:56px;font-size:1.05rem}
.pbtn.small{min-height:40px;padding:9px 12px;font-size:.85rem;border-radius:14px}
.pbtn small{font-size:.7rem;opacity:.8;text-transform:none;letter-spacing:0}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .pbtn{flex:1 1 130px}
.row.col{flex-direction:column}
.row.col .pbtn{flex:none}
.linkbtn{background:none;border:0;color:var(--ink2);font-weight:800;text-decoration:underline;padding:10px;display:block;margin:6px auto 0}
.page-next{margin-top:18px}

/* ---------- toast, flash, confetti, floaties ---------- */
.toast{position:absolute;left:50%;top:12px;z-index:90;background:var(--ink);color:#fff;font-weight:800;font-size:.95rem;padding:10px 16px;border-radius:16px;transform:translate(-50%,-80px);opacity:0;pointer-events:none;max-width:calc(100% - 32px);width:max-content;text-align:center;box-shadow:0 10px 24px -8px rgba(0,0,0,.4);display:flex;align-items:center;gap:8px}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast .ic{width:22px;height:22px;flex:none}
.flash{position:absolute;inset:0;background:var(--coral);opacity:0;pointer-events:none;z-index:70}
#confetti{position:absolute;inset:0;pointer-events:none;z-index:95;width:100%;height:100%}
.floaty{position:absolute;z-index:96;font-family:var(--f-disp);font-weight:800;font-size:1.3rem;pointer-events:none;white-space:nowrap;transform:translate(-50%,0);text-shadow:0 2px 0 #fff,0 0 8px #fff}
.floaty.pos{color:var(--sun-d)}
.floaty.neg{color:var(--coral-d)}
.floaty.dmg{color:var(--coral-d);font-size:1.8rem}
.shock{position:absolute;width:70px;height:70px;border-radius:50%;border:5px solid var(--sun);opacity:0;pointer-events:none;z-index:4}
#overlay-root{position:absolute;inset:0;pointer-events:none;z-index:80}
#overlay-root>*{pointer-events:auto}

/* ---------- tab bar ---------- */
.tabs{display:flex;justify-content:space-around;padding:8px 6px 12px;padding-bottom:max(12px,env(safe-area-inset-bottom));background:#fff;border-top:2px solid var(--line);position:relative;z-index:5}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:6px 2px;border-radius:16px;font-weight:800;font-size:.75rem;color:var(--muted);transition:color .2s;min-width:0}
.tab .ti{width:44px;height:34px;border-radius:12px;display:grid;place-items:center;transition:transform .35s var(--spring),background .2s}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--tang-d)}
.tab[aria-current="page"] .ti{background:var(--tang-l);transform:translateY(-3px) scale(1.08)}
.tab:active .ti{transform:scale(.88)}
.tab:hover .ti{background:var(--bg)}

/* ---------- MAP ---------- */
.para{position:absolute;left:0;right:0;top:0;height:2400px;pointer-events:none;z-index:0}
.blob{position:absolute;border-radius:50%;animation:bob 7s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-14px) rotate(6deg)}}
.glyph{position:absolute;font-family:var(--f-code);font-weight:500;color:var(--tang-l);font-size:40px;animation:bob 9s ease-in-out infinite alternate}
.map-inner{position:relative;z-index:1}
.intro{position:relative;overflow:hidden;padding-right:108px;background:linear-gradient(160deg,#fff 55%,var(--sun-l));min-height:150px}
.intro h1{font-size:2rem;font-weight:800;color:var(--tang-d);margin-top:2px}
.intro p{font-size:.95rem;color:var(--ink2)}
.intro .mini{position:absolute;right:-4px;bottom:-6px;width:112px;background:none;border:0;padding:0}
.intro .review-btn{margin-top:10px}
.goalbar{position:relative;height:22px;border-radius:999px;background:var(--lock);overflow:hidden;margin-top:8px}
.goalbar i{position:absolute;inset:0;background:var(--teal);transform-origin:left;transform:scaleX(var(--p,0));border-radius:999px;transition:transform 1s var(--elastic)}
.goalbar span{position:relative;display:block;text-align:center;font-weight:900;font-size:.78rem;line-height:22px;color:var(--ink)}
.unit{display:flex;align-items:center;gap:10px;background:var(--teal);color:#fff;border-radius:20px;padding:10px 14px;box-shadow:0 5px 0 var(--teal-d);margin:18px 0 8px}
.unit.locked{background:var(--lock-d);box-shadow:0 5px 0 #A89C8C}
.unit-ic{width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:none}
.unit-ic svg{width:34px;height:34px}
.unit-ic.big{width:84px;height:84px;margin:10px auto;background:var(--teal);border-radius:26px;box-shadow:0 5px 0 var(--teal-d)}
.unit-ic.big svg{width:64px;height:64px}
.unit-t{flex:1;min-width:0}
.unit small{display:block;font-weight:900;font-size:.75rem;letter-spacing:.08em;opacity:.9}
.unit b{font-family:var(--f-disp);font-size:1.3rem;line-height:1}
.unit>span{font-weight:800;font-size:.85rem;background:rgba(255,255,255,.2);padding:4px 10px;border-radius:999px;display:flex;align-items:center;gap:4px;white-space:nowrap}
.unit-blurb{font-size:.9rem;color:var(--ink2);margin:0 4px 4px}
.path{position:relative;height:600px}
.path svg.lines{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.dots{fill:none;stroke:var(--lock-d);stroke-width:10;stroke-linecap:round;stroke-dasharray:1 22;animation:march 1.4s linear infinite}
@keyframes march{to{stroke-dashoffset:-23}}
.path-prog{fill:none;stroke:var(--tang);stroke-width:12;stroke-linecap:round}
.path-glow{fill:none;stroke:var(--tang-l);stroke-width:24;stroke-linecap:round;opacity:.7}
.node{position:absolute;width:74px;height:74px;margin:-37px 0 0 -37px;border-radius:50%;border:0;display:grid;place-items:center;color:var(--teal-d);
  --c:var(--lock);--cd:var(--lock-d);background:var(--c);box-shadow:0 7px 0 var(--cd),0 14px 20px -8px rgba(90,40,10,.35),inset 0 -4px 0 rgba(0,0,0,.06),inset 0 5px 0 rgba(255,255,255,.35);transition:transform .16s var(--spring),box-shadow .16s var(--spring);z-index:2}
.node:hover{transform:translateY(-2px)}
.node:active{transform:translateY(6px) scale(1.03,.95);box-shadow:0 1px 0 var(--cd),0 4px 8px -4px rgba(90,40,10,.3),inset 0 -4px 0 rgba(0,0,0,.06)}
.node svg{width:32px;height:32px}
.node.open{--c:var(--sun);--cd:var(--sun-d)}
.node.done{--c:var(--teal);--cd:var(--teal-d)}
.node.cur{--c:var(--tang);--cd:var(--tang-d);width:84px;height:84px;margin:-42px 0 0 -42px;color:var(--tang-d)}
.node.shield.done{color:var(--teal-d)}
.node.boss{--c:var(--coral);--cd:var(--coral-d);width:98px;height:98px;margin:-49px 0 0 -49px}
.node.boss.lock{--c:var(--lock);--cd:var(--lock-d)}
.node.boss.done{--c:var(--teal);--cd:var(--teal-d)}
.boss-mini{width:78px;height:78px;display:block}
.boss-mini svg{width:100%;height:100%}
.node.boss.lock .boss-mini{filter:grayscale(1) opacity(.55)}
.lock-badge{position:absolute;right:-4px;bottom:-2px;width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 3px 0 var(--line)}
.lock-badge svg{width:20px;height:20px}
.lock-badge.ok{background:var(--teal-d)}
.node.cur::before,.node.cur::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:4px solid var(--tang);opacity:0;animation:ring 2s ease-out infinite;z-index:-1}
.node.cur.boss::before,.node.cur.boss::after{border-color:var(--coral)}
.node.cur::after{animation-delay:1s}
@keyframes ring{0%{transform:scale(.85);opacity:.7}100%{transform:scale(1.45);opacity:0}}
.start-tip{position:absolute;z-index:3;transform:translate(-50%,-100%);background:#fff;color:var(--tang-d);font-weight:900;font-size:.875rem;letter-spacing:.06em;padding:7px 12px;border-radius:12px;border:2px solid var(--line);box-shadow:0 3px 0 var(--line);animation:tip 1.1s ease-in-out infinite alternate;pointer-events:none;white-space:nowrap}
.start-tip::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-7px;border:7px solid transparent;border-top-color:#fff;border-bottom:0}
@keyframes tip{to{transform:translate(-50%,calc(-100% - 7px))}}
.nlabel{position:absolute;z-index:2;transform:translateY(-50%);max-width:140px;background:#fff;border-radius:14px;padding:6px 10px;box-shadow:var(--sh);font-weight:800;font-size:.875rem;line-height:1.2;pointer-events:none}
.nlabel small{display:block;font-weight:900;font-size:.68rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.nlabel.cur small{color:var(--tang-d)}
.nlabel.done small{color:var(--teal-d)}
.nlabel.lock{opacity:.75}
.more-card{display:flex;gap:12px;align-items:center;margin-top:18px}
.more-ic{width:56px;height:56px;border-radius:18px;background:var(--lock);display:grid;place-items:center;flex:none}
.more-ic svg{width:40px}
.more{text-align:center;font-weight:800;color:var(--muted);font-size:.9rem;margin:10px 0}
.node-sheet p{color:var(--ink2)}
.ns-tags{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{background:var(--c);color:#fff;font-weight:900;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:4px 10px}
.boss-sheet .bs-art{width:140px;margin:0 auto}

/* ==========================================================================
   MASCOT — copied verbatim from designs/5-springboard.html
   ========================================================================== */
.curlo{display:block;width:100%;height:auto;overflow:visible}
.curlo .c-move{transform-box:fill-box;transform-origin:50% 100%}
.curlo .c-body{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{50%{transform:translateY(-3px) scale(1.025,.975)}}
.curlo .c-eyes{transform-box:fill-box;transform-origin:50% 50%;animation:blink 4.6s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.curlo .c-pupils{transition:transform .35s var(--spring)}
.curlo .bd{fill:var(--tang)}
.curlo .belly{fill:#FFAE78}
.curlo .brace{fill:none;stroke:var(--teal);stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
.curlo .mth,.curlo .brw{opacity:0;transition:opacity .15s}
.curlo[data-mood="happy"] .m-happy,.curlo[data-mood="celebrate"] .m-cele,.curlo[data-mood="worried"] .m-worr,.curlo[data-mood="thinking"] .m-think,.curlo[data-mood="bracing"] .m-brace{opacity:1}
.curlo[data-mood="worried"] .b-worr,.curlo[data-mood="thinking"] .b-think,.curlo[data-mood="bracing"] .b-brace{opacity:1}
.curlo[data-mood="thinking"] .c-pupils{transform:translate(-3px,-5px)}
.curlo[data-mood="worried"] .c-pupils{transform:translate(0,3px)}
.curlo[data-mood="celebrate"] .c-eyes{animation:none;transform:scaleY(.55)}
.curlo .c-shield{transform:translate(118px,120px) rotate(14deg) scale(.9);transition:transform .45s var(--spring)}
.curlo.shield-up .c-shield{transform:translate(80px,112px) rotate(0) scale(1.45)}
.curlo .sh-face{stroke-width:4;stroke-linejoin:round}
.curlo .sh-in{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.curlo[data-tier="1"]{--sa:#E8A765;--sb:#9A5A22;--sc:#B8732F}
.curlo[data-tier="2"]{--sa:#E4ECF4;--sb:#6C87A3;--sc:#3D8BFF}
.curlo[data-tier="3"]{--sa:#FFD447;--sb:#C98C00;--sc:#F2641B}
.curlo .sh-face{fill:var(--sa);stroke:var(--sb)}
.curlo .sh-in{stroke:var(--sc)}
.curlo .helm{fill:var(--sa);stroke:var(--sb);stroke-width:3;stroke-linejoin:round;opacity:0;transition:opacity .3s}
.curlo[data-tier="2"] .helm,.curlo[data-tier="3"] .helm{opacity:1}
.curlo .plume,.curlo .gstar{opacity:0;transition:opacity .3s}
.curlo[data-tier="3"] .plume,.curlo[data-tier="3"] .gstar{opacity:1}
.poke{background:none;border:0;padding:0;cursor:pointer;display:block;border-radius:30px}
/* ---- end verbatim Curlo block ---- */

/* Additive Curlo layers: color variants, shield skins, gear motion. */
.curlo[style*="--cv"] .bd{fill:var(--cv)}
.curlo[style*="--cv"] .belly{fill:var(--cvb)}
.curlo[data-shield="shield-circuit"][data-tier]{--sa:#2A2140;--sb:#0FA898;--sc:#7FF0DF}

@keyframes flutter{to{transform:rotate(-9deg) skewX(4deg)}}

@keyframes capewave{to{transform:scaleX(1.04) skewX(-2deg)}}

.flagm{color:var(--coral-d)}
.t-kw{color:#C2410C;font-weight:500}.t-ty{color:var(--teal-d);font-weight:500}.t-st{color:#B42343}.t-nu{color:#7A4FD0}.t-cm{color:#766C84;font-style:italic}.t-pp{color:#2463C4}.t-ns{color:var(--teal-d)}.t-lib{color:#2463C4}.t-pu{color:var(--ink2)}

.dhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 0 6px;flex-wrap:wrap}

.chal{padding-bottom:8px}

.hint.answer{background:#fff;border-color:var(--sun-d)}
.hx{margin-top:6px;color:var(--ink2)}
.result{margin-top:16px;border-radius:22px;padding:14px 16px;display:none;border:2px solid}
.result.show{display:block}
.result.good{background:var(--teal-l);border-color:var(--teal)}
.result.bad{background:var(--coral-l);border-color:var(--coral)}
.result .rh{display:flex;align-items:center;gap:8px;font-family:var(--f-disp);font-weight:800;font-size:1.5rem;flex-wrap:wrap}
.result.good .rh{color:var(--teal-d)}.result.bad .rh{color:var(--coral-d)}
.result .rh .ic{width:30px;height:30px}
.rxp{margin-left:auto;font-size:1rem;background:#fff;border-radius:999px;padding:3px 10px;color:var(--ink)}
.rscore{font-weight:900;margin-top:2px}
.rexp{margin:8px 0;font-size:1rem}
.rshort{font-weight:800;font-size:1.05rem;margin:6px 0 4px}
.result.soft{background:#FFF1F3}
.soft-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.soft-btns .pbtn{min-height:52px;font-size:.9rem;padding:12px 8px;letter-spacing:.02em}
.soft-btns .pbtn .ic{width:18px;height:18px}
.rpick{display:flex;gap:8px;align-items:flex-start;background:rgba(255,255,255,.75);border-radius:14px;padding:8px 10px;margin:6px 0;font-size:.95rem}
.rpick .ic{width:20px;height:20px;margin-top:1px}
.more-wrap{margin:8px 0 2px}
.story-short{margin:0}
.story-seq .story-line{margin:0;cursor:pointer;min-height:1.4em}
.story-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
.story-dots{display:flex;gap:5px}
.story-dots i{width:8px;height:8px;border-radius:50%;background:var(--lock-d)}
.story-dots i.on{background:var(--tang)}
.story-next{padding:4px 12px;font-size:.85rem}
.more-details{margin-top:6px}
.more-details summary{display:inline-flex;align-items:center;gap:4px;cursor:pointer;font-weight:900;font-size:.85rem;color:var(--tang-d);list-style:none;border-radius:999px;padding:2px 10px;background:var(--tang-l)}
.more-details summary::-webkit-details-marker{display:none}
.more-details summary::after{content:"\25BE";transition:transform .3s var(--spring)}
.more-details[open] summary::after{transform:rotate(180deg)}
.more-details p{font-weight:600;font-size:.95rem;margin:8px 0 0}
.more-btn{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.85);border:2px solid rgba(42,33,64,.12);border-radius:999px;padding:6px 14px;font-weight:900;font-size:.9rem;color:var(--ink2);transition:transform .15s var(--spring)}
.more-btn:active{transform:scale(.95)}
.more-btn .chev{width:18px;height:18px;transition:transform .3s var(--spring)}
.more-btn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.more-body{margin-top:8px;transform-origin:top}
.sbs.compact{margin-top:8px;padding:8px 10px}
.sbs.compact .code{font-size:.8rem;line-height:1.6;padding:6px 0}
.concept-short{font-family:var(--f-disp);font-weight:800;font-size:1.45rem;line-height:1.2;margin:4px 0 12px;color:var(--ink)}
.lesson-intro .more-wrap{margin:4px 0 10px}
.lesson-intro .more-body .card{margin-bottom:10px}
.why{list-style:none;padding:0;margin:8px 0 12px;display:grid;gap:7px}
.why li{background:rgba(255,255,255,.8);border-radius:14px;padding:8px 10px;font-size:.95rem;display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start}
.why li>.ic{width:22px;height:22px;margin-top:2px}
.why code{font-family:var(--f-code);font-weight:500;background:#fff;border:2px solid var(--line);border-radius:8px;padding:0 6px;display:inline-block;min-width:40px;margin:0 6px 4px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.why .yes code{border-color:var(--teal);color:var(--teal-d)}
.why code.snip{display:block;font-size:.82rem}
.wl{display:inline}
.wopt{display:block;margin-bottom:2px}
.accepted{background:rgba(255,255,255,.8);border-radius:14px;padding:10px 12px;margin:8px 0;font-size:.95rem}
.ans-lines{margin:6px 0;padding-left:22px;display:grid;gap:4px}
.cont-btn{width:100%;margin-top:12px}

/* order */
.order{margin-top:8px}
.zone-label{font-weight:900;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 2px 6px}
.zone{list-style:none;margin:0;padding:8px;border-radius:18px;display:grid;gap:8px;min-height:60px}
.zone.prog{background:#FFFBF4;border:2px dashed var(--lock-d)}
.zone.prog.empty::before{content:"Tap lines below to build your program";color:var(--muted);font-weight:700;text-align:center;padding:10px;font-size:.9rem}
.zone.bank{background:var(--bg);border:2px solid var(--line)}
.tile{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 10px;box-shadow:0 3px 0 var(--line);font-family:var(--f-code);font-size:.86rem;white-space:pre-wrap;overflow-wrap:anywhere;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;transition:box-shadow .15s,background .15s}
.tile:hover{background:#FFFDF8}
.tile .grip{color:var(--lock-d);display:grid}
.tile .grip .ic{width:18px;height:18px}
.tile .tcode{flex:1;min-width:0}
.tile .tmark .ic{width:22px;height:22px}
.tile.sel{border-color:var(--sky);box-shadow:0 0 0 3px var(--sky-l),0 3px 0 var(--sky)}
.tile.drag-src{opacity:.35;border-style:dashed;box-shadow:none}
.tile.ok{border-color:var(--teal);background:var(--teal-l)}
.tile.bad{border-color:var(--coral);background:var(--coral-l)}
.drag-ghost{position:fixed;z-index:200;pointer-events:none;margin:0;transform:scale(1.04) rotate(1.5deg);box-shadow:0 18px 30px -10px rgba(42,33,64,.45),0 3px 0 var(--line);cursor:grabbing;list-style:none}

/* timed rounds */
.timed{margin-top:6px}
.timer{position:relative;height:26px;border-radius:999px;background:var(--lock);overflow:hidden}
.tfill{position:absolute;inset:0;background:linear-gradient(90deg,var(--teal),#39C9B7);transform-origin:left;transition:transform .1s linear;border-radius:999px}
.timer.low .tfill{background:linear-gradient(90deg,var(--coral-d),var(--coral))}
.tnum{position:relative;display:block;text-align:center;font-weight:900;line-height:26px;font-size:.85rem}
.tcount{text-align:right;font-weight:900;color:var(--ink2);margin:6px 2px}
.tcard-wrap{position:relative;min-height:200px}
.tcard{position:relative;background:#fff;border-radius:22px;padding:12px;box-shadow:var(--sh)}
.tstart{text-align:center;padding:20px 10px;background:#fff;border-radius:22px;box-shadow:var(--sh)}
.tstart .pbtn{margin-top:10px;min-width:200px}
.su-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.su-btns .pbtn{min-height:60px}
.tq{font-weight:800;font-size:1.05rem;margin:4px 2px 8px}
.stamp{position:absolute;right:12px;top:12px;display:flex;align-items:center;gap:6px;font-family:var(--f-disp);font-weight:800;font-size:1.3rem;padding:4px 12px;border-radius:14px;background:#fff;border:3px solid;transform:rotate(-8deg);z-index:2}
.stamp.ok{color:var(--teal-d);border-color:var(--teal)}
.stamp.bad{color:var(--coral-d);border-color:var(--coral)}
.stamp .ic{width:26px;height:26px}
.tdone{display:flex;align-items:center;justify-content:center;gap:8px;min-height:120px;font-size:1.3rem;font-family:var(--f-disp);background:#fff;border-radius:22px;box-shadow:var(--sh)}
.tdone .ic{width:34px;height:34px;color:var(--tang)}

/* ---------- ARENA ---------- */
.arena{position:relative;height:190px;border-radius:22px;background:linear-gradient(180deg,#E8F8F5,#FFF6E8);border:2px solid var(--line);overflow:hidden;margin:10px 0}
.arena .floor{position:absolute;left:0;right:0;bottom:0;height:34px;background:repeating-linear-gradient(90deg,#FBE3C4 0 26px,#F6D7B0 26px 52px)}
.arena .dm{position:absolute;left:14px;bottom:18px;width:124px}
.attack{position:absolute;right:14px;top:30px;background:var(--coral-d);color:#fff;font-family:var(--f-code);font-weight:500;font-size:.9rem;border-radius:12px;padding:6px 9px;box-shadow:0 4px 0 #9E1F35;white-space:nowrap;z-index:3;max-width:60%;overflow:hidden;text-overflow:ellipsis}
.cells{position:absolute;right:14px;bottom:44px;display:flex;gap:4px;align-items:flex-end}
.cells .cl{font-size:.68rem;font-weight:900;color:var(--muted);margin-right:4px;align-self:center;text-align:right;line-height:1.1;max-width:60px}
.cell{width:34px;height:34px;border-radius:9px;background:#fff;border:2px solid var(--line);display:grid;place-items:center;font-family:var(--f-code);font-size:.8rem;font-weight:500;box-shadow:0 3px 0 var(--line);transition:background .2s,border-color .2s}
.cell.safe{border-color:var(--teal);background:var(--teal-l)}
.cell.bad{border-color:var(--coral);background:var(--coral-l);color:var(--coral-d)}
.crash-note{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-weight:800;color:var(--coral-d);background:var(--coral-l);border-radius:14px;padding:8px 12px}
.crash-note .ic{width:22px;height:22px}
.attack-head{margin:0 -4px 6px;padding:0 4px 4px;position:sticky;top:0;z-index:4;background:var(--cream)}
.attack-head .arena{height:150px;margin:6px 0}
.attack-head .arena .dm{width:100px}
.arena.has-boss .attack{right:96px;top:40px}
.arena-boss{position:absolute;right:10px;bottom:14px;width:96px;height:96px}
.arena-boss svg{width:100%;height:100%}
.fix-host{margin-top:10px}

/* ---------- SESSION ---------- */
.screen.session{display:flex;flex-direction:column}
.sess-top{display:flex;align-items:center;gap:10px;padding:12px 14px 8px;padding-top:max(12px,env(safe-area-inset-top));flex:none;background:var(--cream);z-index:6}
.xbtn{width:40px;height:40px;border-radius:12px;border:2px solid var(--line);background:#fff;display:grid;place-items:center;box-shadow:0 3px 0 var(--line);flex:none;color:var(--ink2)}
.xbtn:active{transform:translateY(3px);box-shadow:none}
.xbtn .ic{width:18px;height:18px}
.sess-prog{flex:1;height:16px;border-radius:999px;background:var(--lock);overflow:hidden;position:relative}
.sess-prog i{position:absolute;inset:0;background:linear-gradient(180deg,#39C9B7,var(--teal));border-radius:999px;transform-origin:left;transform:scaleX(0);transition:transform .8s var(--elastic)}
.sess-prog i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:3px;background:rgba(255,255,255,.5)}
.chip.combo{color:var(--muted);white-space:nowrap;padding:5px 9px;font-size:.85rem}
.chip.combo.hot{background:var(--sun);border-color:var(--sun-d);color:var(--ink);box-shadow:0 2px 0 var(--sun-d),0 0 calc(var(--heat,0)*18px) rgba(255,198,46,.8)}
.chip.combo.blaze{background:linear-gradient(90deg,var(--tang),var(--sun));color:#fff;border-color:var(--tang-d)}
.chip.combo.blaze .ic{animation:flick .5s ease-in-out infinite alternate}
.sess-hearts{color:var(--coral-d)}
.session .scroll{position:relative;inset:auto;flex:1;min-height:0}
.sess-stage{position:relative}
.sess-page{will-change:transform}
.sess-page.leaving{position:absolute;left:0;right:0;top:0;pointer-events:none}
.results{text-align:center;padding-top:6px}
.res-curlo{width:150px;margin:0 auto}
.res-title{font-size:2.2rem;color:var(--tang-d);margin-top:4px}
.res-sub{color:var(--ink2);font-weight:700}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.tile-stat{border-radius:18px;padding:10px 12px;text-align:left;border:2px solid;background:#fff}
.tile-stat .ts-l{display:flex;align-items:center;gap:5px;font-weight:900;font-size:.75rem;letter-spacing:.05em;text-transform:uppercase}
.tile-stat .ts-l .ic{width:16px;height:16px}
.tile-stat .ts-v{font-family:var(--f-disp);font-weight:800;font-size:1.7rem;line-height:1.1;font-variant-numeric:tabular-nums}
.tile-stat.sun{border-color:var(--sun);background:var(--sun-l)}.tile-stat.sun .ts-l{color:#8A5A00}
.tile-stat.teal{border-color:var(--teal);background:var(--teal-l)}.tile-stat.teal .ts-l{color:var(--teal-d)}
.tile-stat.tang{border-color:var(--tang);background:var(--tang-l)}.tile-stat.tang .ts-l{color:var(--tang-d)}
.tile-stat.sky{border-color:var(--sky);background:var(--sky-l)}.tile-stat.sky .ts-l{color:var(--sky-d)}
.tile-stat.coral{border-color:var(--coral);background:var(--coral-l)}.tile-stat.coral .ts-l{color:var(--coral-d)}
.perfect,.stat-gain{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:900;background:#fff;border-radius:16px;padding:10px 12px;margin:8px 0;box-shadow:var(--sh)}
.perfect{background:var(--sun);color:var(--ink)}
.perfect .ic,.stat-gain .ic{width:22px;height:22px}
.results .pbtn.big{margin-top:10px}

/* ---------- BOSS ---------- */
.boss-head{position:sticky;top:-6px;z-index:5;display:flex;gap:10px;align-items:center;background:linear-gradient(180deg,#3A2D58,#2A2140);color:#fff;border-radius:22px;padding:8px 12px;margin:0 0 10px;box-shadow:0 6px 0 #1A1430}
.boss-art{width:86px;height:86px;flex:none}
.boss-art svg,.boss-big svg,.vic-boss svg,.bs-art svg{width:100%;height:100%;display:block;overflow:visible}
.art-boss .b-body{transform-box:fill-box;transform-origin:50% 100%;animation:bbreathe 2.6s ease-in-out infinite}
@keyframes bbreathe{50%{transform:translateY(-3px) scale(1.03,.97)}}
.art-boss .b-eyes{transform-box:fill-box;transform-origin:50% 50%;animation:blink 3.8s infinite}
.art-boss .b-limb{transform-box:fill-box;transform-origin:50% 90%;animation:limb 1.8s ease-in-out infinite alternate}
@keyframes limb{to{transform:rotate(6deg)}}
.art-beast .bs-body{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 3s ease-in-out infinite}
.art-beast .bs-eyes{transform-box:fill-box;transform-origin:50% 50%;animation:blink 5s infinite}
.boss-art.hurtflash{animation:hurt .5s steps(2) 1}
@keyframes hurt{0%,100%{filter:none}25%{filter:brightness(2.4) saturate(0)}50%{filter:none}75%{filter:brightness(2.4) saturate(0)}}
.boss-meta{flex:1;min-width:0}
.boss-name{font-family:var(--f-disp);font-weight:800;font-size:1.1rem;line-height:1.1}
.hpbar{display:flex;gap:4px;margin:6px 0}
.hpbar .seg{flex:1;height:14px;border-radius:5px;background:linear-gradient(180deg,#FF8595,var(--coral));box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);transition:opacity .2s}
.hpbar .seg.gone{background:#4A3E66;box-shadow:inset 0 2px 0 rgba(0,0,0,.25)}
.boss-say{font-weight:800;font-size:.9rem;color:var(--sun);min-height:1.3em}
.boss-intro{text-align:center}
.boss-stage-in{position:relative;background:radial-gradient(circle at 50% 60%,#4A3A70,#2A2140 70%);border-radius:26px;padding:20px 10px 16px;margin-bottom:10px;overflow:hidden}
.boss-big{width:190px;height:190px;margin:0 auto}
.boss-banner{margin-top:6px;color:#fff}
.boss-banner small{display:block;font-weight:900;letter-spacing:.1em;text-transform:uppercase;font-size:.75rem;color:var(--sun)}
.boss-banner b{font-family:var(--f-disp);font-weight:800;font-size:1.9rem;line-height:1;-webkit-text-stroke:1px #1A1430;text-shadow:0 4px 0 #1A1430}
.boss-intro .qhead,.def-intro .qhead,.victory .qhead{text-align:left}
.phase-banner{text-align:center;background:var(--coral-d);color:#fff;border-radius:24px;padding:16px;margin:4px 0 12px;box-shadow:0 6px 0 #9E1F35}
.phase-banner small{display:block;font-weight:900;letter-spacing:.12em;text-transform:uppercase;font-size:.8rem;opacity:.9}
.phase-banner b{font-family:var(--f-disp);font-weight:800;font-size:2.2rem;line-height:1}
.phase-banner.win{background:var(--teal);box-shadow:0 6px 0 var(--teal-d)}
.phase-banner.win b{font-size:1.6rem}
.victory{text-align:center}
.vic-boss{width:160px;height:160px;margin:0 auto}
.rewards{display:grid;gap:8px;margin:12px 0;text-align:left}
.reward{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:10px 12px;box-shadow:var(--sh)}
.reward .ic{width:26px;height:26px}
.reward .muted{margin-left:auto;font-weight:800;font-size:.8rem}

/* ---------- PROJECT ---------- */
.proj-intro h2,.proj-done h2,.stress-intro h2{margin:2px 0 10px}
.proj-steps{list-style:none;padding:0;margin:8px 0;display:grid;gap:8px}
.proj-steps li{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:10px 12px;box-shadow:var(--sh);font-weight:800}
.proj-steps li .ic{width:24px;height:24px}
.proj-steps li.done{background:var(--teal-l)}
.proj-steps li.stress{background:var(--coral-l);color:var(--coral-d)}
.growing{background:#fff;border-radius:18px;padding:8px 12px;box-shadow:var(--sh);margin-bottom:8px}
.growing summary{font-weight:900;display:flex;align-items:center;gap:6px;cursor:pointer;padding:4px 0;list-style:none}
.growing summary::-webkit-details-marker{display:none}
.growing summary .ic{width:20px;height:20px}

/* ---------- DIALOGS + SHEETS ---------- */
.scrim{position:absolute;inset:0;background:rgba(42,33,64,.4);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.open{opacity:1;pointer-events:auto}
.dlg-wrap{position:absolute;inset:0;display:grid;place-items:center;padding:16px;z-index:5}
.dlg{position:relative;background:#fff;border-radius:28px;padding:18px 18px 16px;width:100%;max-width:400px;box-shadow:0 30px 60px -20px rgba(42,33,64,.5);text-align:center;max-height:calc(100% - 24px);overflow:auto}
.dlg-curlo{width:96px;margin:-6px auto 4px}
.dlg h3{font-size:1.4rem;margin-bottom:6px}
.dlg-body{text-align:left;color:var(--ink2)}
.dlg-body p{margin:6px 0}
.dlg-btns{display:grid;gap:10px;margin-top:14px}
.sheet-wrap{position:absolute;inset:0;z-index:4}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:30px 30px 0 0;padding:10px 16px 22px;padding-bottom:max(22px,env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .5s var(--spring);box-shadow:0 -10px 40px rgba(42,33,64,.2);max-height:86%;overflow:auto}
.sheet.open{transform:none}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sheet h3{margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet .xbtn{width:36px;height:36px}
.big-hearts{display:flex;justify-content:center;margin:6px 0 10px}
.big-hearts svg{width:40px;height:40px}
.goal-ring-row{display:flex;gap:14px;align-items:center;margin-bottom:10px}
.ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--teal) calc(var(--p)*360deg),var(--lock) 0);display:grid;place-items:center;flex:none}
.ring span{width:48px;height:48px;border-radius:50%;background:#fff;display:grid;place-items:center;font-family:var(--f-disp);font-weight:800;font-size:1.2rem}
.quest-list{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.quest-list li{display:flex;gap:10px;align-items:center;background:var(--bg);border-radius:18px;padding:10px 12px}
.quest-list li.done{background:var(--teal-l)}
.qi .ic{width:28px;height:28px}
.qb{flex:1;min-width:0}
.qbar{height:10px;border-radius:999px;background:var(--lock);overflow:hidden;margin-top:6px}
.qbar i{display:block;height:100%;background:var(--sun);transform-origin:left;transform:scaleX(var(--p));border-radius:999px}
.qx{text-align:right;font-weight:900;font-size:.85rem}
.qx small{display:block;color:var(--muted);font-weight:800}

/* ---------- CELEBRATION OVERLAYS (from the design's level-up) ---------- */
.lvl{position:absolute;inset:0;z-index:10;display:none;place-items:center;overflow:hidden;background:var(--sun);cursor:pointer;text-align:center}
.lvl.open{display:grid}
.lvl.ach{background:var(--teal)}
.lvl.bugc{background:#3A2D58}
.lvl.cos{background:var(--coral)}
.lvl.tierc{background:var(--sky)}
.rays{position:absolute;left:50%;top:44%;width:1100px;height:1100px;margin:-550px 0 0 -550px;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.35) 0 10deg,transparent 10deg 20deg);animation:spin 14s linear infinite;border-radius:50%}
.lvl.bugc .rays{background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.1) 0 10deg,transparent 10deg 20deg)}
@keyframes spin{to{transform:rotate(360deg)}}
.lvl-in{position:relative;padding:20px;max-width:360px}
.lvl-in .t1{font-family:var(--f-disp);font-weight:800;font-size:1.4rem;letter-spacing:.1em;color:var(--tang-d)}
.lvl.ach .t1,.lvl.cos .t1,.lvl.tierc .t1{color:#fff}
.lvl.bugc .t1{color:var(--sun)}
.lvl-in .big{font-family:var(--f-disp);font-weight:800;font-size:6rem;line-height:.9;color:#fff;-webkit-text-stroke:3px var(--tang-d);text-shadow:0 7px 0 var(--tang-d)}
.lvl-in .lm{width:170px;margin:4px auto 0}
.lvl-in .t2{font-weight:900;font-size:1.1rem;color:var(--ink);min-height:52px;margin:8px 0 14px}
.lvl.ach .t2,.lvl.cos .t2,.lvl.tierc .t2,.lvl.bugc .t2{color:#fff}
.lvl.bugc .t2 b,.lvl.ach .t2 b{color:var(--sun)}
.lvl-in .skip{font-weight:800;font-size:.85rem;color:var(--ink2);margin-top:10px}
.lvl.ach .skip,.lvl.cos .skip,.lvl.tierc .skip,.lvl.bugc .skip{color:rgba(255,255,255,.85)}
.medal{width:130px;height:130px;margin:10px auto;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 8px 0 var(--teal-d),0 0 0 10px rgba(255,255,255,.3)}
.medal .ic{width:80px;height:80px}
.ach-name{font-family:var(--f-disp);font-size:1.6rem}
.bug-reveal{width:150px;height:150px;margin:10px auto;background:rgba(255,255,255,.12);border-radius:30px;padding:10px}
.bug-reveal svg{width:100%;height:100%}

/* ---------- EVOLUTION ---------- */
.evo{position:absolute;inset:0;z-index:20;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 45%,#5B35AE,#2A2140 70%);cursor:pointer;text-align:center;color:#fff}
.evo-rays{position:absolute;left:50%;top:44%;width:1200px;height:1200px;margin:-600px 0 0 -600px;background:repeating-conic-gradient(from 0deg,rgba(255,198,46,.22) 0 8deg,transparent 8deg 16deg);animation:spin 8s linear infinite;border-radius:50%}
.evo-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.evo-in{position:relative;padding:20px;max-width:360px}
.evo-t1{font-family:var(--f-disp);font-weight:800;font-size:2.2rem;color:var(--sun);letter-spacing:.04em}
.evo-stage{position:relative;width:200px;height:215px;margin:6px auto}
.evo-old,.evo-new{position:absolute;inset:0}
.evo-glow{position:absolute;inset:10%;border-radius:50%;background:radial-gradient(circle,rgba(255,237,176,.7),transparent 70%);animation:pulse 1s ease-in-out infinite alternate;z-index:-1}
@keyframes pulse{to{transform:scale(1.2);opacity:.6}}
.evo-shake{animation:evshake .12s linear infinite}
@keyframes evshake{25%{transform:translate(-3px,1px) rotate(-2deg)}75%{transform:translate(3px,-1px) rotate(2deg)}}
.evo-t2{font-weight:900;font-size:1.15rem;min-height:56px;margin:8px 0 12px}
.evo-t2 b{color:var(--sun)}
.evo-gear{font-size:.95rem;font-weight:800;opacity:.9}
.evo .skip{font-weight:800;font-size:.85rem;opacity:.8;margin-top:10px}

/* ---------- PRACTICE / VAULT / BESTIARY / STATS / SETTINGS ---------- */
.review-card{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.rc-ic{width:64px;flex:none}
.rc-b{flex:1;min-width:160px}
.review-card .pbtn{flex:1 1 100%}
.arena-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.type-card{display:flex;flex-direction:column;align-items:flex-start;gap:3px;background:#fff;border:2px solid var(--line);border-radius:20px;padding:12px;box-shadow:0 4px 0 var(--line);text-align:left;transition:transform .15s var(--spring)}
.type-card:hover{transform:translateY(-2px)}
.type-card:active{transform:translateY(4px);box-shadow:none}
.type-card b{font-size:.95rem;line-height:1.15}
.type-card small{color:var(--muted);font-weight:800;font-size:.78rem}
.tc-ic{width:38px;height:38px;border-radius:12px;background:var(--tang-l);color:var(--tang-d);display:grid;place-items:center}
.tc-ic .ic{width:22px;height:22px}
.type-card.locked{background:var(--bg);opacity:.75}
.type-card.locked .tc-ic{background:var(--lock);color:var(--muted)}
.seg{display:flex;background:var(--lock);border-radius:16px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;border-radius:12px;padding:10px 8px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--ink2);transition:background .2s,transform .2s var(--spring)}
.seg button[aria-selected="true"],.seg button[aria-checked="true"]{background:#fff;color:var(--tang-d);box-shadow:0 3px 0 var(--line)}
.seg.small{margin:0;flex:none}
.seg.small button{padding:6px 12px;font-size:.9rem}
.empty-state{text-align:center;padding:20px 10px;color:var(--ink2)}
.es-c{width:110px;margin:0 auto 6px}
.bprog{height:14px;border-radius:999px;background:var(--lock);overflow:hidden;margin:-4px 0 14px}
.bprog i{display:block;height:100%;background:var(--coral);transform-origin:left;transform:scaleX(var(--p));border-radius:999px}
.beast-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.beast{position:relative;background:#fff;border:2px solid var(--line);border-radius:20px;padding:8px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 4px 0 var(--line);transition:transform .15s var(--spring)}
.beast:hover{transform:translateY(-2px)}
.beast:active{transform:translateY(4px);box-shadow:none}
.beast .b-art{position:relative;width:78px;height:78px}
.beast .b-art svg{width:100%;height:100%}
.beast .q{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-disp);font-weight:800;font-size:2rem;color:#fff;text-shadow:0 2px 0 #A89C8C}
.beast b{font-size:.82rem;line-height:1.1;text-align:center}
.beast small{color:var(--muted);font-weight:800;font-size:.7rem}
.beast.locked{background:var(--bg)}
.beast-detail .bd-art{width:140px;height:140px;margin:0 auto}
.stat-tiles{margin-top:0}
.ach-grid{display:grid;gap:8px}
.ach-item{display:flex;gap:10px;align-items:center;background:var(--bg);border-radius:16px;padding:8px 10px;opacity:.7}
.ach-item.got{background:var(--sun-l);opacity:1}
.ach-ic{width:36px;height:36px;border-radius:12px;background:#fff;display:grid;place-items:center;flex:none;color:var(--muted)}
.ach-ic .ic{width:24px;height:24px}
.ach-item b{display:block;font-size:.95rem}
.ach-item small{color:var(--ink2);font-weight:700}
.set-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:2px solid var(--bg);flex-wrap:wrap}
.set-row:last-child{border-bottom:0}
.set-ic{width:36px;height:36px;border-radius:12px;background:var(--bg);display:grid;place-items:center;flex:none}
.set-ic .ic{width:22px;height:22px}
.set-t{flex:1;min-width:120px}
.set-t b{display:block}
.set-t small{color:var(--muted);font-weight:700}
.switch{position:relative;width:58px;height:34px;border-radius:999px;border:0;background:var(--lock-d);flex:none;transition:background .2s}
.switch i{position:absolute;left:4px;top:4px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.15);transition:transform .3s var(--spring)}
.switch[aria-checked="true"]{background:var(--teal)}
.switch[aria-checked="true"] i{transform:translateX(24px)}
.switch[aria-checked="true"] i::after{content:"\2713";position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:14px;color:var(--teal-d)}
.notice{display:flex;gap:10px;background:var(--sun-l);border:2px solid var(--sun);border-radius:18px;padding:12px 14px;font-weight:700;margin-bottom:12px}
.notice .ic{width:24px;height:24px}
.about{display:flex;gap:12px;align-items:center}
.about-c{width:60px;flex:none}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sgrid .pbtn{font-size:.8rem;padding:10px 6px;text-transform:none;letter-spacing:0}
.menu-list{display:grid;gap:10px}
.menu-item{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--line);border-radius:20px;padding:14px;text-align:left;box-shadow:0 4px 0 var(--line)}
.menu-item span{flex:1}
.menu-item small{display:block;color:var(--muted);font-weight:700}
.menu-item .ic{width:24px;height:24px}
.lbl{display:block;font-weight:900;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin:12px 2px 6px}
.text-in{width:100%;font-weight:800;font-size:1.1rem;border:2px solid var(--line);border-radius:16px;padding:12px 14px;background:#fff;color:var(--ink);outline:none;box-shadow:0 3px 0 var(--line)}
.text-in:focus{border-color:var(--sky);box-shadow:0 0 0 3px var(--sky-l)}

/* ---------- ONBOARDING ---------- */
.onboarding{background:linear-gradient(180deg,var(--cream),var(--sun-l))}
.ob-scroll{padding-top:max(20px,env(safe-area-inset-top))}
.ob-page{max-width:440px;margin:0 auto}
.ob-brand{text-align:center;margin:4px 0 6px}
.ob-logo{font-family:var(--f-disp);font-weight:800;font-size:2.2rem;color:var(--tang-d);text-shadow:0 3px 0 #fff}
.ob-hero{display:grid;place-items:center}
.ob-curlo{width:190px;cursor:pointer}
.ob-say{margin:16px 0 14px;text-align:center;min-height:84px;font-size:1.05rem}
.ob-dots{display:flex;justify-content:center;gap:6px;margin-bottom:12px}
.ob-dots i{width:10px;height:10px;border-radius:50%;background:var(--lock-d);transition:transform .3s var(--spring),background .2s}
.ob-dots i.on{background:var(--tang);transform:scale(1.2)}
.ob-page h2{margin:2px 0 8px}
.ob-preview{width:140px;margin:6px auto}
.ob-preview.small{width:110px}
.variant-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.variant{background:#fff;border:2px solid var(--line);border-radius:16px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 3px 0 var(--line)}
.variant.on{border-color:var(--tang);box-shadow:0 3px 0 var(--tang);background:var(--tang-l)}
.vsw{width:30px;height:30px;border-radius:50%;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.variant small{font-weight:800;font-size:.7rem;line-height:1.1;text-align:center}
.goal-grid{display:grid;gap:10px;margin:12px 0 16px}
.goal-card{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:14px;align-items:center;text-align:left;background:#fff;border:2px solid var(--line);border-radius:20px;padding:14px 16px;box-shadow:0 4px 0 var(--line);transition:transform .15s var(--spring)}
.goal-card b{grid-row:1/3;font-family:var(--f-disp);font-size:1.5rem;color:var(--tang-d);min-width:80px}
.goal-card span{font-weight:900}
.goal-card small{color:var(--muted);font-weight:700}
.goal-card.on{border-color:var(--tang);background:var(--tang-l);box-shadow:0 4px 0 var(--tang)}
.ob-page .row{margin-top:14px}
.place-intro{text-align:center}
.place-res .pr-ic .ic{width:70px;height:70px}

/* ---------- reduced motion ---------- */
.rm *,.rm *::before,.rm *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.12s!important;transition-timing-function:ease!important}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.12s!important;transition-timing-function:ease!important}
}
@media (max-width:370px){
  .exec{grid-template-columns:1fr}
  .vars{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
  .stat{grid-template-columns:78px 1fr 38px}
  .opts{grid-template-columns:1fr}
  .intro{padding-right:92px}.intro .mini{width:96px}
  .qhead .mini{width:62px}
  .tab{font-size:.68rem}.tab .ti{width:38px}
  .xpnum{min-width:64px}
  .nlabel{max-width:110px;font-size:.8rem}
}

/* ---------- header toggles: icon morphs into an X while its panel is open ---------- */
.ibtn.morph{position:relative;overflow:hidden}
.ibtn.morph svg{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;transition:transform .35s var(--spring),opacity .2s}
.ibtn.morph .ic-x{opacity:0;transform:rotate(-90deg) scale(.4)}
.ibtn.morph.is-open{background:var(--tang-l);border-color:var(--tang);box-shadow:0 3px 0 var(--tang)}
.ibtn.morph.is-open .ic-main{opacity:0;transform:rotate(90deg) scale(.4)}
.ibtn.morph.is-open .ic-x{opacity:1;transform:none}

/* ---------- View Transitions (bottom-tab switches) ---------- */
::view-transition-old(root),::view-transition-new(root){animation:none}
::view-transition-group(ch-screen){animation-duration:.4s;animation-timing-function:cubic-bezier(.22,.9,.3,1.05)}
::view-transition-image-pair(ch-screen){overflow:hidden}
::view-transition-old(ch-screen){animation:vt-out .24s cubic-bezier(.5,0,.75,0) both}
::view-transition-new(ch-screen){animation:vt-in .4s cubic-bezier(.22,.9,.3,1.05) both}
html[data-vt=back]::view-transition-old(ch-screen){animation-name:vt-out-back}
html[data-vt=back]::view-transition-new(ch-screen){animation-name:vt-in-back}
@keyframes vt-out{to{transform:translateX(-18%) scale(.94);opacity:0}}
@keyframes vt-in{from{transform:translateX(26%) scale(.97);opacity:0}70%{transform:translateX(-1.2%) scale(1);opacity:1}}
@keyframes vt-out-back{to{transform:translateX(18%) scale(.94);opacity:0}}
@keyframes vt-in-back{from{transform:translateX(-26%) scale(.97);opacity:0}70%{transform:translateX(1.2%) scale(1);opacity:1}}

/* ---------- hearts ---------- */
.hclock-row{display:flex;align-items:center;justify-content:center;gap:6px;font-weight:900;font-size:1.05rem;margin:4px 0 8px}
.hclock-row .ic{width:22px;height:22px}
.hclock{font-variant-numeric:tabular-nums;color:var(--coral-d);background:var(--coral-l);border-radius:10px;padding:1px 8px}
.heart-rules{list-style:none;padding:0;margin:4px 0 14px;display:grid;gap:8px}
.heart-rules li{display:flex;gap:10px;align-items:center;background:var(--bg);border-radius:14px;padding:8px 12px;font-weight:700;font-size:.95rem}
.heart-rules .ic{width:22px;height:22px;color:var(--ink2)}

/* ---------- sheets / dialogs: drag handle ---------- */
.sheet .grab{width:56px;height:6px;cursor:grab;position:relative}
.sheet .grab::before{content:"";position:absolute;inset:-12px -20px}
.sheet h3,.dlg h3,.dlg-curlo{cursor:grab}

/* ---------- boss dramatic entrance ---------- */
.boss-dim{position:absolute;inset:0;z-index:20;background:rgba(26,20,48,.88);display:grid;place-items:center;cursor:pointer}
.bd-card{text-align:center;background:var(--coral-d);color:#fff;border-radius:26px;padding:18px 26px;box-shadow:0 8px 0 #9E1F35,0 0 60px rgba(255,90,112,.5)}
.bd-card small{display:block;font-weight:900;letter-spacing:.14em;text-transform:uppercase;font-size:.8rem;color:var(--sun)}
.bd-card b{font-family:var(--f-disp);font-weight:800;font-size:2rem;line-height:1.05}
.lvl-in{max-width:min(360px,100%)}
.lvl-in .t2,.bubble,.rpick,.rshort,.hint,.accepted{overflow-wrap:anywhere}
</style>
</head>

  <div class="hud" id="hud" aria-label="Player status"></div>

  <main class="stage" id="stage" tabindex="-1">
    <div class="splash" id="splash" aria-hidden="true"><div class="splash-dot"></div></div>
  </main>

  <nav class="tabs" aria-label="Main">
    <button class="tab" data-go="map"><span class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20c3-1 3-5 8-6s5-5 8-8"/><circle cx="20" cy="6" r="2" fill="currentColor"/><circle cx="4" cy="20" r="2" fill="currentColor"/></svg></span>Map</button>
    <button class="tab" data-go="buddy"><span class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><rect x="6" y="4" width="12" height="16" rx="6"/><circle cx="10" cy="11" r="1.2" fill="currentColor"/><circle cx="14" cy="11" r="1.2" fill="currentColor"/><path d="M3 8c-1 2-1 6 0 8M21 8c1 2 1 6 0 8"/></svg></span>Curlo</button>
    <button class="tab" data-go="practice"><span class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/></svg></span>Practice</button>
    <button class="tab" data-go="vault"><span class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11M9 8h6"/></svg></span>Vault</button>
    <button class="tab" data-go="bestiary"><span class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" aria-hidden="true"><ellipse cx="12" cy="14" rx="5.5" ry="6.5"/><path d="M12 8v12M6.5 11H3M21 11h-3.5M6.5 16H3.5M20.5 16H17.5M9 6L7 3.5M15 6l2-2.5"/></svg></span>Bestiary</button>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="flash" id="flash" aria-hidden="true"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>
  <div id="overlay-root"></div>
</div>

  /** HTML-escape any value. */
  U.esc = function (s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  };

  /** Create an element from an HTML string (first element child). */
  U.h = function (html) {
    var t = document.createElement('template');
    t.innerHTML = String(html).trim();
    return t.content.firstElementChild;
  };

  /** Markdown-lite used by content: `code` and **bold** only (input is escaped first). */
  U.md = function (s) {
    var out = U.esc(s);
    out = out.replace(/`([^`]+)`/g, function (_, c) { return '<code class="i">' + c + '</code>'; });
    out = out.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    return out;
  };

  U.clamp = function (v, a, b) { return Math.max(a, Math.min(b, v)); };
  U.rand = function (n) { return Math.floor(Math.random() * n); };
  U.pick = function (arr) { return arr[U.rand(arr.length)]; };

  /** Fisher–Yates shuffle (returns a new array). Optional seeded rng. */
  U.shuffle = function (arr, rng) {
    var a = arr.slice(), r = rng || Math.random;
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(r() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  };

  /** Deterministic PRNG (mulberry32) from a string seed. */
  U.seeded = function (seedStr) {
    var s = U.hash(seedStr);
    return function () {
      s |= 0; s = (s + 0x6D2B79F5) | 0;
      var t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };

  /** 32-bit FNV-1a hash of a string. */
  U.hash = function (str) {
    var h = 0x811c9dc5;
    str = String(str);
    for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); }
    return h >>> 0;
  };

  U.isoNow = function () { return new Date().toISOString(); };

  /** Local calendar day "YYYY-MM-DD". */
  U.dayStr = function (d) {
    d = d || new Date();
    var m = d.getMonth() + 1, day = d.getDate();
    return d.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (day < 10 ? '0' : '') + day;
  };

  /** Whole days from day string a to day string b (b - a). */
  U.dayDiff = function (a, b) {
    if (!a || !b) return Infinity;
    var pa = a.split('-').map(Number), pb = b.split('-').map(Number);
    var ta = Date.UTC(pa[0], pa[1] - 1, pa[2]), tb = Date.UTC(pb[0], pb[1] - 1, pb[2]);
    return Math.round((tb - ta) / 86400000);
  };

  U.plural = function (n, one, many) { return n + ' ' + (n === 1 ? one : (many || one + 's')); };

  /** Format seconds as "1h 05m", "12m", "45s". */
  U.fmtDuration = function (sec) {
    sec = Math.max(0, Math.round(sec || 0));
    var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
    if (h) return h + 'h ' + (m < 10 ? '0' : '') + m + 'm';
    if (m) return m + 'm';
    return sec + 's';
  };

  /** "mm:ss" */
  U.fmtClock = function (sec) {
    sec = Math.max(0, Math.ceil(sec));
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  };

  U.debounce = function (fn, ms) {
    var t;
    return function () {
      var a = arguments, self = this;
      clearTimeout(t);
      t = setTimeout(function () { fn.apply(self, a); }, ms);
    };
  };

  /** Plain setTimeout promise (NOT motion-aware; see CH.fx.pause for that). */
  U.sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };

  /** Deep clone of JSON-able data. */
  U.clone = function (o) { return JSON.parse(JSON.stringify(o)); };

  /** Is `o` a plain object? */
  U.isObj = function (o) { return !!o && typeof o === 'object' && !Array.isArray(o); };

  /** Show visible glyphs for whitespace in exact-output answers: ␣ for spaces, ↵ for \n, → for tabs. */
  U.visibleWS = function (s) {
    return U.esc(s)
      .replace(/ /g, '<span class="ws">␣</span>')
      .replace(/\t/g, '<span class="ws">→</span>')
      .replace(/\n/g, '<span class="ws">↵</span><br>');
  };

  /** Stable unique id for DOM (aria) references. */
  var uidN = 0;
  U.uid = function (p) { return (p || 'ch') + '-' + (++uidN); };

  /* ======================================================================
     Event bus
     ====================================================================== */
  var handlers = {};
  CH.events = {
    /** Subscribe; returns an unsubscribe function. */
    on: function (evt, fn) {
      (handlers[evt] = handlers[evt] || []).push(fn);
      return function () { CH.events.off(evt, fn); };
    },
    off: function (evt, fn) {
      var l = handlers[evt];
      if (l) handlers[evt] = l.filter(function (f) { return f !== fn; });
    },
    emit: function (evt, data) {
      (handlers[evt] || []).slice().forEach(function (fn) {
        try { fn(data, evt); } catch (e) { console.error('[CH.events] handler for', evt, 'failed', e); }
      });
      (handlers['*'] || []).slice().forEach(function (fn) {
        try { fn(data, evt); } catch (e) { console.error(e); }
      });
    }
  };
})();
</script>
<script>
/* engine/store.js */
/* ==========================================================================
   Cpp Hero — engine/store.js
   Versioned save: load / save / migrate / validate / export / import / reset.
   Every storage access is wrapped in try/catch. If localStorage is unavailable
   (private mode, sandboxed iframe, file:// quirks, quota) we keep the state in
   memory and show a small notice.
   Save format: see docs/ARCHITECTURE.md ("Save format"). Keep it stable.
   ========================================================================== */
(function () {
  'use strict';
  var CH = window.CH, U = CH.util;

  var KEY = 'cpphero.save';
  var SAVE_VERSION = 1;

  /** Fresh default save. */
  function defaults() {
    var now = U.isoNow();
    return {
      v: SAVE_VERSION,
      createdAt: now, updatedAt: now,
      profile: { name: 'Curlo', variant: 'classic', dailyGoalMin: 10, onboarded: false, placementDone: false },
      settings: { sound: true, music: false, reduceMotion: false, textSize: 'm' },
      xp: 0, level: 1,
      hearts: { n: 5, max: 5, lastRefill: now },
      streak: { days: 0, lastDay: '', freezes: 0, best: 0 },
      daily: { day: '', minutes: 0, quests: [] },
      stats: { logic: 0, structure: 0, memory: 0, toolkit: 0, defense: 0 },
      lessons: {},
      projects: {},
      bosses: {},
      worldsUnlocked: ['w1'],
      srs: {},
      vault: [],
      bestiary: [],
      achievements: {},
      cosmetics: { owned: ['classic'], equipped: { hat: null, color: 'classic', shield: null } },
      counters: { correct: 0, wrong: 0, bestCombo: 0, hardened: 0, reviews: 0, secondsPlayed: 0, byTag: {} }
    };
  }

  /**
   * Fill missing keys from defaults (recursively for plain objects) so a save
   * written by an older build (or hand-edited) still has every field.
   * Values present in `obj` always win; types that don't match are replaced.
   */
  function fillDefaults(obj, def) {
    Object.keys(def).forEach(function (k) {
      var dv = def[k], ov = obj[k];
      if (ov === undefined || ov === null && dv !== null) { obj[k] = U.clone(dv === undefined ? null : dv); return; }
      if (U.isObj(dv)) {
        if (!U.isObj(ov)) { obj[k] = U.clone(dv); return; }
        // Maps keyed by id (lessons, srs, ...) have empty defaults: keep as is.
        if (Object.keys(dv).length) fillDefaults(ov, dv);
      } else if (Array.isArray(dv)) {
        if (!Array.isArray(ov)) obj[k] = U.clone(dv);
      } else if (typeof dv !== typeof ov && dv !== null) {
        obj[k] = dv;
      }
    });
    return obj;
  }

  /**
   * Upgrade older saves step by step. Add a case per version bump:
   *   if (s.v === 1) { ...transform to v2...; s.v = 2; }
   */
  function migrate(s) {
    if (!U.isObj(s)) throw new Error('Save is not an object');
    if (typeof s.v !== 'number') s.v = 1;           // pre-versioned saves = v1 shape
    if (s.v > SAVE_VERSION) throw new Error('This save comes from a newer version of Cpp Hero (v' + s.v + ').');
    // (No migrations yet: v1 is the first format.)
    fillDefaults(s, defaults());
    // Sanity clamps.
    s.hearts.max = U.clamp(+s.hearts.max || 5, 1, 10);
    s.hearts.n = U.clamp(+s.hearts.n || 0, 0, s.hearts.max);
    Object.keys(s.stats).forEach(function (k) { s.stats[k] = U.clamp(+s.stats[k] || 0, 0, 100); });
    if (['s', 'm', 'l'].indexOf(s.settings.textSize) < 0) s.settings.textSize = 'm';
    if (s.worldsUnlocked.indexOf('w1') < 0) s.worldsUnlocked.unshift('w1');
    if (s.cosmetics.owned.indexOf('classic') < 0) s.cosmetics.owned.unshift('classic');
    if (!U.isObj(s.cosmetics.equipped)) s.cosmetics.equipped = { hat: null, color: 'classic', shield: null };
    s.xp = Math.max(0, Math.round(+s.xp || 0));
    // Level is derived from XP (keeps imported / hand-edited saves consistent).
    if (CH.game && CH.game.levelInfo) s.level = CH.game.levelInfo(s.xp).level;
    s.v = SAVE_VERSION;
    return s;
  }

  /** Light shape validation for imported files. Throws with a friendly message. */
  function validate(o) {
    if (!U.isObj(o)) throw new Error('That file isn’t a Cpp Hero save.');
    if (typeof o.v !== 'number') throw new Error('Missing save version (v).');
    if (!U.isObj(o.profile) || !U.isObj(o.settings)) throw new Error('The save is missing profile or settings.');
    if (o.lessons != null && !U.isObj(o.lessons)) throw new Error('Lessons data is malformed.');
    if (o.worldsUnlocked != null && !Array.isArray(o.worldsUnlocked)) throw new Error('worldsUnlocked is malformed.');
    return true;
  }

  /* ---------------- persistence ---------------- */
  var persistent = true;   // false once a storage operation failed
  var noticeShown = false;

  function storageOK() {
    try {
      var k = '__ch_probe__';
      window.localStorage.setItem(k, '1');
      window.localStorage.removeItem(k);
      return true;
    } catch (e) { return false; }
  }

  function readRaw() {
    try { return window.localStorage.getItem(KEY); } catch (e) { persistent = false; return null; }
  }

  function writeRaw(str) {
    try { window.localStorage.setItem(KEY, str); return true; }
    catch (e) { persistent = false; showNotice(); return false; }
  }

  function showNotice() {
    if (noticeShown) return;
    noticeShown = true;
    CH.events.emit('store.notice', { msg: 'Progress can’t be saved on this device. You can still play, and export your progress from Settings.' });
  }

  var store = (CH.store = {
    KEY: KEY,
    SAVE_VERSION: SAVE_VERSION,
    state: null,
    defaults: defaults,
    migrate: migrate,
    validate: validate,
    get persistent() { return persistent; },

    /** Load (or create) the save. Never throws. */
    load: function () {
      persistent = storageOK();
      var raw = persistent ? readRaw() : null, s = null;
      if (raw) {
        try { s = migrate(JSON.parse(raw)); }
        catch (e) {
          console.warn('[store] save unreadable, starting fresh', e);
          // Keep the broken save around in case the user wants it back.
          try { window.localStorage.setItem(KEY + '.broken', raw); } catch (e2) { /* ignore */ }
          s = null;
        }
      }
      store.state = s || defaults();
      if (!persistent) showNotice();
      return store.state;
    },

    /** Debounced save (coalesces bursts of updates). */
    save: U.debounce(function () { store.saveNow(); }, 250),

    saveNow: function () {
      var s = store.state;
      if (!s) return false;
      s.updatedAt = U.isoNow();
      if (!persistent) { showNotice(); return false; }
      var ok = writeRaw(JSON.stringify(s));
      if (ok) CH.events.emit('store.saved');
      return ok;
    },

    /** Replace the whole state (import / reset). */
    replace: function (s) {
      store.state = migrate(s);
      store.saveNow();
      CH.events.emit('store.replaced', store.state);
    },

    reset: function () {
      try { window.localStorage.removeItem(KEY); } catch (e) { /* ignore */ }
      store.state = defaults();
      store.saveNow();
      CH.events.emit('store.replaced', store.state);
    },

    /**
     * Download the save as a JSON file. Resolves true on success.
     * Inside a claude.ai Artifact, plain downloads are blocked, so use the
     * host's `downloads` capability there; everywhere else Blob + <a download>.
     */
    exportFile: function () {
      var s = store.state;
      s.updatedAt = U.isoNow();
      var json = JSON.stringify(s, null, 2);
      var name = 'cpp-hero-save-' + U.dayStr() + '.json';
      var host = window.claude && typeof window.claude.use === 'function' ? window.claude : null;
      if (host) {
        return host.use('downloads').then(function (dl) {
          if (!dl) return store._anchorDownload(json, name);
          return dl.save({ filename: name, data: json }).then(function () { return true; }, function (e) {
            if (e && e.code === 'declined') return 'declined';
            console.error('[store] export failed', e);
            return false;
          });
        }, function () { return store._anchorDownload(json, name); });
      }
      return Promise.resolve(store._anchorDownload(json, name));
    },

    _anchorDownload: function (json, name) {
      try {
        var blob = new Blob([json], { type: 'application/json' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = name; a.rel = 'noopener';
        document.body.appendChild(a);
        a.click();
        setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1500);
        return true;
      } catch (e) {
        console.error('[store] export failed', e);
        return false;
      }
    },

    /**
     * Read + validate + migrate a user-picked File. Resolves with the migrated
     * save object; the caller confirms (in-app dialog) and then calls replace().
     */
    readImport: function (file) {
      return new Promise(function (resolve, reject) {
        if (!file) return reject(new Error('No file selected.'));
        if (file.size > 5 * 1024 * 1024) return reject(new Error('That file is too big to be a save.'));
        var fr = new FileReader();
        fr.onerror = function () { reject(new Error('Couldn’t read that file.')); };
        fr.onload = function () {
          try {
            var o = JSON.parse(String(fr.result));
            validate(o);
            resolve(migrate(o));
          } catch (e) {
            reject(e instanceof SyntaxError ? new Error('That file isn’t valid JSON.') : e);
          }
        };
        fr.readAsText(file);
      });
    }
  });

  // Flush pending writes when the page is hidden/closed.
  function flush() { try { store.saveNow(); } catch (e) { /* ignore */ } }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') flush(); });
  window.addEventListener('pagehide', flush);
})();
</script>
