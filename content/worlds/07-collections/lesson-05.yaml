# World 7 · Lesson 5: Shield: Stay in bounds (Shield lesson)

id: w7.l5
title: "Shield: Stay in bounds"
skill: defense
shield: true
concept:
  short: "[] never checks, .at() throws. Loop with std::size_t i < size(), and never hold references across push_back."
  analogy: "[] grabs from the shelf blindfolded; .at() looks first and shouts if the slot isn't there."
  body:
    - "**[] doesn't check.** `v[10]` on a 3-element vector is undefined behavior: it may read garbage, corrupt other data, crash, or seem to work perfectly. An index of -1 is just as bad: converted to `std::size_t`, it becomes a gigantic number."
    - "**.at() checks.** `v.at(10)` throws `std::out_of_range` (from `<stdexcept>`), which you can catch: `try { ... } catch (const std::out_of_range&) { ... }`. Uncaught, it stops the program with an error: loud, never silent. (World 12 covers exceptions fully.) Often the best move is to check `i < v.size()` yourself before indexing."
    - "**Loop with the right bounds.** `size()` returns `std::size_t`, which is unsigned. Write `for (std::size_t i = 0; i < v.size(); ++i)`: `<`, never `<=`. An `int i` compared with `size()` triggers World 5's signed/unsigned warning, and `v.size() - 1` on an empty vector wraps around to a huge number. Range-for avoids all of this."
    - "**Empty is special.** `front()`, `back()` and `pop_back()` on an empty vector (or string) are UB. Check `!v.empty()` first."
    - "**Invalidation.** A vector keeps its elements side by side in one block of memory. When push_back runs out of room, the vector moves everything to a bigger block and frees the old one. Every reference, pointer and iterator into the old block now dangles. Keep an **index** and re-read `v[i]` after the push_back, or call `v.reserve(n)` first: no reallocation happens until the size passes n."
    - "**Why std::vector and std::string beat raw arrays.** A C array doesn't remember its size, **decays** to a pointer when passed to a function (so the function can't know where it ends), and a C string like `char name[8]` silently overflows when you copy too much into it. That buffer overflow is behind countless security holes. vector and string track their own size and grow when needed."
    - "**find() and npos.** Compare find's result with `std::string::npos` before using it as an index or position."
    - "UB doesn't guarantee a crash. Out-of-bounds code often passes every test, then corrupts data on another machine, compiler or day."
  pitfall: "Common beginner mistake: `int& first = v[0]; v.push_back(7); first = 5;`. It compiles, often seems to work, and then writes into freed memory the day the vector reallocates."
demo:
  code: |-
    #include <iostream>
    #include <stdexcept>
    #include <vector>

    int main() {
        std::vector<int> hp{10, 20, 30};
        std::size_t i{5};
        if (i < hp.size()) {
            std::cout << hp[i] << '\n';
        } else {
            std::cout << "No slot " << i << '\n';
        }
        try {
            std::cout << hp.at(i) << '\n';
        } catch (const std::out_of_range&) {
            std::cout << "at() caught it!\n";
        }
        std::size_t first{0};
        hp.push_back(40);
        std::cout << hp[first] << '\n';
        return 0;
    }
  steps:
    - line: 5
      vars:
        hp: "[10, 20, 30]"
      note: "Three slots: valid indexes are 0, 1 and 2."
    - line: 6
      vars:
        hp: "[10, 20, 30]"
        i: "5"
      note: Index 5 arrives, maybe straight from user input.
    - line: 8
      crash: "hp[5]: reading past the end!"
      note: "Unchecked, hp[5] is UB: garbage, a crash, or silence."
    - line: 7
      shield: Bounds checked!
      note: "Back to reality: 5 < 3 is false, so [] never runs."
    - line: 10
      out: |
        No slot 5
    - line: 13
      note: ".at(5) checks the index itself and throws."
    - line: 15
      out: |
        at() caught it!
      shield: std::out_of_range caught!
      note: Loud and catchable, never silent garbage.
    - line: 17
      vars:
        hp: "[10, 20, 30]"
        i: "5"
        first: "0"
      note: Remember the first element by INDEX, not by reference.
    - line: 18
      vars:
        hp: "[10, 20, 30, 40]"
        i: "5"
        first: "0"
      crash: "An int& to hp[0] would dangle now!"
      note: push_back may move every element to new memory.
    - line: 19
      out: |
        10
      shield: Index still valid!
      note: hp[first] finds the element in its new home.
    - line: 20
      note: Done. Every access was checked or known to be in range.
challenges:
  - id: w7.l5.c1
    type: predict
    tags: [ w7.at, w7.bounds ]
    bug: out-of-bounds
    prompt: ".at() meets a bad index. What does this print?"
    code: |-
      #include <iostream>
      #include <stdexcept>
      #include <vector>

      int main() {
          std::vector<int> v{4, 5, 6};
          try {
              std::cout << v.at(1) << ' ';
              std::cout << v.at(3) << ' ';
              std::cout << "done ";
          } catch (const std::out_of_range&) {
              std::cout << "caught";
          }
          std::cout << '\n';
          return 0;
      }
    options:
      - t: |
          5 caught
        why: "Correct: v.at(1) prints 5, v.at(3) throws, and the catch block runs."
      - t: |
          caught
        why: Output printed before the throw stays printed. The 5 is already out.
      - t: "5 0 done \n"
        why: .at() never invents a value for a bad index. It throws.
      - t: |
          4 caught
        why: "Indexes start at 0, so v.at(1) is 5."
    answer: 0
    hints:
      - Valid indexes for 3 elements are 0, 1, 2.
      - "When at() throws, the rest of the try block is skipped."
    short: "at(1) prints 5; at(3) throws, so \"caught\" prints next."
    explain: "v.at(1) is 5 and prints \"5 \". v.at(3) is out of range, so it throws std::out_of_range before printing anything; the rest of the try block (\"done \") is skipped and the catch prints \"caught\". Output: \"5 caught\" and a newline. With v[3] instead, it would be undefined behavior: no guarantee of anything."
  - id: w7.l5.c2
    type: bug
    tags: [ w7.bounds, w5.offbyone, w5.for ]
    bug: out-of-bounds
    unsafe: true
    prompt: "UNSAFE: this sums the damage list but reads past the end. Tap the buggy line, then pick the fix."
    code: |-
      #include <iostream>
      #include <vector>

      int main() {
          std::vector<int> dmg{3, 1, 4};
          int total = 0;
          for (std::size_t i = 0; i <= dmg.size(); ++i) {
              total += dmg[i];
          }
          std::cout << total << '\n';
          return 0;
      }
    bugLine: 6
    options:
      - t: for (std::size_t i = 0; i < dmg.size(); ++i) {
        why: "Correct: i runs 0, 1, 2 and stops before 3."
      - t: for (int i = 0; i <= dmg.size() - 1; ++i) {
        why: "Signed/unsigned warning, and on an empty vector size() - 1 wraps to a huge number."
      - t: for (std::size_t i = 1; i <= dmg.size(); ++i) {
        why: Skips dmg[0] and still reads dmg[3].
      - t: for (std::size_t i = 0; i <= dmg.size(); i++) {
        why: i++ vs ++i changes nothing. Still reads dmg[3].
    answer: 0
    hints:
      - What is dmg[dmg.size()]?
      - "The last valid index is size() - 1, so stop BEFORE size()."
    short: "i < size(), never i <= size(): dmg[3] doesn't exist."
    explain: "With `<=`, the last pass reads dmg[3], one past the end: undefined behavior. It may add garbage, crash, or seem fine, and [] never warns. Use `i < dmg.size()` with std::size_t, or skip indexes entirely: `for (int d : dmg) { total += d; }`."
    sideBySide:
      unsafe: |-
        #include <vector>

        std::vector<int> dmg{3, 1, 4};
        int total = 0;
        for (std::size_t i = 0; i <= dmg.size(); ++i) {   // reads dmg[3]: UB
            total += dmg[i];
        }
      hardened: |-
        #include <vector>

        std::vector<int> dmg{3, 1, 4};
        int total = 0;
        for (int d : dmg) {   // no index, no way off the end
            total += d;
        }
  - id: w7.l5.c3
    type: review
    tags: [ w7.invalidation, w7.empty ]
    bug: iterator-invalidation
    unsafe: true
    prompt: "Code review: tap every dangerous line, then submit."
    code: |-
      #include <iostream>
      #include <string>
      #include <vector>

      int main() {
          std::vector<std::string> team{"Curlo"};
          std::string& leader = team[0];
          team.push_back("Brace");
          std::cout << leader << '\n';
          for (const std::string& name : team) {
              std::cout << name << '\n';
          }
          std::vector<int> scores;
          std::cout << scores.front() << '\n';
          return 0;
      }
    dangerous: [ 8, 13 ]
    lineNotes:
      "6": "A reference into the vector: fine only until the vector reallocates."
      "7": "push_back may move every element. leader now dangles."
      "8": "Reads through a dangling reference: UB."
      "9": "Fine: a read-only loop that changes nothing."
      "13": "front() on an empty vector: UB."
    hints:
      - What can push_back do to existing elements?
      - Does scores have a front?
    short: "A reference held across push_back dangles; front() on empty is UB."
    explain: "push_back may reallocate: the elements move and the old memory is freed, so `leader` refers to freed memory and reading it is undefined behavior. It may print \"Curlo\" today and garbage tomorrow. Keep an index (`std::size_t leader{0};`) and read `team[leader]`. `scores.front()` on an empty vector is also UB: check `!scores.empty()` first."
    sideBySide:
      unsafe: |-
        #include <string>
        #include <vector>

        std::vector<std::string> team{"Curlo"};
        std::string& leader = team[0];
        team.push_back("Brace");         // may reallocate
        std::cout << leader << '\n';     // UB: dangling
        std::vector<int> scores;
        std::cout << scores.front() << '\n';   // UB: empty
      hardened: |-
        #include <string>
        #include <vector>

        std::vector<std::string> team{"Curlo"};
        std::size_t leader{0};           // an index survives reallocation
        team.push_back("Brace");
        std::cout << team[leader] << '\n';
        std::vector<int> scores;
        if (!scores.empty()) {
            std::cout << scores.front() << '\n';
        }
  - id: w7.l5.c4
    type: harden
    tags: [ w7.bounds, w5.signed-unsigned, w3.validate ]
    bug: out-of-bounds
    prompt: "The player picks a slot. Pick the check that blocks every bad index."
    code: |-
      #include <iostream>
      #include <string>
      #include <vector>

      int main() {
          std::vector<std::string> items{"sword", "shield", "potion"};
          int pick{};
          std::cout << "Slot: ";
          if (!(std::cin >> pick) || ___) {
              std::cout << "No such slot!\n";
              return 1;
          }
          std::cout << items[static_cast<std::size_t>(pick)] << '\n';
          return 0;
      }
    options:
      - t: pick < 0 || static_cast<std::size_t>(pick) >= items.size()
        why: "Correct: rejects negatives first, then anything at or past size(). Only 0, 1, 2 get through."
      - t: pick > static_cast<int>(items.size())
        why: "Off by one: 3 gets through (items[3] is past the end), and so does -1."
      - t: pick < 0
        why: Blocks -1, but 3 or 99 still read past the end.
      - t: pick > 2
        why: Hardcoded, so it breaks when the list changes, and -1 still gets through.
    answer: 0
    hints:
      - Bad indexes can be too small AND too big.
      - Check for negatives before converting to std::size_t.
    short: "Block both ends: pick < 0, or pick >= size()."
    explain: "A valid index is 0 to size() - 1. Check `pick < 0` first (converted to std::size_t, -1 becomes a huge number), then compare the converted value with size(). The explicit cast also avoids World 5's signed/unsigned warning."
    sideBySide:
      unsafe: |-
        #include <string>
        #include <vector>

        std::vector<std::string> items{"sword", "shield", "potion"};
        std::cin >> pick;
        std::cout << items[static_cast<std::size_t>(pick)] << '\n';   // -1 or 3: UB
      hardened: |-
        #include <string>
        #include <vector>

        std::vector<std::string> items{"sword", "shield", "potion"};
        if (!(std::cin >> pick) || pick < 0 ||
            static_cast<std::size_t>(pick) >= items.size()) {
            std::cout << "No such slot!\n";
            return 1;
        }
        std::cout << items[static_cast<std::size_t>(pick)] << '\n';
      prelude: int pick{};
  - id: w7.l5.c5
    type: breakit
    tags: [ w7.invalidation, w7.reserve, w5.for ]
    bug: iterator-invalidation
    unsafe: true
    prompt: "UNSAFE: room for 4 is reserved, then a reference is held while pushing n more. Which n can break it?"
    code: |-
      #include <iostream>
      #include <vector>

      int main() {
          std::vector<int> v;
          v.reserve(4);
          v.push_back(1);
          int& first = v[0];
          int n{};
          std::cin >> n;
          for (int k = 0; k < n; ++k) {
              v.push_back(k);
          }
          first = 99;
          std::cout << v[0] << '\n';
          return 0;
      }
    options:
      - t: "4"
        why: "Correct: size becomes 5, past the reserved 4, so push_back may reallocate and first dangles."
      - t: "3"
        why: Size reaches exactly 4. reserve(4) guarantees no reallocation up to 4.
      - t: "0"
        why: Nothing is pushed, so first stays valid.
      - t: "-2"
        why: The loop never runs (0 < -2 is false). Nothing moves.
    answer: 0
    hints:
      - reserve(4) promises room for at least 4 elements.
      - "1 element is already inside. How many more fit?"
    short: "Pushing past the reserved room can reallocate: first dangles."
    explain: "reserve(4) guarantees no reallocation while size stays at 4 or less. With n = 4 the size reaches 5, so push_back may move the elements and `first` refers to freed memory. Writing 99 through it is undefined behavior: it might corrupt memory silently. Safest fix: keep an index and write `v[0] = 99;` after the loop."
    sideBySide:
      unsafe: |-
        #include <vector>

        std::vector<int> v;
        v.reserve(4);
        v.push_back(1);
        int& first = v[0];
        for (int k = 0; k < n; ++k) {
            v.push_back(k);   // n >= 4: may reallocate
        }
        first = 99;           // UB if it did
      hardened: |-
        #include <vector>

        std::vector<int> v;
        v.push_back(1);
        std::size_t first{0};   // an index, not a reference
        for (int k = 0; k < n; ++k) {
            v.push_back(k);
        }
        v[first] = 99;          // always the current element 0
      prelude: int n{4};
  - id: w7.l5.c6
    type: safe
    tags: [ w7.bounds, w7.npos, w7.empty, w7.invalidation ]
    prompt: Safe or unsafe? The Overflow Blob's minions are leaking in. Go fast!
    seconds: 30
    items:
      - code: |-
          for (std::size_t i = 0; i < s.size(); ++i) {
              std::cout << s[i];
          }
        prelude: std::string s{"hi"};
        safe: true
        why: "i stops before size(): every index is valid."
      - code: |-
          std::string s;
          char last = s.back();
        safe: false
        why: back() on an empty string is UB.
      - code: |-
          if (!s.empty()) {
              std::cout << s.back();
          }
        prelude: std::string s{"hi"};
        safe: true
        why: Checked for empty before calling back().
      - code: |-
          std::size_t p = s.find('!');
          std::cout << s[p];
        prelude: std::string s{"hi"};
        safe: false
        why: "No '!' means p is npos: a gigantic index. UB."
      - code: |-
          std::size_t p = s.find('!');
          if (p != std::string::npos) {
              std::cout << s.substr(p);
          }
        prelude: std::string s{"hi!"};
        safe: true
        why: find's result is checked against npos before use.
      - code: |-
          #include <vector>

          std::vector<int> v{1, 2};
          int& r = v[0];
          v.push_back(3);
          r = 7;
        safe: false
        why: push_back may reallocate, so r dangles. Writing through it is UB.
      - code: |-
          int a[3]{};
          for (int i = 0; i <= 3; ++i) {
              a[i] = i;
          }
        safe: false
        why: "i reaches 3: writes one past the end of a C array. UB."
      - code: |-
          std::string name{"Curlo"};
          name += " the Brave";
        safe: true
        why: std::string grows as needed. No buffer to overflow.
    hints:
      - "Look for indexes that can reach size(), or npos."
      - Look for references held across push_back, and empty front/back.
    short: Safe code checks bounds, npos and empty before touching elements.
    explain: "Safe code keeps every index below size(), checks find() against npos, checks empty() before front()/back(), and never keeps a reference into a vector across push_back. std::string and std::vector grow by themselves; raw arrays don't."
recap:
  - "[] is unchecked (UB); .at() throws std::out_of_range."
  - "Loop std::size_t i < size(), or use range-for."
  - "Check empty() before front(), back(), pop_back()."
  - "push_back can move elements: keep indexes, not references."
vault:
  - id: w7.bounds-check
    title: Check the index (or use .at())
    code: |-
      #include <stdexcept>
      #include <vector>

      std::vector<int> v{10, 20, 30};
      if (i < v.size()) {
          std::cout << v[i] << '\n';   // known to be in range
      }
      try {
          std::cout << v.at(i) << '\n';   // checks for you
      } catch (const std::out_of_range&) {
          std::cout << "Bad index\n";
      }
    prelude: std::size_t i{5};
    note: "v[i] out of range is UB, even for i = -1 (it becomes huge). at() throws instead."
    defense: true
  - id: w7.safe-loop
    title: Loop within bounds
    code: |-
      #include <vector>

      std::vector<int> v{3, 1, 4};
      for (std::size_t i = 0; i < v.size(); ++i) {   // <, never <=
          std::cout << v[i] << '\n';
      }
      for (int x : v) {   // even better: no index at all
          std::cout << x << '\n';
      }
      if (!v.empty()) {
          std::cout << v.back() << '\n';   // front/back need a non-empty vector
      }
    note: size() is std::size_t. size() - 1 on an empty vector wraps to a huge number.
    defense: true
  - id: w7.no-dangling
    title: Don't hold references across push_back
    code: |-
      #include <vector>

      std::vector<int> v{1};
      std::size_t first{0};   // an index survives reallocation
      v.push_back(2);
      v[first] = 99;

      std::vector<int> w;
      w.reserve(10);          // or: reserve room up front
      w.push_back(1);
      int& r = w[0];          // valid until size passes 10
      w.push_back(2);
      r = 5;
    note: "push_back may move every element. References, pointers and iterators into the old memory dangle."
    defense: true
  - id: w7.npos-guard
    title: Check find() against npos
    code: |-
      std::string tag{"hero#42"};
      std::size_t hash = tag.find('#');
      if (hash != std::string::npos) {
          std::cout << tag.substr(hash + 1) << '\n';   // "42"
      }
    note: "npos is the largest std::size_t, not -1 or 0. Never use it as an index."
    defense: true
