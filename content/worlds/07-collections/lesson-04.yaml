# World 7 · Lesson 4: String toolkit (std::string operations)

id: w7.l4
title: String toolkit
skill: toolkit
shield: false
concept:
  short: "A std::string is a row of chars with tools: size, substr, find, += and comparisons."
  analogy: "A string is a bead necklace: each char is a bead with a numbered spot, starting at 0."
  body:
    - "`s.size()` (same as `s.length()`) counts the characters. `s[0]` is the first char and `s.back()` the last (on a non-empty string only!)."
    - "`s += \"!\";` appends text, and `s += 'x';` appends one char. `a + b` makes a new, joined string."
    - "`s.substr(pos, len)` copies up to len chars starting at index pos: for `std::string s{\"dragon\"};`, `s.substr(0, 4)` is `\"drag\"`. Leave out len to take the rest: `s.substr(4)` is `\"on\"`. A pos past the end throws `std::out_of_range`."
    - "`s.find(\"gon\")` returns the index where the match starts (3 here), or `std::string::npos` when there's no match. npos is the biggest possible `std::size_t`, NOT -1 or 0, so always compare the result with npos before using it."
    - "`==`, `!=`, `<` and `>` compare strings by content, char by char, like a dictionary that goes by char codes: every uppercase letter comes before every lowercase one, so `\"Zeta\" < \"alpha\"` is true."
    - "Walk the chars with range-for: `for (char c : s)` reads them, `for (char& c : s)` can change them in place."
  pitfall: "Common beginner mistake: `if (s.find(\"x\"))` as a yes/no test. A match at index 0 counts as false, and no match (npos) counts as true: exactly backwards. Write `if (s.find(\"x\") != std::string::npos)`."
demo:
  code: |-
    #include <iostream>
    #include <string>

    int main() {
        std::string name{"dragon"};
        std::cout << name.size() << '\n';
        std::cout << name.substr(0, 4) << '\n';
        std::cout << name.find("gon") << '\n';
        name += "fly";
        std::cout << name << '\n';
        if (name.find('x') == std::string::npos) {
            std::cout << "no x\n";
        }
        return 0;
    }
  steps:
    - line: 4
      vars:
        name: '"dragon"'
      note: "Six chars at indexes 0 to 5."
    - line: 5
      out: |
        6
      note: size() counts the characters.
    - line: 6
      out: |
        drag
      note: "substr(0, 4): four chars starting at index 0."
    - line: 7
      out: |
        3
      note: "\"gon\" starts at index 3: d-r-a-g-o-n."
    - line: 8
      vars:
        name: '"dragonfly"'
      note: "+= appends. The string grows by itself."
    - line: 9
      out: |
        dragonfly
    - line: 10
      note: "No x anywhere, so find returns npos."
    - line: 11
      out: |
        no x
      note: Always compare find's answer with npos.
    - line: 13
      note: Done. Strings track their own size, always.
challenges:
  - id: w7.l4.c1
    type: predict
    tags: [ w7.substr ]
    prompt: What does this print?
    code: |-
      #include <iostream>
      #include <string>

      int main() {
          std::string spell{"Fireball"};
          std::cout << spell.substr(4) << ' ' << spell.substr(0, 2) << '\n';
          return 0;
      }
    options:
      - t: |
          ball Fi
        why: "Correct: from index 4 to the end is \"ball\"; two chars from index 0 is \"Fi\"."
      - t: |
          eball Fi
        why: That counts from 1. Index 4 is the fifth char, 'b'.
      - t: |
          ball Fir
        why: The second number is a LENGTH (2 chars), not an end index.
      - t: |
          Fire Fi
        why: substr(4) STARTS at index 4 and takes the rest.
    answer: 0
    hints:
      - "F-i-r-e are indexes 0 to 3."
      - substr(pos, len) takes len chars. No len means "to the end".
    short: "substr(4) is \"ball\"; substr(0, 2) is \"Fi\"."
    explain: "Indexes: F0 i1 r2 e3 b4 a5 l6 l7. substr(4) starts at 'b' and takes the rest: \"ball\". substr(0, 2) takes 2 chars from index 0: \"Fi\". Output: \"ball Fi\" and a newline."
  - id: w7.l4.c2
    type: mcq
    tags: [ w7.find, w7.npos ]
    prompt: "`s.find('z')` finds no z. What does it return?"
    options:
      - t: std::string::npos
        why: "Correct: a special std::size_t value that means \"not found\"."
      - t: "-1"
        why: find returns an unsigned std::size_t, which can't be -1. Compare with npos.
      - t: "0"
        why: "0 means \"found at the very start\". That's a real match."
      - t: s.size()
        why: "Close, but no. The \"not found\" answer is always npos."
    answer: 0
    hints:
      - It's a named constant that lives inside std::string.
      - 0 is a valid index, so it can't mean "not found".
    short: "No match returns std::string::npos. Always compare against it."
    explain: "find returns the match's start index, or std::string::npos (the largest std::size_t) when there's no match. Not -1, not 0: index 0 is a real match at the start."
  - id: w7.l4.c3
    type: harden
    tags: [ w7.find, w7.npos, w4.guard ]
    prompt: "Split the user name off an email. Pick the check that catches a missing @."
    code: |-
      #include <iostream>
      #include <string>

      int main() {
          std::string email{"hero_codebase.dev"};
          std::size_t at = email.find('@');
          if (___) {
              std::cout << "No @ in the email!\n";
              return 1;
          }
          std::cout << "User: " << email.substr(0, at) << '\n';
          return 0;
      }
    options:
      - t: at == std::string::npos
        why: "Correct: npos is exactly what find returns when there's no @."
      - t: at == 0
        why: 0 means the @ is the first char. A missing @ gives npos.
      - t: "!at"
        why: "Same as at == 0: it misses npos entirely."
      - t: at < 0
        why: at is an unsigned std::size_t; it's never below 0. Always false.
    answer: 0
    hints:
      - What does find return when nothing matches?
      - std::size_t can never be negative.
    short: "Compare find's answer with std::string::npos before using it."
    explain: "Without the check, `substr(0, npos)` means \"up to the end\", so the program silently prints the whole email as the user name: wrong, with no error. Check `at == std::string::npos` first. `at < 0` can never be true for an unsigned type (g++ -Wextra warns about it)."
    sideBySide:
      unsafe: |-
        std::size_t at = email.find('@');
        std::cout << "User: " << email.substr(0, at) << '\n';   // no @: prints it all
      hardened: |-
        std::size_t at = email.find('@');
        if (at == std::string::npos) {
            std::cout << "No @ in the email!\n";
            return 1;
        }
        std::cout << "User: " << email.substr(0, at) << '\n';
      prelude: std::string email{"hero_codebase.dev"};
  - id: w7.l4.c4
    type: predict
    tags: [ w7.string-chars, w7.range-for, w4.if ]
    prompt: Count the a's. What does this print?
    code: |-
      #include <iostream>
      #include <string>

      int main() {
          std::string word{"banana"};
          int count = 0;
          for (char c : word) {
              if (c == 'a') {
                  ++count;
              }
          }
          std::cout << count << ' ' << word.size() << '\n';
          return 0;
      }
    options:
      - t: |
          3 6
        why: "Correct: b-a-n-a-n-a has three a's and six chars."
      - t: |
          3 7
        why: size() counts only the real chars. No hidden extra is counted.
      - t: |
          2 6
        why: The loop visits every char, including the last 'a'.
      - t: |
          3 5
        why: size() is the count (6). The last INDEX is 5.
    answer: 0
    hints:
      - Range-for visits every char, first to last.
      - size() is a count, not the last index.
    short: "banana has 3 a's and size() 6."
    explain: "The loop checks each of the 6 chars and counts 3 a's. size() is the number of chars, 6 (the last index is 5). Output: \"3 6\" and a newline."
  - id: w7.l4.c5
    type: write
    tags: [ w7.string-append, w3.arith ]
    prompt: "Write one line that adds an exclamation mark to the end of `shout`."
    code: |-
      #include <string>

      std::string shout{"charge"};
      // make shout "charge!":
    accept:
      - shout += "!";
      - shout += '!';
      - shout.push_back('!');
      - shout.append("!");
      - shout = shout + "!";
      - shout = shout + '!';
    placeholder: shout...
    hints:
      - "Strings support a compound operator you know from World 3."
      - "+= works with a string or a single char."
    short: "shout += '!'; appends to the string in place."
    explain: "`shout += \"!\";` or `shout += '!';` appends in place, and the string grows as needed. (`push_back('!')` and `append(\"!\")` work too.) No buffer to overflow, no size to track."
  - id: w7.l4.c6
    type: edge
    tags: [ w7.substr, w7.bounds, w3.getline ]
    bug: out-of-bounds
    unsafe: true
    prompt: "UNSAFE: this drops a word's first 2 chars, then adds its last char. Which inputs expose a bug? Select all."
    code: |-
      #include <iostream>
      #include <string>

      int main() {
          std::string word;
          std::getline(std::cin, word);
          std::string rest = word.substr(2);
          std::cout << rest << word.back() << '\n';
          return 0;
      }
    options:
      - t: an empty line
        why: "Exposes it: substr(2) on \"\" throws std::out_of_range, and back() on empty is UB."
      - t: a
        why: "Exposes it: 2 is past the end of a 1-char string, so substr throws."
      - t: ab
        why: "substr(2) at exactly size() is allowed: rest is \"\", back() is 'b'."
      - t: hello
        why: "Works: rest is \"llo\", back() is 'o'. Prints \"lloo\"."
    answers: [ 0, 1 ]
    hints:
      - "What if the word is shorter than 2 chars?"
      - substr's start may equal size(), but not go past it.
    short: "Words shorter than 2 chars break substr(2) and back()."
    explain: "substr(pos) needs pos <= size(), otherwise it throws std::out_of_range (uncaught, the program stops). back() on an empty string is undefined behavior: it might print garbage or seem fine. Test short and empty inputs, and check the size first."
    sideBySide:
      unsafe: |-
        std::string rest = word.substr(2);          // throws if size < 2
        std::cout << rest << word.back() << '\n';   // UB if empty
      hardened: |-
        if (word.size() < 2) {
            std::cout << "Too short!\n";
            return 1;
        }
        std::string rest = word.substr(2);
        std::cout << rest << word.back() << '\n';
      prelude: std::string word{"hi"};
recap:
  - size() counts chars; indexes run 0 to size - 1.
  - "substr(pos, len) copies len chars from pos."
  - "find returns an index or std::string::npos."
  - "+= appends; ==, < compare by content."
vault:
  - id: w7.string-ops
    title: std::string toolkit
    code: |-
      std::string s{"dragon"};
      std::size_t n = s.size();            // 6
      std::string head = s.substr(0, 4);   // "drag"
      std::string tail = s.substr(4);      // "on"
      std::size_t p = s.find("gon");       // 3
      if (s.find('x') == std::string::npos) {
          // not found
      }
      s += "fly";                          // "dragonfly"
    note: "substr(pos) throws if pos > size(). find says \"not found\" with npos."
    defense: false
