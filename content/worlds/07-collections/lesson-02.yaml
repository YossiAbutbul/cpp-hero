    type: predict
    tags: [ w7.vector, w7.push-back, w7.size ]
    prompt: What does this print?
    code: |-
      #include <iostream>
      #include <vector>

      int main() {
          std::vector<int> v{4, 2};
          v.push_back(6);
          v.push_back(1);
          std::cout << v.size() << ' ' << v[2] << ' ' << v.back() << '\n';
          return 0;
      }
    options:
      - t: |
          4 6 1
        why: "Correct: v is [4, 2, 6, 1]. Four elements, v[2] is the third (6), the last is 1."
      - t: |
          4 2 1
        why: "v[2] is the THIRD element: indexes start at 0."
      - t: |
          2 6 1
        why: size() counts every element, including the two pushed ones.
      - t: |
          4 6 4
        why: back() is the LAST element, not the first.
    answer: 0
    hints:
      - Write out the vector after both push_backs.
      - "v[2] is the third element. back() is the last."
    short: "v becomes [4, 2, 6, 1]: size 4, v[2] is 6, back is 1."
    explain: "push_back appends, so v is [4, 2, 6, 1]. size() is 4, v[2] (the third element) is 6, and back() is 1. Output: \"4 6 1\" and a newline."
  - id: w7.l2.c2
    type: mcq
    tags: [ w7.vector, w2.init ]
    prompt: "What does `std::vector<int> v(5);` hold?"
    options:
      - t: Five zeros
        why: "Correct: parentheses mean \"make 5 elements\", and each one is value-initialized to 0."
      - t: One element, 5
        why: "That's std::vector<int> v{5}; with braces."
      - t: Nothing yet, just room for 5
        why: size() is really 5 here. Reserving room without elements is what reserve() does.
      - t: Five garbage values
        why: A vector always initializes its elements. These are 0s.
    answer: 0
    hints:
      - Parentheses and braces mean different things here.
      - (5) is a count. {5} is a list of values.
    short: "v(5) is five 0s; v{5} is one element, 5."
    explain: "`std::vector<int> v(5);` calls the count constructor: five elements, each 0. `std::vector<int> v{5};` is a list with one element, 5. A vector never holds garbage."
  - id: w7.l2.c3
    type: write
    tags: [ w7.push-back ]
    prompt: "Write one line that adds the value 42 to the end of `scores`."
    code: |-
      #include <vector>

      std::vector<int> scores{10, 20};
      // add 42 to the end of scores:
    accept:
      - scores.push_back(42);
      - scores.emplace_back(42);
    acceptRe:
      - ^scores\.(push|emplace)_back\( ?42 ?\) ?;$
    placeholder: scores...
    hints:
      - "It's a member function: scores.something(42);"
      - The name says it pushes to the back.
    short: "scores.push_back(42); appends 42, making [10, 20, 42]."
    explain: "`scores.push_back(42);` adds 42 after the last element; size goes from 2 to 3. (`emplace_back(42)` works too.) Writing `scores[2] = 42;` would be undefined behavior: slot 2 doesn't exist yet."
  - id: w7.l2.c4
    type: bug
    tags: [ w7.vector, w7.index, w7.push-back ]
    bug: out-of-bounds
    unsafe: true
    prompt: "UNSAFE: this should store 100 in a new vector, but slot 0 doesn't exist. Tap the buggy line, then pick the fix."
    code: |-
      #include <iostream>
      #include <vector>

      int main() {
          std::vector<int> hp;
          hp[0] = 100;
          std::cout << hp.size() << '\n';
          return 0;
      }
    bugLine: 5
    options:
      - t: hp.push_back(100);
        why: "Correct: push_back creates the element. Now size() is 1."
      - t: hp.at(0) = 100;
        why: at() checks, so it throws std::out_of_range instead of UB. It still adds nothing.
      - t: hp.front() = 100;
        why: front() on an empty vector is UB too. There is no front yet.
      - t: hp[1] = 100;
        why: Slot 1 doesn't exist either. Still UB.
    answer: 0
    hints:
      - How many elements does hp have right after it's declared?
      - "[] reaches elements. Which function creates one?"
    short: "[] can't create elements. push_back adds them."
    explain: "An empty vector has no slot 0, so `hp[0] = 100;` writes to memory the vector doesn't own: undefined behavior. It might crash, corrupt something else, or seem to work and print 0. `hp.push_back(100);` actually grows the vector."
    sideBySide:
      unsafe: |-
        #include <vector>

        std::vector<int> hp;
        hp[0] = 100;         // UB: there is no element 0
      hardened: |-
        #include <vector>

        std::vector<int> hp;
        hp.push_back(100);   // size is now 1
