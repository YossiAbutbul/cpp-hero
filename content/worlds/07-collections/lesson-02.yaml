      - Write out v after both pushes.
      - "back() is the last element."
    short: "push_back appends; [2] is the third."
    explain: "push_back appends, so v is [4, 2, 6, 1]. size() is 4, v[2] (the third element) is 6, and back() is 1. Output: \"4 6 1\" and a newline."
  - id: w7.l2.c2
    type: mcq
    tags: [ w7.vector, w2.init ]
    prompt: "What does `std::vector<int> v(5);` hold?"
    options:
      - t: Five zeros
        why: "(5) is a count: five 0s."
      - t: One element, 5
        why: "That's v{5}, with braces."
      - t: Nothing yet, just room for 5
        why: size() really is 5.
      - t: Five garbage values
        why: Vectors never hold garbage.
    answer: 0
    hints:
      - Parentheses, not braces.
      - (5) is a count.
    short: "v(5) is five 0s; v{5} is one 5."
    explain: "`std::vector<int> v(5);` calls the count constructor: five elements, each 0. `std::vector<int> v{5};` is a list with one element, 5. A vector never holds garbage. (Getting spare room without adding elements is what reserve() does, coming in the Shield lesson.)"
  - id: w7.l2.c3
    type: write
    tags: [ w7.push-back ]
    prompt: "Write one line that adds 42 to the end of `scores`."
    code: |-
      #include <vector>

      std::vector<int> scores{10, 20};
      // add 42 to the end of scores:
    accept:
      - scores.push_back(42);
      - scores.emplace_back(42);
    acceptRe:
      - ^scores\.(push|emplace)_back\( ?42 ?\) ?;$
    placeholder: scores...
    hints:
      - "scores.something(42);"
      - It pushes to the back.
    short: "push_back appends: [10, 20, 42]."
    explain: "`scores.push_back(42);` adds 42 after the last element; size goes from 2 to 3. (`emplace_back(42)` works too.) Writing `scores[2] = 42;` would be undefined behavior: slot 2 doesn't exist yet."
  - id: w7.l2.c4
    type: bug
    tags: [ w7.vector, w7.index, w7.push-back ]
    bug: out-of-bounds
    unsafe: true
    prompt: "UNSAFE: this should store 100. Tap the buggy line, pick the fix."
    code: |-
      #include <iostream>
      #include <vector>

      int main() {
          std::vector<int> hp;
          hp[0] = 100;
          std::cout << hp.size() << '\n';
          return 0;
      }
    bugLine: 5
    options:
      - t: hp.push_back(100);
        why: push_back creates the element.
      - t: hp.at(0) = 100;
        why: Throws instead. Still adds nothing.
      - t: hp.front() = 100;
        why: No front yet. Still UB.
      - t: hp[1] = 100;
        why: No slot 1 either. Still UB.
    answer: 0
    hints:
      - How many elements does hp have?
      - "Which function creates an element?"
    short: "[] can't create elements; push_back can."
    explain: "An empty vector has no slot 0, so `hp[0] = 100;` writes to memory the vector doesn't own: undefined behavior. It might crash, corrupt something else, or seem to work and print 0. `hp.at(0)` would throw std::out_of_range instead, which is safer but still adds nothing. `hp.push_back(100);` actually grows the vector."
    sideBySide:
      unsafe: |-
        #include <vector>

        std::vector<int> hp;
        hp[0] = 100;         // UB: there is no element 0
      hardened: |-
        #include <vector>

        std::vector<int> hp;
        hp.push_back(100);   // size is now 1
