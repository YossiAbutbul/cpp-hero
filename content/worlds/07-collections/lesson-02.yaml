  - id: w7.l2.c6
    type: predict
    tags: [ w7.vector, w7.empty, w2.bool ]
    prompt: No spaces are printed between values. What does this print?
    code: |-
      #include <iostream>
      #include <vector>

      int main() {
          std::vector<int> bag{1, 2, 3};
          bag.pop_back();
          std::cout << bag.size() << bag.empty();
          bag.clear();
          std::cout << bag.size() << bag.empty() << '\n';
          return 0;
      }
    options:
      - t: |
          2001
        why: "Correct: after pop_back, size 2 and not empty (0). After clear, size 0 and empty (1)."
      - t: |
          3001
        why: pop_back removes the last element, so the size is 2 first.
      - t: |
          2010
        why: empty() is true AFTER clear(), so the last digit is 1.
      - t: |
          20 01
        why: The code never prints a space between the two lines of output.
    answer: 0
    hints:
      - pop_back removes one element. clear removes all of them.
      - empty() is a bool, printed as 1 or 0.
    short: "pop_back: size 2, not empty. clear: size 0, empty. Prints 2001."
    explain: "After pop_back, bag is [1, 2]: size 2, empty() false (0). After clear, bag is []: size 0, empty() true (1). All four print with no spaces: \"2001\" and a newline."
recap:
  - "push_back adds at the end; size() counts."
  - "[] reaches existing elements; it never creates them."
  - "front()/back(): first and last, non-empty only."
  - "v{5} is one element; v(5) is five 0s."
vault:
  - id: w7.vector
    title: std::vector basics
    code: |-
      #include <vector>

      std::vector<int> v{3, 7};
      v.push_back(9);          // [3, 7, 9]
      int first = v.front();   // 3 (non-empty only!)
      int last = v.back();     // 9
      v.pop_back();            // [3, 7]
      v.clear();               // [], v.empty() is true
    note: "size() is a std::size_t. [] never creates elements: push_back does."
    defense: false
  - id: w7.vector-init
    title: Braces vs parentheses
    code: |-
      #include <vector>

      std::vector<int> a{5};   // one element: 5
      std::vector<int> b(5);   // five 0s
      std::vector<int> c;      // empty, size 0
    note: "{} lists the values; () says how many."
    defense: false
