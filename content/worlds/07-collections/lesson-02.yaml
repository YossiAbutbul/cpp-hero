recap:
  - "push_back adds; size() counts."
  - "[] never creates elements."
  - "front()/back() need a non-empty vector."
  - "v{5} is one 5; v(5) is five 0s."
vault:
  - id: w7.vector
    title: std::vector basics
    code: |-
      #include <vector>

      std::vector<int> v{3, 7};
      v.push_back(9);          // [3, 7, 9]
      int first = v.front();   // 3 (non-empty only!)
      int last = v.back();     // 9
      v.pop_back();            // [3, 7]
      v.clear();               // [], v.empty() is true
    note: "size() is a std::size_t. [] never creates elements: push_back does."
    defense: false
  - id: w7.vector-init
    title: Braces vs parentheses
    code: |-
      #include <vector>

      std::vector<int> a{5};   // one element: 5
      std::vector<int> b(5);   // five 0s
      std::vector<int> c;      // empty, size 0
    note: "{} lists the values; () says how many."
    defense: false
