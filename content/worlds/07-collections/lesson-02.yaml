# World 7 · Lesson 2: Vectors that grow (std::vector)

id: w7.l2
title: Vectors that grow
skill: toolkit
shield: false
concept:
  short: "std::vector is a resizable array: push_back adds to the end, size() counts, [] reaches an element."
  analogy: "A vector is a stretchy backpack: keep stuffing items in and it makes room."
  body:
    - "`#include <vector>`, then `std::vector<int> v{3, 7};` makes a vector holding 3 and 7. `std::vector<std::string> names;` starts empty (size 0), never garbage."
    - "`v.push_back(9);` adds 9 at the end and the vector grows by one. `v.size()` says how many elements there are. Its type is `std::size_t`, an unsigned whole number. `v.empty()` is true when the size is 0."
    - "`v[0]` is the first element and `v[v.size() - 1]` the last. `v.front()` and `v.back()` are shortcuts for those two, but only on a vector that isn't empty!"
    - "`v.pop_back()` removes the last element, and `v.clear()` removes them all (size becomes 0). Both only shrink; neither can fail on a non-empty vector."
    - "Watch the brackets: `std::vector<int> a{5};` is ONE element, 5. `std::vector<int> b(5);` is FIVE zeros. Parentheses call the \"how many\" constructor."
  pitfall: "Common beginner mistake: `v[0] = 5;` on an empty vector. [] never creates elements; it only reaches ones that already exist. Use push_back to grow."
demo:
  code: |-
    #include <iostream>
    #include <vector>

    int main() {
        std::vector<int> v{3, 7};
        v.push_back(9);
        std::cout << v.size() << '\n';
        std::cout << v.front() << ' ' << v.back() << '\n';
        v[1] = 8;
        v.clear();
        std::cout << v.empty() << '\n';
        return 0;
    }
  steps:
    - line: 4
      vars:
        v: "[3, 7]"
      note: Two elements to start with.
    - line: 5
      vars:
        v: "[3, 7, 9]"
      note: push_back adds 9 at the end. The vector grew!
    - line: 6
      out: |
        3
      note: size() counts the elements.
    - line: 7
      out: |
        3 9
      note: front() is the first element, back() the last.
    - line: 8
      vars:
        v: "[3, 8, 9]"
      note: "v[1] is the second element. [] only reaches existing ones."
    - line: 9
      vars:
        v: "[]"
      note: clear() removes everything. Size is now 0.
    - line: 10
      out: |
        1
      note: empty() is true, and bools print as 1.
    - line: 11
      note: Done. The vector cleans up its memory by itself.
challenges:
