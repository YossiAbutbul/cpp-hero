# World 7 · Lesson 1: Rows of boxes (C-style arrays and std::array)

id: w7.l1
title: Rows of boxes
skill: toolkit
shield: false
concept:
  short: An array holds a fixed count of same-type values, indexed from 0.
  analogy: "An egg carton: a fixed number of slots, numbered from 0."
  body:
    - "A **C-style array** is the old way, inherited from C: `int hp[3] = {10, 20, 30};`. Its size is fixed when you write the code. The elements are `hp[0]`, `hp[1]` and `hp[2]`: the first index is 0 and the last is size minus 1."
    - "C-style arrays have sharp edges. They don't remember their size once you pass them to a function (they **decay** to a pointer), you can't copy one with `=`, and `hp[3]` is not checked at all. The Shield lesson shows why that's dangerous."
    - "**std::array** (`#include <array>`) is the modern fixed-size array: `std::array<int, 3> hp{10, 20, 30};`. The type says what it holds and how many. It's just as fast, but it knows its size (`hp.size()`), can be copied and compared, and has `.at()` for checked access."
    - "Braces fill the gaps with zeros: `std::array<int, 5> slots{};` is five 0s, and `std::array<int, 4> a{5, 8};` is 5, 8, 0, 0. Without the braces, the ints inside are uninitialized garbage (remember World 2!)."
    - "Use std::array when the count is fixed and known up front (days in a week, a 3x3 board). When the count changes while the program runs, use std::vector (next lesson)."
  pitfall: "Common beginner mistake: thinking the last element of a 5-slot array is `a[5]`. Counting starts at 0, so the last one is `a[4]`; `a[5]` is one past the end and reading it is undefined behavior."
demo:
  code: |-
    #include <array>
    #include <iostream>

    int main() {
        std::array<int, 3> hp{10, 20, 30};
        std::cout << hp[0] << '\n';
        hp[2] = 35;
        std::cout << hp[2] << '\n';
        std::cout << hp.size() << '\n';
        return 0;
    }
  steps:
    - line: 0
      note: std::array needs <array>.
    - line: 4
      vars:
        hp: "[10, 20, 30]"
      note: "Three int slots: indexes 0, 1, 2."
    - line: 5
      out: |
        10
      note: "hp[0] is the FIRST slot."
    - line: 6
      vars:
        hp: "[10, 20, 35]"
      note: "The last slot gets a new value."
    - line: 7
      out: |
        35
    - line: 8
      out: |
        3
      note: std::array knows its own size.
    - line: 9
      note: Done. Every index stayed between 0 and 2.
challenges:
  - id: w7.l1.c1
    type: mcq
    tags: [ w7.array ]
    prompt: "You declare `int scores[5];`. Which indexes are valid?"
    options:
      - t: 0 to 4
        why: "Five slots: 0, 1, 2, 3, 4."
      - t: 1 to 5
        why: Indexes start at 0, not 1.
      - t: 0 to 5
        why: Six slots. scores[5] is past the end.
      - t: 1 to 4
        why: Skips scores[0], the first slot.
    answer: 0
    hints:
      - The first index is always 0.
      - Five slots starting at 0 end where?
    short: A 5-slot array has indexes 0 to 4.
    explain: "Arrays are zero-based: the first element is [0] and the last is [size - 1]. For `int scores[5]` that's scores[0] through scores[4]. Using scores[5] reads past the end: undefined behavior."
  - id: w7.l1.c2
    type: predict
    tags: [ w7.std-array, w2.init ]
    prompt: What does this print?
    code: |-
      #include <array>
      #include <iostream>

      int main() {
          std::array<int, 4> a{5, 8, 2};
          std::cout << a[1] + a[3] << ' ' << a.size() << '\n';
          return 0;
      }
    options:
      - t: |
          8 4
        why: "8 + 0, and the size is 4."
      - t: |
          8 3
        why: "size() comes from the type: 4."
      - t: |
          7 4
        why: "a[1] is the second value, 8."
      - t: Compile error
        why: Fewer values than slots is fine.
    answer: 0
    hints:
      - Braces fill the missing slots with 0.
      - What size does the type say?
    short: Missing values become 0; size() comes from the type.
    explain: "`std::array<int, 4> a{5, 8, 2};` holds 5, 8, 2, 0: braces zero-fill the rest. a[1] + a[3] is 8 + 0 = 8, and a.size() is 4. Output: \"8 4\" and a newline. Giving MORE values than slots would be a compile error."
  - id: w7.l1.c3
    type: fill
    tags: [ w7.std-array, w2.init ]
    prompt: Fill in the blank so all seven temperatures start at 0.0.
    code: |-
      #include <array>

      std::array<double, 7> temps___;   // seven 0.0s
    accept:
      - "{}"
      - "{0.0}"
      - "{0}"
    placeholder: initializer
    hints:
      - "World 2's rule: always initialize."
      - Empty braces set every slot to zero.
    short: "temps{} starts every slot at 0.0."
    explain: "Empty braces value-initialize every element: seven 0.0s. Without them, a local std::array of doubles holds garbage, and reading garbage is undefined behavior."
  - id: w7.l1.c4
    type: order
    tags: [ w7.std-array, w1.include ]
    prompt: "Order the lines: include, make three grades, change the first to 'S', print it."
    lines:
      - "#include <array>"
      - "std::array<char, 3> grade{'A', 'B', 'C'};"
      - "grade[0] = 'S';"
      - "std::cout << grade[0] << '\\n';"
    distractors:
      - "std::array<char> grade{'A', 'B', 'C'};"
    hints:
      - Header first, declare before use.
      - std::array needs a type AND a count.
    short: Header, declare, change, print.
    explain: "The header comes first, the array must exist before you change it, and you print after the change. `std::array<char>` doesn't compile: the size is part of the type."
  - id: w7.l1.c5
    type: bug
    tags: [ w7.array, w5.offbyone, w5.for ]
    bug: out-of-bounds
    unsafe: true
    prompt: "UNSAFE: this sums 4 loot values but reads one too many. Tap the buggy line, pick the fix."
    code: |-
      #include <iostream>

      int main() {
          int loot[4] = {3, 1, 4, 1};
          int total = 0;
          for (int i = 0; i <= 4; ++i) {
              total += loot[i];
          }
          std::cout << total << '\n';
          return 0;
      }
    bugLine: 5
    options:
      - t: for (int i = 0; i < 4; ++i) {
        why: "i takes 0 to 3: all valid."
      - t: for (int i = 1; i <= 4; ++i) {
        why: Skips loot[0] and still reads loot[4].
      - t: for (int i = 0; i <= 4; i++) {
        why: i++ changes nothing. Still reads loot[4].
      - t: for (int i = 0; i <= 5; ++i) {
        why: Worse! Reads two slots past the end.
    answer: 0
    hints:
      - Last valid index of 4 slots?
      - "<= 4 lets i become 4."
    short: "Use i < 4: loot[4] is past the end."
    explain: "With `i <= 4`, the last pass reads loot[4], which doesn't exist: undefined behavior. It might add garbage, crash, or seem fine, and C arrays never warn you. Loop with `<` the size, or better, use std::array with size() (or a range-for, coming soon)."
    sideBySide:
      unsafe: |-
        int loot[4] = {3, 1, 4, 1};
        int total = 0;
        for (int i = 0; i <= 4; ++i) {   // reads loot[4]: UB
            total += loot[i];
        }
      hardened: |-
        #include <array>

        std::array<int, 4> loot{3, 1, 4, 1};
        int total = 0;
        for (std::size_t i = 0; i < loot.size(); ++i) {
            total += loot[i];
        }
  - id: w7.l1.c6
    type: mcq
    tags: [ w7.std-array, w7.array ]
    prompt: What's the main reason to prefer `std::array<int, 3>` over `int hp[3]`?
    options:
      - t: It knows its size and can be copied, at the same speed
        why: Same speed, plus size(), copying and .at().
      - t: It's much faster
        why: Same speed. The win is safety.
      - t: It can grow with push_back
        why: Fixed size. Growing is vector's job.
      - t: It checks every [] access
        why: "[] is unchecked here too. Only .at() checks."
    answer: 0
    hints:
      - What does a C array forget?
      - Which one knows its size?
    short: Knows its size, copies, same speed.
    explain: "A C array forgets its size when passed to a function, can't be assigned with =, and has no checked access. std::array fixes all of that at zero cost: it's the same block of ints in memory. But its [] is still unchecked: use .at() or check the index when it might be wrong."
recap:
  - "Fixed size; the first index is 0."
  - "hp.size() gives the count."
  - "Braces zero-fill: a{};"
  - Prefer std::array over C arrays.
vault:
  - id: w7.std-array
    title: std::array basics
    code: |-
      #include <array>

      std::array<int, 3> hp{10, 20, 30};
      hp[0] = 15;                    // valid indexes: 0, 1, 2
      std::size_t n = hp.size();     // 3
      std::array<int, 5> slots{};    // five 0s
    note: "Fixed size, knows its size, copyable. Prefer it over int hp[3]."
    defense: false
