          - "4"
        answer: 0
      - q: Uppercase sorts before lowercase. What does this print?
        code: std::cout << (std::string{"Zeta"} < std::string{"alpha"});
        options:
          - "1"
          - "0"
        answer: 0
      - q: What is v.size() now?
        code: |-
