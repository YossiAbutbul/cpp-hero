    hints:
      - "Indexes start at 0; uppercase sorts first."
      - "[] is unchecked; & means the real element."
    short: "0-based, size_t, npos, & to modify."
    explain: "std::array<int, 4> has indexes 0 to 3; \"brace\" has 5 chars; 'Z' (90) is less than 'a' (97), so \"Zeta\" < \"alpha\" is true (1); clear() empties the vector; .at() checks; size() is std::size_t; no match is npos; int& changes elements."
  - id: w7.boss.r7
    type: safe
    tags: [ w7.bounds, w7.empty, w7.invalidation, w7.substr ]
    prompt: Safe or unsafe? Pop the tiny blobs fast!
    seconds: 30
    items:
      - code: |-
          #include <array>

          std::array<int, 3> a{};
          int x = a.at(2);
        safe: true
        why: 2 is the last valid slot.
      - code: |-
          #include <vector>

          std::vector<int> v;
          v.pop_back();
        safe: false
        why: pop_back on empty is UB.
      - code: |-
          std::string s{"abc"};
          std::cout << s.substr(1, 50);
        safe: true
        why: "Long lengths stop at the end."
      - code: |-
          std::string s{"abc"};
          std::cout << s.substr(5);
        safe: false
        why: Start 5 is past the end.
      - code: |-
          for (char& c : s) {
              c = 'x';
          }
        prelude: std::string s{"abc"};
        safe: true
        why: Range-for stays in bounds.
      - code: |-
          int i{-1};
          std::cout << s[i];
        prelude: std::string s{"abc"};
        safe: false
        why: "-1 becomes a gigantic index."
      - code: |-
          #include <vector>

          std::vector<int> v{1, 2};
          if (!v.empty()) {
              std::cout << v.back();
          }
        safe: true
        why: Checked for empty first.
      - code: |-
          #include <vector>

          std::vector<int> v{1};
          const int& r = v[0];
          v.push_back(2);
          std::cout << r;
        safe: false
        why: r may dangle after push_back.
    hints:
      - Empty? Index past size()?
      - References across push_back?
    short: Check empty, stay below size().
    explain: "The unsafe ones: pop_back on empty (UB), substr starting past the end (throws), index -1 (becomes huge: UB), and a reference held across push_back (may dangle: UB). A length past the end is fine for substr: it just stops at the end."
  - id: w7.boss.r8
    type: bug
    tags: [ w7.bounds, w5.signed-unsigned, w5.offbyone ]
    bug: out-of-bounds
    unsafe: true
    prompt: "UNSAFE: on an empty vector this loop runs almost forever. Tap the buggy line, pick the fix."
    code: |-
      #include <iostream>
      #include <vector>

      int main() {
          std::vector<int> scores;
          for (std::size_t i = 0; i <= scores.size() - 1; ++i) {
              std::cout << scores[i] << '\n';
          }
          return 0;
      }
    bugLine: 5
    options:
      - t: for (std::size_t i = 0; i < scores.size(); ++i) {
        why: "Empty runs zero times."
      - t: for (int i = 0; i <= scores.size() - 1; ++i) {
        why: "size() minus 1 still wraps."
      - t: for (std::size_t i = 1; i <= scores.size(); ++i) {
        why: "Reads scores[size()]."
      - t: for (std::size_t i = 0; i <= scores.size(); ++i) {
        why: "Empty still reads scores[0]."
    answer: 0
    hints:
      - Unsigned 0 minus 1 is what?
      - Use < size() directly.
    short: "Empty size() minus 1 wraps huge."
    explain: "size() is unsigned, so on an empty vector 0 - 1 wraps to the largest std::size_t. The loop tries to read billions of elements that don't exist: undefined behavior (likely a crash, but not guaranteed). `i < scores.size()` needs no subtraction and handles empty correctly. Switching to `int i` doesn't help: `size() - 1` is computed unsigned before the compare, and you get a sign-compare warning too."
    sideBySide:
      unsafe: |-
        #include <vector>

        std::vector<int> scores;
        for (std::size_t i = 0; i <= scores.size() - 1; ++i) {   // 0 - 1 wraps
            std::cout << scores[i] << '\n';
        }
      hardened: |-
        #include <vector>

        std::vector<int> scores;
        for (std::size_t i = 0; i < scores.size(); ++i) {
            std::cout << scores[i] << '\n';
        }
  - id: w7.boss.r9
    type: edge
    tags: [ w7.bounds, w6.params, w5.signed-unsigned ]
    bug: out-of-bounds
    unsafe: true
    prompt: "UNSAFE: doubled() trusts its slot. Which calls read out of bounds? Select all."
    code: |-
      #include <iostream>
      #include <vector>

      int doubled(const std::vector<int>& v, int slot) {
          return v[static_cast<std::size_t>(slot)] * 2;
      }

      int main() {
          std::vector<int> v{4, 5};
          std::cout << doubled(v, 1) << '\n';
          return 0;
      }
    options:
      - t: "v = {4, 5}, slot = 1"
        why: "Fine: returns 10."
      - t: "v = {4, 5}, slot = 2"
        why: "Slot 2 is past the end."
      - t: "v = {4, 5}, slot = -1"
        why: "-1 becomes gigantic."
      - t: "v = {}, slot = 0"
        why: "Empty has no slot 0."
      - t: "v = {7}, slot = 0"
        why: "Fine: returns 14."
    answers: [ 1, 2, 3 ]
    hints:
      - "Too big, negative, empty."
      - size() is past the end.
    short: "Test size(), negatives and empty."
    explain: "Good edge tests hit every boundary: one past the end (slot == size()), negative (becomes huge), and the empty vector. All three are undefined behavior with []. Valid slots are 0 to size() minus 1. Validate the parameter first (World 6), or use .at()."
    sideBySide:
      unsafe: |-
        #include <vector>

        int result = v[static_cast<std::size_t>(slot)] * 2;
      hardened: |-
        #include <vector>

        if (slot < 0 || static_cast<std::size_t>(slot) >= v.size()) {
            std::cout << "Bad slot\n";
            return 1;
        }
        int result = v[static_cast<std::size_t>(slot)] * 2;
      prelude: std::vector<int> v{4, 5}; int slot{1};
defense:
  - attack: "-1"
    label: Index -1!
    challenge:
      id: w7.boss.d1
      type: breakit
      tags: [ w7.bounds, w5.signed-unsigned, w3.validate ]
      bug: out-of-bounds
      unsafe: true
      prompt: "UNSAFE: this rejects bad text and slots too big. Which input still breaks it?"
      code: |-
        #include <iostream>
        #include <vector>

        int main() {
            std::vector<int> hp{30, 45, 60};
            int slot{};
            if (!(std::cin >> slot) || slot >= static_cast<int>(hp.size())) {
                std::cout << "Out of range!\n";
                return 1;
            }
            std::cout << hp[static_cast<std::size_t>(slot)] << '\n';
            return 0;
        }
      options:
        - t: "-1"
          why: "Passes both checks, becomes huge."
        - t: "2"
          why: Valid. Prints 60.
        - t: "3"
          why: "Caught: 3 >= 3."
        - t: abc
          why: "Caught: the read fails."
      answer: 0
      hints:
        - Which bad index isn't too BIG?
        - What does -1 become unsigned?
      short: "Reject negatives too."
      explain: "The check only rejects slots that are too big. -1 is smaller than 3, so it passes, and static_cast<std::size_t>(-1) is the largest std::size_t: hp[that] is far out of bounds. Reject negatives too."
      sideBySide:
        unsafe: |-
          #include <vector>

          std::vector<int> hp{30, 45, 60};
          if (!(std::cin >> slot) || slot >= static_cast<int>(hp.size())) {
              return 1;
          }
          std::cout << hp[static_cast<std::size_t>(slot)] << '\n';   // -1: UB
        hardened: |-
          #include <vector>

          std::vector<int> hp{30, 45, 60};
          if (!(std::cin >> slot) || slot < 0 ||
              static_cast<std::size_t>(slot) >= hp.size()) {
              std::cout << "Out of range!\n";
              return 1;
          }
          std::cout << hp[static_cast<std::size_t>(slot)] << '\n';
        prelude: int slot{};
  - attack: "(no scores)"
    label: Empty vector!
    challenge:
      id: w7.boss.d2
      type: harden
      tags: [ w7.empty, w7.front-back, w4.guard ]
      prompt: "Zero scores arrive. Pick the condition that stops front() on empty."
      code: |-
        #include <iostream>
        #include <vector>

        int main() {
            std::vector<int> scores;
            int s{};
            while (std::cin >> s) {
                scores.push_back(s);
            }
            if (___) {
                std::cout << "No scores yet\n";
                return 1;
            }
            std::cout << "First: " << scores.front() << '\n';
            return 0;
        }
      options:
        - t: scores.empty()
          why: Bails out before front().
        - t: "!scores.empty()"
          why: "Inverted: lets empty through."
        - t: scores.front() == 0
          why: That front() is already UB.
        - t: scores.size() < 0
          why: Always false for size_t.
      answer: 0
      hints:
        - Don't touch the elements.
        - "Is it empty?"
      short: "Check empty() before front()."
      explain: "front() on an empty vector is undefined behavior: it may print garbage or crash. empty() is always safe to call. Check it first, and bail out with a clear message."
      sideBySide:
        unsafe: |-
          #include <vector>

          std::vector<int> scores;
          std::cout << "First: " << scores.front() << '\n';   // UB: empty
        hardened: |-
          #include <vector>

          std::vector<int> scores;
          if (scores.empty()) {
              std::cout << "No scores yet\n";
              return 1;
          }
          std::cout << "First: " << scores.front() << '\n';
  - attack: hp5
    label: npos as an index!
    challenge:
      id: w7.boss.d3
      type: bug
      tags: [ w7.npos, w7.find, w3.getline ]
      bug: out-of-bounds
      unsafe: true
      prompt: "UNSAFE: turns \"hp:5\" into \"hp=5\", but breaks on `hp5`. Tap the buggy line, pick the fix."
      code: |-
        #include <iostream>
        #include <string>

        int main() {
            std::string cmd;
            std::getline(std::cin, cmd);
            std::size_t colon = cmd.find(':');
            cmd[colon] = '=';
            std::cout << cmd << '\n';
            return 0;
        }
      bugLine: 7
      options:
        - t: "if (colon != std::string::npos) { cmd[colon] = '='; }"
          why: Only writes when found.
        - t: "if (colon >= 0) { cmd[colon] = '='; }"
          why: Always true. npos gets through.
        - t: "cmd.at(colon) = '=';"
          why: Throws, and stops the program.
        - t: "if (colon) { cmd[colon] = '='; }"
          why: "Backwards for npos and 0."
      answer: 0
      hints:
        - What does find return for hp5?
        - Check for "not found" first.
      short: "Check npos before indexing."
      explain: "With no colon, find returns npos, the largest std::size_t. `cmd[npos]` writes far outside the string: undefined behavior that might corrupt memory silently. Compare with npos first, then use the index. `.at()` would throw std::out_of_range instead, which is better than UB, but uncaught it still stops the program."
      sideBySide:
        unsafe: |-
          std::size_t colon = cmd.find(':');
          cmd[colon] = '=';   // no colon: cmd[npos], UB
        hardened: |-
          std::size_t colon = cmd.find(':');
          if (colon != std::string::npos) {
              cmd[colon] = '=';
          } else {
              std::cout << "Expected key:value\n";
          }
        prelude: std::string cmd{"hp5"};
  - attack: push_back
    label: Push while holding a reference!
    challenge:
      id: w7.boss.d4
      type: harden
      tags: [ w7.invalidation, w7.reserve ]
      bug: iterator-invalidation
      prompt: "Pick the call that keeps `first` valid through the push_back."
      code: |-
        #include <iostream>
        #include <vector>

        int main() {
            std::vector<int> gold{10};
            gold.___;
            int& first = gold[0];
            gold.push_back(20);
            first += 5;
            std::cout << gold[0] << ' ' << gold[1] << '\n';
            return 0;
        }
      options:
        - t: reserve(2)
          why: "Room for 2: no reallocation."
        - t: resize(2)
          why: Push needs a third slot.
        - t: shrink_to_fit()
          why: Makes reallocation MORE likely.
        - t: clear()
          why: Then gold[0] is UB.
      answer: 0
      hints:
        - It moves when out of room.
        - Ask for room BEFORE taking the reference.
      short: "reserve first, and the reference stays valid."
      explain: "After `reserve(2)`, no reallocation happens until the size passes 2, so `first` stays valid through one push_back and the program prints \"15 20\". `resize(2)` adds a 0 and makes the size 2, so the push_back needs a third slot and may reallocate. Even simpler: skip the reference and write `gold[0] += 5;` after pushing. Indexes never dangle."
      sideBySide:
        unsafe: |-
          #include <vector>

          std::vector<int> gold{10};
          int& first = gold[0];
          gold.push_back(20);   // may reallocate
          first += 5;           // UB if it did
        hardened: |-
          #include <vector>

          std::vector<int> gold{10};
          gold.reserve(2);      // room for both, no reallocation
          int& first = gold[0];
          gold.push_back(20);
          first += 5;
victory: Blorp... squeezed... back in bounds. Just a tidy puddle now.
reward:
  xp: 225
  cosmetic: shield-bounds
  bug: out-of-bounds
