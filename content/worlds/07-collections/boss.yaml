# World 7 boss: The Overflow Blob

id: w7.boss
name: The Overflow Blob
art: blob
hp: 8
intro: Blorp! I ooze past the end of every array. Index me!
taunt:
  - Read v[v.size()]. It's only ONE more. Blorp.
  - Your vector is empty? Call front() anyway!
  - npos is just a big number. Use it as an index!
  - Hold that reference tight. I'll push_back behind you.
rounds:
  - id: w7.boss.r1
    type: predict
    tags: [ w7.vector, w7.push-back, w7.front-back ]
    prompt: The Blob swells the vector. What does this print?
    code: |-
      #include <iostream>
      #include <vector>

      int main() {
          std::vector<int> v{2, 4};
          v.push_back(v[0] + v[1]);
          v.push_back(v.back() * 2);
          std::cout << v.size() << ' ' << v.back() << '\n';
          return 0;
      }
    options:
      - t: |
          4 12
        why: "6, then 6 * 2 = 12."
      - t: |
          4 8
        why: "back() is already 6."
      - t: |
          2 12
        why: Both pushes grow v.
      - t: |
          3 12
        why: 2 plus 2 pushes is 4.
    answer: 0
    hints:
      - Track v after each push.
      - back() is last at that moment.
    short: "[2, 4] becomes [2, 4, 6, 12]."
    explain: "First push: v[0] + v[1] = 6, so [2, 4, 6]. Second push: back() is 6, times 2 is 12, so [2, 4, 6, 12]. Output: \"4 12\" and a newline."
  - id: w7.boss.r2
    type: mcq
    tags: [ w7.vector, w2.init ]
    prompt: "What is `v.size()` after `std::vector<int> v{3};`?"
    options:
      - t: "1"
        why: "Braces list values: one 3."
      - t: "3"
        why: "That's v(3): three 0s."
      - t: "0"
        why: The braces hold one value.
      - t: Compile error
        why: It's valid code.
    answer: 0
    hints:
      - Braces or parentheses?
      - "{3} lists one value."
    short: "v{3} is one 3; v(3) is three 0s."
    explain: "With braces, the values are a list: `v{3}` is [3], size 1. Parentheses call the count constructor: `v(3)` is [0, 0, 0], size 3."
  - id: w7.boss.r3
    type: predict
    tags: [ w7.ref-loop, w7.range-for, w7.string-append ]
    prompt: What does this print?
    code: |-
      #include <iostream>
      #include <string>
      #include <vector>

      int main() {
          std::vector<std::string> names{"ana", "bo"};
          for (std::string& n : names) {
              n += "!";
          }
          for (std::string n : names) {
              n = "?";
          }
          std::cout << names[0] << names[1] << '\n';
          return 0;
      }
    options:
      - t: |
          ana!bo!
        why: "! sticks; ? hits copies."
      - t: |
          ??
        why: "The ? loop uses copies."
      - t: |
          anabo
        why: "The & loop makes ! stick."
      - t: |
          ana! bo!
        why: No space is printed.
    answer: 0
    hints:
      - Which loop has an &?
      - Copies never change the vector.
    short: "Only the & loop changes names."
    explain: "`std::string& n` refers to each element, so += \"!\" changes names to [\"ana!\", \"bo!\"]. `std::string n` is a copy each pass, so = \"?\" is thrown away. Output: \"ana!bo!\" and a newline."
  - id: w7.boss.r4
    type: predict
    tags: [ w7.find, w7.substr ]
    prompt: The Blob splits a word. What does this print?
    code: |-
      #include <iostream>
      #include <string>

      int main() {
          std::string s{"level-up"};
          std::size_t d = s.find('-');
          std::cout << d << ' ' << s.substr(d + 1) << ' ' << s.substr(0, d) << '\n';
          return 0;
      }
    options:
      - t: |
          5 up level
        why: "Dash at 5, split around it."
      - t: |
          6 up level
        why: "Count from 0: dash is at 5."
      - t: |
          5 -up level
        why: "d + 1 skips the dash."
      - t: |
          5 up level-
        why: "5 chars stop before the dash."
    answer: 0
    hints:
      - "l-e-v-e-l is indexes 0 to 4."
      - substr(0, d) takes d chars.
    short: "find gives 5; substr splits around it."
    explain: "find('-') returns 5. substr(6) is \"up\", substr(0, 5) is \"level\". Output: \"5 up level\" and a newline. (Here the dash exists; in real code, check find against npos first!)"
  - id: w7.boss.r5
    type: fill
    tags: [ w7.npos, w7.find ]
    prompt: "Fill in the blank so the domain prints only when an @ exists."
    code: |-
      #include <iostream>
      #include <string>

      int main() {
          std::string mail{"curlo@codebase.dev"};
          std::size_t at = mail.find('@');
          if (at != std::string::___) {
              std::cout << mail.substr(at + 1) << '\n';
          }
          return 0;
      }
    accept:
      - npos
    placeholder: constant
    hints:
      - The "not found" value.
      - Starts with n.
    short: "!= npos means found."
    explain: "find returns std::string::npos when there's no match. Only when `at != std::string::npos` is `at + 1` a real position. Without the check, npos + 1 wraps to 0 and you'd print the whole string as the domain."
  - id: w7.boss.r6
    type: speed
    tags: [ w7.std-array, w7.size, w7.string-compare, w7.at, w7.npos, w7.ref-loop ]
    prompt: SPEED ROUND! Answer fast!
    seconds: 45
    items:
      - q: "Valid indexes of std::array<int, 4>?"
        options:
          - 0 to 3
          - 1 to 4
          - 0 to 4
        answer: 0
      - q: What is s.size()?
        code: std::string s{"brace"};
        options:
          - "5"
