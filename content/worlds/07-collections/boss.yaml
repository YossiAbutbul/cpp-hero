# World 7 boss: The Overflow Blob

id: w7.boss
name: The Overflow Blob
art: blob
hp: 8
intro: Blorp! I ooze past the end of every array. Go on, index me!
taunt:
  - Read v[v.size()]. It's only ONE more. Blorp.
  - Your vector is empty? Call front() anyway!
  - npos is just a big number. Use it as an index!
  - Hold that reference tight. I'll push_back behind you.
rounds:
  - id: w7.boss.r1
    type: predict
    tags: [ w7.vector, w7.push-back, w7.front-back ]
    prompt: The Blob swells the vector. What does this print?
    code: |-
      #include <iostream>
      #include <vector>

      int main() {
          std::vector<int> v{2, 4};
          v.push_back(v[0] + v[1]);
          v.push_back(v.back() * 2);
          std::cout << v.size() << ' ' << v.back() << '\n';
          return 0;
      }
    options:
      - t: |
          4 12
        why: "Correct: v becomes [2, 4, 6], then [2, 4, 6, 12]."
      - t: |
          4 8
        why: "When the second push_back runs, back() is already 6, so it pushes 12."
      - t: |
          2 12
        why: Both push_backs grow the vector. The size is 4.
      - t: |
          3 12
        why: Count again. 2 elements plus 2 pushes is 4.
    answer: 0
    hints:
      - Track the vector after each push_back.
      - back() is whatever is last at that moment.
    short: "[2, 4] becomes [2, 4, 6, 12]: size 4, back 12."
    explain: "First push: v[0] + v[1] = 6, so [2, 4, 6]. Second push: back() is 6, times 2 is 12, so [2, 4, 6, 12]. Output: \"4 12\" and a newline."
  - id: w7.boss.r2
    type: mcq
    tags: [ w7.vector, w2.init ]
    prompt: "What is `v.size()` after `std::vector<int> v{3};`?"
    options:
      - t: "1"
        why: "Correct: braces list the values, so v holds one element, 3."
      - t: "3"
        why: "That's std::vector<int> v(3); with parentheses: three 0s."
      - t: "0"
        why: The braces aren't empty. They hold one value.
      - t: Compile error
        why: "It's perfectly valid. It just doesn't mean \"three elements\"."
    answer: 0
    hints:
      - Braces or parentheses?
      - "{3} is a list with one value in it."
    short: "v{3} holds one element (3); v(3) holds three 0s."
    explain: "With braces, the values are a list: `v{3}` is [3], size 1. Parentheses call the count constructor: `v(3)` is [0, 0, 0], size 3."
  - id: w7.boss.r3
    type: predict
    tags: [ w7.ref-loop, w7.range-for, w7.string-append ]
    prompt: One loop by reference, one by value. What does this print?
    code: |-
      #include <iostream>
      #include <string>
      #include <vector>

      int main() {
          std::vector<std::string> names{"ana", "bo"};
          for (std::string& n : names) {
              n += "!";
          }
          for (std::string n : names) {
              n = "?";
          }
          std::cout << names[0] << names[1] << '\n';
          return 0;
      }
    options:
      - t: |
          ana!bo!
        why: "Correct: the & loop changes the real strings; the copy loop only changes copies."
      - t: |
          ??
        why: "The second loop takes copies (std::string n), so the ? never reaches names."
      - t: |
          anabo
        why: "The first loop uses std::string&, so the ! sticks."
      - t: |
          ana! bo!
        why: Nothing prints a space between the two names.
    answer: 0
    hints:
      - Which loop has an &?
      - Changing a copy never changes the vector.
    short: "The & loop adds ! for real; the copy loop changes nothing."
    explain: "`std::string& n` refers to each element, so += \"!\" changes names to [\"ana!\", \"bo!\"]. `std::string n` is a copy each pass, so = \"?\" is thrown away. Output: \"ana!bo!\" and a newline."
