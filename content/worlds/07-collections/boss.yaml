  - id: w7.boss.r7
    type: safe
    tags: [ w7.bounds, w7.empty, w7.invalidation, w7.substr ]
    prompt: Safe or unsafe? The Blob splits into tiny blobs. Pop them fast!
    seconds: 30
    items:
      - code: |-
          #include <array>

          std::array<int, 3> a{};
          int x = a.at(2);
        safe: true
        why: Index 2 is the last valid slot of a 3-element array.
      - code: |-
          #include <vector>

          std::vector<int> v;
          v.pop_back();
        safe: false
        why: pop_back on an empty vector is UB.
      - code: |-
          std::string s{"abc"};
          std::cout << s.substr(1, 50);
        safe: true
        why: "Too long a length is fine: substr stops at the end. Prints \"bc\"."
      - code: |-
          std::string s{"abc"};
          std::cout << s.substr(5);
        safe: false
        why: Start 5 is past the end (size 3), so substr throws std::out_of_range.
      - code: |-
          for (char& c : s) {
              c = 'x';
          }
        prelude: std::string s{"abc"};
        safe: true
        why: Range-for can't go out of bounds, and char& changes each char.
      - code: |-
          int i{-1};
          std::cout << s[i];
        prelude: std::string s{"abc"};
        safe: false
        why: "-1 converts to a gigantic std::size_t: far out of bounds. UB."
      - code: |-
          #include <vector>

          std::vector<int> v{1, 2};
          if (!v.empty()) {
              std::cout << v.back();
          }
        safe: true
        why: back() only runs on a non-empty vector.
      - code: |-
          #include <vector>

          std::vector<int> v{1};
          const int& r = v[0];
          v.push_back(2);
          std::cout << r;
        safe: false
        why: const doesn't stop reallocation. r may dangle after push_back.
    hints:
      - Watch for empty collections and indexes past size().
      - A reference held across push_back is a trap.
    short: Safe code checks empty, stays below size(), and drops references before push_back.
    explain: "The unsafe ones: pop_back on empty (UB), substr starting past the end (throws), index -1 (becomes huge: UB), and a reference held across push_back (may dangle: UB). A length past the end is fine for substr: it just stops at the end."
  - id: w7.boss.r8
    type: bug
    tags: [ w7.bounds, w5.signed-unsigned, w5.offbyone ]
    bug: out-of-bounds
    unsafe: true
    prompt: "UNSAFE: the vector is empty, and this loop still runs almost forever. Tap the buggy line, then pick the fix."
    code: |-
      #include <iostream>
      #include <vector>

      int main() {
          std::vector<int> scores;
          for (std::size_t i = 0; i <= scores.size() - 1; ++i) {
              std::cout << scores[i] << '\n';
          }
          return 0;
      }
    bugLine: 5
    options:
      - t: for (std::size_t i = 0; i < scores.size(); ++i) {
        why: "Correct: 0 < 0 is false, so an empty vector runs zero times."
      - t: for (int i = 0; i <= scores.size() - 1; ++i) {
        why: size() - 1 is still unsigned and still wraps. Now with a sign-compare warning too.
      - t: for (std::size_t i = 1; i <= scores.size(); ++i) {
        why: "Skips scores[0], and on a full vector reads scores[size()], past the end."
      - t: for (std::size_t i = 0; i <= scores.size(); ++i) {
        why: "Empty: runs once and reads scores[0], which doesn't exist."
    answer: 0
    hints:
      - What is 0 - 1 for an unsigned std::size_t?
      - Compare with size() directly, using <.
    short: "size() - 1 wraps on empty. Use i < size() instead."
    explain: "size() is unsigned, so on an empty vector 0 - 1 wraps to the largest std::size_t. The loop tries to read billions of elements that don't exist: undefined behavior (likely a crash, but not guaranteed). `i < scores.size()` needs no subtraction and handles empty correctly."
    sideBySide:
      unsafe: |-
        #include <vector>

        std::vector<int> scores;
        for (std::size_t i = 0; i <= scores.size() - 1; ++i) {   // 0 - 1 wraps
            std::cout << scores[i] << '\n';
        }
      hardened: |-
        #include <vector>

        std::vector<int> scores;
        for (std::size_t i = 0; i < scores.size(); ++i) {
            std::cout << scores[i] << '\n';
        }
  - id: w7.boss.r9
    type: edge
    tags: [ w7.bounds, w6.params, w5.signed-unsigned ]
    bug: out-of-bounds
    unsafe: true
    prompt: "UNSAFE: doubled() trusts its slot. Which calls expose out-of-bounds access? Select all."
    code: |-
      #include <iostream>
      #include <vector>

      int doubled(const std::vector<int>& v, int slot) {
          return v[static_cast<std::size_t>(slot)] * 2;
      }

      int main() {
          std::vector<int> v{4, 5};
          std::cout << doubled(v, 1) << '\n';
          return 0;
      }
    options:
      - t: "v = {4, 5}, slot = 1"
        why: "Fine: slot 1 exists, returns 10."
      - t: "v = {4, 5}, slot = 2"
        why: "Exposes it: slot 2 equals size(), one past the end."
      - t: "v = {4, 5}, slot = -1"
        why: "Exposes it: -1 becomes a gigantic std::size_t."
      - t: "v = {}, slot = 0"
        why: "Exposes it: an empty vector has no slot 0."
      - t: "v = {7}, slot = 0"
        why: "Fine: the only element, returns 14."
    answers: [ 1, 2, 3 ]
    hints:
      - "Test both ends: too big, negative, and empty."
      - Valid slots are 0 to size() - 1.
    short: "Test slot == size(), negative slots and empty vectors."
    explain: "Good edge tests hit every boundary: one past the end (slot == size()), negative (becomes huge), and the empty vector. All three are undefined behavior with []. Validate the parameter first (World 6), or use .at()."
    sideBySide:
      unsafe: |-
        #include <vector>

        int result = v[static_cast<std::size_t>(slot)] * 2;
      hardened: |-
        #include <vector>

        if (slot < 0 || static_cast<std::size_t>(slot) >= v.size()) {
            std::cout << "Bad slot\n";
            return 1;
        }
        int result = v[static_cast<std::size_t>(slot)] * 2;
      prelude: std::vector<int> v{4, 5}; int slot{1};
defense:
  - attack: "-1"
    label: Index -1!
    challenge:
      id: w7.boss.d1
      type: breakit
      tags: [ w7.bounds, w5.signed-unsigned, w3.validate ]
      bug: out-of-bounds
      unsafe: true
      prompt: "UNSAFE: this checks bad text and slots that are too big. Which input still breaks it?"
      code: |-
        #include <iostream>
        #include <vector>

        int main() {
            std::vector<int> hp{30, 45, 60};
            int slot{};
            if (!(std::cin >> slot) || slot >= static_cast<int>(hp.size())) {
                std::cout << "Out of range!\n";
                return 1;
            }
            std::cout << hp[static_cast<std::size_t>(slot)] << '\n';
            return 0;
        }
      options:
        - t: "-1"
          why: "Correct: -1 passes both checks, then becomes a gigantic index. UB."
        - t: "2"
          why: The last valid slot. Prints 60.
        - t: "3"
          why: "Caught: 3 >= 3."
        - t: abc
          why: "Caught: the read fails."
      answer: 0
      hints:
        - Which bad index isn't too BIG?
        - What happens to -1 when it becomes a std::size_t?
      short: "-1 slips past a size-only check and becomes a huge index."
      explain: "The check only rejects slots that are too big. -1 is smaller than 3, so it passes, and static_cast<std::size_t>(-1) is the largest std::size_t: hp[that] is far out of bounds. Reject negatives too."
      sideBySide:
        unsafe: |-
          #include <vector>

          std::vector<int> hp{30, 45, 60};
          if (!(std::cin >> slot) || slot >= static_cast<int>(hp.size())) {
              return 1;
          }
          std::cout << hp[static_cast<std::size_t>(slot)] << '\n';   // -1: UB
        hardened: |-
          #include <vector>

          std::vector<int> hp{30, 45, 60};
          if (!(std::cin >> slot) || slot < 0 ||
              static_cast<std::size_t>(slot) >= hp.size()) {
              std::cout << "Out of range!\n";
              return 1;
          }
          std::cout << hp[static_cast<std::size_t>(slot)] << '\n';
        prelude: int slot{};
  - attack: "(no scores)"
    label: Empty vector!
    challenge:
      id: w7.boss.d2
      type: harden
      tags: [ w7.empty, w7.front-back, w4.guard ]
      prompt: "The Blob sends zero scores. Pick the guard that protects front()."
      code: |-
        #include <iostream>
        #include <vector>

        int main() {
            std::vector<int> scores;
            int s{};
            while (std::cin >> s) {
                scores.push_back(s);
            }
            if (___) {
                std::cout << "No scores yet\n";
                return 1;
            }
            std::cout << "First: " << scores.front() << '\n';
            return 0;
        }
      options:
        - t: scores.empty()
          why: "Correct: stops before front() ever touches an empty vector."
        - t: "!scores.empty()"
          why: "Inverted: rejects real scores and lets the empty vector through."
        - t: scores.front() == 0
          why: Calls front() to check, which is already UB on an empty vector.
        - t: scores.size() < 0
          why: std::size_t can't be negative. Always false.
      answer: 0
      hints:
        - Ask the vector, don't touch its elements.
        - There's a member function that answers "is it empty?".
      short: "Check scores.empty() before calling front()."
      explain: "front() on an empty vector is undefined behavior: it may print garbage or crash. empty() is always safe to call. Check it first, and bail out with a clear message."
      sideBySide:
        unsafe: |-
          #include <vector>

          std::vector<int> scores;
          std::cout << "First: " << scores.front() << '\n';   // UB: empty
        hardened: |-
          #include <vector>

          std::vector<int> scores;
          if (scores.empty()) {
              std::cout << "No scores yet\n";
              return 1;
          }
          std::cout << "First: " << scores.front() << '\n';
  - attack: hp5
    label: npos as an index!
    challenge:
      id: w7.boss.d3
      type: bug
      tags: [ w7.npos, w7.find, w3.getline ]
      bug: out-of-bounds
      unsafe: true
      prompt: "UNSAFE: this turns \"hp:5\" into \"hp=5\". The Blob types `hp5`, with no colon. Tap the buggy line, then pick the fix."
      code: |-
        #include <iostream>
        #include <string>

        int main() {
            std::string cmd;
            std::getline(std::cin, cmd);
            std::size_t colon = cmd.find(':');
            cmd[colon] = '=';
            std::cout << cmd << '\n';
            return 0;
        }
      bugLine: 7
      options:
        - t: "if (colon != std::string::npos) { cmd[colon] = '='; }"
          why: "Correct: only writes when a colon was really found."
        - t: "if (colon >= 0) { cmd[colon] = '='; }"
          why: std::size_t is always >= 0, so npos still gets through.
        - t: "cmd.at(colon) = '=';"
          why: Throws instead of UB, which is better, but uncaught it still stops the program.
        - t: "if (colon) { cmd[colon] = '='; }"
          why: "npos counts as true, and a colon at index 0 counts as false. Backwards."
      answer: 0
      hints:
        - What does find return for hp5?
        - Check against the "not found" value first.
      short: "Check colon != std::string::npos before using it as an index."
      explain: "With no colon, find returns npos, the largest std::size_t. `cmd[npos]` writes far outside the string: undefined behavior that might corrupt memory silently. Compare with npos first, then use the index."
      sideBySide:
        unsafe: |-
          std::size_t colon = cmd.find(':');
          cmd[colon] = '=';   // no colon: cmd[npos], UB
        hardened: |-
          std::size_t colon = cmd.find(':');
          if (colon != std::string::npos) {
              cmd[colon] = '=';
          } else {
              std::cout << "Expected key:value\n";
          }
        prelude: std::string cmd{"hp5"};
  - attack: push_back
    label: Push while holding a reference!
    challenge:
      id: w7.boss.d4
      type: harden
      tags: [ w7.invalidation, w7.reserve ]
      bug: iterator-invalidation
      prompt: "The Blob pushes while you hold a reference to gold[0]. Pick the call that keeps `first` valid."
      code: |-
        #include <iostream>
        #include <vector>

        int main() {
            std::vector<int> gold{10};
            gold.___;
            int& first = gold[0];
            gold.push_back(20);
            first += 5;
            std::cout << gold[0] << ' ' << gold[1] << '\n';
            return 0;
        }
      options:
        - t: reserve(2)
          why: "Correct: room for 2 up front, so the push_back can't reallocate and first stays valid."
        - t: resize(2)
          why: Makes the size 2 (adds a 0). The push_back then needs a third slot and may reallocate.
        - t: shrink_to_fit()
          why: Asks to drop spare room, making reallocation on push_back even more likely.
        - t: clear()
          why: Empties the vector, so gold[0] on the next line is already UB.
      answer: 0
      hints:
        - Reallocation happens when the size passes the capacity.
        - Ask for enough room BEFORE taking the reference.
      short: "reserve(2) first: no reallocation, so the reference stays valid."
      explain: "After `reserve(2)`, no reallocation happens until the size passes 2, so `first` stays valid through one push_back and the program prints \"15 20\". Even simpler: skip the reference and write `gold[0] += 5;` after pushing. Indexes never dangle."
      sideBySide:
        unsafe: |-
          #include <vector>

          std::vector<int> gold{10};
          int& first = gold[0];
          gold.push_back(20);   // may reallocate
          first += 5;           // UB if it did
        hardened: |-
          #include <vector>

          std::vector<int> gold{10};
          gold.reserve(2);      // room for both, no reallocation
          int& first = gold[0];
          gold.push_back(20);
          first += 5;
victory: Blorp... squeezed... back in bounds. The Blob shrinks into a tidy, bounded puddle.
