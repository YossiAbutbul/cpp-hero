# World 7 · Lesson 3: Loop the whole collection (range-based for)

id: w7.l3
title: Loop the whole collection
skill: logic
shield: false
concept:
  short: "Range-for visits every element: by copy, by const&, or by &."
  analogy: "Value is a photocopy, const& is looking through glass, & is the original."
  body:
    - "`for (int x : v) { ... }` runs once per element, in order, with x set to each one. No index, no bounds to get wrong: World 5's off-by-one can't happen here."
    - "**By value** (`int x`): x is a copy. Changing x doesn't change the vector. Fine for small types like int, double or char."
    - "**By const reference** (`const std::string& name`): no copy, read-only. The default for anything bigger than a number, for the same reason World 6 passes big parameters as const refs."
    - "**By reference** (`int& x`): x IS the element, so `x *= 2;` changes the vector itself."
    - "`auto` works too: `for (const auto& item : bag)`. Need the index as well? Use a classic loop: `for (std::size_t i = 0; i < v.size(); ++i)`."
    - "Don't push_back to (or erase from) the vector you're range-for looping over: it can pull the floor out from under the loop. The Shield lesson shows why."
  pitfall: "Common beginner mistake: `for (int x : v) { x = 0; }` and expecting v to be all zeros. x was a copy. You need `int& x`. (g++ even warns: \"variable 'x' set but not used\".)"
demo:
  code: |-
    #include <iostream>
    #include <vector>

    int main() {
        std::vector<int> v{1, 2, 3};
        for (int x : v) {
            x *= 10;
        }
        for (int& x : v) {
            x *= 10;
        }
        for (const int& x : v) {
            std::cout << x << ' ';
        }
        std::cout << '\n';
        return 0;
    }
  steps:
    - line: 4
      vars:
        v: "[1, 2, 3]"
    - line: 5
      vars:
        v: "[1, 2, 3]"
        x: "1"
      note: "By value: x is a COPY."
    - line: 6
      vars:
        v: "[1, 2, 3]"
        x: "10"
      note: Only the copy changes.
    - line: 8
      vars:
        v: "[1, 2, 3]"
      note: "int& x: x IS each element in turn."
    - line: 9
      vars:
        v: "[10, 2, 3]"
      note: Changing x changes v[0] itself.
    - line: 9
      vars:
        v: "[10, 20, 30]"
      note: Every element changed in place.
    - line: 12
      out: "10 "
      note: "const int&: read-only, no copy."
    - line: 12
      out: "20 "
    - line: 12
      out: "30 "
    - line: 14
      out: "\n"
      note: One newline to finish.
    - line: 15
      note: "Copy, change, read."
challenges:
  - id: w7.l3.c1
    type: predict
    tags: [ w7.range-for, w5.for ]
    prompt: "This tries to reset every hp to 0. What does it print?"
    expect: warn
    code: |-
      #include <iostream>
      #include <vector>

      int main() {
          std::vector<int> hp{5, 5, 5};
          for (int h : hp) {
              h = 0;
          }
          std::cout << hp[0] + hp[1] + hp[2] << '\n';
          return 0;
      }
    options:
      - t: |
          15
        why: Only the copies became 0.
      - t: |
          0
        why: "That needs int& h."
      - t: |
          5
        why: "All three 5s remain: 15."
      - t: Compile error
        why: It compiles, with a warning.
    answer: 0
    hints:
      - "int h, not int& h."
      - Does editing a copy change the original?
    short: "h is a copy, so hp stays [5, 5, 5]."
    explain: "`for (int h : hp)` copies each element into h. `h = 0;` changes only the copy, so hp is still [5, 5, 5] and the sum is 15. g++ warns \"variable 'h' set but not used\": a big hint. Use `for (int& h : hp)` to change the real elements."
  - id: w7.l3.c2
    type: mcq
    tags: [ w7.ref-loop ]
    prompt: Which loop header makes `s *= 2` double the scores stored IN the vector?
    code: |-
      for (___) {
          s *= 2;
      }
    expect: skip
    options:
      - t: "int& s : scores"
        why: s IS each element, so it sticks.
      - t: "int s : scores"
        why: s is a copy; the change is lost.
      - t: "const int& s : scores"
        why: const can't be changed. Won't compile.
      - t: "s : scores"
        why: Needs a type. Won't compile.
    answer: 0
    hints:
      - Change elements, not copies.
      - Look for a non-const &.
    short: "int& changes the real elements."
    explain: "Only a non-const reference (`int& s` or `auto& s`) lets the loop body change the elements. `int s` doubles a copy, and `const int& s` refuses to compile when you assign."
  - id: w7.l3.c3
    type: fill
    tags: [ w7.range-for, w6.constref ]
    prompt: Fill in the loop variable's type so names are read-only and never copied.
    code: |-
      #include <iostream>
      #include <string>
      #include <vector>

      int main() {
          std::vector<std::string> party{"Curlo", "Brace", "Semi"};
          for (___ name : party) {
              std::cout << name << '\n';
          }
          return 0;
      }
    accept:
      - const std::string&
      - const auto&
      - std::string const&
      - auto const&
    placeholder: loop variable type
    hints:
      - "No copy: &. Read-only: ..."
      - Like a World 6 read-only parameter.
    short: "const& reads without copying."
    explain: "`const std::string&` (or `const auto&`) refers to each string without copying it, and const makes sure the loop can't change it by accident. Plain `std::string name` works too, but copies every string."
  - id: w7.l3.c4
    type: order
    tags: [ w7.range-for, w7.push-back ]
    prompt: "Order the lines so the program prints `4 9 2 5 `."
    lines:
      - "#include <vector>"
      - "std::vector<int> coins{4, 9, 2};"
      - coins.push_back(5);
      - "for (int c : coins) {"
      - "    std::cout << c << ' ';"
      - "}"
    distractors:
      - "for (int c = coins) {"
    hints:
      - Add the 5 before the loop runs.
      - "Range-for uses a colon."
    short: Push the 5 before looping.
    explain: "The vector must exist before push_back, and the 5 must be added before the loop so it gets printed. Range-for uses `:`, not `=`."
  - id: w7.l3.c5
    type: review
    tags: [ w7.range-for, w7.invalidation, w7.bounds ]
    bug: iterator-invalidation
    unsafe: true
    prompt: "Code review: tap every dangerous line, then submit."
    code: |-
      #include <iostream>
      #include <string>
      #include <vector>

      int main() {
          std::vector<std::string> loot{"gem", "coin"};
          for (const std::string& item : loot) {
              if (item == "gem") {
                  loot.push_back("gem shard");
              }
          }
          for (const std::string& item : loot) {
              std::cout << item << '\n';
          }
          std::cout << loot[loot.size()] << '\n';
          return 0;
      }
    dangerous: [ 8, 14 ]
    lineNotes:
      "6": "Fine on its own: a read-only loop."
      "8": "push_back mid-loop can move the elements: item and the loop now dangle. UB."
      "11": "Fine: reads each element, changes nothing."
      "14": "loot[loot.size()] is one past the end: UB."
    hints:
      - Anything added WHILE looping?
      - Is index size() valid?
    short: "Don't grow a vector mid-loop; [size()] is past the end."
    explain: "push_back can move all elements to a bigger block of memory, leaving the loop's hidden iterator and `item` pointing at freed memory: undefined behavior (it may seem fine with 2 elements and break with 20). Collect new items in a separate vector and add them after the loop. And the last valid index is size() minus 1, so loot[loot.size()] reads past the end."
    sideBySide:
      unsafe: |-
        #include <string>
        #include <vector>

        std::vector<std::string> loot{"gem", "coin"};
        for (const std::string& item : loot) {
            if (item == "gem") {
                loot.push_back("gem shard");   // UB: loop may dangle
            }
        }
      hardened: |-
        #include <string>
        #include <vector>

        std::vector<std::string> loot{"gem", "coin"};
        std::vector<std::string> found;
        for (const std::string& item : loot) {
            if (item == "gem") {
                found.push_back("gem shard");
            }
        }
        for (const std::string& f : found) {
            loot.push_back(f);   // safe: not looping over loot now
        }
  - id: w7.l3.c6
    type: predict
    tags: [ w7.ref-loop, w5.for ]
    prompt: What does this print?
    code: |-
      #include <iostream>
      #include <vector>

      int main() {
          std::vector<int> v{1, 2, 3};
          for (int& x : v) {
              x = x * x;
          }
          for (int x : v) {
              std::cout << x;
          }
          std::cout << '\n';
          return 0;
      }
    options:
      - t: |
          149
        why: Squares stick, no spaces.
      - t: |
          123
        why: "int& x makes the squares stick."
      - t: |
          1 4 9
        why: No space is printed.
      - t: |
          14
        why: Range-for visits EVERY element.
    answer: 0
    hints:
      - The first loop uses int&.
      - Are any spaces printed?
    short: "int& squares v in place."
    explain: "The first loop takes each element by reference and squares it, so v becomes [1, 4, 9]. The second loop reads copies and prints them back to back: \"149\" and a newline."
recap:
  - Range-for visits every element.
  - "int x: a copy. Changes don't stick."
  - "const auto&: read without copying."
  - "int& x: change elements in place."
vault:
  - id: w7.range-for
    title: Range-for, three ways
    code: |-
      #include <string>
      #include <vector>

      std::vector<int> v{1, 2, 3};
      std::vector<std::string> names{"Curlo"};
      for (int x : v) { }                  // copy: changes don't stick
      for (const auto& name : names) { }   // read only, no copy
      for (int& x : v) { x *= 2; }         // change in place
    note: Don't add to or erase from a vector while range-for looping over it.
    defense: false
reviewTags: [ w5.for, w6.constref, w7.vector, w7.push-back ]
