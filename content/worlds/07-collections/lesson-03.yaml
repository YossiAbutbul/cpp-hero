# World 7 · Lesson 3: Loop the whole collection (range-based for)

id: w7.l3
title: Loop the whole collection
skill: logic
shield: false
concept:
  short: "Range-for visits every element: by value copies, const& reads without copying, & changes the real thing."
  analogy: "By value you get a photocopy, const& a look through glass, & the real thing in your hands."
  body:
    - "`for (int x : v) { ... }` runs once per element, in order, with x set to each one. No index, no bounds to get wrong: World 5's off-by-one can't happen here."
    - "**By value** (`int x`): x is a copy. Changing x doesn't change the vector. Fine for small types like int, double or char."
    - "**By const reference** (`const std::string& name`): no copy, read-only. The default for anything bigger than a number, for the same reason World 6 passes big parameters as const refs."
    - "**By reference** (`int& x`): x IS the element, so `x *= 2;` changes the vector itself."
    - "`auto` works too: `for (const auto& item : bag)`. Need the index as well? Use a classic loop: `for (std::size_t i = 0; i < v.size(); ++i)`."
    - "Don't push_back to (or erase from) the vector you're range-for looping over: it can pull the floor out from under the loop. The Shield lesson shows why."
  pitfall: "Common beginner mistake: `for (int x : v) { x = 0; }` and expecting v to be all zeros. x was a copy. You need `int& x`. (g++ even warns: \"variable 'x' set but not used\".)"
demo:
  code: |-
    #include <iostream>
    #include <vector>

    int main() {
        std::vector<int> v{1, 2, 3};
        for (int x : v) {
            x *= 10;
        }
        for (int& x : v) {
            x *= 10;
        }
        for (const int& x : v) {
            std::cout << x << ' ';
        }
        std::cout << '\n';
        return 0;
    }
  steps:
    - line: 4
      vars:
        v: "[1, 2, 3]"
    - line: 5
      vars:
        v: "[1, 2, 3]"
        x: "1"
      note: "By value: x is a COPY of the first element."
    - line: 6
      vars:
        v: "[1, 2, 3]"
        x: "10"
      note: Only the copy changes. v is untouched.
    - line: 8
      vars:
        v: "[1, 2, 3]"
      note: "int& x: now x IS each element in turn."
    - line: 9
      vars:
        v: "[10, 2, 3]"
      note: Changing x changes v[0] itself.
    - line: 9
      vars:
        v: "[10, 20, 30]"
      note: Loop finished. Every element changed in place.
    - line: 12
      out: "10 "
      note: "const int&: read-only, no copy."
    - line: 12
      out: "20 "
    - line: 12
      out: "30 "
    - line: 14
      out: "\n"
      note: One newline to finish the line.
    - line: 15
      note: "Copy, change, read: three ways to walk a vector."
challenges:
  - id: w7.l3.c1
    type: predict
    tags: [ w7.range-for, w5.range ]
    prompt: "Trying to reset every hp to 0. What does this print? (g++ warns here. Why?)"
    expect: warn
    code: |-
      #include <iostream>
      #include <vector>

      int main() {
          std::vector<int> hp{5, 5, 5};
          for (int h : hp) {
              h = 0;
          }
          std::cout << hp[0] + hp[1] + hp[2] << '\n';
          return 0;
      }
    options:
      - t: |
          15
        why: "Correct: h is a copy. Setting the copy to 0 never touches hp."
      - t: |
          0
        why: "That would need int& h. By value, each h is a throwaway copy."
      - t: |
          5
        why: All three 5s are untouched, so the sum is 15.
      - t: Compile error
        why: "It compiles, just with a warning: variable 'h' set but not used."
    answer: 0
    hints:
      - "int h, not int& h: what is h?"
      - Does changing a photocopy change the original?
    short: "By value, h is a copy: hp stays [5, 5, 5], sum 15."
    explain: "`for (int h : hp)` copies each element into h. `h = 0;` changes only the copy, so hp is still [5, 5, 5] and the sum is 15. g++ warns \"variable 'h' set but not used\": a big hint. Use `for (int& h : hp)` to change the real elements."
  - id: w7.l3.c2
    type: mcq
    tags: [ w7.ref-loop ]
    prompt: Which loop header lets you double every score IN the vector?
    code: |-
      for (___) {
          s *= 2;
      }
    expect: skip
    options:
      - t: "int& s : scores"
        why: "Correct: s refers to each real element, so s *= 2 changes the vector."
      - t: "int s : scores"
        why: s is a copy; the doubled value is thrown away each pass.
      - t: "const int& s : scores"
        why: const means read-only, so s *= 2 is a compile error.
      - t: "s : scores"
        why: The loop variable needs a type (or auto). This doesn't compile.
    answer: 0
    hints:
      - You want to change the elements, not copies.
      - Which one is a non-const reference?
    short: "int& s changes the real elements; int s changes copies."
    explain: "Only a non-const reference (`int& s` or `auto& s`) lets the loop body change the elements. `int s` doubles a copy, and `const int& s` refuses to compile when you assign."
  - id: w7.l3.c3
    type: fill
    tags: [ w7.range-for, w6.const-ref ]
    prompt: Print every name without copying any strings, and without being able to change them.
    code: |-
      #include <iostream>
      #include <string>
      #include <vector>

      int main() {
          std::vector<std::string> party{"Curlo", "Brace", "Semi"};
          for (___ name : party) {
              std::cout << name << '\n';
          }
          return 0;
      }
    accept:
      - const std::string&
      - const auto&
      - std::string const&
      - auto const&
    placeholder: loop variable type
    hints:
      - "No copy means a reference. Read-only means..."
      - Same as a World 6 read-only parameter.
    short: "const std::string& reads each name with no copy."
    explain: "`const std::string&` (or `const auto&`) refers to each string without copying it, and const makes sure the loop can't change it by accident. Plain `std::string name` works too, but copies every string."
  - id: w7.l3.c4
    type: order
    tags: [ w7.range-for, w7.push-back ]
    prompt: "Order the lines so the program prints `4 9 2 5 `."
    lines:
      - "#include <vector>"
      - "std::vector<int> coins{4, 9, 2};"
      - coins.push_back(5);
      - "for (int c : coins) {"
      - "    std::cout << c << ' ';"
      - "}"
    distractors:
      - "for (int c = coins) {"
    hints:
      - The 5 must be in the vector before the loop runs.
      - "Range-for uses a colon: for (int c : coins)."
    short: Declare, push_back 5, then loop and print each coin.
    explain: "The vector must exist before push_back, and the 5 must be added before the loop so it gets printed. Range-for uses `:`, not `=`."
  - id: w7.l3.c5
    type: review
    tags: [ w7.range-for, w7.invalidation, w7.bounds ]
    bug: iterator-invalidation
    unsafe: true
    prompt: "Code review: tap every dangerous line, then submit."
    code: |-
      #include <iostream>
      #include <string>
      #include <vector>

      int main() {
          std::vector<std::string> loot{"gem", "coin"};
          for (const std::string& item : loot) {
              if (item == "gem") {
                  loot.push_back("gem shard");
              }
          }
          for (const std::string& item : loot) {
              std::cout << item << '\n';
          }
          std::cout << loot[loot.size()] << '\n';
          return 0;
      }
    dangerous: [ 8, 14 ]
    lineNotes:
      "6": "Fine on its own: a read-only loop."
      "8": "push_back mid-loop can move the elements: item and the loop now dangle. UB."
      "11": "Fine: reads each element, changes nothing."
      "14": "loot[loot.size()] is one past the end: UB."
    hints:
      - Is anything added to the vector WHILE it's being looped over?
      - What is the last valid index of a vector?
    short: "Never grow a vector mid range-for; [size()] is past the end."
    explain: "push_back can move all elements to a bigger block of memory, leaving the loop's hidden iterator and `item` pointing at freed memory: undefined behavior (it may seem fine with 2 elements and break with 20). Collect new items in a separate vector and add them after the loop. And the last valid index is size() - 1, so loot[loot.size()] reads past the end."
    sideBySide:
      unsafe: |-
        #include <string>
        #include <vector>

        std::vector<std::string> loot{"gem", "coin"};
        for (const std::string& item : loot) {
            if (item == "gem") {
                loot.push_back("gem shard");   // UB: loop may dangle
            }
        }
      hardened: |-
        #include <string>
        #include <vector>

        std::vector<std::string> loot{"gem", "coin"};
        std::vector<std::string> found;
        for (const std::string& item : loot) {
            if (item == "gem") {
                found.push_back("gem shard");
            }
        }
        for (const std::string& f : found) {
            loot.push_back(f);   // safe: not looping over loot now
        }
  - id: w7.l3.c6
    type: predict
    tags: [ w7.ref-loop, w5.range ]
    prompt: What does this print?
    code: |-
      #include <iostream>
      #include <vector>

      int main() {
          std::vector<int> v{1, 2, 3};
          for (int& x : v) {
              x = x * x;
          }
          for (int x : v) {
              std::cout << x;
          }
          std::cout << '\n';
          return 0;
      }
    options:
      - t: |
          149
        why: "Correct: int& squares each element in place: [1, 4, 9], printed with no spaces."
      - t: |
          123
        why: "int& x is a reference, so the squares stick in v."
      - t: |
          1 4 9
        why: Nothing prints a space between the numbers.
      - t: |
          14
        why: Range-for visits EVERY element, including the last one.
    answer: 0
    hints:
      - The first loop uses int&. Does the change stick?
      - Are there any spaces in the output?
    short: "int& x changes v to [1, 4, 9]; it prints 149."
    explain: "The first loop takes each element by reference and squares it, so v becomes [1, 4, 9]. The second loop reads copies and prints them back to back: \"149\" and a newline."
recap:
  - Range-for visits every element, no index needed.
  - "int x: copy. Changes don't stick."
  - "const auto&: read big things without copying."
  - "int& x: change the elements in place."
vault:
  - id: w7.range-for
    title: Range-for, three ways
    code: |-
      #include <string>
      #include <vector>

      std::vector<int> v{1, 2, 3};
      std::vector<std::string> names{"Curlo"};
      for (int x : v) { }                  // copy: changes don't stick
      for (const auto& name : names) { }   // read only, no copy
      for (int& x : v) { x *= 2; }         // change in place
    note: Don't add to or erase from a vector while range-for looping over it.
    defense: false
reviewTags: [ w5.range, w6.const-ref, w7.vector, w7.push-back ]
