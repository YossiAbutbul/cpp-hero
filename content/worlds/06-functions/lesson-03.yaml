# World 6 · Lesson 3: Prototypes, overloads and defaults

id: w6.l3
title: Prototypes, overloads, defaults
skill: structure
shield: false
concept:
  short: "A prototype declares a function before its body; overloads share a name; defaults fill in missing trailing arguments."
  analogy: A prototype is a table of contents entry; it promises the chapter exists, and the pages come later.
  body:
    - "A **declaration** (prototype) tells the compiler a function's return type, name and parameter types, then ends with `;` and no body: `int damage(int attack, int armor);`. A **definition** has the body."
    - "With prototypes at the top, `main()` can call functions whose definitions come further down the file. Big programs put the declarations in header files and the definitions in `.cpp` files."
    - "Declared but never defined? Compiling works, but **linking** fails: `undefined reference to damage(int, int)`. The promise was never kept."
    - "**Overloading**: several functions can share a name if their parameter lists differ: `show(int)` and `show(const std::string&)`. The compiler picks the best match for the argument types. Return type alone can't tell overloads apart."
    - "If no candidate is clearly best, the call is **ambiguous** and won't compile: with only `f(long)` and `f(double)`, `f(5)` needs a conversion either way."
    - "**Default arguments** fill in trailing parameters you leave out: `int heal(int hp, int amount = 10);` lets you call `heal(hp)`. Defaults must be the rightmost parameters, and you write each default **once**, in the declaration, not again in the definition."
  pitfall: "Common beginner mistake: repeating the default in both the prototype and the definition (`int amount = 10` twice). That's a compile error: \"default argument given for parameter 2\"."
demo:
  code: |-
    #include <iostream>
    #include <string>

    void show(int value);
    void show(const std::string& text);
    int heal(int hp, int amount = 10);

    int main() {
        show(heal(5));
        show(heal(5, 2));
        show("Full!");
        return 0;
    }

    void show(int value) {
        std::cout << "HP " << value << '\n';
    }

    void show(const std::string& text) {
        std::cout << text << '\n';
    }

    int heal(int hp, int amount) {
        return hp + amount;
    }
  steps:
    - line: 3
      note: "Prototypes: promises that these functions are defined below."
    - line: 5
      note: amount = 10 is a default argument.
    - line: 8
      push: { name: main }
      note: heal(5) leaves out amount, so it defaults to 10.
    - line: 22
      push: { name: heal, vars: { hp: "5", amount: "10" } }
      note: "push frame: heal(hp=5, amount=10)."
    - line: 23
      pop: { returns: "15" }
      note: "pop frame: return 15."
    - line: 14
      push: { name: show(int), vars: { value: "15" } }
      note: An int argument picks the show(int) overload.
    - line: 15
      out: |
        HP 15
    - line: 22
      pop: true
      push: { name: heal, vars: { hp: "5", amount: "2" } }
      note: "push frame: heal(hp=5, amount=2). No default needed."
    - line: 23
      pop: { returns: "7" }
      note: "pop frame: return 7."
    - line: 15
      push: { name: show(int), vars: { value: "7" } }
      out: |
        HP 7
    - line: 10
      pop: true
      note: Text argument, so the compiler picks the string overload.
    - line: 19
      push: { name: show(string), vars: { text: '"Full!"' } }
      out: |
        Full!
    - line: 11
      pop: true
      note: Three calls, two overloads, one default. Done!
challenges:
  - id: w6.l3.c1
    type: mcq
    tags: [ w6.prototype ]
    prompt: Which line is a declaration (prototype), not a definition?
    options:
      - t: int damage(int attack, int armor);
        why: "Correct: types and name, ending in ; with no body."
      - t: "int damage(int attack, int armor) { return attack - armor; }"
        why: It has a body in { }, so it's a definition (which also declares it).
      - t: damage(10, 3);
        why: That's a call, not a declaration.
      - t: int damage = 10;
        why: That's a variable named damage, not a function.
    answer: 0
    hints:
      - A prototype has no body.
      - Look for the ; right after the parentheses.
    short: A prototype ends with ; and has no body.
    explain: "A prototype gives the return type, name and parameter types, then a semicolon. The definition, with the body, can come later in the file (or in another file)."
  - id: w6.l3.c2
    type: predict
    tags: [ w6.overload, w2.char, w2.double ]
    prompt: Three overloads named describe. What does this print? (Watch the spaces.)
    code: |-
      #include <iostream>

      void describe(int x) {
          std::cout << "int:" << x << ' ';
      }

      void describe(double x) {
          std::cout << "double:" << x << ' ';
      }

      void describe(char x) {
          std::cout << "char:" << x << ' ';
      }

      int main() {
          describe(7);
          describe(2.5);
          describe('A');
          std::cout << '\n';
          return 0;
      }
    options:
      - t: "int:7 double:2.5 char:A \n"
        why: "Correct: each argument's type exactly matches one overload."
      - t: "int:7 double:2.5 int:65 \n"
        why: "'A' is a char, and describe(char) is an exact match. No conversion to int needed."
      - t: "int:7 int:2 char:A \n"
        why: 2.5 is a double literal, so describe(double) is the exact match.
      - t: "double:7 double:2.5 char:A \n"
        why: 7 is an int literal; describe(int) matches exactly.
    answer: 0
    hints:
      - What type is each literal? 7, 2.5, 'A'.
      - An exact type match always wins.
    short: "Each argument picks the overload whose parameter type matches exactly."
    explain: '7 is an int, 2.5 is a double, ''A'' is a char, and each has an exact-match overload. Each call prints a trailing space, so the output is "int:7 double:2.5 char:A " and a newline.'
  - id: w6.l3.c3
    type: bug
    tags: [ w6.default, w6.prototype ]
    prompt: This does NOT compile. Tap the buggy line, then pick the fix.
    code: |-
      #include <iostream>

      int heal(int hp, int amount = 10);

      int main() {
          std::cout << heal(5) << '\n';
          return 0;
      }

      int heal(int hp, int amount = 10) {
          return hp + amount;
      }
    expect: error
    bugLine: 9
    options:
      - t: int heal(int hp, int amount) {
        why: "Correct: the default lives in the prototype only. The definition just names the parameters."
      - t: int heal(int hp, int amount = 5) {
        why: Any default in the definition repeats one from the prototype. Still an error.
      - t: int heal(int hp = 0, int amount = 10) {
        why: Adds more defaults in the definition. Still an error.
      - t: int heal(int hp, int amount);
        why: Now there's no body at all, so linking fails with "undefined reference".
    answer: 0
    hints:
      - The default is written twice. Where should it live?
      - The caller sees the prototype, so that's where the default belongs.
    short: Write the default once, in the prototype; drop it from the definition.
    explain: "A default argument may be given only once. Callers see the declaration, so put it there and leave it out of the definition: `int heal(int hp, int amount) { ... }`."
    sideBySide:
      unsafe: |-
        int heal(int hp, int amount = 10);
        int heal(int hp, int amount = 10) {   // error: default repeated
            return hp + amount;
        }
      expect: error
      hardened: |-
        #include <iostream>

        int heal(int hp, int amount = 10);   // default here only

        int main() {
            std::cout << heal(5) << '\n';     // 15
        }

        int heal(int hp, int amount) {
            return hp + amount;
        }
  - id: w6.l3.c4
    type: fill
    tags: [ w6.default ]
    prompt: Make bonus optional, defaulting to 0, so attack(8) compiles.
    code: |-
      #include <iostream>

      int attack(int power, int bonus ___);

      int main() {
          std::cout << attack(8) << ' ' << attack(8, 4) << '\n';
          return 0;
      }

      int attack(int power, int bonus) {
          return power + bonus;
      }
    accept:
      - "= 0"
    placeholder: default value
    hints:
      - A default is written with = after the parameter name.
      - It goes in the prototype, not the definition.
    short: int bonus = 0 lets callers leave bonus out.
    explain: "`int bonus = 0` in the prototype means attack(8) is treated as attack(8, 0). The program prints \"8 12\"."
  - id: w6.l3.c5
    type: mcq
    tags: [ w6.overload ]
    prompt: Only these two overloads exist. What happens with the call f(5)?
    code: |-
      void f(long x);
      void f(double x);

      f(5);
    expect: error
    options:
      - t: "Compile error: the call is ambiguous"
        why: "Correct: 5 is an int. int to long and int to double are equally good conversions."
      - t: It calls f(long), because long is closer to int
        why: Both are ranked as plain conversions. Neither beats the other, so it's ambiguous.
      - t: It calls f(double), because double is bigger
        why: Size doesn't decide overloads. Both conversions rank the same.
      - t: It compiles but crashes at runtime
        why: Overload resolution happens at compile time. The error is reported before any run.
    answer: 0
    hints:
      - Is there an overload taking exactly an int?
      - If two conversions are equally good, who wins?
    short: Two equally good conversions make the call ambiguous, a compile error.
    explain: 'There''s no f(int). Converting int to long and int to double rank the same, so g++ reports "call of overloaded f(int) is ambiguous". Add an f(int) overload or pass 5L / 5.0.'
  - id: w6.l3.c6
    type: predict
    tags: [ w6.default, w5.for ]
    prompt: A default argument meets a loop. What does this print?
    code: |-
      #include <iostream>

      void stars(int n = 3) {
          for (int i = 0; i < n; ++i) {
              std::cout << '*';
          }
          std::cout << '\n';
      }

      int main() {
          stars();
          stars(1);
          return 0;
      }
    options:
      - t: |
          ***
          *
        why: "Correct: stars() uses the default 3; stars(1) prints one star."
      - t: |

          *
        why: stars() doesn't pass 0. A missing argument uses the default, 3.
      - t: |
          ***
          ***
        why: The default is only used when the argument is left out. stars(1) passes 1.
      - t: |
          ****
          **
        why: "i goes 0, 1, 2 for n = 3: the loop runs exactly n times."
    answer: 0
    hints:
      - What is n when no argument is given?
      - i < n with i starting at 0 runs n times.
    short: stars() means stars(3); stars(1) prints one star.
    explain: 'The first call uses the default: 3 stars. The second passes 1. Each call ends its line with a newline: "***", then "*".'
recap:
  - "Prototype: a declaration ending in ; with no body."
  - "Declared but never defined: linker error."
  - Overloads differ by parameter types, not return type.
  - Defaults go on trailing parameters, written once.
vault:
  - id: w6.prototype
    title: Prototype first, body later
    code: |-
      #include <iostream>

      int heal(int hp, int amount = 10);   // declaration + default

      int main() {
          std::cout << heal(5) << '\n';     // 15
          std::cout << heal(5, 2) << '\n';  // 7
      }

      int heal(int hp, int amount) {       // definition: no default here
          return hp + amount;
      }
    note: Defaults live in the declaration only. Declared but never defined gives a linker error.
    defense: false
  - id: w6.overload
    title: Overloading
    code: |-
      #include <iostream>
      #include <string>

      void show(int value) { std::cout << "HP " << value << '\n'; }
      void show(const std::string& text) { std::cout << text << '\n'; }

      int main() {
          show(42);       // show(int)
          show("Hi");     // show(const std::string&)
      }
    note: Overloads need different parameter lists. Equal-rank conversions make a call ambiguous.
    defense: false
reviewTags: [ w2.double, w2.char, w6.call, w6.params ]
