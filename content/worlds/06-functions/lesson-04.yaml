# World 6 · Lesson 4: Scope and lifetime (stack frames)

id: w6.l4
title: Scope and lifetime
skill: memory
shield: false
concept:
  short: A local lives only inside its block. When a function returns, its locals vanish.
  analogy: "A stack frame is a hotel room: yours at check-in, emptied at check-out."
  body:
    - "**Scope** is where a name can be used. A variable declared inside `{ }` is visible from its declaration to that block's closing `}`. Parameters are in scope for their whole function."
    - "**Lifetime** is when the variable actually exists. A local is created when execution reaches it and destroyed at the end of its block. Every call gets **fresh** locals: a local does not remember its value from the previous call."
    - "Each call **pushes** a stack frame holding its parameters and locals, and `return` **pops** it. That's why two calls of the same function get independent variables, and why one function can't see another's locals. Check-in is the call; check-out is the return."
    - "Two functions can both have a local named `hp` without clashing: they're different variables in different frames."
    - "An inner block may declare a name that **shadows** an outer one. It compiles, but the outer variable is hidden until the inner `}`, which confuses readers. Prefer distinct names (`-Wshadow` warns)."
    - "Global variables (declared outside every function) live for the whole program and any function can change them, which makes bugs hard to trace. Pass values in and return results out instead."
  pitfall: "Common beginner mistake: counting calls with a local `int count{0}; ++count;` and expecting it to keep growing. It restarts at 0 every call, because every call gets a brand-new frame."
demo:
  code: |-
    #include <iostream>

    int roll(int sides) {
        int result = sides / 2 + 1;
        return result;
    }

    int main() {
        int total{0};
        total += roll(6);
        total += roll(4);
        std::cout << "Total: " << total << '\n';
        return 0;
    }
  steps:
    - line: 8
      push: { name: main, vars: { total: "0" } }
      note: main's frame holds total.
    - line: 9
      push: { name: roll, vars: { sides: "6" } }
      note: "push frame: roll(sides=6)."
    - line: 3
      vars:
        result: "4"
      note: "result lives only in roll's frame."
    - line: 4
      pop: { returns: "4" }
      note: "pop frame: return 4. sides and result vanish."
    - line: 9
      vars:
        total: "4"
      note: Back in main, total is 4.
    - line: 10
      push: { name: roll, vars: { sides: "4" } }
      note: "push frame: a brand-new roll frame."
    - line: 3
      vars:
        result: "3"
      note: A fresh result. Nothing left over.
    - line: 4
      pop: { returns: "3" }
      note: "pop frame: return 3."
    - line: 10
      vars:
        total: "7"
      note: total is now 7.
    - line: 11
      out: |
        Total: 7
    - line: 12
      note: main's frame pops last.
challenges:
  - id: w6.l4.c1
    type: mcq
    tags: [ w6.scope ]
    prompt: Can main() print `result` like this?
    code: |-
      #include <iostream>

      int roll(int sides) {
          int result = sides / 2 + 1;
          return result;
      }

      int main() {
          roll(6);
          std::cout << result << '\n';
          return 0;
      }
    expect: error
    options:
      - t: "No: compile error, result isn't in scope in main"
        why: result belongs to roll, not main.
      - t: Yes, it prints 4
        why: main has no variable named result.
      - t: Yes, but it prints garbage
        why: It never compiles, so it never runs.
      - t: Only because roll(6) was called first
        why: Calling roll doesn't make its locals visible.
    answer: 0
    hints:
      - Where is result declared?
    short: "result is local to roll; main can't name it."
    explain: "Scope is decided by where code is written, not by what ran before: result is declared inside roll, so only roll's body can use it. g++ says \"'result' was not declared in this scope\". To use the value, store the return: `int r = roll(6);`."
  - id: w6.l4.c2
    type: predict
    tags: [ w6.lifetime, w6.call ]
    prompt: What does this print?
    code: |-
      #include <iostream>

      int countCall() {
          int count{0};
          ++count;
          return count;
      }

      int main() {
          std::cout << countCall() << countCall() << countCall() << '\n';
          return 0;
      }
    options:
      - t: |
          111
        why: Each call gets a new count, from 0 to 1.
      - t: |
          123
        why: A local doesn't survive between calls.
      - t: |
          321
        why: Every call returns 1, whatever the order.
      - t: |
          000
        why: ++count runs before the return.
    answer: 0
    hints:
      - Does count remember anything after returning?
    short: A fresh count every call, so each returns 1.
    explain: 'count is created at 0 on every call and destroyed on return, so each call returns 1. Output: "111" and a newline. (Since C++17 a << chain runs left to right, but here the order wouldn''t matter anyway.) To keep a running count, pass it in and return the new value.'
  - id: w6.l4.c3
    type: predict
    tags: [ w6.scope ]
    prompt: An inner block reuses a name. What does this print?
    code: |-
      #include <iostream>

      int main() {
          int hp{10};
          {
              int hp{3};
              std::cout << hp << ' ';
          }
          std::cout << hp << '\n';
          return 0;
      }
    options:
      - t: |
          3 10
        why: Inner hp prints 3, then outer hp prints 10.
      - t: |
          3 3
        why: The outer hp was never changed.
      - t: |
          10 10
        why: Inside the block, hp means the inner 3.
      - t: Compile error
        why: Shadowing is legal, just confusing.
    answer: 0
    hints:
      - "After the inner }, which hp is left?"
    short: The inner hp hides the outer one until its }.
    explain: 'The inner `int hp{3};` is a new, separate variable that shadows the outer hp inside its block. At the }, it dies, and hp means the outer 10 again. Output: "3 10" and a newline. Legal, but prefer distinct names.'
  - id: w6.l4.c4
    type: write
    tags: [ w6.return, w6.lifetime ]
    prompt: nextTurn(t) returns t + 1. Write one line that adds 1 to `turn` using it.
    prelude: "auto nextTurn = [](int t) { return t + 1; }; int turn{0};"
    accept:
      - turn = nextTurn(turn);
    placeholder: turn = ...
    hints:
      - Store the returned value back into turn.
    short: turn = nextTurn(turn); stores the new value.
    explain: "The function receives a copy, so it can't touch main's turn directly. It returns the new value, and main stores it: `turn = nextTurn(turn);`. No globals needed."
  - id: w6.l4.c5
    type: bug
    tags: [ w6.scope, w5.while ]
    prompt: "lastHit is out of scope at the print. Tap the buggy line, then pick the fix."
    code: |-
      #include <iostream>

      int main() {
          int turn{0};
          while (turn < 3) {
              int lastHit = turn * 2;
              ++turn;
          }
          std::cout << "Last hit: " << lastHit << '\n';
          return 0;
      }
    expect: error
    bugLine: 5
    options:
      - t: "lastHit = turn * 2;   // with int lastHit{0}; declared before the loop"
        why: Declared before the loop, it lives past it.
      - t: int lastHit{turn * 2};
        why: Still inside the loop, so it still dies at }.
      - t: int lastHit = turn * 2; return lastHit;
        why: main returns early. Nothing prints.
      - t: "int lastHit = (turn * 2);"
        why: Parentheses don't change scope.
    answer: 0
    hints:
      - Where does a variable declared in the loop die?
      - Declare it where the print can see it.
    short: Declare lastHit before the loop so it outlives it.
    explain: "A variable declared inside the loop body is destroyed at the body's } on every pass. Declare `int lastHit{0};` before the loop and assign inside it; then the print after the loop can see the last value (4)."
    sideBySide:
      unsafe: |-
        while (turn < 3) {
            int lastHit = turn * 2;   // dies at }
            ++turn;
        }
        std::cout << lastHit;         // error: not in scope
      expect: error
      hardened: |-
        int lastHit{0};
        while (turn < 3) {
            lastHit = turn * 2;
            ++turn;
        }
        std::cout << "Last hit: " << lastHit << '\n';
      prelude: int turn{0};
  - id: w6.l4.c6
    type: mcq
    tags: [ w6.scope, w6.lifetime ]
    prompt: "Both functions declare `int hp`. What happens?"
    code: |-
      int heal(int x) {
          int hp = x + 5;
          return hp;
      }

      int hurt(int x) {
          int hp = x - 5;
          return hp;
      }

      int main() {
          return heal(1) + hurt(9);
      }
    options:
      - t: They are two separate variables that never clash
        why: Each hp lives in its own function's frame.
      - t: "Compile error: hp is defined twice"
        why: Different scopes may reuse a name.
      - t: They share one variable, so the second overwrites the first
        why: Functions never share locals.
      - t: The one in the later function hides the earlier one everywhere
        why: Neither hp is visible outside its function.
    answer: 0
    hints:
      - Where does each hp live?
    short: Same name in two functions means two variables.
    explain: Each hp is local to its function and lives in that call's frame. They can't see or overwrite each other. Only the same scope forbids reusing a name. main returns 6 + 4 = 10.
recap:
  - "A name works until its block's }."
  - Locals are fresh on every call.
  - return pops the frame and its locals.
  - Same name, two functions, two variables.
vault:
  - id: w6.scope
    title: Scope and lifetime
    code: |-
      #include <iostream>

      int roll(int sides) {        // sides lives in roll's frame
          int result = sides / 2;  // local: created on every call
          return result;           // value copied out, frame popped
      }

      int main() {
          int r = roll(6);         // store it: result itself is gone
          std::cout << r << '\n';
      }
    note: A local lives from its declaration to its block's }. Nothing survives between calls.
    defense: false
reviewTags: [ w5.while, w5.for, w6.params, w6.return ]
