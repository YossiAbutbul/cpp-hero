# World 6 boss: The Scope Sentinel

id: w6.boss
name: The Scope Sentinel
art: sentinel
hp: 7
intro: HALT. I AM THE SCOPE SENTINEL. NOTHING LEAVES ITS SCOPE ALIVE... EXCEPT BY VALUE.
taunt:
  - YOUR LOCALS ARE MINE THE MOMENT YOU RETURN.
  - RETURN ME A REFERENCE. I PROMISE IT IS STILL THERE.
  - IGNORE THAT RESULT. NOTHING BAD EVER HAPPENS. PROBABLY.
  - LEVEL ZERO? YOUR FUNCTION FORGOT THAT PATH. I DID NOT.
rounds:
  - id: w6.boss.r1
    type: predict
    tags: [ w6.call, w6.return ]
    prompt: The Sentinel stacks frames on frames. What does this print?
    code: |-
      #include <iostream>

      int twice(int x) {
          return x * 2;
      }

      int plusOne(int x) {
          return x + 1;
      }

      int main() {
          std::cout << twice(plusOne(3)) << ' ' << plusOne(twice(3)) << '\n';
          return 0;
      }
    options:
      - t: |
          8 7
        why: "Correct: the inner call runs first. twice(4) = 8, then plusOne(6) = 7."
      - t: |
          7 8
        why: "Inner calls run first: twice(plusOne(3)) is twice(4) = 8."
      - t: |
          8 8
        why: Order matters. (3 * 2) + 1 is 7, not 8.
      - t: |
          7 7
        why: (3 + 1) * 2 is 8, not 7.
    answer: 0
    hints:
      - An argument must be computed before the call can start.
      - Work from the innermost parentheses outward.
    short: "Innermost call first: twice(4) = 8, plusOne(6) = 7."
    explain: 'To call twice(plusOne(3)), plusOne(3) must return first (4), then twice(4) = 8. In the other order, twice(3) = 6, then plusOne(6) = 7. Output: "8 7" and a newline.'
  - id: w6.boss.r2
    type: mcq
    tags: [ w6.overload ]
    prompt: Which pair CANNOT coexist as overloads?
    options:
      - t: int roll(int sides); and double roll(int sides);
        why: "Correct: same parameter list, only the return type differs. That's a compile error."
      - t: void show(int); and void show(double);
        why: Different parameter types. A valid overload set.
      - t: void hit(int); and void hit(int, int);
        why: Different number of parameters. Valid.
      - t: void say(char); and void say(const std::string&);
        why: Different parameter types. Valid.
    answer: 0
    hints:
      - What does the compiler use to choose an overload?
      - A call doesn't mention the return type.
    short: Overloads must differ in parameters; return type alone isn't enough.
    explain: The compiler picks an overload from the arguments of a call, and roll(6) would look identical for both. So functions that differ only by return type are an error.
  - id: w6.boss.r3
    type: predict
    tags: [ w6.byvalue, w6.scope ]
    prompt: The Sentinel tries to change your hp through a copy. What does this print?
    code: |-
      #include <iostream>

      int shield(int hp) {
          hp += 5;
          return hp * 2;
      }

      int main() {
          int hp{3};
          int power = shield(hp);
          std::cout << hp << ' ' << power << '\n';
          return 0;
      }
    options:
      - t: |
          3 16
        why: "Correct: the copy becomes 8 and 8 * 2 = 16 comes back. main's hp stays 3."
      - t: |
          8 16
        why: shield changed its own copy. main's hp is a different variable.
      - t: |
          3 6
        why: hp += 5 runs first on the copy, so 8 * 2 is returned.
      - t: |
          8 6
        why: "Both wrong: main's hp is untouched, and the copy is 8 before doubling."
    answer: 0
    hints:
      - The parameter is a copy of 3.
      - The copy is changed before the multiplication.
    short: main's hp stays 3; the copy becomes 8 and returns 16.
    explain: 'shield''s hp is a copy: 3 + 5 = 8, returns 16. main''s hp is still 3. Output: "3 16" and a newline.'
  - id: w6.boss.r4
    type: predict
    tags: [ w6.default, w5.for, w5.offbyone ]
    prompt: A default argument and a loop. What does this print?
    code: |-
      #include <iostream>

      int sumTo(int n, int start = 1) {
          int total{0};
          for (int i = start; i <= n; ++i) {
              total += i;
          }
          return total;
      }

      int main() {
          std::cout << sumTo(4) << ' ' << sumTo(4, 3) << '\n';
          return 0;
      }
    options:
      - t: |
          10 7
        why: "Correct: 1 + 2 + 3 + 4 = 10, and 3 + 4 = 7."
      - t: |
          6 3
        why: "That's i < n, stopping one early. <= includes n itself."
      - t: |
          10 10
        why: The second call passes start = 3, overriding the default.
      - t: |
          9 7
        why: With start = 1 the sum begins at 1, giving 10.
    answer: 0
    hints:
      - sumTo(4) means sumTo(4, 1).
      - "<= n includes n."
    short: "sumTo(4) adds 1..4 = 10; sumTo(4, 3) adds 3 + 4 = 7."
    explain: 'The default start is 1, so sumTo(4) = 1 + 2 + 3 + 4 = 10. sumTo(4, 3) = 3 + 4 = 7. total is a fresh local in each call. Output: "10 7" and a newline.'
  - id: w6.boss.r5
    type: speed
    tags: [ w6.prototype, w6.scope, w6.default, w6.dangling, w6.nodiscard, w6.assert, w4.switch ]
    prompt: SPEED ROUND! The Sentinel sweeps the stack. Answer fast!
    seconds: 45
    items:
      - q: Which line is a prototype?
        options:
          - "f(3);"
          - "int f(int x);"
          - "int f(int x) { return x; }"
        answer: 1
      - q: What does this switch return for n = 2?
        code: |-
          switch (n) {
              case 1: return 'A';
              case 2: return 'B';
              default: return '?';
          }
        prelude: int n{2};
        options:
          - "'A'"
          - "'?'"
          - "'B'"
        answer: 2
      - q: A local variable is destroyed when...
        options:
          - its block ends
          - the program ends
          - main returns
        answer: 0
      - q: Default arguments go on which parameters?
        options:
          - the first ones
          - the trailing (rightmost) ones
          - any of them
        answer: 1
      - q: What does -Wreturn-local-addr warn about?
        options:
          - an unused return value
          - a missing #include
          - returning a reference to a local
        answer: 2
      - q: Ignoring a [[nodiscard]] result gives...
        options:
          - a compiler warning
          - a crash at runtime
          - a linker error
        answer: 0
      - q: Which flag removes every assert?
        options:
          - "-Wall"
          - "-DNDEBUG"
          - "-std=c++20"
        answer: 1
      - q: After f(a), what is a?
        code: |-
          void f(int x) { x = 9; }
          int main() { int a{1}; f(a); }
        expect: warn
        options:
          - "9"
          - garbage
          - "1"
        answer: 2
    hints:
      - "Locals die at their }; copies can't change the caller."
      - "Warnings are clues: -Wreturn-local-addr, [[nodiscard]]."
    short: "Prototypes end in ;, locals die at }, defaults trail, warnings help."
    explain: "A prototype is a body-less declaration. switch(2) hits case 2. Locals die at their block's end. Defaults are trailing. -Wreturn-local-addr flags dangling returns, [[nodiscard]] flags ignored results, -DNDEBUG deletes asserts, and by-value parameters leave a unchanged."
  - id: w6.boss.r6
    type: bug
    tags: [ w6.missing-return, w4.if ]
    unsafe: true
    prompt: "UNSAFE: lootFor(2) is undefined behavior. Tap the buggy line, then pick the fix."
    code: |-
      #include <iostream>

      int lootFor(int level) {
          if (level >= 10) {
              return 50;
          }
          if (level >= 5) {
              return 20;
          }
      }

      int main() {
          std::cout << lootFor(2) << '\n';
          return 0;
      }
    bugLine: 9
    options:
      - t: "    return 5;  (then the closing })"
        why: "Correct: now levels below 5 get a real value. Every path returns."
      - t: "}  // UB is fine if tests pass"
        why: UB can pass tests and still break with another compiler or optimization level.
      - t: "    return;  (then the closing })"
        why: A bare return in an int function is a compile error. It needs a value.
      - t: "    assert(level >= 5);  (then the closing })"
        why: Disappears with NDEBUG, and the path still has no return value.
    answer: 0
    hints:
      - What does lootFor(2) return? Follow each if.
      - g++ says "control reaches end of non-void function".
    short: Add a final return; falling off an int function is UB.
    explain: "For level 2 both ifs are false and execution reaches the closing } of an int function: undefined behavior. It may print 0, garbage or crash. Add a final `return 5;` for the \"none of the above\" case."
    sideBySide:
      unsafe: |-
        int lootFor(int level) {
            if (level >= 10) {
                return 50;
            }
            if (level >= 5) {
                return 20;
            }
        }               // level < 5: no return, UB

        int main() {
            return lootFor(2);
        }
      hardened: |-
        int lootFor(int level) {
            if (level >= 10) {
                return 50;
            }
            if (level >= 5) {
                return 20;
            }
            return 5;   // every path returns
        }

        int main() {
            return lootFor(2);
        }
  - id: w6.boss.r7
    type: harden
    tags: [ w6.constref, w2.string ]
    prompt: The Sentinel feeds you a 10,000-character spellbook on every call. Pick the parameter type.
    code: |-
      #include <iostream>
      #include <string>

      bool isLongName(___ name) {
          return name.size() > 10;
      }

      int main() {
          std::cout << isLongName("Curlo the Magnificent") << '\n';
          return 0;
      }
    options:
      - t: const std::string&
        why: "Correct: no copy, read-only, and it accepts literals like \"Curlo the Magnificent\"."
      - t: std::string
        why: Works, but copies every character on every call.
      - t: std::string&
        why: A non-const reference can't bind to a temporary string from a literal. Compile error here.
      - t: const std::string
        why: Still a full copy; const doesn't prevent that.
    answer: 0
    hints:
      - You only read name.
      - "No copy AND no changes: const plus &."
    short: const std::string& reads big text without copying or changing it.
    explain: 'By value copies the whole string per call. `const std::string&` refers to the caller''s text, promises not to change it, and binds to temporaries like the one made from "Curlo the Magnificent".'
    sideBySide:
      unsafe: |-
        #include <string>

        bool isLongName(std::string name) {        // copies every call
            return name.size() > 10;
        }

        int main() { return isLongName("Curlo") ? 1 : 0; }
      hardened: |-
        #include <string>

        bool isLongName(const std::string& name) { // no copy, read-only
            return name.size() > 10;
        }

        int main() { return isLongName("Curlo") ? 1 : 0; }
  - id: w6.boss.r8
    type: edge
    tags: [ w6.validate, w3.divzero, w3.overflow ]
    unsafe: true
    prompt: "UNSAFE: percent() has no guards. Which calls expose a bug? Select all. (32-bit int.)"
    code: |-
      int percent(int part, int whole) {
          return part * 100 / whole;
      }

      int main() {
          return percent(1, 4);
      }
    options:
      - t: percent(5, 0)
        why: "Exposes it: dividing by zero is UB."
      - t: percent(30000000, 50000000)
        why: "Exposes it: 30000000 * 100 is 3 billion, past the int limit. Signed overflow is UB."
      - t: percent(1, 4)
        why: 100 / 4 = 25. Fine.
      - t: percent(0, 7)
        why: 0 / 7 = 0. Fine.
    answers: [ 0, 1 ]
    hints:
      - Check the divisor, then the multiplication.
      - The largest 32-bit int is about 2.1 billion.
    short: A zero divisor and a huge part both cause UB.
    explain: "whole = 0 divides by zero, and a big part overflows part * 100 before the division. Guard the parameters, and do the multiplication in long long."
    sideBySide:
      unsafe: |-
        int percent(int part, int whole) {
            return part * 100 / whole;
        }

        int main() {
            return percent(1, 4);
        }
      hardened: |-
        // Returns -1 for invalid input.
        [[nodiscard]] int percent(int part, int whole) {
            if (whole <= 0 || part < 0 || part > whole) {
                return -1;
            }
            return static_cast<int>(static_cast<long long>(part) * 100 / whole);
        }

        int main() {
            return percent(1, 4) == 25 ? 0 : 1;
        }
  - id: w6.boss.r9
    type: mcq
    tags: [ w6.dangling, w6.lifetime ]
    bug: dangling-ref
    unsafe: true
    prompt: "This printed \"Meteor\" in your test. Why is it still a bug?"
    code: |-
      #include <iostream>
      #include <string>

      const std::string& bestSpell() {
          std::string name{"Meteor"};
          return name;
      }

      int main() {
          std::cout << bestSpell() << '\n';
          return 0;
      }
    options:
      - t: name is destroyed at the return, so the reference dangles. Using it is UB
        why: "Correct: UB can look fine in one test and print garbage or crash in the next."
      - t: It isn't a bug, since it printed correctly
        why: '"It worked once" proves nothing with UB. g++ even warns about it.'
      - t: Returning std::string by value would be slower and unsafe
        why: By value is safe, and the string is moved out cheaply.
      - t: The const makes the reference safe
        why: const doesn't extend the life of a local. It still dies at the return.
    answer: 0
    hints:
      - When does name die?
      - g++ says "reference to local variable returned".
    short: The local dies at return; the reference dangles. UB, even if it "worked".
    explain: "name lives in bestSpell's frame. The frame pops at the return, so the caller gets a reference to a destroyed string. That's UB: it may print correctly, print junk, or crash. g++ warns with -Wreturn-local-addr. Return std::string by value."
defense:
  - attack: "-50"
    label: Negative argument!
    challenge:
      id: w6.boss.d1
      type: harden
      tags: [ w6.validate, w4.guard ]
      prompt: The Sentinel casts a spell costing -50 mana, which would ADD mana. Pick the guard.
      code: |-
        #include <iostream>

        [[nodiscard]] bool canCast(int mana, int cost) {
            if (___) {
                return false;
            }
            return cost <= mana;
        }

        int main() {
            std::cout << canCast(10, -50) << '\n';
            return 0;
        }
      options:
        - t: cost < 0
          why: "Correct: a negative cost is nonsense, so the cast is refused."
        - t: cost > mana
          why: The last line already handles that. -50 still passes as "affordable".
        - t: mana < 0
          why: Checks the wrong parameter; the curse is in cost.
        - t: cost == -50
          why: Blocks one value. The Sentinel just tries -51.
      answer: 0
      hints:
        - Which parameter is cursed?
        - Block the whole invalid range.
      short: Guard cost < 0 before checking affordability.
      explain: 'Without the guard, -50 <= 10 is true, so the spell "succeeds" and spending it would add mana. Reject impossible arguments first, then answer the real question.'
      sideBySide:
        unsafe: |-
          [[nodiscard]] bool canCast(int mana, int cost) {
              return cost <= mana;   // -50 <= 10: "affordable"!
          }
          int main() { return canCast(10, -50) ? 1 : 0; }
        hardened: |-
          [[nodiscard]] bool canCast(int mana, int cost) {
              if (cost < 0) {
                  return false;      // guard: impossible cost
              }
              return cost <= mana;
          }
          int main() { return canCast(10, -50) ? 1 : 0; }
  - attack: "999"
    label: Out-of-range argument!
    challenge:
      id: w6.boss.d2
      type: harden
      tags: [ w6.validate, w6.assert ]
      prompt: "Valid levels are 1 to 10, and the level comes from player input. Pick the guard that survives a release build."
      code: |-
        #include <iostream>

        [[nodiscard]] int levelBonus(int level) {
            if (___) {
                return 0;
            }
            return level * 5;
        }

        int main() {
            std::cout << levelBonus(999) << '\n';
            return 0;
        }
      options:
        - t: level < 1 || level > 10
          why: "Correct: rejects both sides of the range, in every build."
        - t: level < 1 && level > 10
          why: No number is both below 1 and above 10, so this is never true.
        - t: level > 10
          why: Catches 999 but lets 0 and negatives through.
        - t: assert(level <= 10)
          why: assert is void, so this doesn't compile, and NDEBUG would delete it anyway.
      answer: 0
      hints:
        - Check both ends of the range.
        - Player input needs a real if, not an assert.
      short: "Check both ends with ||: level < 1 || level > 10."
      explain: "Input from the player must be validated with a real check that exists in every build. `level < 1 || level > 10` rejects everything outside 1..10, including 999."
      sideBySide:
        unsafe: |-
          #include <cassert>

          int levelBonus(int level) {
              assert(level >= 1 && level <= 10);   // gone with NDEBUG
              return level * 5;
          }
          int main() { return levelBonus(3) == 15 ? 0 : 1; }
        hardened: |-
          [[nodiscard]] int levelBonus(int level) {
              if (level < 1 || level > 10) {
                  return 0;                        // real check, every build
              }
              return level * 5;
          }
          int main() { return levelBonus(999); }
  - attack: bestScore(3, 7)
    label: Reference to a local!
    challenge:
      id: w6.boss.d3
      type: bug
      tags: [ w6.dangling, w6.lifetime ]
      bug: dangling-ref
      unsafe: true
      prompt: "UNSAFE: the Sentinel slipped a dangling reference into bestScore. Tap the buggy line, then pick the fix."
      code: |-
        #include <iostream>

        const int& bestScore(int a, int b) {
            int best = a > b ? a : b;
            return best;
        }

        int main() {
            std::cout << bestScore(3, 7) << '\n';
            return 0;
        }
      bugLine: 2
      options:
        - t: int bestScore(int a, int b) {
          why: "Correct: return the int by value. The caller gets its own copy of 7."
        - t: "const int& bestScore(const int& a, const int& b) {"
          why: Still returns a reference to the local best, which dies at the return.
        - t: int& bestScore(int a, int b) {
          why: Dropping const doesn't help. It's still a reference to a dead local.
        - t: "const int* bestScore(int a, int b) {"
          why: A pointer to a local dangles too (and return best wouldn't compile).
      answer: 0
      hints:
        - What does the & in the return type refer to?
        - Small values are cheap to copy.
      short: Return int by value; a reference to local best dangles.
      explain: "best lives in bestScore's frame and is destroyed at the return, so the returned reference points at nothing. Using it is UB. g++ warns with -Wreturn-local-addr. An int is tiny: return it by value."
      sideBySide:
        unsafe: |-
          const int& bestScore(int a, int b) {
              int best = a > b ? a : b;
              return best;             // dangling!
          }
          int main() { return bestScore(3, 7); }
        hardened: |-
          int bestScore(int a, int b) {
              return a > b ? a : b;    // by value: safe
          }
          int main() { return bestScore(3, 7); }
  - attack: title(0)
    label: A missing return path!
    challenge:
      id: w6.boss.d4
      type: harden
      tags: [ w6.missing-return, w4.if ]
      prompt: The Sentinel calls title(0). Pick the line that closes the missing path.
      code: |-
        #include <iostream>
        #include <string>

        std::string title(int level) {
            if (level >= 10) {
                return "Champion";
            }
            if (level >= 1) {
                return "Hero";
            }
            ___
        }

        int main() {
            std::cout << title(0) << '\n';
            return 0;
        }
      options:
        - t: return "Unknown";
          why: "Correct: every path now returns a real std::string."
        - t: "// nothing needed"
          why: Falling off the end of a non-void function is UB, often a crash for std::string.
        - t: return;
          why: A non-void function must return a value. Compile error.
        - t: assert(level >= 1);
          why: Deleted by NDEBUG, and the path still falls off the end.
      answer: 0
      hints:
        - What does title(0) reach?
        - Every path of a non-void function needs a return value.
      short: 'Add return "Unknown"; so level 0 gets a real value.'
      explain: 'For level 0 both conditions are false, so execution reaches the closing }. For a std::string function that is UB and often a crash. A final return covers "none of the above".'
      sideBySide:
        unsafe: |-
          #include <string>

          std::string title(int level) {
              if (level >= 1) {
                  return "Hero";
              }
          }                       // title(0): UB
          int main() { return title(1).empty() ? 1 : 0; }
        hardened: |-
          #include <string>

          std::string title(int level) {
              if (level >= 1) {
                  return "Hero";
              }
              return "Unknown";   // every path returns
          }
          int main() { return title(0).empty() ? 1 : 0; }
victory: FRAME... POPPED... The Sentinel's visor clatters down. Every value returned home safely.
reward:
  xp: 225
  cosmetic: sentinel-visor
  bug: dangling-ref
