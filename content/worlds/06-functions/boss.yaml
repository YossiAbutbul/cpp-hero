# World 6 boss: The Scope Sentinel

id: w6.boss
name: The Scope Sentinel
art: sentinel
hp: 7
intro: HALT. NOTHING LEAVES ITS SCOPE ALIVE... EXCEPT BY VALUE.
taunt:
  - YOUR LOCALS ARE MINE THE MOMENT YOU RETURN.
  - RETURN ME A REFERENCE. IT IS STILL THERE. PROMISE.
  - IGNORE THAT RESULT. NOTHING BAD HAPPENS. PROBABLY.
  - LEVEL ZERO? YOUR FUNCTION FORGOT THAT PATH.
rounds:
  - id: w6.boss.r1
    type: predict
    tags: [ w6.call, w6.return ]
    prompt: Calls inside calls. What does this print?
    code: |-
      #include <iostream>

      int twice(int x) {
          return x * 2;
      }

      int plusOne(int x) {
          return x + 1;
      }

      int main() {
          std::cout << twice(plusOne(3)) << ' ' << plusOne(twice(3)) << '\n';
          return 0;
      }
    options:
      - t: |
          8 7
        why: Inner call first. twice(4) = 8, plusOne(6) = 7.
      - t: |
          7 8
        why: twice(plusOne(3)) is twice(4) = 8, printed first.
      - t: |
          8 8
        why: plusOne(twice(3)) is 6 + 1 = 7.
      - t: |
          7 7
        why: twice(plusOne(3)) is 4 * 2 = 8.
    answer: 0
    hints:
      - An argument is computed before the call starts.
    short: "Innermost call first: twice(4) = 8, plusOne(6) = 7."
    explain: 'To call twice(plusOne(3)), plusOne(3) must return first (4), then twice(4) = 8. In the other order, twice(3) = 6, then plusOne(6) = 7. Output: "8 7" and a newline.'
  - id: w6.boss.r2
    type: mcq
    tags: [ w6.overload ]
    prompt: Which pair CANNOT exist together as overloads?
    options:
      - t: int roll(int sides); and double roll(int sides);
        why: Same parameters; only the return type differs.
      - t: void show(int); and void show(double);
        why: Different parameter types. Valid.
      - t: void hit(int); and void hit(int, int);
        why: Different number of parameters. Valid.
      - t: void say(char); and void say(const std::string&);
        why: Different parameter types. Valid.
    answer: 0
    hints:
      - A call doesn't mention the return type.
    short: Overloads must differ in parameters, not just return type.
    explain: The compiler picks an overload from the arguments of a call, and roll(6) would look identical for both. So functions that differ only by return type are a compile error.
  - id: w6.boss.r3
    type: predict
    tags: [ w6.byvalue, w6.scope ]
    prompt: The Sentinel changes a copy of your hp. What does this print?
    code: |-
      #include <iostream>

      int shield(int hp) {
          hp += 5;
          return hp * 2;
      }

      int main() {
          int hp{3};
          int power = shield(hp);
          std::cout << hp << ' ' << power << '\n';
          return 0;
      }
    options:
      - t: |
          3 16
        why: The copy becomes 8, returns 16. main's hp stays 3.
      - t: |
          8 16
        why: shield changed only its copy.
      - t: |
          3 6
        why: "hp += 5 runs first, then 8 * 2."
      - t: |
          8 6
        why: main's hp is untouched, and 8 * 2 is 16.
    answer: 0
    hints:
      - The parameter is a copy of 3.
    short: main's hp stays 3; the copy returns 16.
    explain: 'shield''s hp is a copy: 3 + 5 = 8, returns 16. main''s hp is still 3. Output: "3 16" and a newline.'
  - id: w6.boss.r4
    type: predict
    tags: [ w6.default, w5.for, w5.offbyone ]
    prompt: A default argument and a loop. What does this print?
    code: |-
      #include <iostream>

      int sumTo(int n, int start = 1) {
          int total{0};
          for (int i = start; i <= n; ++i) {
              total += i;
          }
          return total;
      }

      int main() {
          std::cout << sumTo(4) << ' ' << sumTo(4, 3) << '\n';
          return 0;
      }
    options:
      - t: |
          10 7
        why: Default start 1 gives 10; start 3 gives 7.
      - t: |
          6 3
        why: "That's i < n. <= includes n itself."
      - t: |
          10 10
        why: The second call passes start = 3.
      - t: |
          9 7
        why: Starting at 1 gives 10, not 9.
    answer: 0
    hints:
      - sumTo(4) means sumTo(4, 1).
      - "<= n includes n."
    short: "sumTo(4) means sumTo(4, 1): 10. Then 3 + 4 = 7."
    explain: 'The default start is 1, so sumTo(4) = 1 + 2 + 3 + 4 = 10. sumTo(4, 3) = 3 + 4 = 7. total is a fresh local in each call. Output: "10 7" and a newline.'
  - id: w6.boss.r5
    type: speed
    tags: [ w6.prototype, w6.scope, w6.default, w6.dangling, w6.nodiscard, w6.assert, w4.switch ]
    prompt: SPEED ROUND! Answer each question fast!
    seconds: 45
    items:
      - q: Which line is a prototype?
        options:
          - "f(3);"
          - "int f(int x);"
          - "int f(int x) { return x; }"
        answer: 1
      - q: What does this switch return for n = 2?
        code: |-
          switch (n) {
              case 1: return 'A';
              case 2: return 'B';
              default: return '?';
          }
        prelude: int n{2};
        options:
          - "'A'"
          - "'?'"
          - "'B'"
        answer: 2
      - q: A local variable is destroyed when...
        options:
          - its block ends
          - the program ends
          - main returns
        answer: 0
      - q: Default arguments go on which parameters?
        options:
          - the first ones
          - the trailing (rightmost) ones
          - any of them
        answer: 1
      - q: What does -Wreturn-local-addr warn about?
        options:
          - an unused return value
          - a missing #include
          - returning a reference to a local
        answer: 2
      - q: Ignoring a [[nodiscard]] result gives...
        options:
          - a compiler warning
          - a crash at runtime
          - a linker error
        answer: 0
      - q: Which flag removes every assert?
        options:
          - "-Wall"
          - "-DNDEBUG"
          - "-std=c++20"
        answer: 1
      - q: After f(a), what is a?
        code: |-
          void f(int x) { x = 9; }
          int main() { int a{1}; f(a); }
        expect: warn
        options:
          - "9"
          - garbage
          - "1"
        answer: 2
    hints:
      - "Locals die at }; copies can't change the caller."
    short: "Prototypes end in ;, locals die at }, defaults trail."
    explain: "A prototype is a body-less declaration. switch(2) hits case 2. Locals die at their block's end. Defaults are trailing. -Wreturn-local-addr flags dangling returns, [[nodiscard]] flags ignored results, -DNDEBUG deletes asserts, and by-value parameters leave a unchanged."
  - id: w6.boss.r6
    type: bug
    tags: [ w6.missing-return, w4.if ]
    unsafe: true
    prompt: "UNSAFE: lootFor(2) is undefined behavior. Tap the buggy line, then pick the fix."
    code: |-
      #include <iostream>

      int lootFor(int level) {
          if (level >= 10) {
              return 50;
          }
          if (level >= 5) {
              return 20;
          }
      }

      int main() {
          std::cout << lootFor(2) << '\n';
          return 0;
      }
    bugLine: 9
    options:
      - t: "    return 5;  (then the closing })"
        why: Levels below 5 now get a value.
      - t: "}  // UB is fine if tests pass"
        why: UB can pass tests, then break on another compiler.
      - t: "    return;  (then the closing })"
        why: An int function must return a value. Compile error.
      - t: "    assert(level >= 5);  (then the closing })"
        why: NDEBUG deletes it, and there's still no return.
    answer: 0
    hints:
      - g++ says "control reaches end of non-void function".
    short: Add a final return; falling off the end is UB.
    explain: "For level 2 both ifs are false and execution reaches the closing } of an int function: undefined behavior. It may print 0, garbage or crash. Add a final `return 5;` for the \"none of the above\" case."
    sideBySide:
      unsafe: |-
        int lootFor(int level) {
            if (level >= 10) {
                return 50;
            }
            if (level >= 5) {
                return 20;
            }
        }               // level < 5: no return, UB

        int main() {
            return lootFor(2);
        }
      hardened: |-
        int lootFor(int level) {
            if (level >= 10) {
                return 50;
            }
            if (level >= 5) {
                return 20;
            }
            return 5;   // every path returns
        }

        int main() {
            return lootFor(2);
        }
  - id: w6.boss.r7
    type: harden
    tags: [ w6.constref, w2.string ]
    prompt: "name can be huge. Pick the parameter type: no copy, no changes."
    code: |-
      #include <iostream>
      #include <string>

      bool isLongName(___ name) {
          return name.size() > 10;
      }

      int main() {
          std::cout << isLongName("Curlo the Magnificent") << '\n';
          return 0;
      }
    options:
      - t: const std::string&
        why: No copy, read-only, and it accepts string literals.
      - t: std::string
        why: Works, but copies every character each call.
      - t: std::string&
        why: Can't bind to a literal's temporary string. Compile error.
      - t: const std::string
        why: Still a full copy.
    answer: 0
    hints:
      - "No copy AND no changes."
    short: const std::string& reads big text, no copy.
    explain: 'By value copies the whole string per call. `const std::string&` refers to the caller''s text, promises not to change it, and binds to temporaries like the one made from "Curlo the Magnificent".'
    sideBySide:
      unsafe: |-
        #include <string>

        bool isLongName(std::string name) {        // copies every call
            return name.size() > 10;
        }

        int main() { return isLongName("Curlo") ? 1 : 0; }
      hardened: |-
        #include <string>

        bool isLongName(const std::string& name) { // no copy, read-only
            return name.size() > 10;
        }

        int main() { return isLongName("Curlo") ? 1 : 0; }
  - id: w6.boss.r8
    type: edge
    tags: [ w6.validate, w3.divzero, w3.overflow ]
    unsafe: true
    prompt: "UNSAFE: percent() has no guards. Which calls cause UB? Select all. (32-bit int.)"
    code: |-
      int percent(int part, int whole) {
          return part * 100 / whole;
      }

      int main() {
          return percent(1, 4);
      }
    options:
      - t: percent(5, 0)
        why: Dividing by zero is UB.
      - t: percent(30000000, 50000000)
        why: "30000000 * 100 is 3 billion: int overflow, UB."
      - t: percent(1, 4)
        why: 100 / 4 = 25. Fine.
      - t: percent(0, 7)
        why: 0 / 7 = 0. Fine.
    answers: [ 0, 1 ]
    hints:
      - Check the divisor, then the multiplication.
      - The biggest 32-bit int is about 2.1 billion.
    short: A zero divisor and a huge part both cause UB.
    explain: "whole = 0 divides by zero, and a big part overflows part * 100 before the division. Guard the parameters, and do the multiplication in long long."
    sideBySide:
      unsafe: |-
        int percent(int part, int whole) {
            return part * 100 / whole;
        }

        int main() {
            return percent(1, 4);
        }
      hardened: |-
        // Returns -1 for invalid input.
        [[nodiscard]] int percent(int part, int whole) {
            if (whole <= 0 || part < 0 || part > whole) {
                return -1;
            }
            return static_cast<int>(static_cast<long long>(part) * 100 / whole);
        }

        int main() {
            return percent(1, 4) == 25 ? 0 : 1;
        }
  - id: w6.boss.r9
    type: mcq
    tags: [ w6.dangling, w6.lifetime ]
    bug: dangling-ref
    unsafe: true
    prompt: "This printed \"Meteor\" in your test. Why is it still a bug?"
    code: |-
      #include <iostream>
      #include <string>

      const std::string& bestSpell() {
          std::string name{"Meteor"};
          return name;
      }

      int main() {
          std::cout << bestSpell() << '\n';
          return 0;
      }
    options:
      - t: name is destroyed at the return, so the reference dangles. Using it is UB
        why: UB can look fine once, then print garbage.
      - t: It isn't a bug, since it printed correctly
        why: '"It worked once" proves nothing with UB.'
      - t: Returning std::string by value would be slower and unsafe
        why: By value is safe, and moving out is cheap.
      - t: The const makes the reference safe
        why: const doesn't keep a local alive.
    answer: 0
    hints:
      - When does name die?
    short: The local dies at return, so the reference dangles.
    explain: "name lives in bestSpell's frame. The frame pops at the return, so the caller gets a reference to a destroyed string. That's UB: it may print correctly, print junk, or crash. g++ warns with -Wreturn-local-addr. Return std::string by value."
defense:
  - attack: "-50"
    label: Negative argument!
    challenge:
      id: w6.boss.d1
      type: harden
      tags: [ w6.validate, w4.guard ]
      prompt: A spell costing -50 mana would ADD mana. Pick the guard condition.
      code: |-
        #include <iostream>

        [[nodiscard]] bool canCast(int mana, int cost) {
            if (___) {
                return false;
            }
            return cost <= mana;
        }

        int main() {
            std::cout << canCast(10, -50) << '\n';
            return 0;
        }
      options:
        - t: cost < 0
          why: A negative cost is nonsense, so it's refused.
        - t: cost > mana
          why: The last line handles that. -50 still passes.
        - t: mana < 0
          why: Wrong parameter. The curse is in cost.
        - t: cost == -50
          why: Blocks one value. -51 still works.
      answer: 0
      hints:
        - Which parameter is cursed?
      short: Reject cost < 0 before checking affordability.
      explain: 'Without the guard, -50 <= 10 is true, so the spell "succeeds" and spending it would add mana. Reject impossible arguments first, then answer the real question.'
      sideBySide:
        unsafe: |-
          [[nodiscard]] bool canCast(int mana, int cost) {
              return cost <= mana;   // -50 <= 10: "affordable"!
          }
          int main() { return canCast(10, -50) ? 1 : 0; }
        hardened: |-
          [[nodiscard]] bool canCast(int mana, int cost) {
              if (cost < 0) {
                  return false;      // guard: impossible cost
              }
              return cost <= mana;
          }
          int main() { return canCast(10, -50) ? 1 : 0; }
  - attack: "999"
    label: Out-of-range argument!
    challenge:
      id: w6.boss.d2
      type: harden
      tags: [ w6.validate, w6.assert ]
      prompt: "Valid levels are 1 to 10. Pick the guard that works in every build."
      code: |-
        #include <iostream>

        [[nodiscard]] int levelBonus(int level) {
            if (___) {
                return 0;
            }
            return level * 5;
        }

        int main() {
            std::cout << levelBonus(999) << '\n';
            return 0;
        }
      options:
        - t: level < 1 || level > 10
          why: Rejects both sides of the range.
        - t: level < 1 && level > 10
          why: No number is below 1 AND above 10.
        - t: level > 10
          why: Catches 999 but lets 0 through.
        - t: assert(level <= 10)
          why: Won't compile here, and NDEBUG would delete it.
      answer: 0
      hints:
        - Check both ends of the range.
      short: "Check both ends with ||."
      explain: "The level comes from player input, so it must be validated with a real check that exists in every build. `level < 1 || level > 10` rejects everything outside 1..10, including 999. `&&` is never true, and `assert(...)` is void, so it can't be an if condition (and NDEBUG would delete it anyway)."
      sideBySide:
        unsafe: |-
          #include <cassert>

          int levelBonus(int level) {
              assert(level >= 1 && level <= 10);   // gone with NDEBUG
              return level * 5;
          }
          int main() { return levelBonus(3) == 15 ? 0 : 1; }
        hardened: |-
          [[nodiscard]] int levelBonus(int level) {
              if (level < 1 || level > 10) {
                  return 0;                        // real check, every build
              }
              return level * 5;
          }
          int main() { return levelBonus(999); }
  - attack: bestScore(3, 7)
    label: Reference to a local!
    challenge:
      id: w6.boss.d3
      type: bug
      tags: [ w6.dangling, w6.lifetime ]
      bug: dangling-ref
      unsafe: true
      prompt: "UNSAFE: bestScore returns a dangling reference. Tap the buggy line, then pick the fix."
      code: |-
        #include <iostream>

        const int& bestScore(int a, int b) {
            int best = a > b ? a : b;
            return best;
        }

        int main() {
            std::cout << bestScore(3, 7) << '\n';
            return 0;
        }
      bugLine: 2
      options:
        - t: int bestScore(int a, int b) {
          why: Return the int by value, a safe copy.
        - t: "const int& bestScore(const int& a, const int& b) {"
          why: Still a reference to the dead local best.
        - t: int& bestScore(int a, int b) {
          why: Dropping const doesn't help. Still dangling.
        - t: "const int* bestScore(int a, int b) {"
          why: A pointer to a local dangles too.
      answer: 0
      hints:
        - What does the & in the return type refer to?
        - Small values are cheap to copy.
      short: Return int by value; a local reference dangles.
      explain: "best lives in bestScore's frame and is destroyed at the return, so the returned reference points at nothing. Using it is UB. g++ warns with -Wreturn-local-addr. An int is tiny: return it by value."
      sideBySide:
        unsafe: |-
          const int& bestScore(int a, int b) {
              int best = a > b ? a : b;
              return best;             // dangling!
          }
          int main() { return bestScore(3, 7); }
        hardened: |-
          int bestScore(int a, int b) {
              return a > b ? a : b;    // by value: safe
          }
          int main() { return bestScore(3, 7); }
  - attack: title(0)
    label: A missing return path!
    challenge:
      id: w6.boss.d4
      type: harden
      tags: [ w6.missing-return, w4.if ]
      prompt: title(0) has no return. Pick the line that fixes it.
      code: |-
        #include <iostream>
        #include <string>

        std::string title(int level) {
            if (level >= 10) {
                return "Champion";
            }
            if (level >= 1) {
                return "Hero";
            }
            ___
        }

        int main() {
            std::cout << title(0) << '\n';
            return 0;
        }
      options:
        - t: return "Unknown";
          why: Every path now returns a std::string.
        - t: "// nothing needed"
          why: Falling off the end is UB, often a crash.
        - t: return;
          why: title must return a value. Compile error.
        - t: assert(level >= 1);
          why: NDEBUG deletes it, and there's still no return.
      answer: 0
      hints:
        - Every path needs a return value.
      short: A final return covers level 0.
      explain: 'For level 0 both conditions are false, so execution reaches the closing }. For a std::string function that is UB and often a crash. A final return covers "none of the above".'
      sideBySide:
        unsafe: |-
          #include <string>

          std::string title(int level) {
              if (level >= 1) {
                  return "Hero";
              }
          }                       // title(0): UB
          int main() { return title(1).empty() ? 1 : 0; }
        hardened: |-
          #include <string>

          std::string title(int level) {
              if (level >= 1) {
                  return "Hero";
              }
              return "Unknown";   // every path returns
          }
          int main() { return title(0).empty() ? 1 : 0; }
victory: FRAME... POPPED... The Sentinel's visor clatters down.
reward:
  xp: 225
  cosmetic: sentinel-visor
  bug: dangling-ref
