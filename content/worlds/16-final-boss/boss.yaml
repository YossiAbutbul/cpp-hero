# World 16 boss (Final Boss): The Undefined Dragon
#
# A multi-stage fight (see `stages` below and NOTES.md). A knock-out restarts only
# the current stage, with fresh hearts:
#   Stage 1 · Scales of Logic      r1-r4   hp 3 (Worlds 1-7: loops, switch, unsigned, strings)
#   Stage 2 · Wings of Memory      r5-r8   hp 3 (Worlds 8-11: pointers, ownership, objects)
#   Stage 3 · Fire of Abstraction  r9-r12  hp 4 (Worlds 12-15: exceptions, STL, templates, UB)
#   Defense · The Dragon's Fire    d1-d5   (hostile inputs, one per layer)
# hp 10 (above the usual 6-8) because this is the final, longest fight.

id: w16.boss
name: The Undefined Dragon
art: dragon
hp: 10
intro: I AM THE UNDEFINED DRAGON. Every bug in this Codebase hatched from my fire.
taunt:
  - I am every bug you ever fixed. And I remember them all.
  - Unchecked input? Delicious. One past the end? Dessert.
  - It worked on YOUR machine? I live on all the other ones.
  - Undefined means I can do ANYTHING. Even pretend I'm gone.
  - Your pointer still points at me. Go on, follow it.
stages:
  - name: Scales of Logic
    taunt:
      - My scales are made of every loop you got wrong.
      - Off by one? I LOVE off by one.
    rounds: [w16.boss.r1, w16.boss.r2, w16.boss.r3, w16.boss.r4]
    hp: 3
  - name: Wings of Memory
    taunt:
      - You cracked my scales. Now feel my wings of dangling pointers!
      - Who owns this memory? Nobody. I do.
    rounds: [w16.boss.r5, w16.boss.r6, w16.boss.r7, w16.boss.r8]
    hp: 3
  - name: Fire of Abstraction
    taunt:
      - Enough! Burn in templates, exceptions and undefined fire!
      - My final form. Nothing here is defined.
    rounds: [w16.boss.r9, w16.boss.r10, w16.boss.r11, w16.boss.r12]
    hp: 4
rounds:
  # ---- Stage 1 · Scales of Logic (Worlds 1-7) ----
  - id: w16.boss.r1
    type: predict
    tags: [ w16.flow, w5.continue, w5.break ]
    prompt: "What does this print? Spaces count. (↵ marks a new line.)"
    code: |-
      #include <iostream>

      int main() {
          for (int i = 1; i <= 4; ++i) {
              if (i == 2) {
                  continue;
              }
              if (i == 4) {
                  break;
              }
              std::cout << i * i << ' ';
          }
          std::cout << '\n';
          return 0;
      }
    options:
      - t: "1 9 \n"
        why: "1 prints, 2 is skipped, 3 prints 9, 4 breaks out."
      - t: "1 4 9 \n"
        why: continue skips the print when i is 2.
      - t: "1 9 16 \n"
        why: "break happens before the print when i is 4."
      - t: "1 \n"
        why: continue skips one pass only. The loop goes on.
    answer: 0
    hints:
      - continue skips to the next pass; break leaves the loop.
    short: "1 prints, 2 is skipped, 3 prints 9, 4 breaks."
    explain: "i = 1 prints 1. i = 2 hits continue and skips the print. i = 3 prints 9. i = 4 hits break before printing. Then one newline: \"1 9 \" and a newline."
  - id: w16.boss.r2
    type: mcq
    tags: [ w16.flow, w4.switch, w4.fallthrough ]
    bug: missing-default
    expect: warn
    prompt: "`rank` is 1. How much gold is paid out?"
    code: |-
      int gold = 0;
      switch (rank) {
          case 1: gold += 50;
          case 2: gold += 20;
          default: gold += 5;
      }
    prelude: int rank{1};
    options:
      - t: "75"
        why: "No break: case 1 falls into case 2 and default."
      - t: "50"
        why: "Without break, execution doesn't stop after case 1."
      - t: "55"
        why: Fallthrough runs every case below the match.
      - t: "5"
        why: default runs last here, but case 1 matched first.
    answer: 0
    hints:
      - Where are the break statements?
    short: "No break: case 1 falls through case 2 and default. 75."
    explain: "Without break, a switch keeps running every case below the matching one. 50 + 20 + 5 = 75. g++ warns with -Wimplicit-fallthrough; end each case with break (or [[fallthrough]]; when you really mean it)."
  - id: w16.boss.r3
    type: bug
    tags: [ w16.flow, w5.signed-unsigned, w5.infinite ]
    bug: signed-unsigned
    unsafe: true
    prompt: "UNSAFE: this should print hp backwards. Tap the buggy line, then pick the fix."
    code: |-
      std::vector<int> hp{3, 6, 9};
      for (std::size_t i = hp.size() - 1; i >= 0; --i) {
          std::cout << hp[i] << '\n';
      }
    bugLine: 1
    options:
      - t: for (std::size_t i = hp.size(); i-- > 0;) {
        why: "Tests, then decrements: i runs 2, 1, 0. Safe when empty."
      - t: for (std::size_t i = hp.size(); i >= 0; --i) {
        why: "Still always true, and it starts out of bounds."
      - t: for (std::size_t i = hp.size() - 1; i > 0; --i) {
        why: "Skips hp[0], and empty vectors still wrap."
      - t: for (unsigned i = hp.size() - 1; i >= 0; --i) {
        why: unsigned is still never negative. Same endless loop.
    answer: 0
    hints:
      - Can a std::size_t ever be less than 0?
    short: "Unsigned i >= 0 is always true. Use i-- > 0."
    explain: "std::size_t is unsigned, so i >= 0 is always true. After i = 0, --i wraps to the largest size_t and hp[i] reads far out of bounds: undefined behavior. `i-- > 0` tests first, then decrements. (Or iterate with rbegin()/rend().)"
    sideBySide:
      unsafe: |-
        for (std::size_t i = hp.size() - 1; i >= 0; --i) {
            std::cout << hp[i] << '\n';   // wraps past 0: UB
        }
      hardened: |-
        for (auto it = hp.rbegin(); it != hp.rend(); ++it) {
            std::cout << *it << '\n';
        }
      prelude: std::vector<int> hp{3, 6, 9};
  - id: w16.boss.r4
    type: predict
    tags: [ w16.functions, w6.constref, w2.string, w2.char ]
    prompt: "What does this print?"
    code: |-
      #include <iostream>
      #include <string>

      std::string shout(const std::string& word) {
          std::string out = word;
          for (char& c : out) {
              if (c >= 'a' && c <= 'z') {
                  c = static_cast<char>(c - 'a' + 'A');
              }
          }
          return out + "!";
      }

      int main() {
          const std::string name = "curlo";
          std::cout << shout(name) << ' ' << name.size() << '\n';
          return 0;
      }
    options:
      - t: |
          CURLO! 5
        why: "shout works on a copy; name keeps its 5 letters."
      - t: |
          CURLO! 6
        why: The ! is added to the copy, not to name.
      - t: |
          curlo! 5
        why: "The loop's char& uppercases each letter of out."
      - t: |
          CURLO 5
        why: shout returns out + "!", so the ! is included.
    answer: 0
    hints:
      - word is a const reference; out is a copy.
    short: "The copy becomes CURLO!; name is untouched, still 5 letters."
    explain: "shout copies word into out, uppercases out through char&, and returns out + \"!\". name is passed by const reference and never changes, so its size is 5."
  # ---- Stage 2 · Wings of Memory (Worlds 8-11) ----
  - id: w16.boss.r5
    type: review
    tags: [ w16.ownership, w16.virtual, w8.nullcheck ]
    bug: double-delete
    unsafe: true
    prompt: "UNSAFE: tap every buggy line, then submit."
    code: |-
      #include <iostream>
      #include <memory>

      struct Bug {
          virtual ~Bug() = default;
          virtual int bite() const { return 1; }
      };

      struct Hydra : Bug {
          int bite() const override { return 3; }
      };

      int main() {
          Bug* raw = new Hydra{};
          std::unique_ptr<Bug> owner{raw};
          std::unique_ptr<Bug> second{raw};
          Bug copy = *owner;
          std::cout << copy.bite() << '\n';
          int* hp = nullptr;
          std::cout << *hp << '\n';
          return 0;
      }
    dangerous: [ 15, 16, 19 ]
    lineNotes:
      13: "Legal, but make_unique leaves no raw pointer to misuse."
      14: "One owner: fine so far."
      15: "A second owner: both delete it. Double delete, UB."
      16: "Slicing: copy is a plain Bug. bite() returns 1."
      19: "Dereferencing nullptr: UB."
    hints:
      - How many owners? Any sliced copy? Any null pointer?
    short: "Two owners, a sliced copy, and a null dereference."
    explain: "Line 15 gives the same object a second unique_ptr, so it gets deleted twice. Line 16 slices the Hydra into a plain Bug (a logic bug: bite() says 1). Line 19 follows nullptr. Use make_unique, pass polymorphic objects by reference, and check pointers."
    sideBySide:
      unsafe: |-
        Bug* raw = new Hydra{};
        std::unique_ptr<Bug> owner{raw};
        std::unique_ptr<Bug> second{raw};   // double delete
        Bug copy = *owner;                  // sliced
      hardened: |-
        std::unique_ptr<Bug> owner = std::make_unique<Hydra>();
        const Bug& view = *owner;           // no copy, no slicing
        std::cout << view.bite() << '\n';
      prelude: |-
        struct Bug {
            virtual ~Bug() = default;
            virtual int bite() const { return 1; }
        };
        struct Hydra : Bug {
            int bite() const override { return 3; }
        };
  - id: w16.boss.r6
    type: mcq
    tags: [ w16.ownership, w16.classes ]
    prompt: "A class holds only a std::vector and a std::unique_ptr. Which special members must you write?"
    options:
      - t: None. The members already clean up and move correctly
        why: "The Rule of Zero: the generated ones are right."
      - t: A destructor that deletes the unique_ptr's object
        why: unique_ptr already deletes it. That's a double delete.
      - t: All five, to be safe
        why: Hand-written copies and moves are where bugs creep in.
      - t: A copy constructor, or the class won't compile
        why: It compiles; it's just move-only.
    answer: 0
    hints:
      - Do vector and unique_ptr clean up after themselves?
    short: "Rule of Zero: self-managing members need no special functions."
    explain: "std::vector and std::unique_ptr each handle their own cleanup and moving. The compiler-generated destructor and move operations call theirs, so you write none of the five. (The class is move-only, since unique_ptr can't be copied.)"
  - id: w16.boss.r7
    type: predict
    tags: [ w16.virtual, w16.ownership ]
    prompt: "A Hydra is created and destroyed in a scope. What does this print?"
    code: |-
      #include <iostream>
      #include <memory>

      struct Bug {
          Bug() { std::cout << "B"; }
          virtual ~Bug() { std::cout << "~B"; }
      };

      struct Hydra : Bug {
          Hydra() { std::cout << "H"; }
          ~Hydra() override { std::cout << "~H"; }
      };

      int main() {
          {
              std::unique_ptr<Bug> p = std::make_unique<Hydra>();
          }
          std::cout << '\n';
          return 0;
      }
    options:
      - t: |
          BH~H~B
        why: "Base built first, derived destroyed first. ~H runs: it's virtual."
      - t: |
          BH~B
        why: A NON-virtual base destructor might do that. Here it's virtual.
      - t: |
          HB~B~H
        why: The base part is constructed first.
      - t: |
          BH~B~H
        why: "Destruction runs in reverse: derived first."
    answer: 0
    hints:
      - Construction goes base first; destruction is the mirror.
    short: "Built base-first, destroyed derived-first: BH~H~B."
    explain: "Constructing a Hydra builds the Bug part first (B), then the Hydra part (H). At the scope's end, the unique_ptr deletes through Bug*; the virtual destructor dispatches to ~Hydra (~H), which then runs ~Bug (~B)."
  - id: w16.boss.r8
    type: harden
    tags: [ w16.ownership ]
    bug: memory-leak
    prompt: "countEggs can return early. Pick the line that creates a Nest and can't leak."
    code: |-
      #include <memory>

      struct Nest {
          int eggs{};
      };

      int countEggs(bool scouted) {
          ___
          if (!scouted) {
              return 0;
          }
          nest->eggs = 12;
          return nest->eggs;
      }
    options:
      - t: auto nest = std::make_unique<Nest>();
        why: "On every return path, the unique_ptr deletes the Nest."
      - t: Nest* nest = new Nest{};
        why: Nothing ever deletes it. Every call leaks.
      - t: Nest* nest = nullptr;
        why: No Nest at all. nest->eggs follows nullptr.
      - t: std::unique_ptr<Nest> nest;
        why: An empty unique_ptr is null. nest->eggs is UB.
    answer: 0
    hints:
      - Which option both creates a Nest and owns it?
    short: "make_unique creates AND owns: every return path cleans up."
    explain: "With a raw new, every return would need its own delete, and an exception would skip them all. std::make_unique ties the Nest's lifetime to a scope: RAII deletes it on every path."
    sideBySide:
      unsafe: |-
        int countEggs(bool scouted) {
            Nest* nest = new Nest{};
            if (!scouted) {
                return 0;   // leak
            }
            nest->eggs = 12;
            return nest->eggs;   // leak
        }
      hardened: |-
        int countEggs(bool scouted) {
            auto nest = std::make_unique<Nest>();
            if (!scouted) {
                return 0;
            }
            nest->eggs = 12;
            return nest->eggs;
        }
      prelude: "struct Nest { int eggs{}; };"
  # ---- Stage 3 · Fire of Abstraction (Worlds 12-15) ----
  - id: w16.boss.r9
    type: predict
    tags: [ w16.exceptions, w16.optional, w16.templates ]
    prompt: "The second call throws. What does this print?"
    code: |-
      #include <iostream>
      #include <optional>
      #include <stdexcept>

      template <typename T>
      T checkedHalf(T value) {
          if (value < 0) {
              throw std::invalid_argument{"negative"};
          }
          return value / 2;
      }

      int main() {
          std::optional<int> result;
          try {
              result = checkedHalf(9);
              result = checkedHalf(-4);
          } catch (const std::invalid_argument& e) {
              std::cout << e.what() << ' ';
          }
          std::cout << result.value_or(-1) << '\n';
          return 0;
      }
    options:
      - t: |
          negative 4
        why: "9 / 2 = 4 is stored; the second call throws first."
      - t: |
          negative -1
        why: result already holds 4, so value_or ignores -1.
      - t: |
          negative -2
        why: checkedHalf(-4) throws before any division.
      - t: |
          4
        why: -4 < 0 throws, so the handler prints "negative ".
    answer: 0
    hints:
      - Does the second assignment happen if the call throws?
    short: "First call stores 4; the second throws before assigning."
    explain: "checkedHalf(9) returns 4 (int division), stored in result. checkedHalf(-4) throws before returning, so the assignment never happens. The handler prints \"negative \", and value_or(-1) finds 4. Output: \"negative 4\" and a newline."
  - id: w16.boss.r10
    type: speed
    tags: [ w16.stl, w16.modern, w16.exceptions, w16.ownership ]
    prompt: "Speed round! Answer each question before time runs out."
    seconds: 50
    items:
      - q: Which smart pointer means exactly one owner?
        options:
          - std::unique_ptr
          - std::shared_ptr
          - a raw pointer
        answer: 0
      - q: What does this print?
        code: std::cout << 17 % 5 << 17 / 5;
        options:
          - "23"
          - "32"
          - "3.4"
        answer: 0
      - q: m starts empty. What does this print?
        code: |-
          int g = m["imp"];
          std::cout << m.size();
        prelude: std::map<std::string, int> m;
        options:
          - "0"
          - "1"
        answer: 1
      - q: Which keyword makes the compiler verify an override?
        options:
          - virtual
          - override
          - explicit
        answer: 1
      - q: A lambda outlives the local x. Which capture is safe?
        options:
          - "[&x]"
          - "[x]"
          - "[&]"
        answer: 1
      - q: v has 3 elements. What does v.at(10) do?
        options:
          - Undefined behavior
          - Throws std::out_of_range
          - Returns 0
        answer: 1
      - q: Which handler should come first?
        options:
          - catch (const std::exception&)
          - catch (const std::out_of_range&)
        answer: 1
    hints:
      - "m[key] inserts; .at() throws; specific catch first."
    short: "unique_ptr owns; m[] inserts; .at() throws; specific first."
    explain: "One owner is std::unique_ptr. 17 % 5 is 2 and 17 / 5 is 3, printed back to back: 23. m[\"imp\"] inserts, so size is 1. override makes the compiler check. A lambda that outlives x must copy it: [x]. .at() throws std::out_of_range. Specific handlers go before std::exception."
  - id: w16.boss.r11
    type: edge
    tags: [ w16.templates, w16.stl ]
    bug: unchecked-find
    unsafe: true
    prompt: "UNSAFE: m is {\"imp\": 3, \"hydra\": 40}. Which keys cause UB? Select all."
    code: |-
      #include <map>
      #include <string>

      template <typename K, typename V>
      V lookup(const std::map<K, V>& m, const K& key) {
          return m.find(key)->second;
      }
    options:
      - t: "\"imp\""
        why: Found. Returns 3.
      - t: "\"ghost\""
        why: "Missing, so find returns end(); end()->second is UB."
      - t: "\"\""
        why: "The empty string isn't a key either."
      - t: "\"Hydra\""
        why: "Keys are case-sensitive. \"Hydra\" isn't \"hydra\"."
      - t: "\"hydra\""
        why: Found. Returns 40.
    answers: [ 1, 2, 3 ]
    hints:
      - Which keys are really in the map, exactly?
    short: "Every missing key, even a case typo, dereferences end()."
    explain: "The template is fine for any K and V, but it never checks find() against end(). Any missing key (ghost, the empty string, a capitalized Hydra) makes it dereference end(): undefined behavior. Return std::optional<V> instead."
    sideBySide:
      unsafe: |-
        template <typename K, typename V>
        V lookup(const std::map<K, V>& m, const K& key) {
            return m.find(key)->second;
        }
      hardened: |-
        #include <optional>

        template <typename K, typename V>
        std::optional<V> lookup(const std::map<K, V>& m, const K& key) {
            const auto it = m.find(key);
            if (it == m.end()) {
                return std::nullopt;
            }
            return it->second;
        }
  - id: w16.boss.r12
    type: safe
    tags: [ w16.ub, w16.move, w16.bounds, w3.overflow ]
    bug: ub-hydra
    prompt: "Final breath! Safe or unsafe? Mark each snippet. Go!"
    seconds: 40
    items:
      - code: |-
          std::vector<int> v;
          if (!v.empty()) {
              std::cout << v.front();
          }
        safe: true
        why: front() is only called when the vector has an element.
      - code: |-
          std::vector<int> v;
          std::cout << v.front();
        safe: false
        why: front() on an empty vector is UB.
      - code: |-
          auto owner = std::make_unique<int>(3);
          auto other = std::move(owner);
          std::cout << *owner;
        safe: false
        why: A moved-from unique_ptr is null. Dereferencing it is UB.
      - code: |-
          std::string s;
          if (std::getline(std::cin, s) && !s.empty()) {
              std::cout << s[0];
          }
        safe: true
        why: The read is checked and the string isn't empty.
      - code: |-
          int a = std::numeric_limits<int>::max();
          int b = a + 1;
        safe: false
        why: "Signed overflow: UB, even if it seems to wrap."
      - code: |-
          enum class Mode { On, Off };
          Mode m = Mode::On;
        safe: true
        why: A scoped enum with a named value. Nothing to go wrong.
      - code: |-
          int* p = new int[3];
          delete p;
        safe: false
        why: "new[] needs delete[]. Better: std::vector<int>(3)."
      - code: |-
          try {
              throw std::runtime_error{"x"};
          } catch (const std::exception& e) {
              std::cout << e.what();
          }
        safe: true
        why: Thrown, caught by const reference, handled.
    hints:
      - Empty containers, moved-from pointers, limits, new vs delete.
    short: "Check before front(), skip moved-from pointers, respect limits."
    explain: "Unsafe: front() on an empty vector, dereferencing a moved-from unique_ptr, signed overflow, and new[] freed with plain delete. Safe: each checked access, the scoped enum, and a caught exception."
defense:
  - attack: '""'
    label: An empty name!
    challenge:
      id: w16.boss.d1
      type: harden
      tags: [ w16.bounds, w2.string, w7.empty ]
      prompt: "name may be empty. Pick the guard before front()."
      code: |-
        #include <string>

        char firstLetter(const std::string& name) {
            if (___) {
                return '?';
            }
            return name.front();
        }
      options:
        - t: name.empty()
          why: "An empty string has no front(), so answer '?'."
        - t: "name.front() == '\\0'"
          why: Calls front() to check if front() is safe. UB.
        - t: name.size() > 100
          why: Guards against long names, not empty ones.
        - t: "name == \" \""
          why: Catches a single space, not an empty string.
      answer: 0
      hints:
        - Ask the string about its size, not its first character.
      short: "front() on an empty string is UB: check empty() first."
      explain: "std::string::front() requires at least one character. Check `name.empty()` before touching any character. Any check that reads a character first has already done the dangerous part."
      sideBySide:
        unsafe: |-
          char firstLetter(const std::string& name) {
              return name.front();   // "": UB
          }
        hardened: |-
          char firstLetter(const std::string& name) {
              if (name.empty()) {
                  return '?';
              }
              return name.front();
          }
  - attack: "-1"
    label: Negative index!
    challenge:
      id: w16.boss.d2
      type: harden
      tags: [ w16.bounds, w7.bounds, w6.validate ]
      bug: out-of-bounds
      prompt: "The Dragon asks for slot -1. Pick the check that rejects every bad index."
      code: |-
        #include <stdexcept>
        #include <vector>

        int pick(const std::vector<int>& hp, int i) {
            if (___) {
                throw std::out_of_range{"no such slot"};
            }
            return hp[static_cast<std::size_t>(i)];
        }
      options:
        - t: i < 0 || i >= static_cast<int>(hp.size())
          why: "Blocks negatives AND anything at or past the end."
        - t: i >= static_cast<int>(hp.size())
          why: Misses -1, which becomes a huge index after the cast.
        - t: i < 0
          why: Blocks -1, but slot 999 reads far past the end.
        - t: i > static_cast<int>(hp.size())
          why: Misses negatives, and lets i == size() through.
      answer: 0
      hints:
        - There are two ways to be out of range.
      short: "Check both ends: i < 0 and i >= size()."
      explain: "An index is valid only from 0 to size() - 1. Check both ends before indexing. A negative int cast to std::size_t becomes an enormous number, so a missing `i < 0` check doesn't fail safely."
      sideBySide:
        unsafe: |-
          int pick(const std::vector<int>& hp, int i) {
              return hp[static_cast<std::size_t>(i)];   // -1: UB
          }
        hardened: |-
          int pick(const std::vector<int>& hp, int i) {
              if (i < 0 || i >= static_cast<int>(hp.size())) {
                  throw std::out_of_range{"no such slot"};
              }
              return hp[static_cast<std::size_t>(i)];
          }
  - attack: "30000000"
    label: Huge value!
    challenge:
      id: w16.boss.d3
      type: breakit
      tags: [ w16.input, w3.overflow, w3.validate ]
      bug: overflow
      unsafe: true
      prompt: "UNSAFE: this rejects text and negatives. Which input still breaks it? (32-bit int.)"
      code: |-
        int gold{};
        if (!(std::cin >> gold) || gold < 0) {
