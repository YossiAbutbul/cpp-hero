# World 16 mini-project (capstone): The Bug Log

id: w16.p
title: The Bug Log
intro: "Capstone! Build a bug log using every world you've beaten."
steps:
  - id: w16.p.s1
    type: fill
    tags: [ w16.modern ]
    prompt: "Fill in the keyword that makes Severity a scoped, strongly typed enum."
    code: "enum ___ Severity { Low = 1, Medium, High };"
    accept:
      - class
      - struct
    placeholder: keyword
    hints:
      - "The modern, scoped kind: enum ..."
    short: "enum class keeps Severity scoped and strongly typed."
    explain: "`enum class Severity` makes you write `Severity::High`, and it won't silently convert to or from int. Any conversion has to be an explicit static_cast, which is exactly where we'll put a check."
  - id: w16.p.s2
    type: write
    tags: [ w16.optional, w16.functions ]
    prompt: "Write the line for the comment: return \"no valid Severity\"."
    code: |-
      #include <optional>

      enum class Severity { Low = 1, Medium, High };

      std::optional<Severity> toSeverity(int level) {
          if (level < 1 || level > 3) {
              // your line: no valid Severity
          }
          return static_cast<Severity>(level);
      }
    accept:
      - return std::nullopt;
      - return {};
    placeholder: return ...
    hints:
      - The empty optional is spelled std::nullopt.
    short: "An empty optional says \"no valid Severity\"."
    explain: "Returning std::nullopt (or `{}`) gives back an empty optional. The caller must check it before using the value, so a 9 can never become a fake Severity."
  - id: w16.p.s3
    type: order
    tags: [ w16.input, w3.validate, w3.cin ]
    prompt: Read the report count, refusing anything but 0 to 100. Order the lines.
    lines:
      - "int count{};"
      - "std::cout << \"How many reports? \";"
      - "if (!(std::cin >> count) || count < 0 || count > 100) {"
      - "    std::cout << \"Count must be a number from 0 to 100.\\n\";"
      - "    return 1;"
      - "}"
    distractors:
      - "std::cin >> count;"
    hints:
      - "Declare, prompt, then read and check in one if."
    short: "Read AND range-check in one condition."
    explain: "Initialize count, prompt, then read and validate together: a failed read short-circuits the ||, and the range check stops negatives and absurd counts. The bare `std::cin >> count;` distractor reads without checking."
  - id: w16.p.s4
    type: fill
    tags: [ w16.lambdas, w16.stl, w16.classes ]
    prompt: "Fill in the lambda's capture list so it can use sev."
    code: |-
      #include <algorithm>
      #include <map>
      #include <string>

      enum class Severity { Low = 1, Medium, High };

      class BugLog {
      public:
          std::size_t countAt(Severity sev) const {
              return static_cast<std::size_t>(std::count_if(entries_.begin(), entries_.end(),
                  [___](const auto& entry) { return entry.second == sev; }));
          }

      private:
          std::map<std::string, Severity> entries_;
      };
    accept:
      - sev
      - "="
      - "&"
      - "&sev"
    placeholder: capture
    hints:
      - "Capture it by value: just its name."
    short: "[sev] gives the lambda its own copy to compare."
    explain: "The lambda compares each entry's severity with sev, so it must capture sev. By value (`[sev]`) is the safe default; `[&sev]` also works here because count_if finishes before countAt returns."
  - id: w16.p.s5
    type: predict
    tags: [ w16.stl, w7.find ]
    prompt: "What does this map test print?"
    code: |-
      std::map<std::string, int> entries;
      entries["hydra"] = 3;
      entries["imp"] = 1;
      entries["hydra"] = 2;
      std::cout << entries.size() << ' ' << entries["hydra"] << '\n';
    options:
      - t: |
          2 2
        why: "The second hydra overwrites the first: two keys, hydra 2."
      - t: |
          3 2
        why: A map key is unique. Assigning again replaces its value.
      - t: |
          2 3
        why: The later assignment wins. hydra now holds 2.
      - t: |
          3 3
        why: Keys are unique, and the last assignment wins.
    answer: 0
    hints:
      - Can a map hold the same key twice?
    short: "Same key twice: one entry, and the last value wins."
    explain: "operator[] finds hydra the second time and overwrites its value, so the map has two entries (hydra, imp) and hydra is 2. Here inserting is what we want; for questions, the log uses find()."
program: |-
  #include <algorithm>
  #include <iostream>
  #include <map>
  #include <optional>
  #include <string>

  enum class Severity { Low = 1, Medium, High };

  std::optional<Severity> toSeverity(int level) {
      if (level < 1 || level > 3) {
          return std::nullopt;
      }
      return static_cast<Severity>(level);
  }

  class BugLog {
  public:
      void record(const std::string& name, Severity sev) {
          entries_[name] = sev;
      }

      std::optional<Severity> find(const std::string& name) const {
          const auto it = entries_.find(name);
          if (it == entries_.end()) {
              return std::nullopt;
          }
          return it->second;
      }

      std::size_t countAt(Severity sev) const {
          return static_cast<std::size_t>(std::count_if(entries_.begin(), entries_.end(),
              [sev](const auto& entry) { return entry.second == sev; }));
      }

      std::size_t size() const { return entries_.size(); }

  private:
      std::map<std::string, Severity> entries_;
  };

  int main() {
      BugLog log;
      int count{};
      std::cout << "How many reports? ";
      if (!(std::cin >> count) || count < 0 || count > 100) {
          std::cout << "Count must be a number from 0 to 100.\n";
          return 1;
      }
      for (int i = 0; i < count; ++i) {
          std::string name;
          int level{};
          if (!(std::cin >> name >> level)) {
              std::cout << "Bad report line.\n";
              return 1;
          }
          const auto sev = toSeverity(level);
          if (!sev) {
              std::cout << "Skipped " << name << ": severity must be 1 to 3.\n";
              continue;
          }
          log.record(name, *sev);
      }
      std::cout << log.size() << " bugs logged, " << log.countAt(Severity::High) << " high.\n";

      std::string query;
      std::cout << "Look up: ";
      if (std::cin >> query) {
          if (const auto sev = log.find(query)) {
              std::cout << query << ": level " << static_cast<int>(*sev) << '\n';
          } else {
              std::cout << query << ": not in the log\n";
          }
      }
      return 0;
  }
programStdin: |
  3
  hydra 3
  imp 1
  goblin 9
  ghost
stress:
  intro: "Final stress test! Everything the Dragon would throw. Patch every crack!"
  attacks:
    - input: abc
      label: Text instead of a count!
      challenge:
        id: w16.p.a1
        type: harden
        tags: [ w16.input, w3.cin, w3.validate ]
        bug: cin-fail
        prompt: "The count is `abc`. Pick the condition that rejects it and any count outside 0 to 100."
        code: |-
          int count{};
          std::cout << "How many reports? ";
          if (___) {
              std::cout << "Count must be a number from 0 to 100.\n";
              return 1;
          }
        options:
          - t: "!(std::cin >> count) || count < 0 || count > 100"
            why: "Checks the read first, then the range."
          - t: count < 0 || count > 100
            why: Never reads anything. count is always 0.
          - t: "!(std::cin >> count)"
            why: Stops abc, but -5 or 2000000000 get through.
          - t: "!(std::cin >> count) && count > 100"
            why: "A failed read sets count to 0, and 0 > 100 is false."
        answer: 0
        hints:
          - Read first, then check the range.
        short: "Read, check the read, then check the range."
        explain: "`!(std::cin >> count)` reads and catches abc. Only if that succeeds does || go on to the range checks. Capping at 100 also keeps a hostile count from making the loop wait for millions of lines."
        sideBySide:
          unsafe: |-
            std::cin >> count;
            for (int i = 0; i < count; ++i) { /* ... */ }
          hardened: |-
            if (!(std::cin >> count) || count < 0 || count > 100) {
                std::cout << "Count must be a number from 0 to 100.\n";
                return 1;
            }
          prelude: int count{};
    - input: goblin 9
      label: Severity 9 doesn't exist!
      challenge:
        id: w16.p.a2
        type: harden
        tags: [ w16.optional, w16.modern, w4.guard ]
        prompt: "Level 9 would be cast to a Severity with no name. Pick toSeverity's guard."
        code: |-
          #include <optional>

          enum class Severity { Low = 1, Medium, High };

          std::optional<Severity> toSeverity(int level) {
              if (___) {
                  return std::nullopt;
              }
              return static_cast<Severity>(level);
          }
        options:
          - t: level < 1 || level > 3
            why: "Only 1, 2 and 3 name a real Severity."
          - t: level > 3
            why: Misses 0 and negatives.
          - t: level == 9
            why: Only blocks this exact attack. The Dragon just tries 10.
          - t: level < 1 && level > 3
            why: "No number is both: this never refuses anything."
        answer: 0
        hints:
          - Which numbers name a real Severity? Block both ends.
        short: "Refuse anything outside 1 to 3 before the cast."
        explain: "static_cast<Severity>(9) compiles and gives a value that matches no enumerator: every switch and comparison on it goes wrong. Check the range before the cast, and return an empty optional for anything else."
        sideBySide:
          unsafe: |-
            Severity toSeverity(int level) {
                return static_cast<Severity>(level);   // 9: a nameless Severity
            }
          hardened: |-
            std::optional<Severity> toSeverity(int level) {
                if (level < 1 || level > 3) {
                    return std::nullopt;
                }
                return static_cast<Severity>(level);
            }
          prelude: "enum class Severity { Low = 1, Medium, High };"
    - input: ghost
      label: Look up a bug that isn't there!
      challenge:
        id: w16.p.a3
        type: bug
        tags: [ w16.stl, w7.find ]
        bug: unchecked-find
        unsafe: true
        prompt: "UNSAFE: looking up `ghost` is UB. A miss is normal. Tap the bug, then pick the fix."
        code: |-
          #include <map>
          #include <optional>
          #include <string>

          enum class Severity { Low = 1, Medium, High };

          class BugLog {
          public:
              std::optional<Severity> find(const std::string& name) const {
                  return entries_.find(name)->second;
              }

          private:
              std::map<std::string, Severity> entries_;
          };
        bugLine: 9
        options:
          - t: Compare the iterator with end(); return std::nullopt when it matches
            why: "A miss becomes an empty optional; end() is never dereferenced."
          - t: return entries_[name];
            why: "Doesn't compile: a const map has no operator[]."
          - t: return entries_.at(name);
            why: Throws on a normal miss. optional fits better.
          - t: "return entries_.find(name)->second; // TODO check"
            why: A comment changes nothing. end() is still dereferenced.
        answer: 0
        hints:
          - What does find() return for a missing key?
        short: "Check find() against end() before using ->second."
        explain: "For a missing key, find() returns end(), and end()->second is undefined behavior. It may crash, return garbage, or look fine. Compare with end() first and return std::nullopt for a miss."
        sideBySide:
          unsafe: |-
            class BugLog {
            public:
                std::optional<Severity> find(const std::string& name) const {
                    return entries_.find(name)->second;   // ghost: end()->second
                }

            private:
                std::map<std::string, Severity> entries_;
            };
          hardened: |-
            class BugLog {
            public:
                std::optional<Severity> find(const std::string& name) const {
                    const auto it = entries_.find(name);
                    if (it == entries_.end()) {
                        return std::nullopt;
                    }
                    return it->second;
                }

            private:
                std::map<std::string, Severity> entries_;
            };
          prelude: "enum class Severity { Low = 1, Medium, High };"
