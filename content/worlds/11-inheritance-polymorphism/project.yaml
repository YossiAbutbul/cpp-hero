# World 11 mini-project: Guild Roster

id: w11.p
title: Guild Roster
intro: "Build a guild of knights, archers and healers on one abstract base."
steps:
  - id: w11.p.s1
    type: fill
    tags: [ w11.virtual-dtor, w11.abstract ]
    prompt: "Members are owned by std::unique_ptr<Member>. Fill in the keyword the destructor needs."
    code: |-
      #include <string>

      class Member {
      public:
          ___ ~Member() = default;
          virtual std::string name() const = 0;
          virtual int attack() const = 0;
      };
    accept:
      - virtual
    placeholder: keyword
    hints:
      - Members will be deleted through a Member pointer.
    short: "Polymorphic base: `virtual ~Member() = default;`."
    explain: "Members are created as Knights, Archers and Healers but deleted through `std::unique_ptr<Member>`. Only a virtual destructor makes that deletion run the real type's destructor first. Without it: undefined behavior."
  - id: w11.p.s2
    type: write
    tags: [ w11.override, w11.pure-virtual ]
    prompt: "Inside class Knight, write the one-line function that overrides attack() and returns 8."
    code: |-
      class Knight : public Member {
      public:
          // your line goes here
      };
    prelude: "class Member { public: virtual ~Member() = default; virtual int attack() const = 0; };"
    accept:
      - "int attack() const override { return 8; }"
      - "int attack() const override final { return 8; }"
      - "int attack() const final override { return 8; }"
    placeholder: int attack() ...
    hints:
      - Copy the base signature exactly, then add override and a body.
    short: "Exact base signature, plus override, plus a body."
    explain: "The signature must match `virtual int attack() const = 0;` exactly (name, no parameters, const). `override` makes the compiler check that. The body returns the Knight's attack: `int attack() const override { return 8; }`."
  - id: w11.p.s3
    type: order
    tags: [ w11.slicing, w8.constref ]
    prompt: "Write `report`, which prints any member without slicing it. Put the lines in order."
    prelude: "class Member { public: virtual ~Member() = default; virtual std::string name() const = 0; virtual int attack() const = 0; };"
    lines:
      - "void report(const Member& m) {"
      - "    std::cout << m.name() << \" hits for \" << m.attack() << '\\n';"
      - "}"
    distractors:
      - "void report(Member m) {"
    hints:
      - The parameter must refer to the member, not copy it.
    short: "`const Member&` sees the whole member; by value would slice."
    explain: "`const Member&` refers to the real Knight, Archer or Healer, so `name()` and `attack()` dispatch to its versions. The by-value distractor would slice, and since Member is abstract, it doesn't even compile: an abstract base protects you from slicing."
  - id: w11.p.s4
    type: predict
    tags: [ w11.poly-container, w11.dispatch, w9.make-unique ]
    prompt: "The first recruits join. What does this print?"
    code: |-
      #include <iostream>
      #include <memory>
      #include <string>
      #include <vector>

      class Member {
      public:
          virtual ~Member() = default;
          virtual std::string name() const = 0;
          virtual int attack() const = 0;
      };

      class Knight : public Member {
      public:
          std::string name() const override { return "Knight"; }
          int attack() const override { return 8; }
      };

      class Healer : public Member {
      public:
          std::string name() const override { return "Healer"; }
          int attack() const override { return 2; }
      };

      int main() {
          std::vector<std::unique_ptr<Member>> roster;
          roster.push_back(std::make_unique<Healer>());
          roster.push_back(std::make_unique<Knight>());
          int total = 0;
          for (const auto& m : roster) {
              total += m->attack();
          }
          std::cout << roster.size() << " members, power " << total << '\n';
          return 0;
      }
    options:
      - t: |
          2 members, power 10
        why: "Healer 2 + Knight 8, each through its own override."
      - t: |
          2 members, power 16
        why: "Each adds its own attack once: not 8 + 8."
      - t: |
          2 members, power 0
        why: "attack() dispatches to the real types, which return 2 and 8."
      - t: |
          1 members, power 8
        why: "Two push_backs, so roster.size() is 2."
    answer: 0
    hints:
      - Each unique_ptr points at its own real type.
    short: "Dispatch through unique_ptr<Member>: 2 + 8 = 10."
    explain: "Each element owns a whole Healer or Knight, and `m->attack()` runs the real type's override: 2 + 8 = 10. Output: \"2 members, power 10\" and a newline. When roster goes out of scope, each object is deleted through the virtual destructor."
  - id: w11.p.s5
    type: fill
    tags: [ w11.slicing, w8.deref ]
    prompt: "`m` is a std::unique_ptr<Member>. Fill the blank to pass the Member it owns."
    code: |-
      for (const auto& m : roster) {
          report(___);
      }
    prelude: "class Member { public: virtual ~Member() = default; virtual int attack() const = 0; }; class Knight : public Member { public: int attack() const override { return 8; } }; auto report = [](const Member& x) { std::cout << x.attack() << '\\n'; }; std::vector<std::unique_ptr<Member>> roster; roster.push_back(std::make_unique<Knight>());"
    accept:
      - "*m"
    placeholder: expression
    hints:
      - Dereference it, just like a raw pointer.
    short: "`*m` gives the owned Member; the reference binds to it."
    explain: "Dereferencing a unique_ptr with `*m` gives the owned object, and `const Member&` binds to it directly: no copy, no slicing, and the unique_ptr keeps ownership. (`m` is never null here, because the recruit step only stores real members.)"
program: |-
  #include <iostream>
  #include <memory>
  #include <string>
  #include <utility>
  #include <vector>

  class Member {
  public:
      virtual ~Member() = default;
      virtual std::string name() const = 0;
      virtual int attack() const = 0;
  };

  class Knight : public Member {
  public:
      std::string name() const override { return "Knight"; }
      int attack() const override { return 8; }
  };

  class Archer : public Member {
  public:
      std::string name() const override { return "Archer"; }
      int attack() const override { return 5; }
  };

  class Healer : public Member {
  public:
      std::string name() const override { return "Healer"; }
      int attack() const override { return 2; }

  private:
      std::string prayer_{"May your braces always match."};
  };

  std::unique_ptr<Member> recruit(const std::string& kind) {
      if (kind == "knight") {
          return std::make_unique<Knight>();
      }
      if (kind == "archer") {
          return std::make_unique<Archer>();
      }
      if (kind == "healer") {
          return std::make_unique<Healer>();
      }
      return nullptr;
  }

  void report(const Member& m) {
      std::cout << m.name() << " hits for " << m.attack() << '\n';
  }

  int main() {
      const std::size_t maxMembers = 5;
      std::vector<std::unique_ptr<Member>> roster;
      std::string kind;
      while (roster.size() < maxMembers && std::cin >> kind) {
          std::unique_ptr<Member> m = recruit(kind);
          if (m == nullptr) {
              std::cout << "Unknown class: " << kind << '\n';
              continue;
          }
          roster.push_back(std::move(m));
      }
      int total = 0;
      for (const auto& m : roster) {
          report(*m);
          total += m->attack();
      }
      std::cout << "Guild power: " << total << '\n';
      return 0;
  }
programStdin: "knight archer wizard healer\n"
stress:
  intro: "I'm the Phantom's understudy! Let's see if your guild stays whole."
  attacks:
    - input: wizard
      label: A class the guild has never heard of!
      challenge:
        id: w11.p.a1
        type: harden
        tags: [ w8.nullcheck, w9.make-unique ]
        bug: null-deref
        prompt: "recruit(\"wizard\") returns nullptr. Pick the guard before storing and using m."
        code: |-
          std::unique_ptr<Member> m = recruit(kind);
          if (___) {
              std::cout << "Unknown class: " << kind << '\n';
              return 1;
          }
          std::cout << m->attack() << '\n';
        prelude: "class Member { public: virtual ~Member() = default; virtual int attack() const = 0; }; class Knight : public Member { public: int attack() const override { return 8; } }; auto recruit = [](const std::string& k) -> std::unique_ptr<Member> { if (k == \"knight\") { return std::make_unique<Knight>(); } return nullptr; }; std::string kind{\"wizard\"};"
        options:
          - t: m == nullptr
            why: "Stops before m-> follows the empty pointer."
          - t: m->attack() == 0
            why: "The check itself follows the empty pointer: UB."
          - t: kind.empty()
            why: "\"wizard\" isn't empty. The recruit result is the danger."
          - t: m != nullptr
            why: "Inverted: rejects every real recruit and follows the empty one."
        answer: 0
        hints:
          - A unique_ptr can be compared with nullptr, like a raw pointer.
        short: "An empty unique_ptr is null too: check before using ->."
        explain: "A factory that returns a pointer is saying \"this might be nothing\". `m->attack()` on an empty unique_ptr dereferences null: undefined behavior, usually a crash. Check `m == nullptr` (or `if (!m)`) first and handle the unknown class."
        sideBySide:
          unsafe: |-
            std::unique_ptr<Member> m = recruit(kind);
            std::cout << m->attack() << '\n';   // null for "wizard": UB
          hardened: |-
            std::unique_ptr<Member> m = recruit(kind);
            if (m == nullptr) {
                std::cout << "Unknown class: " << kind << '\n';
                return 1;
            }
            std::cout << m->attack() << '\n';
          prelude: "class Member { public: virtual ~Member() = default; virtual int attack() const = 0; }; class Knight : public Member { public: int attack() const override { return 8; } }; auto recruit = [](const std::string& k) -> std::unique_ptr<Member> { if (k == \"knight\") { return std::make_unique<Knight>(); } return nullptr; }; std::string kind{\"wizard\"};"
    - input: "knight knight knight knight knight knight knight"
      label: Seven recruits for a five-slot guild hall!
      challenge:
        id: w11.p.a2
        type: harden
        tags: [ w7.bounds, w7.std-array, w5.while ]
        bug: out-of-bounds
        prompt: "The guild hall has 5 slots. Pick the loop condition that never writes past them."
        code: |-
          std::array<std::unique_ptr<Member>, 5> slots;
          std::size_t count = 0;
          std::string kind;
          while (___ && std::cin >> kind) {
              slots[count] = std::make_unique<Knight>();
              ++count;
          }
          std::cout << count << " knights\n";
        prelude: "class Member { public: virtual ~Member() = default; virtual int attack() const = 0; }; class Knight : public Member { public: int attack() const override { return 8; } };"
        options:
          - t: count < slots.size()
            why: "Stops at 5, before slots[count] could reach slots[5]."
          - t: count <= slots.size()
            why: "Off by one: writes slots[5], past the end. UB."
          - t: "true"
            why: "Only stops at end of input. The 6th knight overflows."
          - t: count != 7
            why: "Tailored to this attack, and still lets count reach 5 and 6."
        answer: 0
        hints:
          - "Valid indexes are 0 to 4."
        short: "Check count < slots.size() before writing slots[count]."
        explain: "Indexes of a 5-element array run from 0 to 4. The condition is checked before each write, so `count < slots.size()` stops the loop when the hall is full. `<=` lets one extra write through to slots[5]: undefined behavior that may corrupt other memory without crashing. (The real program uses a vector with the same size check.)"
        sideBySide:
          unsafe: |-
            std::array<std::unique_ptr<Member>, 5> slots;
            std::size_t count = 0;
            std::string kind;
            while (std::cin >> kind) {
                slots[count] = std::make_unique<Knight>();   // 6th: out of bounds
                ++count;
            }
          hardened: |-
            std::array<std::unique_ptr<Member>, 5> slots;
            std::size_t count = 0;
            std::string kind;
            while (count < slots.size() && std::cin >> kind) {
                slots[count] = std::make_unique<Knight>();
                ++count;
            }
          prelude: "class Member { public: virtual ~Member() = default; virtual int attack() const = 0; }; class Knight : public Member { public: int attack() const override { return 8; } };"
    - input: healer
      label: "A Healer with a long prayer, deleted through Member*!"
      challenge:
        id: w11.p.a3
        type: bug
        tags: [ w11.virtual-dtor, w9.make-unique ]
        bug: missing-virtual-dtor
        unsafe: true
        prompt: "Tap the line that makes deleting a Healer UB, then pick the fix."
        code: |-
          #include <memory>
          #include <string>

          class Member {
          public:
              ~Member() = default;
              virtual int attack() const = 0;
          };

          class Healer : public Member {
          public:
              int attack() const override { return 2; }

          private:
              std::string prayer_{"May your braces always match."};
          };

          int main() {
              std::unique_ptr<Member> m = std::make_unique<Healer>();
              return m->attack() == 2 ? 0 : 1;
          }
        bugLine: 5
        options:
          - t: "virtual ~Member() = default;"
            why: "Now deletion runs ~Healer first, freeing prayer_."
          - t: Delete the ~Member() line entirely
            why: "The implicit destructor isn't virtual either. Same UB."
          - t: "~Healer() override = default; in Healer"
            why: "Won't compile: no virtual base destructor to override."
          - t: "Use Member* m = new Healer{}; instead"
            why: "Same deletion through Member*, by hand. Still UB."
        answer: 0
        hints:
          - The unique_ptr<Member> deletes through a Member pointer.
        short: "unique_ptr<Member> deletes via Member*: ~Member must be virtual."
        explain: "When m goes out of scope, the unique_ptr deletes the Healer through a `Member*`. With a non-virtual `~Member`, that's undefined behavior: typically ~Healer never runs and prayer_'s memory leaks, but anything can happen. `virtual ~Member() = default;` makes the deletion start at the real type."
        sideBySide:
          unsafe: |-
            class Member {
            public:
                ~Member() = default;   // not virtual: deleting a Healer via Member* is UB
                virtual int attack() const = 0;
            };
          hardened: |-
            class Member {
            public:
                virtual ~Member() = default;
                virtual int attack() const = 0;
            };
