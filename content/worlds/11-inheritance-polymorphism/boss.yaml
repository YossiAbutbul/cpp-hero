# World 11 boss: The Slicing Phantom

id: w11.boss
name: The Slicing Phantom
art: phantom
hp: 7
intro: "Hand me your Mage by value, hero... I'll return only a Hero."
taunt:
  - Copy it into a Hero. I'll keep the rest.
  - "No virtual destructor? Then half your Dragon is mine forever."
  - Forget one const and your override becomes my puppet.
  - It compiled without errors? That's exactly how I like it.
rounds:
  - id: w11.boss.r1
    type: predict
    tags: [ w11.virtual, w11.static-bind, w8.pointer ]
    prompt: The Phantom mixes virtual and non-virtual calls. What does this print?
    code: |-
      #include <iostream>

      class Hero {
      public:
          virtual ~Hero() = default;
          virtual char move() const { return 'h'; }
          char stance() const { return 's'; }
      };

      class Ninja : public Hero {
      public:
          char move() const override { return 'N'; }
          char stance() const { return 'S'; }
      };

      int main() {
          Ninja n;
          const Hero& r = n;
          const Hero* p = &n;
          std::cout << r.move() << r.stance() << p->move() << n.stance() << '\n';
          return 0;
      }
    options:
      - t: |
          NsNS
        why: "move() follows the Ninja; stance() follows the declared type."
      - t: |
          NSNS
        why: "stance() isn't virtual, so r.stance() gives Hero's 's'."
      - t: |
          hshS
        why: "move() is virtual, so r and p reach Ninja's 'N'."
      - t: |
          NsNs
        why: "n.stance() is called on the Ninja itself: 'S'."
    answer: 0
    hints:
      - "Virtual: ask the object. Non-virtual: ask the declared type."
    short: "Virtual follows the object; non-virtual follows the declared type."
    explain: "r and p are a Hero reference and pointer to a Ninja. `move()` is virtual: 'N' both times. `r.stance()` is non-virtual, and r's type is Hero: 's'. `n.stance()` is called on a Ninja: 'S'. Output: \"NsNS\" and a newline."
  - id: w11.boss.r2
    type: mcq
    tags: [ w11.override, w11.virtual-dtor, w11.slicing ]
    prompt: The Phantom offers four "facts". Which one is TRUE?
    options:
      - t: "override turns a signature mismatch into a compile error."
        why: "That's its whole job."
      - t: "A const Hero& parameter slices a Mage."
        why: "References never slice: they name the whole object."
      - t: "Deleting a Mage through Hero* is fine without a virtual destructor."
        why: "It's UB. Typically the Mage part is never cleaned up."
      - t: "An abstract class can be created if all its functions are virtual."
        why: "Any pure virtual (= 0) makes it abstract: never creatable."
    answer: 0
    hints:
      - Which one is a compile-time check?
    short: "override makes the compiler verify the override."
    explain: "References and pointers don't slice; only new base *values* do. Deleting through a base pointer requires a virtual destructor, or it's UB. An abstract class (any `= 0`) can never be created directly. And `override` is a compile-time check that the function really overrides a base virtual."
  - id: w11.boss.r3
    type: predict
    tags: [ w11.ctor-order, w11.virtual-dtor, w9.make-unique ]
    prompt: A Mage is born and destroyed through a Hero pointer. What does this print?
    code: |-
      #include <iostream>
      #include <memory>

      class Hero {
      public:
          Hero() { std::cout << 'H'; }
          virtual ~Hero() { std::cout << 'h'; }
      };

      class Mage : public Hero {
      public:
          Mage() { std::cout << 'M'; }
          ~Mage() override { std::cout << 'm'; }
      };

      int main() {
          {
              std::unique_ptr<Hero> p = std::make_unique<Mage>();
          }
          std::cout << '\n';
          return 0;
      }
    options:
      - t: |
          HMmh
        why: "Base built first; the virtual destructor starts at Mage."
      - t: |
          HMh
        why: "That's a non-virtual ~Hero (UB). Here it's virtual."
      - t: |
          HMhm
        why: "Destruction runs in reverse: the Mage part first."
      - t: |
          MHmh
        why: "The Hero part is constructed before the Mage part."
    answer: 0
    hints:
      - Is ~Hero virtual here? Destruction mirrors construction.
    short: "Virtual ~Hero: full cleanup in reverse order, HMmh."
    explain: "make_unique<Mage>() builds the Hero part (H), then the Mage part (M). At the closing brace, the unique_ptr deletes through a Hero*. Because ~Hero is virtual, deletion starts at the real type: ~Mage (m), then ~Hero (h). Output: \"HMmh\" and a newline."
  - id: w11.boss.r4
    type: fill
    tags: [ w11.base-call, w11.override ]
    prompt: "Knight's title adds \"Sir \" to Hero's title. Fill in the call to Hero's version."
    code: |-
      class Hero {
      public:
          virtual ~Hero() = default;
          virtual std::string title() const { return "Hero"; }
      };

      class Knight : public Hero {
      public:
          std::string title() const override { return "Sir " + ___; }
      };
    accept:
      - "Hero::title()"
    placeholder: base call
    hints:
      - "Qualify it with the base class name and ::."
    short: "`Hero::title()` calls the base version directly."
    explain: "`Hero::title()` names Hero's version explicitly, so it returns \"Hero\" without dispatch. A plain `title()` inside Knight's title would dispatch back to Knight's own version: infinite recursion."
  - id: w11.boss.r5
    type: speed
    tags: [ w11.virtual, w11.abstract, w11.slicing, w11.override ]
    prompt: "Speed round! Answer each question before time runs out."
    seconds: 45
    items:
      - q: "Which keyword turns on run-time dispatch?"
        options: [ "virtual", "override", "static", "explicit" ]
        answer: 0
      - q: "What makes a function pure virtual?"
        options: [ "= default", "= 0", "= delete", "final" ]
        answer: 1
      - q: "Which parameter type slices a Mage?"
        options: [ "const Hero&", "Hero*", "Hero", "Hero&" ]
        answer: 2
      - q: "A class with a pure virtual function is..."
        options: [ "final", "abstract", "static", "sliced" ]
        answer: 1
      - q: "Which order does destruction run in?"
        options: [ "Base, then derived", "Derived, then base", "Any order", "Only derived" ]
        answer: 1
      - q: "Which container keeps every hero whole?"
        options: [ "std::vector<Hero>", "std::vector<std::unique_ptr<Hero>>", "std::vector<Hero&>", "std::array<Hero, 5>" ]
        answer: 1
    hints:
      - References and pointers never slice.
    short: "virtual, = 0, by value slices, abstract, derived first, unique_ptr."
    explain: "`virtual` enables dispatch; `= 0` makes a function pure; a by-value `Hero` parameter slices; any pure virtual makes a class abstract; destruction runs derived-then-base; and `std::vector<std::unique_ptr<Hero>>` stores whole objects of any hero type."
  - id: w11.boss.r6
    type: bug
    tags: [ w11.slicing, w8.constref ]
    bug: object-slicing
    unsafe: true
    prompt: "The duel always says \"1 vs 1\", even for Titans. Tap the buggy line, then pick the fix."
    code: |-
      #include <iostream>

      class Hero {
      public:
          virtual ~Hero() = default;
          virtual int might() const { return 1; }
      };

      class Titan : public Hero {
      public:
          int might() const override { return 50; }
      };

      void duel(Hero a, Hero b) {
          std::cout << a.might() << " vs " << b.might() << '\n';
      }

      int main() {
          Titan t;
          Hero h;
          duel(t, h);
          return 0;
      }
    bugLine: 13
    options:
      - t: "void duel(const Hero& a, const Hero& b) {"
        why: "References keep the Titan whole: might() gives 50."
      - t: "void duel(Titan a, Titan b) {"
        why: "Then duel(t, h) won't compile: h is a plain Hero."
      - t: "void duel(const Hero a, const Hero b) {"
        why: "Still by-value copies. const doesn't prevent slicing."
      - t: "Add virtual in front of might() in Titan"
        why: "It already dispatches. The copies are just plain Heroes."
    answer: 0
    hints:
      - "What is a, really: a Titan or a Hero?"
    short: "By-value Hero parameters slice the Titan; take const Hero&."
    explain: "`duel(Hero a, Hero b)` creates two new Hero objects from the arguments, copying only the Hero part of the Titan. They really are Heroes, so `might()` returns 1 for both. With `const Hero&`, a refers to the actual Titan and prints \"50 vs 1\"."
    sideBySide:
      unsafe: |-
        void duel(Hero a, Hero b) {   // Titan sliced into a Hero
            std::cout << a.might() << " vs " << b.might() << '\n';
        }
      hardened: |-
        void duel(const Hero& a, const Hero& b) {
            std::cout << a.might() << " vs " << b.might() << '\n';
        }
      prelude: "class Hero { public: virtual ~Hero() = default; virtual int might() const { return 1; } };"
  - id: w11.boss.r7
    type: predict
    tags: [ w11.ctor-order, w11.virtual ]
    prompt: "Each constructor calls the virtual kind(). What does this print?"
    code: |-
      #include <iostream>

      class Hero {
      public:
          Hero() { std::cout << kind(); }
          virtual ~Hero() = default;
          virtual char kind() const { return 'H'; }
      };

      class Mage : public Hero {
      public:
          Mage() { std::cout << kind(); }
          char kind() const override { return 'M'; }
      };

      int main() {
          Mage m;
          std::cout << '\n';
          return 0;
      }
    options:
      - t: |
          HM
        why: "While Hero() runs, the object is still only a Hero."
      - t: |
          MM
        why: "During Hero(), the Mage part doesn't exist yet."
      - t: |
          M
        why: "Both constructors run, and each prints a letter."
      - t: |
          HH
        why: "In Mage's constructor body, the object is a Mage: 'M'."
    answer: 0
    hints:
      - Which parts of the object exist while Hero() runs?
    short: "Virtual calls in a base constructor use the base version: HM."
    explain: "While Hero's constructor runs, the Mage part hasn't been built yet, so the object behaves as a plain Hero and `kind()` gives 'H'. By the time Mage's constructor body runs, the object is a Mage: 'M'. Output: \"HM\" and a newline. Lesson: don't rely on virtual calls in constructors (or destructors)."
  - id: w11.boss.r8
    type: harden
    tags: [ w11.virtual-dtor, w9.make-unique ]
    bug: missing-virtual-dtor
    prompt: "Dragons will be deleted through std::unique_ptr<Monster>. Pick the destructor declaration."
    code: |-
      class Monster {
      public:
          ___
          virtual int threat() const = 0;
      };
    options:
      - t: "virtual ~Monster() = default;"
        why: "Deleting via Monster* now runs the real destructor first."
      - t: "~Monster() = default;"
        why: "Not virtual: deleting a Dragon through Monster* is UB."
      - t: "~Monster() override = default;"
        why: "Doesn't compile: Monster has no base destructor to override."
      - t: "explicit ~Monster() = default;"
        why: "Doesn't compile: explicit isn't for destructors."
    answer: 0
    hints:
      - Deletion happens through the base type.
    short: "Polymorphic base: `virtual ~Monster() = default;`."
    explain: "A std::unique_ptr<Monster> deletes through a Monster*. Only a virtual destructor makes that deletion start at the real type (Dragon), then run ~Monster. Without it, it's undefined behavior, typically leaving the Dragon part uncleaned."
    sideBySide:
      unsafe: |-
        class Monster {
        public:
            ~Monster() = default;   // not virtual
            virtual int threat() const = 0;
        };
      hardened: |-
        class Monster {
        public:
            virtual ~Monster() = default;
            virtual int threat() const = 0;
        };
defense:
  - attack: "Hero copy = mage;"
    label: The Phantom slices your Mage into a plain Hero!
    challenge:
      id: w11.boss.d1
      type: harden
      tags: [ w11.slicing, w11.poly-container, w9.make-unique ]
      bug: object-slicing
      prompt: "Block it! Pick the party type that keeps the Mage whole."
      code: |-
        std::vector<___> party;
        party.push_back(std::make_unique<Mage>());
        std::cout << party[0]->power() << '\n';
      prelude: "class Hero { public: virtual ~Hero() = default; virtual int power() const { return 1; } }; class Mage : public Hero { public: int power() const override { return 9; } };"
      options:
        - t: std::unique_ptr<Hero>
          why: "Each element owns a whole object; power() gives 9."
        - t: Hero
          why: "Hero values: every Mage is sliced, and power() returns 1."
        - t: Hero*
          why: "Whole, but raw owning pointers leak without manual delete."
        - t: std::unique_ptr<Mage>
          why: "Whole, but now Knights and Archers can't join."
      answer: 0
      hints:
        - Store owners of whole objects, for every hero type.
      short: "`std::vector<std::unique_ptr<Hero>>`: whole, owned, any hero."
      explain: "A container of Hero values slices every derived element. `std::unique_ptr<Hero>` keeps each object whole, dispatches correctly, accepts every hero type, and deletes each one through the virtual destructor."
      sideBySide:
        unsafe: |-
          std::vector<Hero> party;
          party.push_back(Mage{});   // sliced
          std::cout << party[0].power() << '\n';   // 1
        hardened: |-
          std::vector<std::unique_ptr<Hero>> party;
          party.push_back(std::make_unique<Mage>());
          std::cout << party[0]->power() << '\n';   // 9
        prelude: "class Hero { public: virtual ~Hero() = default; virtual int power() const { return 1; } }; class Mage : public Hero { public: int power() const override { return 9; } };"
  - attack: "delete boss;"
    label: A Dragon deleted through a Monster pointer!
    challenge:
      id: w11.boss.d2
      type: bug
      tags: [ w11.virtual-dtor, w9.delete ]
      bug: missing-virtual-dtor
      unsafe: true
      prompt: "The Dragon's hoard is never cleaned up. Tap the buggy line, then pick the fix."
      code: |-
        #include <memory>
        #include <string>

        class Monster {
        public:
            virtual int threat() const = 0;
        };

        class Dragon : public Monster {
        public:
            int threat() const override { return 99; }

        private:
            std::string hoard_{"gold, gems, and one very old sock"};
        };

        int main() {
            std::unique_ptr<Monster> boss = std::make_unique<Dragon>();
            return boss->threat() == 99 ? 0 : 1;
        }
      bugLine: 5
      options:
        - t: "Add virtual ~Monster() = default; above threat()"
          why: "Now deletion runs ~Dragon, which frees the hoard."
        - t: "Use Monster* boss = new Dragon{}; and delete boss;"
          why: "Same deletion through Monster*, by hand. Still UB."
        - t: Make threat() non-virtual
          why: "Breaks the override; the destructor still isn't virtual."
        - t: "Add ~Dragon() override = default; to Dragon"
          why: "Won't compile: no virtual base destructor to override."
      answer: 0
      hints:
        - Monster has virtual functions. What's missing?
      short: "Monster needs a virtual destructor. Add one."
      explain: "Monster's implicit destructor is public and non-virtual. When the unique_ptr deletes the Dragon through a Monster*, that's undefined behavior: typically ~Dragon never runs and hoard_ leaks. Declare `virtual ~Monster() = default;` in every polymorphic base."
      sideBySide:
        unsafe: |-
          class Monster {
          public:
              virtual int threat() const = 0;   // implicit ~Monster: not virtual
          };
        hardened: |-
          class Monster {
          public:
              virtual ~Monster() = default;
              virtual int threat() const = 0;
          };
  - attack: "int power()"
    label: "An impostor override, one const short!"
    challenge:
      id: w11.boss.d3
      type: harden
      tags: [ w11.override, w11.signature ]
      prompt: "Pick the declaration that truly overrides Hero's power(), and proves it."
      code: |-
        class Hero {
        public:
            virtual ~Hero() = default;
            virtual int power() const { return 1; }
        };

        class Mage : public Hero {
        public:
            ___ { return 9; }
        };
      options:
        - t: int power() const override
          why: "Exact signature, and override makes the compiler prove it."
        - t: int power()
          why: "Missing const: a new function. Hero& calls return 1."
        - t: virtual int power()
          why: "Still missing const: a new virtual function."
        - t: int power() override
          why: "Missing const, so override makes this a compile error."
      answer: 0
      hints:
        - Copy the base signature exactly, then add the oath.
      short: "`int power() const override`: exact match, compiler-checked."
      explain: "An override must match the base signature exactly, including `const`. Without `override`, a mismatch silently creates a new function. With it, the compiler rejects the mismatch, which is precisely the protection you want."
      sideBySide:
        unsafe: |-
          class Mage : public Hero {
          public:
              int power() { return 9; }   // impostor: hides, doesn't override
          };
        hardened: |-
          class Mage : public Hero {
          public:
              int power() const override { return 9; }
          };
        prelude: "class Hero { public: virtual ~Hero() = default; virtual int power() const { return 1; } };"
  - attack: nullptr
    label: A recruit the Phantom erased!
    challenge:
      id: w11.boss.d4
      type: harden
      tags: [ w8.nullcheck, w11.dispatch ]
      bug: null-deref
      prompt: "findHero may return nullptr. Pick the guard before the virtual call."
      code: |-
        const Hero* found = findHero(name);
        if (___) {
            std::cout << "No such hero\n";
            return 1;
        }
        std::cout << found->power() << '\n';
      prelude: "class Hero { public: virtual ~Hero() = default; virtual int power() const { return 1; } }; Hero knight; std::string name{\"Ghost\"}; auto findHero = [&knight](const std::string& n) -> const Hero* { return n == \"Knight\" ? &knight : nullptr; };"
      options:
        - t: found == nullptr
          why: "Stops before -> follows a null pointer."
        - t: found->power() == 0
          why: "The check itself follows nullptr: UB."
        - t: name.empty()
          why: "\"Ghost\" isn't empty. The search result is the danger."
        - t: found != nullptr
          why: "Inverted: rejects real heroes and follows the null one."
      answer: 0
      hints:
        - Test the pointer itself before calling through it.
      short: "Check found == nullptr before calling through it."
      explain: "A virtual call needs a real object to look up the right version. Calling `found->power()` on nullptr is undefined behavior, usually a crash. Check the pointer first."
      sideBySide:
        unsafe: |-
          const Hero* found = findHero(name);
          std::cout << found->power() << '\n';   // nullptr: UB
        hardened: |-
          const Hero* found = findHero(name);
          if (found == nullptr) {
              std::cout << "No such hero\n";
              return 1;
          }
          std::cout << found->power() << '\n';
        prelude: "class Hero { public: virtual ~Hero() = default; virtual int power() const { return 1; } }; Hero knight; std::string name{\"Ghost\"}; auto findHero = [&knight](const std::string& n) -> const Hero* { return n == \"Knight\" ? &knight : nullptr; };"
victory: "My blade... shattered on a const reference... I am... whole again?"
reward:
  xp: 325
  cosmetic: override-halo
  bug: object-slicing
