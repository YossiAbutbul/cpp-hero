# World 9 · Lesson 4: shared_ptr, shared owners

id: w9.l4
title: "shared_ptr: shared owners"
skill: memory
shield: false
concept:
  short: "std::shared_ptr lets several owners share one object; the last owner to let go deletes it."
  analogy: "A shared_ptr is a group rental: everyone gets a key, and the last one out locks up and returns the place."
  body:
    - "`auto treasure = std::make_shared<int>(3);` creates a heap int plus a hidden **reference count**. Copying a shared_ptr is allowed: every copy is another owner and bumps the count. `use_count()` shows how many owners there are."
    - "When an owner goes out of scope (or is reset), the count drops. When it reaches **zero**, the last owner deletes the object. Nobody writes delete."
    - "**Default to unique_ptr.** shared_ptr costs more (a counter that must be updated safely, even across threads) and blurs the question \"who owns this?\". Use it only when ownership is truly shared and no single owner clearly outlives the others."
    - "Never build two separate shared_ptrs from the same raw pointer (`std::shared_ptr<int> b(a.get());`): each has its own count, and both delete the object. Copy the shared_ptr instead, or better, always start with `std::make_shared`."
    - "One trap: owners that point at each other in a **cycle** keep each other's count above zero forever, so nothing is freed: a leak. `std::weak_ptr` (a non-owning observer) breaks such cycles; you'll meet cases like this once you build your own types."
  pitfall: "Common beginner mistake: using shared_ptr everywhere \"just in case\". It hides who owns what. Start with unique_ptr and share only when you must."
demo:
  code: |-
    #include <iostream>
    #include <memory>

    int main() {
        auto treasure = std::make_shared<int>(3);
        std::cout << treasure.use_count() << '\n';
        {
            auto copy = treasure;
            *copy += 1;
            std::cout << treasure.use_count() << ' ' << *treasure << '\n';
        }
        std::cout << treasure.use_count() << '\n';
        return 0;
    }
  steps:
    - line: 4
      vars:
        treasure: "→ 3"
      mem:
        cells:
          - { name: heap int, value: "3", addr: heap }
          - { name: treasure, ptr: heap int, addr: stack }
      note: One heap int, one owner.
    - line: 5
      out: |
        1
      note: use_count() counts the owners.
    - line: 7
      vars:
        copy: "→ 3"
      mem:
        cells:
          - { name: copy, ptr: heap int, addr: stack }
      note: Copying makes a second owner of the SAME int.
    - line: 8
      vars:
        treasure: "→ 4"
        copy: "→ 4"
      mem:
        cells:
          - { name: heap int, value: "4" }
      note: Both owners see the change.
    - line: 9
      out: |
        2 4
      note: Two owners now.
    - line: 10
      vars:
        copy: null
      mem:
        drop: [ copy ]
      note: copy leaves; the count drops to 1. The int survives.
    - line: 11
      out: |
        1
    - line: 13
      vars:
        treasure: null
      mem:
        drop: [ treasure, heap int ]
      shield: Last owner out frees it!
      note: Count hits 0, so the int is deleted.
challenges:
  - id: w9.l4.c1
    type: predict
    tags: [ w9.shared, w9.use-count ]
    prompt: Count the owners. What does this print?
    code: |-
      #include <iostream>
      #include <memory>

      int main() {
          auto a = std::make_shared<int>(5);
          std::cout << a.use_count();
          {
              auto b = a;
              *b += 1;
              std::cout << ' ' << a.use_count();
          }
          std::cout << ' ' << a.use_count() << ' ' << *a << '\n';
          return 0;
      }
    options:
      - t: |
          1 2 1 6
        why: "Correct: b joins (2), leaves at } (1), and its +1 changed the shared int."
      - t: |
          1 2 2 6
        why: b is destroyed at its closing brace, so the count drops back to 1.
      - t: |
          1 2 1 5
        why: "b and a own the SAME int, so *b += 1 changes *a too."
      - t: |
          1 1 1 6
        why: Copying a shared_ptr adds an owner, so the count becomes 2 inside the block.
    answer: 0
    hints:
      - A copy is one more owner of the same int.
      - When does b stop existing?
    short: Copies share one int; the count rises and falls with the owners.
    explain: "a starts with 1 owner. `auto b = a;` adds a second owner of the same int (count 2), and `*b += 1` makes it 6. At the block's }, b is destroyed and the count drops back to 1. Output: \"1 2 1 6\" and a newline."
  - id: w9.l4.c2
    type: mcq
    tags: [ w9.shared, w9.unique ]
    prompt: A player's sword is held by exactly one inventory at a time. Which owner fits?
    options:
      - t: std::unique_ptr
        why: "Correct: one owner at a time, handed over with std::move when it changes hands."
      - t: std::shared_ptr
        why: "Works, but costs more and hides that there's always exactly one owner."
      - t: A raw pointer from new
        why: Then you must delete it by hand on every path. Leaks and double deletes await.
      - t: A reference to a local
        why: The local dies at its closing brace; the reference would dangle.
    answer: 0
    hints:
      - How many owners at once?
      - Pick the cheapest smart pointer that fits.
    short: One owner at a time means unique_ptr; share only when truly shared.
    explain: "Exactly one owner at a time is unique_ptr's job, and std::move hands it between inventories. shared_ptr is for when several parts of the program must keep the object alive together and none clearly outlives the rest."
  - id: w9.l4.c3
    type: harden
    tags: [ w9.shared, w9.double-delete ]
    bug: double-delete
    prompt: "b must share ownership with a. Pick what goes in the blank so the int is deleted exactly once."
    code: |-
      int* raw = new int{8};
      std::shared_ptr<int> a(raw);
      std::shared_ptr<int> b(___);
      std::cout << a.use_count() << '\n';
    options:
      - t: a
        why: "Correct: copying a shares its count. Two owners, one delete."
      - t: raw
        why: "A second, separate count for the same int: both delete it. Double delete."
      - t: a.get()
        why: "Same trap: a new count for an int that a already owns. Double delete."
      - t: new int{8}
        why: No crash, but b owns a different int. They don't share anything.
    answer: 0
    hints:
      - Only copies of a shared_ptr share its counter.
      - A raw pointer carries no count with it.
    short: Copy the shared_ptr; never wrap the same raw pointer twice.
    explain: "Each shared_ptr built from a raw pointer starts its own reference count. Two counts for one int means two deletes: undefined behavior. Copying `a` shares its count, so the int is deleted once, when the last owner leaves. Safest: start with `std::make_shared` and never touch the raw pointer."
    sideBySide:
      unsafe: |-
        int* raw = new int{8};
        std::shared_ptr<int> a(raw);
        std::shared_ptr<int> b(raw);   // second count: double delete!
      hardened: |-
        auto a = std::make_shared<int>(8);
        auto b = a;                     // shares the count
        std::cout << a.use_count() << '\n';   // 2
