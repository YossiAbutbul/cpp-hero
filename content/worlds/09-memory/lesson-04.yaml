  - id: w9.l4.c5
    type: mcq
    tags: [ w9.shared, w9.leak ]
    bug: memory-leak
    prompt: "Two objects hold shared_ptrs to each other, and nothing else points at them. What happens?"
    options:
      - t: Neither is ever freed, a memory leak
        why: "Correct: each keeps the other's count at 1, so neither count reaches 0."
      - t: Both are freed normally
        why: A count only hits 0 when every owner is gone. In a cycle, that never happens.
      - t: It's a double delete
        why: Nothing gets deleted at all; that's the problem.
      - t: It doesn't compile
        why: Cycles compile fine. That's what makes them sneaky.
    answer: 0
    hints:
      - When does a shared_ptr delete its object?
      - Can a count in a cycle ever reach 0?
    short: A shared_ptr cycle keeps both counts above zero forever, so it leaks.
    explain: "A shared_ptr frees its object only when the count reaches zero. In a cycle, each object owns the other, so both counts stay at 1 forever: a leak. Make one side a `std::weak_ptr`, which watches without owning. Or design one clear owner with unique_ptr."
recap:
  - make_shared creates the object and a shared count.
  - Each copy is another owner.
  - The last owner to leave deletes it.
  - Prefer unique_ptr; share only when truly shared.
vault:
  - id: w9.sharedptr
    title: std::shared_ptr
    code: |-
      #include <memory>

      auto relic = std::make_shared<int>(7);   // count 1
      {
          auto guard = relic;                  // count 2, same int
          *guard += 1;                         // relic sees 8
      }                                        // count back to 1
      // last owner gone -> int deleted
    note: "Copy the shared_ptr to share. Never wrap one raw pointer twice. Cycles leak: use std::weak_ptr for back-links."
    defense: false
