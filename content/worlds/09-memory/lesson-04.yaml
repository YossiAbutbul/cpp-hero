  - id: w9.l4.c5
    type: mcq
    tags: [ w9.shared, w9.leak ]
    bug: memory-leak
    prompt: "Two objects hold shared_ptrs to each other. Nothing else points at them. What happens?"
    options:
      - t: Neither is ever freed, a memory leak
        why: Each keeps the other's count at 1 forever.
      - t: Both are freed normally
        why: In a cycle, the count never reaches 0.
      - t: It's a double delete
        why: Nothing gets deleted at all.
      - t: It doesn't compile
        why: Cycles compile fine.
    answer: 0
    hints:
      - When does it delete?
      - Can a cycle's count reach 0?
    short: A cycle never hits count 0, so it leaks.
    explain: "A shared_ptr frees its object only when the count reaches zero. In a cycle, each object owns the other, so both counts stay at 1 forever: a leak. Make one side a `std::weak_ptr`, which watches without owning. Or design one clear owner with unique_ptr."
recap:
  - make_shared makes the object and a count.
  - Each copy is another owner.
  - The last owner out deletes it.
  - Prefer unique_ptr; share only when needed.
vault:
  - id: w9.sharedptr
    title: std::shared_ptr
    code: |-
      #include <memory>

      auto relic = std::make_shared<int>(7);   // count 1
      {
          auto guard = relic;                  // count 2, same int
          *guard += 1;                         // relic sees 8
      }                                        // count back to 1
      // last owner gone -> int deleted
    note: "Copy the shared_ptr to share. Never wrap one raw pointer twice. Cycles leak: use std::weak_ptr for back-links."
    defense: false
