# World 9 mini-project: Slime Spawner

id: w9.p
title: Slime Spawner
intro: "Spawn heap slimes, each with one owner that cleans up every byte."
steps:
  - id: w9.p.s1
    type: fill
    tags: [ w9.unique, w7.vector ]
    prompt: "Fill in the element type: a unique_ptr to an int, one owner per slime."
    code: std::vector<___> pool;
    accept:
      - std::unique_ptr<int>
    placeholder: element type
    hints:
      - One heap owner per slime.
      - "std::unique_ptr, int in <>."
    short: A vector of unique_ptr owns and frees every slime.
    explain: "`std::vector<std::unique_ptr<int>> pool;` is a container of owners. When the vector is destroyed, each unique_ptr deletes its slime. No delete to write anywhere."
  - id: w9.p.s2
    type: fill
    tags: [ w9.make-unique ]
    prompt: "Fill in the function that creates slime i with 10 + i HP."
    code: pool.push_back(std::___<int>(10 + i));
    prelude: std::vector<std::unique_ptr<int>> pool; int i{0};
    accept:
      - make_unique
    placeholder: function name
    hints:
      - Makes the int and its owner.
      - It starts with make_.
    short: make_unique makes each slime and its owner.
    explain: "`std::make_unique<int>(10 + i)` returns a fresh unique_ptr. It's a temporary, so push_back moves it straight into the vector: no copy needed."
  - id: w9.p.s3
    type: order
    tags: [ w9.make-unique, w5.for ]
    prompt: Order the loop so it spawns n slimes.
    prelude: int n{3}; std::vector<std::unique_ptr<int>> pool;
    lines:
      - "for (int i = 0; i < n; ++i) {"
      - "    pool.push_back(std::make_unique<int>(10 + i));"
      - "}"
    distractors:
      - "    pool.push_back(new int{10 + i});"
    hints:
      - Header, body, closing brace.
      - Raw new can't go in.
    short: Loop n times, pushing a make_unique each time.
    explain: "The loop runs n times, each time pushing a new owner. The distractor `push_back(new int{...})` doesn't compile: unique_ptr's constructor from a raw pointer is explicit, which stops raw new from sneaking in."
  - id: w9.p.s4
    type: bug
    tags: [ w9.unique, w7.range-for ]
    expect: error
    prompt: "This loop doesn't compile! Tap the line the compiler rejects, then pick the fix."
    prelude: std::vector<std::unique_ptr<int>> pool; pool.push_back(std::make_unique<int>(10));
    code: |-
      int total{};
      for (auto slime : pool) {
          total += *slime;
      }
    bugLine: 1
    options:
      - t: "for (const auto& slime : pool) {"
        why: Borrows each slime by reference. No copies.
      - t: "for (auto slime : std::move(pool)) {"
        why: Still copies each element, and empties the pool.
      - t: "for (auto* slime : pool) {"
        why: The elements are unique_ptrs, not raw pointers.
      - t: "for (int slime : pool) {"
        why: A unique_ptr doesn't convert to int.
    answer: 0
    hints:
      - "auto slime copies each element."
      - Can a unique_ptr be copied?
    short: Loop over unique_ptrs by const reference.
    explain: "`for (auto slime : pool)` tries to copy each unique_ptr, and copying is deleted. `const auto&` borrows each element instead, just like World 7's rule for big elements. The pool keeps ownership. `std::move(pool)` doesn't help: the loop still copies each element, and moving the pool away isn't what we want."
    sideBySide:
      unsafe: |-
        int total{};
        for (auto slime : pool) {        // copies a unique_ptr: compile error
            total += *slime;
        }
      hardened: |-
        int total{};
        for (const auto& slime : pool) { // borrow, don't copy
            total += *slime;
        }
      expect: error
      prelude: std::vector<std::unique_ptr<int>> pool; pool.push_back(std::make_unique<int>(10));
  - id: w9.p.s5
    type: predict
    tags: [ w9.unique, w7.range-for ]
    prompt: "The pool holds 3 slimes. What does this print? Spaces count."
    prelude: "std::vector<std::unique_ptr<int>> pool; for (int i = 0; i < 3; ++i) { pool.push_back(std::make_unique<int>(10 + i)); }"
    code: |-
      int total{};
      for (const auto& slime : pool) {
          std::cout << *slime << ' ';
          total += *slime;
      }
      std::cout << "| total " << total << '\n';
    options:
      - t: |
          10 11 12 | total 33
        why: HP 10, 11, 12, and 10 + 11 + 12 = 33.
      - t: |
          11 12 13 | total 36
        why: i starts at 0, so the first slime has 10 HP.
      - t: |
          10 11 12 13 | total 46
        why: "i < 3 spawns exactly 3 slimes."
      - t: |
          10 11 12| total 33
        why: A space follows every number, even the last.
    answer: 0
    hints:
      - Spawned with i = 0, 1, 2.
      - A space after every number.
    short: HP 10, 11, 12; total 33.
    explain: "The loop spawned HP 10 + 0, 10 + 1, 10 + 2. Each prints followed by a space, then \"| total 33\" and a newline."
  - id: w9.p.s6
    type: mcq
    tags: [ w9.raii, w9.rule-of-zero ]
    prompt: How many delete statements does this program need?
    options:
      - t: None
        why: Each unique_ptr deletes its own slime.
      - t: One per slime, in a loop at the end
        why: The unique_ptrs already do that. Double delete.
      - t: One delete[] for the whole pool
        why: The pool isn't from new[]. The vector frees itself.
      - t: One, but only on early returns
        why: RAII covers early returns too.
    answer: 0
    hints:
      - Who owns each slime?
      - What happens at main's }?
    short: "Zero deletes: the owners clean up."
    explain: "Rule of Zero in action: the vector owns the unique_ptrs, and each unique_ptr owns a slime. At main's }, the vector is destroyed, each unique_ptr deletes its int, and nothing leaks on any path. Deleting them yourself too would be a double delete."
program: |-
  #include <cstddef>
  #include <iostream>
  #include <memory>
  #include <vector>

  int main() {
      int n{};
      std::cout << "How many slimes? ";
      if (!(std::cin >> n) || n < 1 || n > 100) {
          std::cout << "Pick a whole number from 1 to 100.\n";
          return 1;
      }

      std::vector<std::unique_ptr<int>> pool;
      pool.reserve(static_cast<std::size_t>(n));
      for (int i = 0; i < n; ++i) {
          pool.push_back(std::make_unique<int>(10 + i));
      }

      int total{};
      for (const auto& slime : pool) {
          std::cout << *slime << ' ';
          total += *slime;
      }
      std::cout << "| total " << total << '\n';
      return 0;
  }
programStdin: "3\n"
stress:
  intro: Hard hats on! Nasty spawn counts incoming. Patch every crack!
  attacks:
    - input: abc
      label: Text instead of a number!
      challenge:
        id: w9.p.a1
        type: harden
        tags: [ w3.validate, w3.cin ]
        prompt: "Input `abc` must be rejected. Fill the blank to catch a failed read."
        code: |-
          int n{};
          if (___ || n < 1 || n > 100) {
              std::cout << "Pick a whole number from 1 to 100.\n";
              return 1;
          }
        options:
          - t: "!(std::cin >> n)"
            why: Reads and checks in one step.
          - t: n == 0
            why: Never reads anything, so n is always 0.
          - t: std::cin >> n
            why: "Inverted: rejects every good read."
          - t: "!std::cin"
            why: Nothing ever reads n. Every run is rejected.
        answer: 0
        hints:
          - Read inside the check.
          - A failed read tests false.
        short: "!(std::cin >> n) reads and catches failure."
        explain: "`!(std::cin >> n)` does the read and tests the stream: a failed read makes it true. Text like abc fails the read (n stays 0 and the stream is broken), so the program stops before spawning anything."
        sideBySide:
          unsafe: |-
            std::cin >> n;                 // "abc": fails silently
            pool.reserve(static_cast<std::size_t>(n));
          hardened: |-
            if (!(std::cin >> n) || n < 1 || n > 100) {
                std::cout << "Pick a whole number from 1 to 100.\n";
                return 1;
            }
          prelude: int n{}; std::vector<std::unique_ptr<int>> pool;
    - input: "-5"
      label: Negative slimes!
      challenge:
        id: w9.p.a2
        type: harden
        tags: [ w3.validate, w9.heap ]
        prompt: "Input -5 crashes reserve(). Fill the blank to reject every bad low count."
        code: |-
          int n{};
          if (!(std::cin >> n) || ___ || n > 100) {
              return 1;
          }
          pool.reserve(static_cast<std::size_t>(n));
        prelude: std::vector<std::unique_ptr<int>> pool;
        options:
          - t: n < 1
            why: Rejects zero and every negative count.
          - t: n == -5
            why: Blocks only -5. Other negatives get through.
          - t: n > 0
            why: "Inverted: rejects every valid count."
          - t: n < -100
            why: Lets -1 to -99 straight through.
        answer: 0
        hints:
          - Guard the whole bad range.
          - At least one slime.
        short: "Reject n < 1 before any allocation."
        explain: "Converted to std::size_t, -5 wraps around to about 18 quintillion. reserve() can't allocate that and throws std::length_error, and nobody catches it, so the program terminates. Validate the range before any size reaches an allocation."
        sideBySide:
          unsafe: |-
            std::cin >> n;
            pool.reserve(static_cast<std::size_t>(n));   // -5: throws, program ends
          hardened: |-
            if (!(std::cin >> n) || n < 1 || n > 100) {
                return 1;
            }
            pool.reserve(static_cast<std::size_t>(n));
          prelude: int n{}; std::vector<std::unique_ptr<int>> pool;
    - input: "1000000000"
      label: A billion slimes!
      challenge:
        id: w9.p.a3
        type: harden
        tags: [ w3.validate, w9.heap ]
        prompt: "A billion slimes would eat all memory. Fill the blank with a sane cap."
        code: |-
          int n{};
          if (!(std::cin >> n) || n < 1 || ___) {
              return 1;
          }
        options:
          - t: n > 100
            why: Caps the pool before anything is allocated.
          - t: n > 1000000000
            why: A billion itself still passes.
          - t: n == 1000000000
            why: Blocks one value. 999999999 still gets through.
          - t: "false"
            why: No cap at all.
        answer: 0
        hints:
          - Valid can still be too big.
          - Pick a sane limit.
        short: Cap the count; the heap isn't infinite.
        explain: "A billion slimes means a billion allocations: gigabytes of memory. new then throws std::bad_alloc (or the OS kills the program). Always cap sizes that come from input before allocating."
        sideBySide:
          unsafe: |-
            if (!(std::cin >> n) || n < 1) {   // no upper limit
                return 1;
            }
          hardened: |-
            if (!(std::cin >> n) || n < 1 || n > 100) {
                return 1;
            }
          prelude: int n{};
