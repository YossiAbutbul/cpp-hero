# World 9 · Lesson 3: unique_ptr, the one true owner

id: w9.l3
title: "unique_ptr: one owner"
skill: memory
shield: false
concept:
  short: "std::unique_ptr is the sole owner and deletes automatically at }."
  analogy: "A locker with one key: hand it over, never copy it."
  body:
    - "`#include <memory>`, then `auto hp = std::make_unique<int>(100);`. You get a smart pointer that owns a heap int. Use it like a pointer: `*hp`, and `if (hp)` tests whether it owns anything."
    - "When the unique_ptr goes out of scope (a `}`, an early `return`, an exception), it deletes what it owns. You never write `delete`, so you can't forget it, do it twice, or use the wrong form. Like a locker with a single key: you can hand the key over, never copy it, and the locker empties itself when the holder leaves."
    - "There is only **one owner**, so copying is a compile error: `auto b = a;` won't build. To hand ownership over, **move** it: `auto b = std::move(a);`. Afterwards `a` is empty (it tests false, like nullptr) and `b` owns the int."
    - "Functions: take `const int&` or a raw `int*` when you only **use** the value; take a `std::unique_ptr<int>` by value when the function **takes over** ownership (the caller writes `std::move`). A factory can simply `return std::make_unique<int>(9);`."
    - "Handy members: `p.get()` gives a raw, non-owning pointer (never delete it), and `p.reset()` deletes the object now and leaves p empty. For arrays, `std::make_unique<int[]>(n)` exists, but `std::vector<int>` is usually the better choice."
  pitfall: "Common beginner mistake: `std::unique_ptr<int> b{a.get()};` to \"copy\" it. Now two unique_ptrs each think they own the int, and both delete it: a double delete."
demo:
  code: |-
    #include <iostream>
    #include <memory>

    int main() {
        auto hero = std::make_unique<int>(100);
        *hero -= 30;
        std::cout << *hero << '\n';
        auto backup = std::move(hero);
        if (!hero) {
            std::cout << "hero is empty\n";
        }
        std::cout << *backup << '\n';
        return 0;
    }
  steps:
    - line: 4
      vars:
        hero: "→ 100"
      mem:
        cells:
          - { name: heap int, value: "100", addr: heap }
          - { name: hero, ptr: heap int, addr: stack }
      note: hero owns a new heap int.
    - line: 5
      vars:
        hero: "→ 70"
      mem:
        cells:
          - { name: heap int, value: "70" }
      note: Use it like a pointer.
    - line: 6
      out: |
        70
    - line: 7
      vars:
        hero: "empty"
        backup: "→ 70"
      mem:
        cells:
          - { name: backup, ptr: heap int, addr: stack }
          - { name: hero, ptr: null }
      note: "Moved: backup owns it, hero is empty."
    - line: 8
      note: An empty unique_ptr tests false.
    - line: 9
      out: |
        hero is empty
    - line: 11
      out: |
        70
      note: The owner works fine.
    - line: 13
      vars:
        hero: null
        backup: null
      mem:
        drop: [ backup, hero, heap int ]
      shield: "Auto-delete: no leak!"
      note: "At }, backup deletes the int for us."
challenges:
  - id: w9.l3.c1
    type: fill
    tags: [ w9.unique, w9.make-unique ]
    prompt: Fill in the function that makes a unique_ptr owning 50.
    code: |-
      auto shield = std::___<int>(50);
      std::cout << *shield << '\n';
    accept:
      - make_unique
    placeholder: function name
    hints:
      - It starts with make_.
      - It makes a unique_ptr.
    short: make_unique makes the int and its one owner.
    explain: "`std::make_unique<int>(50)` allocates the int and wraps it in a `std::unique_ptr<int>` in one step. There's no `new` to pair with a `delete`, and it's freed automatically at the end of the scope."
  - id: w9.l3.c2
    type: predict
    tags: [ w9.move-owner, w9.unique ]
    prompt: What does this print?
    code: |-
      #include <iostream>
      #include <memory>

      int main() {
          auto a = std::make_unique<int>(42);
          auto b = std::move(a);
          std::cout << (a ? "a owns" : "a empty") << ", " << *b << '\n';
          return 0;
      }
    options:
      - t: |
          a empty, 42
        why: b owns it now; a is empty.
      - t: |
          a owns, 42
        why: A move isn't a copy.
      - t: |
          a empty, 0
        why: Only the owner changed, not the int.
      - t: It doesn't compile
        why: Moving a unique_ptr is allowed; copying isn't.
    answer: 0
    hints:
      - How many owners can it have?
      - Empty tests false.
    short: std::move hands ownership over; the source is empty.
    explain: "`std::move(a)` hands ownership to b. A unique_ptr that was moved from is empty (null), so `a` tests false and the ternary picks \"a empty\". `*b` is still 42."
  - id: w9.l3.c3
    type: bug
    tags: [ w9.unique, w9.move-owner ]
    bug: double-delete
    expect: error
    prompt: "This doesn't compile! Tap the line the compiler rejects, then pick the fix."
    code: |-
      #include <iostream>
      #include <memory>

      int main() {
          auto potion = std::make_unique<int>(25);
          std::unique_ptr<int> spare = potion;
          std::cout << *spare << '\n';
          return 0;
      }
    bugLine: 5
    options:
      - t: std::unique_ptr<int> spare = std::move(potion);
        why: Moves ownership. Still one owner.
      - t: std::unique_ptr<int> spare{potion.get()};
        why: Compiles, but two owners delete one int.
      - t: int* spare = potion;
        why: A unique_ptr doesn't convert to a raw pointer.
      - t: std::unique_ptr<int> spare = *potion;
        why: "*potion is an int, not an owner."
    answer: 0
    hints:
      - How many owners may it have?
      - "Hand it over; don't copy."
    short: "unique_ptr can't be copied, only moved."
    explain: "Copying a unique_ptr is deliberately a compile error: two owners would both delete the int. `std::move(potion)` transfers ownership instead, and potion becomes empty. The sneaky `spare{potion.get()}` compiles, but then both unique_ptrs delete the same int at the end: double delete, undefined behavior. `int* spare = potion;` and `spare = *potion;` are still compile errors."
    sideBySide:
      unsafe: |-
        auto potion = std::make_unique<int>(25);
        std::unique_ptr<int> spare{potion.get()};   // two owners: double delete!
      hardened: |-
        auto potion = std::make_unique<int>(25);
        std::unique_ptr<int> spare = std::move(potion);   // one owner
        std::cout << *spare << '\n';
  - id: w9.l3.c4
    type: mcq
    tags: [ w9.unique, w6.constref ]
    prompt: "`hp` is a `std::unique_ptr<int>`. `show` only prints the int. Which parameter is simplest?"
    options:
      - t: void show(const int& hp)
        why: It only reads. No ownership needed.
      - t: void show(std::unique_ptr<int> hp)
        why: Takes ownership; deletes the int at show's end.
      - t: void show(int* hp) and delete it at the end
        why: show doesn't own it. Double delete.
      - t: void show(std::unique_ptr<int>& hp)
        why: Works, but ties show to how the int is stored.
    answer: 0
    hints:
      - Own it, or just look?
      - Only owners decide when memory dies.
    short: Readers get a plain reference, not ownership.
    explain: "Ownership only matters to whoever decides when the memory dies. A function that just reads the value takes `const int&` (or a raw `const int*` if \"nothing\" is allowed); the caller writes `show(*hp)`. Taking `std::unique_ptr<int>&` works, but it ties show to how the caller stores the int, so a plain reference is simpler. Take a `std::unique_ptr` by value only when the function should take over ownership (it needs std::move and deletes the int when it ends)."
  - id: w9.l3.c5
    type: write
    tags: [ w9.make-unique, w9.unique ]
    prompt: Write one line that makes a unique_ptr named `mana` owning an int 30.
    accept:
      - auto mana = std::make_unique<int>(30);
      - std::unique_ptr<int> mana = std::make_unique<int>(30);
      - auto mana{std::make_unique<int>(30)};
    acceptRe:
      - '^(auto|std::unique_ptr<int>) mana(=std::make_unique<int>\(30\)|\{std::make_unique<int>\(30\)\});$'
    placeholder: auto mana ...
    hints:
      - Use auto and std::make_unique.
      - Type in <>, value in ().
    short: make_unique gives mana its heap int.
    explain: "`auto mana = std::make_unique<int>(30);` creates the int on the heap and its one owner. Spelling out `std::unique_ptr<int>` instead of auto also works."
recap:
  - make_unique makes the object and owner.
  - unique_ptr deletes automatically at }.
  - "No copies; std::move hands it over."
  - A moved-from unique_ptr is empty.
vault:
  - id: w9.uniqueptr
    title: std::unique_ptr
    code: |-
      #include <memory>

      auto hp = std::make_unique<int>(100);   // one owner
      *hp -= 30;
      auto keeper = std::move(hp);            // hand over; hp is empty
      if (!hp) { /* hp owns nothing now */ }
      keeper.reset();                         // delete now (optional)
      // no delete anywhere: freed at } on every path
    note: Default smart pointer. Can't be copied, only moved. Pass plain references to code that only reads.
    defense: false
