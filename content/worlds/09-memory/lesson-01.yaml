# World 9 · Lesson 1: Stack vs heap

id: w9.l1
title: Stack vs heap
skill: memory
shield: false
concept:
  short: "Locals live on the stack and vanish at their closing brace; heap memory from new stays until you delete it."
  analogy: "The stack is a tray rack that clears itself after every meal; the heap is a storage unit you rent and must hand back."
  body:
    - "Your program's memory has two main areas. The **stack** holds local variables and function parameters. Every function call pushes a **frame** onto it; when the function returns, the frame pops and its locals are gone. It is fast and fully automatic."
    - "The **heap** (also called the free store) is a big pool you ask for at run time. `new int{7}` finds room for an int on the heap and gives you back a **pointer** to it. That int stays alive until you say `delete` on that pointer, no matter which function ends."
    - "Why use the heap at all? When something must **outlive** the function that makes it, or when its size is only known at run time (and could be big: the stack is small, often around 1 to 8 MB)."
    - "In `int* gem = new int{7};` there are two things: the pointer `gem` is a normal local on the **stack**; the int it points at lives on the **heap**. When `gem` goes out of scope, only the pointer vanishes. The heap int stays, unless someone deletes it."
    - "Good news: you've already used the heap safely. `std::vector` and `std::string` keep their elements on the heap and free them for you. In modern C++ you rarely write `new` yourself; this world shows why, and what to use instead."
  pitfall: "Common beginner mistake: using `new` for every variable, Java or C# style. In C++ most variables should simply be locals: `int hp = 10;` needs no new and no delete."
demo:
  code: |-
    #include <iostream>

    int makeGold() {
        int gold = 50;
        return gold;
    }

    int main() {
        int hp = 10;
        int loot = makeGold();
        int* gem = new int{7};
        std::cout << hp << ' ' << loot << ' ' << *gem << '\n';
        delete gem;
        gem = nullptr;
        return 0;
    }
  steps:
    - line: 7
      push:
        name: main
      note: "main's frame is pushed onto the stack."
    - line: 8
      vars:
        hp: "10"
      mem:
        cells:
          - { name: hp, value: "10", addr: stack }
      note: hp lives in main's frame.
    - line: 9
      push:
        name: makeGold
      note: Calling makeGold pushes a new frame on top.
    - line: 3
      vars:
        gold: "50"
      mem:
        cells:
          - { name: gold, value: "50", addr: stack }
      note: gold lives in makeGold's frame.
    - line: 4
      pop:
        returns: "50"
      mem:
        drop: [ gold ]
      note: "Frame popped: gold vanished; 50 flies back."
    - line: 9
      vars:
        loot: "50"
      mem:
        cells:
          - { name: loot, value: "50", addr: stack }
      note: main stores the returned copy in loot.
    - line: 10
      vars:
        gem: "→ heap int"
      mem:
        cells:
          - { name: heap int, value: "7", addr: heap }
          - { name: gem, ptr: heap int, addr: stack }
      note: new puts an int on the heap; gem points at it.
    - line: 11
      out: |
        10 50 7
      note: "*gem follows the arrow into the heap."
    - line: 12
      vars:
        gem: "→ (freed)"
      mem:
        drop: [ heap int ]
      note: delete hands the heap int back. gem now dangles!
    - line: 13
      vars:
        gem: "nullptr"
      mem:
        cells:
          - { name: gem, ptr: null }
      note: Reset gem so nobody follows a dead arrow.
    - line: 14
      pop: true
      mem:
        drop: [ hp, loot, gem ]
      note: main returns; its frame pops too.
challenges:
  - id: w9.l1.c1
    type: mcq
    tags: [ w9.stack, w6.scope ]
    prompt: "Where does `int arrows = 12;` inside a function live, and when does it go away?"
    options:
      - t: On the stack; gone when the function returns
        why: "Correct: locals live in the function's stack frame, which pops on return."
      - t: On the heap; gone when you delete it
        why: Only memory from new lives on the heap. A plain local needs no delete.
      - t: On the stack; it lives until the program ends
        why: Stack frames pop when their function returns. Locals don't linger.
      - t: On the heap; freed automatically at the closing brace
        why: A plain local isn't on the heap at all.
    answer: 0
    hints:
      - Did anybody write new?
      - Every call pushes a frame; every return pops it.
    short: Locals live on the stack and vanish when their scope ends.
    explain: "A local variable lives in its function's stack frame. When the function returns (or the block's `}` is reached), the frame pops and the local is gone. No new, no delete, no cleanup to forget."
  - id: w9.l1.c2
    type: predict
    tags: [ w9.heap, w9.new, w8.deref ]
    prompt: "forge() ends before main prints. What does this print?"
    code: |-
      #include <iostream>

      int* forge() {
          int* sword = new int{9};
          return sword;
      }

      int main() {
          int* s = forge();
          std::cout << *s << '\n';
          delete s;
          return 0;
      }
    options:
      - t: |
          9
        why: "Correct: the int lives on the heap, so it survives forge() returning."
      - t: |
          0
        why: The heap int was initialized with {9} and nothing changed it.
      - t: Garbage, because sword is dangling
        why: "The pointer sword dies, but the heap int it pointed at doesn't. s holds the same address."
      - t: Nothing; it doesn't compile
        why: Returning a pointer to heap memory is legal C++.
    answer: 0
    hints:
      - Which dies at forge's }, the pointer or the int?
      - Heap memory lives until someone deletes it.
    short: Heap memory outlives the function that created it.
    explain: "`sword` is a local pointer and dies when forge() returns, but it only held an address. The int itself is on the heap and lives until `delete s;`. main gets a copy of the address, so `*s` is 9. (Unlike World 8's `return &local;`, nothing dangles here.) Returning a raw owning pointer is still risky: the caller must remember to delete. Lesson 3 fixes that with std::unique_ptr."
  - id: w9.l1.c3
    type: mcq
    tags: [ w9.heap, w9.stack, w7.vector ]
    prompt: Which is a good reason for data to live on the heap?
    options:
      - t: Its size is only known at run time and may be large
        why: "Correct: the stack is small and fixed; the heap grows on demand. std::vector does exactly this."
      - t: It's a small counter used inside one loop
        why: A plain local on the stack is simpler and faster.
      - t: The heap is faster than the stack
        why: The stack is faster; heap allocation has to search for room.
      - t: Heap memory can never leak
        why: "Heap memory is exactly what leaks when nobody frees it."
    answer: 0
    hints:
      - The stack is small and sized before the program runs.
      - Think of a player-chosen number of monsters.
    short: Use the heap for run-time sizes or data that must outlive a function.
    explain: "The heap is for data that must outlive its function or whose size is only known at run time (and may be too big for the small stack). Even then, prefer a container: `std::vector<int> scores(n);` uses the heap and frees it for you."
  - id: w9.l1.c4
    type: fill
    tags: [ w9.new, w9.heap ]
    prompt: Put an int holding 7 on the heap. Fill in the keyword.
    code: |-
      int* gem = ___ int{7};
      std::cout << *gem << '\n';
      delete gem;
    accept:
      - new
    placeholder: keyword
    hints:
      - It's the opposite of delete.
      - It returns the address of fresh heap memory.
    short: new int{7} creates an int on the heap and returns its address.
    explain: "`new int{7}` asks the heap for room for one int, initializes it to 7 and returns a pointer to it. Every `new` needs exactly one matching `delete` later."
  - id: w9.l1.c5
    type: order
    tags: [ w9.new, w9.delete, w8.nullptr ]
    prompt: "Order the life of a heap int: create it, use it, give it back, then drop the stale address."
    lines:
      - int* gem = new int{7};
      - "std::cout << *gem << '\\n';"
      - delete gem;
      - gem = nullptr;
    distractors:
      - delete *gem;
    hints:
      - You can't use memory after giving it back.
      - "delete takes the pointer, not the value it points at."
    short: new, use, delete, then reset the pointer to nullptr.
    explain: "Create with `new`, use through the pointer, `delete gem;` exactly once, then `gem = nullptr;` so the stale address can't be followed. `delete *gem;` doesn't compile: delete needs a pointer, and *gem is an int."
recap:
  - Locals live on the stack and vanish automatically.
  - new puts data on the heap and returns a pointer.
  - Heap data lives until someone deletes it.
  - The pointer is on the stack; its target isn't.
vault:
  - id: w9.stackheap
    title: Stack vs heap
    code: |-
      void quest() {
          int hp = 10;             // stack: gone at }
          int* gem = new int{7};   // gem: stack, *gem: heap
          delete gem;              // heap int handed back
          gem = nullptr;
      }                            // hp and gem vanish here
    note: Stack is automatic and fast. The heap lasts until delete. Prefer locals and containers.
    defense: false
