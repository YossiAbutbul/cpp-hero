# World 5 · Lesson 1: While loops

id: w5.l1
title: While loops
skill: logic
shield: false
concept:
  short: "while (condition) { body } repeats the body as long as the condition stays true."
  analogy: "A guard at a gate asks \"still true?\" before every lap."
  body:
    - "`while (condition) { ... }` checks the condition **first**. If it's true, the body runs, then C++ jumps back and checks again. The moment it's false, execution continues after the closing `}`."
    - "If the condition is false the very first time, the body runs **zero** times."
    - "Most loops have a **counter**: a variable that changes every lap (`++turns;`, `--lives;`) and moves the condition toward false. No change, no exit."
    - "An **accumulator** collects a result across laps: start it at a known value before the loop (`int total{0};`), then add to it inside (`total += damage;`). Starting it uninitialized is UB, just like in World 2."
    - "After the loop, the counter keeps its last value, the one that made the condition false. `while (i <= 3)` ends with i equal to 4."
  pitfall: "Common beginner mistake: forgetting to update the counter inside the body. The condition never changes, so the loop runs forever (an infinite loop)."
demo:
  code: |-
    #include <iostream>

    int main() {
        int charge{0};
        int turns{0};
        while (charge < 30) {
            charge += 10;
            ++turns;
            std::cout << "Charge: " << charge << '\n';
        }
        std::cout << "Ready after " << turns << " turns!\n";
        return 0;
    }
  steps:
    - line: 3
      vars:
        charge: "0"
      note: The accumulator starts at a known 0.
    - line: 4
      vars:
        charge: "0"
        turns: "0"
      note: The counter starts at 0 too.
    - line: 5
      note: "Check first: 0 < 30 is true. Enter the body."
    - line: 6
      vars:
        charge: "10"
        turns: "0"
    - line: 7
      vars:
        charge: "10"
        turns: "1"
      note: The counter ticks up.
    - line: 8
      out: |
        Charge: 10
    - line: 5
      note: Back to the top. 10 < 30, go again.
    - line: 6
      vars:
        charge: "20"
        turns: "1"
    - line: 7
      vars:
        charge: "20"
        turns: "2"
    - line: 8
      out: |
        Charge: 20
    - line: 5
      note: 20 < 30, one more lap.
    - line: 6
      vars:
        charge: "30"
        turns: "2"
    - line: 7
      vars:
        charge: "30"
        turns: "3"
    - line: 8
      out: |
        Charge: 30
    - line: 5
      note: "30 < 30 is false: the loop ends."
    - line: 10
      out: |
        Ready after 3 turns!
      note: Execution continues after the closing brace.
    - line: 11
      note: "return 0: fully charged!"
challenges:
  - id: w5.l1.c1
    type: predict
    tags: [ w5.while, w3.arith ]
    prompt: What does this print?
    code: |-
      #include <iostream>

      int main() {
          int n = 1;
          while (n < 20) {
              n *= 3;
          }
          std::cout << n << '\n';
          return 0;
      }
    options:
      - t: |
          27
        why: "n goes 1, 3, 9, 27; then the check fails."
      - t: |
          9
        why: 9 < 20 is still true, so the body runs once more.
      - t: |
          20
        why: n jumps from 9 to 27 and never equals 20.
      - t: |
          81
        why: 27 < 20 is false, so there is no lap after 27.
    answer: 0
    hints:
      - Write down n after each lap.
      - The check happens before every lap, including the one after 27.
    short: "n goes 1, 3, 9, 27; then 27 < 20 is false."
    explain: "Trace it: 1 < 20 so n = 3; 3 < 20 so n = 9; 9 < 20 so n = 27; 27 < 20 is false, the loop ends and 27 is printed."
  - id: w5.l1.c2
    type: mcq
    tags: [ w5.while, w3.compare ]
    prompt: How many times does the body of this loop run?
    code: |-
      int i = 10;
      while (i < 5) {
          std::cout << i << '\n';
          ++i;
      }
    options:
      - t: Zero times
        why: 10 < 5 is false on the very first check.
      - t: Once
        why: That's a do-while. A while loop checks before the first lap.
      - t: Five times
        why: Five would need i to start below 5. It starts at 10.
      - t: Forever
        why: The condition is false right away, so there's no lap at all.
    answer: 0
    hints:
      - When does a while loop check its condition?
      - Is 10 < 5 true?
    short: A while loop checks first, so it can run zero times.
    explain: "while checks the condition before every lap, including the first one. 10 < 5 is false, so the body never runs and nothing is printed."
  - id: w5.l1.c3
    type: fill
    tags: [ w5.while, w5.counter ]
    prompt: "Fill in the condition so this prints `3 2 1 Liftoff!`."
    code: |-
      int count{3};
      while (___) {
          std::cout << count << ' ';
          --count;
      }
      std::cout << "Liftoff!\n";
    accept:
      - count > 0
      - count >= 1
      - 0 < count
      - 1 <= count
    placeholder: condition
    hints:
      - Keep going while there's still something to count.
      - The last number printed is 1, so stop once count hits 0.
    short: "count > 0 loops for 3, 2, 1 and stops at 0."
    explain: "count > 0 is true for 3, 2 and 1, so those print. After --count makes it 0, the check fails and Liftoff! prints. (count >= 1 works too.)"
  - id: w5.l1.c4
    type: bug
    tags: [ w5.infinite, w5.counter, w1.warnings ]
    bug: infinite-loop
    unsafe: true
    prompt: "UNSAFE: this countdown never stops. Tap the buggy line, then pick the fix."
    code: |-
      int lives{3};
      while (lives > 0) {
          std::cout << "Lives: " << lives << '\n';
          lives - 1;
      }
      std::cout << "Game over\n";
    bugLine: 3
    options:
      - t: --lives;
        why: lives really drops each lap, so lives > 0 turns false.
      - t: lives = 1;
        why: lives is stuck at 1, and 1 > 0 stays true forever.
      - t: ++lives;
        why: lives grows away from 0, so the loop never ends.
      - t: lives + 1;
        why: Same problem as before. It computes a value and throws it away.
    answer: 0
    hints:
      - Does `lives - 1` actually change lives?
      - The value must be stored back, or use --.
    short: "`lives - 1` never stores its result. Use `--lives`."
    explain: "`lives - 1;` calculates 2 and throws it away: lives stays 3 and the loop spins forever. g++ even warns \"statement has no effect\" with -Wall. `--lives;` (or `lives -= 1;`) changes the variable, moving the loop toward its exit."
    sideBySide:
      unsafe: |-
        while (lives > 0) {
            std::cout << "Lives: " << lives << '\n';
            lives - 1;   // no effect: infinite loop
        }
      hardened: |-
        while (lives > 0) {
            std::cout << "Lives: " << lives << '\n';
            --lives;
        }
      prelude: int lives{3};
  - id: w5.l1.c5
    type: write
    tags: [ w5.accum ]
    prompt: "Inside a loop, add this round's `damage` to the running `total`. Write one statement."
    prelude: int total{0}; int damage{5};
    accept:
      - total += damage;
      - total = total + damage;
      - total = damage + total;
    acceptRe:
      - ^total ?(\+= ?damage|= ?total ?\+ ?damage|= ?damage ?\+ ?total) ?;$
    placeholder: total ...
    hints:
      - The accumulator is total. It grows by damage each lap.
      - "+= adds to a variable in place. Don't forget the ;"
    short: total += damage; adds this lap's damage to the running total.
    explain: "`total += damage;` is short for `total = total + damage;`. Each lap adds one more round's damage, so after the loop total holds the sum."
  - id: w5.l1.c6
    type: predict
    tags: [ w5.counter, w5.accum ]
    prompt: What does this print? (It shows i, then total.)
    code: |-
      #include <iostream>

      int main() {
          int total{0};
          int i{1};
          while (i <= 3) {
              total += i * 10;
              ++i;
          }
          std::cout << i << ' ' << total << '\n';
          return 0;
      }
    options:
      - t: |
          4 60
        why: "10 + 20 + 30 = 60, and i ends at 4."
      - t: |
          3 60
        why: At i = 3, i <= 3 is still true.
      - t: |
          4 100
        why: The body never runs for i = 4, so no extra 40.
      - t: |
          3 30
        why: total adds 10, 20 and 30, not just 30.
    answer: 0
    hints:
      - Which value of i makes i <= 3 false?
      - "Add up only the laps that run: i = 1, 2, 3."
    short: "Laps i = 1, 2, 3 add 60; i ends at 4."
    explain: "Laps run for i = 1, 2, 3, adding 10, 20, 30: total is 60. Then ++i makes i 4, 4 <= 3 is false, and the loop ends with i still 4. Output: \"4 60\" and a newline."
recap:
  - while checks the condition before every lap.
  - False at the start means zero laps.
  - Every lap moves the counter toward exit.
  - Start accumulators at a known value.
vault:
  - id: w5.while
    title: The while loop
    code: |-
      int turns{0};
      while (turns < 3) {       // checked before every lap
          std::cout << "Turn " << turns << '\n';
          ++turns;              // move toward the exit!
      }
      // here turns == 3
    note: Runs zero or more times. The counter must change inside the body.
    defense: false
  - id: w5.accum
    title: Counter + accumulator
    code: |-
      int total{0};             // accumulator: known start
      int i{1};                 // counter
      while (i <= 5) {
          total += i;
          ++i;
      }
      // total == 15, i == 6
    note: Initialize both before the loop. After the loop the counter is one past the last lap.
    defense: false
reviewTags: [ w4.if, w3.compare, w3.incdec, w2.init, w1.cout ]
