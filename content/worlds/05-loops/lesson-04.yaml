    prompt: "How many pairs (like `00`) does this print?"
    code: |-
      for (int r = 0; r < 3; ++r) {
          for (int c = 0; c < 3; ++c) {
              if (c == 1) {
                  break;
              }
              std::cout << r << c << ' ';
          }
      }
    options:
      - t: "3"
        why: "Each of the 3 rows prints only c = 0."
      - t: "1"
        why: That needs break to end BOTH loops. It ends one.
      - t: "9"
        why: The break stops each row at c = 1.
      - t: "6"
        why: At c = 1 the break comes before the print.
    answer: 0
    hints:
      - Which loop does break leave?
      - The outer loop still runs all 3 laps.
    short: break leaves only the inner loop; each row prints once.
    explain: "Each row prints r0, then c = 1 triggers break, which ends the inner loop only. The outer loop continues, so rows 0, 1, 2 each print once: 00 10 20."
  - id: w5.l4.c5
    type: fill
    tags: [ w5.break, w5.while ]
    prompt: Fill in the statement that ends the loop once hp drops to 0 or below.
    code: |-
      int hp{10};
      while (true) {
          hp -= 4;
          if (hp <= 0) {
              ___;
          }
          std::cout << "Still standing: " << hp << '\n';
      }
      std::cout << "Down!\n";
    accept:
      - break
