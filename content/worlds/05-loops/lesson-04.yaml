# World 5 · Lesson 4: Break, continue and nested loops

id: w5.l4
title: Break, continue and nested loops
skill: logic
shield: false
concept:
  short: "break leaves the loop; continue skips to the next lap. Loops inside loops make grids."
  analogy: "A clock: the minute hand circles fully for each hour tick."
  body:
    - "`break;` exits the loop immediately; execution continues after its closing `}`. Handy for \"stop as soon as...\" logic, like a `while (true)` loop that ends when hp hits 0."
    - "`continue;` skips the rest of this lap. In a `for` loop the update (`++i`) still runs; in a `while` loop it jumps straight back to the condition, so an update at the bottom is **skipped**."
    - "A **nested** loop is a loop in another loop's body. For every lap of the outer loop, the inner loop runs completely, restarting from its start value. Rows outside, columns inside: that's how you print grids and patterns."
    - "The inner loop's bound can use the outer counter: `for (int col = 1; col <= row; ++col)` makes each row one longer, a triangle."
    - "`break` and `continue` affect only the **innermost** loop they're in. A `break` in the inner loop ends that row, not the whole grid."
  pitfall: "Common beginner mistake: `continue` in a while loop that skips the `++i` at the bottom. The counter stops moving and the loop never ends."
demo:
  code: |-
    #include <iostream>

    int main() {
        for (int row = 1; row <= 3; ++row) {
            for (int col = 1; col <= row; ++col) {
                std::cout << '*';
            }
            std::cout << '\n';
        }
        return 0;
    }
  steps:
    - line: 3
      vars:
        row: "1"
      note: "Outer loop: row 1."
    - line: 4
      vars:
        row: "1"
        col: "1"
      note: "Inner loop starts fresh: col = 1."
    - line: 5
      out: "*"
    - line: 4
      vars:
        row: "1"
        col: "2"
      note: "2 <= 1 is false: this row is done."
    - line: 7
      out: "\n"
    - line: 3
      vars:
        row: "2"
      note: "Next row: 2. The inner loop restarts."
    - line: 4
      vars:
        row: "2"
        col: "1"
    - line: 5
      out: "*"
    - line: 4
      vars:
        row: "2"
        col: "2"
    - line: 5
      out: "*"
    - line: 4
      vars:
        row: "2"
        col: "3"
      note: "3 <= 2 is false: row 2 done."
    - line: 7
      out: "\n"
    - line: 3
      vars:
        row: "3"
    - line: 4
      vars:
        row: "3"
        col: "1"
    - line: 5
      out: "*"
    - line: 4
      vars:
        row: "3"
        col: "2"
    - line: 5
      out: "*"
    - line: 4
      vars:
        row: "3"
        col: "3"
    - line: 5
      out: "*"
    - line: 4
      vars:
        row: "3"
        col: "4"
    - line: 7
      out: "\n"
    - line: 3
      vars:
        row: "4"
      note: "row 4 fails row <= 3: the triangle is done."
    - line: 9
challenges:
  - id: w5.l4.c1
    type: predict
    tags: [ w5.continue, w3.modulo ]
    prompt: What does this print? Spaces count.
    code: |-
      #include <iostream>

      int main() {
          for (int i = 1; i <= 6; ++i) {
              if (i % 3 == 0) {
                  continue;
              }
              std::cout << i << ' ';
          }
          std::cout << '\n';
          return 0;
      }
    options:
      - t: "1 2 4 5 \n"
        why: 3 and 6 hit continue before the print.
      - t: "1 2 \n"
        why: That's what break would do. continue only skips one lap.
      - t: "3 6 \n"
        why: "Reversed: continue SKIPS the multiples of 3."
      - t: "1 2 3 4 5 6 \n"
        why: The continue runs before the print for 3 and 6.
    answer: 0
    hints:
      - Which values of i make i % 3 == 0 true?
      - continue skips the rest of that lap only.
    short: continue skips 3 and 6; the loop keeps going.
    explain: "For i = 3 and 6, i % 3 is 0, so continue jumps to ++i and skips the print. Every other value prints with a space. Output: \"1 2 4 5 \" and a newline."
  - id: w5.l4.c2
    type: predict
    tags: [ w5.break, w5.accum ]
    prompt: What does this print?
    code: |-
      #include <iostream>

      int main() {
          int total{0};
          for (int i = 1; i <= 10; ++i) {
              total += i;
              if (total > 10) {
                  break;
              }
          }
          std::cout << total << '\n';
          return 0;
      }
    options:
      - t: |
          15
        why: "15 is the first total above 10, so break fires."
      - t: |
          10
        why: 10 > 10 is false, so one more lap runs.
      - t: |
          55
        why: That's 1 through 10 with no break. The break stops it early.
      - t: |
          21
        why: The break fires right after 15, before i = 6 is added.
    answer: 0
    hints:
      - Keep a running total lap by lap.
      - Is 10 > 10 true?
    short: "Totals 1, 3, 6, 10, 15; break fires at 15."
    explain: "The running total is 1, 3, 6, 10, then 15. The check comes after adding, and 15 is the first total above 10, so break exits and 15 is printed."
  - id: w5.l4.c3
    type: predict
    tags: [ w5.nested ]
    prompt: "What does this grid print? (↵ marks a new line.)"
    code: |-
      #include <iostream>

      int main() {
          for (int r = 0; r < 2; ++r) {
              for (int c = 0; c < 3; ++c) {
                  std::cout << r << c << ' ';
              }
              std::cout << '\n';
          }
          return 0;
      }
    options:
      - t: "00 01 02 \n10 11 12 \n"
        why: "Each r runs c through 0, 1, 2, then a newline."
      - t: "00 10 \n01 11 \n02 12 \n"
        why: Rows and columns swapped. c runs fully for each r.
      - t: "00 01 02 10 11 12 \n"
        why: The newline prints after every row, not once at the end.
      - t: "00 11 \n"
        why: The inner loop runs all 3 laps for every r.
    answer: 0
    hints:
      - The inner loop runs completely for each outer lap.
      - The newline belongs to the outer loop.
    short: "For each r, c runs 0 to 2; then a newline."
    explain: "Outer r = 0: inner prints 00 01 02 then a newline. Outer r = 1: 10 11 12 then a newline. 2 × 3 = 6 pairs in total."
  - id: w5.l4.c4
