    placeholder: keyword
    hints:
      - while (true) never ends on its own.
      - You need a keyword that leaves the loop right now.
    short: break is the only exit from a while (true) loop.
    explain: "while (true) never stops by itself, so break is the exit. It prints 6, then 2, then hp becomes -2 and break jumps to \"Down!\". A while (true) loop must always have a reachable break."
  - id: w5.l4.c6
    type: review
    tags: [ w5.continue, w5.infinite ]
    bug: infinite-loop
    unsafe: true
    prompt: "UNSAFE: this should add the odd numbers below 10, but never ends. Tap every dangerous line."
    code: |-
      int sum{0};
      int i{0};
      while (i < 10) {
          if (i % 2 == 0) {
              continue;
          }
          sum += i;
          ++i;
      }
    dangerous: [ 4 ]
    lineNotes:
      "2": "The condition is fine; the problem is i stops moving."
      "4": "continue jumps back to the check and skips ++i: i stays 0 forever."
      "7": "The update is here, but continue never reaches it."
    hints:
      - Follow i = 0 through one lap.
      - What does continue skip in a while loop?
    short: continue in a while loop skipped the update. Use a for loop.
    explain: "At i = 0, i % 2 == 0 is true, so continue jumps straight back to i < 10, skipping ++i. i is 0 forever: an infinite loop. In a for loop, continue still runs the update, so the counter always moves."
    sideBySide:
      unsafe: |-
        while (i < 10) {
            if (i % 2 == 0) {
                continue;   // skips ++i
            }
            sum += i;
            ++i;
        }
      hardened: |-
        for (int k = 0; k < 10; ++k) {
            if (k % 2 == 0) {
                continue;   // ++k still runs
            }
            sum += k;
        }
      prelude: int sum{0}; int i{0};
recap:
  - break leaves the innermost loop immediately.
  - continue skips to the next lap.
  - In while loops, continue can skip your update.
  - "Nested: inner loop runs fully each lap."
vault:
  - id: w5.breakcontinue
    title: break and continue
    code: |-
      for (int i = 1; i <= 10; ++i) {
          if (i % 2 == 0) {
              continue;   // skip evens; ++i still runs
          }
          if (i > 7) {
              break;      // leave the loop now
          }
          std::cout << i << ' ';   // 1 3 5 7
      }
    note: Both affect only the innermost loop. Prefer for loops when you use continue.
    defense: false
  - id: w5.nested
    title: Nested loops (grid)
    code: |-
      for (int row = 1; row <= 3; ++row) {
          for (int col = 1; col <= row; ++col) {
              std::cout << '*';
          }
          std::cout << '\n';   // one newline per row
      }
    note: Rows outside, columns inside. The inner loop restarts every row.
    defense: false
