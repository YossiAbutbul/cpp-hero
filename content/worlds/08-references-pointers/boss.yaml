# World 8 boss: The Dangling Wraith

id: w8.boss
name: The Dangling Wraith
art: wraith
hp: 8
intro: "Ssss... I am the Dangling Wraith. Follow my arrows... into the void."
taunt:
  - Your local is gone. Its address is mine now.
  - Dereference me. I dare you. I am nullptr.
  - An uninitialized pointer points wherever I want.
  - It printed the right number? That's just my trick.
rounds:
  - id: w8.boss.r1
    type: predict
    tags: [ w8.ref, w8.deref ]
    prompt: What does this print?
    code: |-
      #include <iostream>

      int main() {
          int hp = 8;
          int& r = hp;
          int* p = &hp;
          r += 2;
          *p *= 3;
          std::cout << hp << '\n';
          return 0;
      }
    options:
      - t: |
          30
        why: "(8 + 2) * 3 = 30, all in hp."
      - t: |
          24
        why: r += 2 changes hp before the multiply.
      - t: |
          10
        why: "*p *= 3 also writes into hp."
      - t: |
          8
        why: Neither r nor p is a copy.
    answer: 0
    hints:
      - How many int boxes exist here?
    short: "r and *p are both just hp."
    explain: "One box, three ways to reach it. `r += 2` makes hp 10; `*p *= 3` makes it 30. Output: \"30\" and a newline."
  - id: w8.boss.r2
    type: mcq
    tags: [ w8.ptr-vs-ref, w8.reseat ]
    prompt: Which claim is TRUE?
    options:
      - t: A pointer can be reseated and can be null; a reference can be neither.
        why: That's the core difference.
      - t: A reference can be reseated with r = other;
        why: That copies other's value into what r names.
      - t: A reference may be declared first and bound later.
        why: "int& r; doesn't compile."
      - t: Dereferencing nullptr throws an exception you can catch.
        why: It's undefined behavior, not an exception.
    answer: 0
    hints:
      - Think about "nothing" and "switching targets".
    short: "Pointers: nullable and reseatable. References: neither."
    explain: "A reference is bound once and always names a real object (while it lives). A pointer can hold nullptr and can be pointed elsewhere, which is exactly why pointers need checks."
  - id: w8.boss.r3
    type: predict
    tags: [ w8.pointer, w8.byref, w6.params ]
    prompt: What does this print?
    code: |-
      #include <iostream>

      void swapPtr(int* a, int* b) {
          int temp = *a;
          *a = *b;
          *b = temp;
      }

      int main() {
          int x = 3;
          int y = 7;
          swapPtr(&x, &y);
          std::cout << x << ' ' << y << '\n';
          return 0;
      }
    options:
      - t: |
          7 3
        why: It writes through both arrows into x and y.
      - t: |
          3 7
        why: The pointers are copies, but aim at x and y.
      - t: |
          7 7
        why: temp saves x's old value first.
      - t: |
          3 3
        why: "*a = *b puts 7 into x."
    answer: 0
    hints:
      - "*a is x itself."
    short: Writing through the pointers swaps the real x and y.
    explain: "a and b hold x's and y's addresses, so `*a` and `*b` are x and y. The swap trades them: \"7 3\" and a newline. A reference version is simpler and can't be handed nullptr."
  - id: w8.boss.r4
    type: fill
    tags: [ w8.constref, w6.constref ]
    prompt: "`chant` only reads a long spell. Fill in the parameter type: no copy, no changes."
    code: |-
      #include <iostream>
      #include <string>

      void chant(___ spell) {
          std::cout << spell << '\n';
      }

      int main() {
          chant("Begone, Wraith!");
          return 0;
      }
    accept:
      - const std::string&
      - std::string const&
    placeholder: type
    hints:
      - "It's a std::string, passed by reference."
    short: "`const std::string&`: no copy, no changes, accepts literals."
    explain: "`const std::string&` avoids a copy and forbids changes. It can also bind to the temporary string made from \"Begone, Wraith!\"; a plain `std::string&` couldn't."
  - id: w8.boss.r5
    type: predict
    tags: [ w8.ptr-arith ]
    prompt: What does this print?
    code: |-
      #include <array>
      #include <iostream>

      int main() {
          std::array<int, 4> souls{2, 4, 6, 8};
          int* p = &souls[3];
          --p;
          std::cout << *p << ' ' << *(p - 2) << '\n';
          return 0;
      }
    options:
      - t: |
          6 2
        why: "Two back from 6 is souls[0], 2."
      - t: |
          8 4
        why: "--p moves p back one element first."
      - t: |
          5 3
        why: Pointer math moves between elements, not values.
      - t: |
          6 4
        why: Two back lands on souls[0], not souls[1].
    answer: 0
    hints:
      - Where is p after --p?
    short: Pointer steps count whole elements, backward too.
    explain: "p starts at souls[3]. `--p` moves it to souls[2] (6). `*(p - 2)` reads souls[0] (2). Every step stayed inside the array; one more step back from souls[0] would be UB. Output: \"6 2\" and a newline."
  - id: w8.boss.r6
    type: speed
    tags: [ w8.pointer, w8.ref, w8.const-ptr, w8.nullptr ]
    prompt: Speed round! Answer fast!
    seconds: 45
    items:
      - q: "What does *p mean in an expression?"
        options:
          - address of p
          - the value p points at
          - p is null
        answer: 1
      - q: "What does &x mean in an expression?"
        options:
          - reference to x
          - address of x
          - value of x
        answer: 1
      - q: Which can be null?
        options:
          - int& r
          - int* p
          - both
        answer: 1
      - q: "const int* p: what is locked?"
        options:
          - the int it points at
          - the pointer itself
          - both
        answer: 0
      - q: "int* const p: what is locked?"
        options:
          - the int it points at
          - the pointer itself
          - neither
        answer: 1
      - q: What value does p hold?
        code: int* p = nullptr;
        options:
          - garbage
          - nullptr, points nowhere
          - "the address of 0"
        answer: 1
      - q: What is x now?
        code: |-
          int x = 1;
          int& r = x;
          r = 5;
        options:
          - "1"
          - "5"
        answer: 1
    hints:
      - "* follows, & takes an address."
    short: "* follows, & takes an address. Only pointers can be null."
    explain: "In expressions, `*p` follows the pointer and `&x` gives an address. Only pointers can be null. `const int*` locks the target; `int* const` locks the pointer. Assigning through a reference changes the original."
  - id: w8.boss.r7
    type: bug
    tags: [ w8.dangling, w6.return ]
    bug: dangling-ref
    unsafe: true
    prompt: This returns a dangling reference. Tap the buggy line, then pick the fix.
    code: |-
      #include <iostream>

      int& summonHp() {
          int hp = 99;
          return hp;
      }

      int main() {
          int& wraith = summonHp();
          std::cout << wraith << '\n';
          return 0;
      }
    bugLine: 2
    options:
      - t: int summonHp() {
        why: The caller gets its own copy of 99.
      - t: const int& summonHp() {
        why: const doesn't save hp; it still dies at }.
      - t: int* summonHp() {
        why: Dangles the same, and won't compile here.
      - t: int&& summonHp() {
        why: Still a reference to the dead local.
    answer: 0
    hints:
      - Return a copy instead.
    short: Never return a reference to a local; return by value.
    explain: "hp is destroyed when summonHp returns, so the returned reference dangles, and reading wraith is UB. g++ warns: \"reference to local variable 'hp' returned\". Return `int` by value, and in main write `int wraith = summonHp();`."
    sideBySide:
      unsafe: |-
        #include <iostream>

        int& summonHp() {
            int hp = 99;
            return hp;   // dangling reference
        }

        int main() {
            int& wraith = summonHp();
            std::cout << wraith << '\n';   // UB
            return 0;
        }
      hardened: |-
        #include <iostream>

        int summonHp() {
            int hp = 99;
            return hp;   // a copy
        }

        int main() {
            int wraith = summonHp();
            std::cout << wraith << '\n';
            return 0;
        }
  - id: w8.boss.r8
    type: safe
    tags: [ w8.init-ptr, w8.nullcheck, w8.dangling ]
    prompt: Safe or unsafe? Go fast!
    seconds: 30
    items:
      - code: |-
          int* p = &hp;
          std::cout << *p;
        prelude: int hp{8};
        safe: true
        why: p points at a living int.
      - code: |-
          int* p;
          std::cout << *p;
        safe: false
        why: "Reads a garbage address: UB."
      - code: |-
          int* p = nullptr;
          if (p) {
              std::cout << *p;
          }
        safe: true
        why: "if (p) checks for null before following."
      - code: |-
          int* p = nullptr;
          *p = 3;
        safe: false
        why: Writing through nullptr is UB.
      - code: |-
          int& r = hp;
          std::cout << r;
        prelude: int hp{8};
        safe: true
        why: The reference names a living variable.
      - code: |-
          int* p = nullptr;
          {
              int ghost = 4;
              p = &ghost;
          }
          *p = 1;
        safe: false
        why: ghost is out of scope; p dangles.
      - code: |-
          const int& r = 5;
          std::cout << r;
        safe: true
        why: A direct const reference keeps the temporary alive.
      - code: |-
          int x = 2;
          int* p = &x;
          delete p;
        safe: false
        why: x wasn't made with new. Deleting it is UB.
    hints:
      - Is each pointer set, checked, and alive?
      - "Never delete what you didn't new."
    short: "Safe arrows: initialized, checked, aimed at living things."
    explain: "Initialize every pointer, check nullptr before following it, don't keep pointers to out-of-scope locals, and never delete what you didn't new. A const reference bound directly to a temporary keeps that temporary alive; that rule has limits (see the defense phase!)."
  - id: w8.boss.r9
    type: edge
    tags: [ w8.nullcheck, w3.validate ]
    bug: null-deref
    unsafe: true
    prompt: "Valid choices are 1 and 2. Which choice values cause undefined behavior? Select all."
    code: |-
      int* target = (choice == 1) ? &knight
                  : (choice == 2) ? &mage
                  : nullptr;
      std::cout << *target << '\n';
    prelude: int knight{30}; int mage{12}; int choice{1};
    options:
      - t: "1"
        why: Targets the Knight. Safe.
      - t: "2"
        why: Targets the Mage. Safe.
      - t: "0"
        why: No match, so *target follows nullptr.
      - t: "3"
        why: Also falls through to nullptr.
      - t: "-1"
        why: Negatives match nothing either.
    answers: [ 2, 3, 4 ]
    hints:
      - Which choices leave target as nullptr?
    short: Every choice other than 1 or 2 leaves target null.
    explain: "Any input that isn't 1 or 2 makes target nullptr, and the unchecked `*target` is UB. Good edge tests try both sides of the valid range. Fix: check `target == nullptr` before printing."
    sideBySide:
      unsafe: |-
        int* target = (choice == 1) ? &knight
                    : (choice == 2) ? &mage
                    : nullptr;
        std::cout << *target << '\n';   // UB for 0, 3, -1...
      hardened: |-
        int* target = (choice == 1) ? &knight
                    : (choice == 2) ? &mage
                    : nullptr;
        if (target == nullptr) {
            std::cout << "Pick 1 or 2\n";
            return 1;
        }
        std::cout << *target << '\n';
      prelude: int knight{30}; int mage{12}; int choice{1};
defense:
  - attack: nullptr
    label: A null hero!
    challenge:
      id: w8.boss.d1
      type: harden
      tags: [ w8.nullcheck, w6.params ]
      bug: null-deref
      prompt: "The Wraith calls heal(nullptr). Pick the line for the blank that blocks it."
      code: |-
        #include <iostream>

        void heal(int* hp) {
            ___
            *hp += 10;
        }

        int main() {
            int knight = 30;
            heal(&knight);
            heal(nullptr);
            std::cout << knight << '\n';
            return 0;
        }
      options:
        - t: "if (hp == nullptr) { return; }"
          why: Leaves before following null.
        - t: "if (*hp == 0) { return; }"
          why: The check itself dereferences null. UB.
        - t: "if (hp != nullptr) { return; }"
          why: "Inverted: skips real heroes, follows null."
        - t: hp = &hp[0];
          why: Still nullptr, and pointer math on null is UB.
      answer: 0
      hints:
        - Test the pointer before *hp.
      short: Check nullptr first, or take int& so null is impossible.
      explain: "A pointer parameter accepts nullptr, so the function must check before `*hp`. When a missing hero never makes sense, `void heal(int& hp)` is better: the compiler rejects `heal(nullptr)` outright."
      sideBySide:
        unsafe: |-
          #include <iostream>

          void heal(int* hp) {
              *hp += 10;   // heal(nullptr): UB
          }

          int main() {
              int knight = 30;
              heal(&knight);
              std::cout << knight << '\n';
              return 0;
          }
        hardened: |-
          #include <iostream>

          void heal(int& hp) {   // can't be null
              hp += 10;
          }

          int main() {
              int knight = 30;
              heal(knight);
              std::cout << knight << '\n';
              return 0;
          }
  - attack: "&expired"
    label: An arrow to a fallen local!
    challenge:
      id: w8.boss.d2
      type: bug
      tags: [ w8.dangling, w6.return ]
      bug: dangling-pointer
      unsafe: true
      prompt: "summon returns a dead local's address. Tap the buggy line, then pick the fix."
      code: |-
        #include <iostream>

        int* summon() {
            int minion = 7;
            return &minion;
        }

        int main() {
            int* m = summon();
            std::cout << *m << '\n';
            return 0;
        }
      bugLine: 4
      options:
        - t: "Return by value: int summon() { ...; return minion; }"
          why: The caller gets its own copy. Nothing dangles.
        - t: return &minion + 0;
          why: Same dead address, just disguised.
        - t: "Make it: int* m = nullptr; m = summon();"
          why: m still receives the dead address.
        - t: "Add: delete m; at the end of main"
          why: minion was never made with new. UB.
      answer: 0
      hints:
        - Hand back the value, not its address.
      short: Return a local by value, never by address.
      explain: "minion lives on summon's stack frame, which is gone once summon returns. The returned pointer dangles; reading `*m` is UB. g++ -Wall warns: \"function returns address of local variable\". AddressSanitizer can catch the bad read at run time."
      sideBySide:
        unsafe: |-
          #include <iostream>

          int* summon() {
              int minion = 7;
              return &minion;   // dangling
          }

          int main() {
              int* m = summon();
              std::cout << *m << '\n';   // UB
              return 0;
          }
        hardened: |-
          #include <iostream>

          int summon() {
              int minion = 7;
              return minion;
          }

          int main() {
              int m = summon();
              std::cout << m << '\n';
              return 0;
          }
  - attack: "int* curse;"
    label: An uninitialized pointer!
    challenge:
      id: w8.boss.d3
      type: harden
      tags: [ w8.init-ptr, w2.init ]
      prompt: "Pick the declaration that makes the nullptr check below actually work."
      code: |-
        ___;
        if (curse != nullptr) {
            *curse = 1;
        }
        std::cout << "Curse lifted\n";
      options:
        - t: int* curse = nullptr
          why: "A known \"nowhere\", so the check works."
        - t: int* curse
          why: Garbage passes the check, then writes to junk.
        - t: int curse = 0
          why: Not a pointer; the later lines won't compile.
        - t: int& curse
          why: An unbound reference doesn't compile.
      answer: 0
      hints:
        - A check needs a known starting value.
      short: Initialize pointers to nullptr so null checks mean something.
      explain: "An uninitialized pointer holds leftover bits: not nullptr, not valid. A check like `curse != nullptr` can't save you from that. Always initialize: `int* curse = nullptr;` or point it at a real object right away."
      sideBySide:
        unsafe: |-
          int* curse;   // garbage
          if (curse != nullptr) {
              *curse = 1;   // UB
          }
        hardened: |-
          int* curse = nullptr;
          if (curse != nullptr) {
              *curse = 1;
          }
          std::cout << "Curse lifted\n";
  - attack: "std::max(hit, 10)"
    label: A reference to a temporary that died!
    challenge:
      id: w8.boss.d4
      type: breakit
      tags: [ w8.dangling, w8.constref ]
      bug: dangling-ref
      unsafe: true
      prompt: "std::max returns a reference to the bigger argument. Which hit value leaves `best` dangling?"
      code: |-
        #include <algorithm>

        const int& best = std::max(hit, 10);
        std::cout << best << '\n';
      prelude: int hit{3};
      options:
        - t: "3"
          why: 10 wins; that temporary dies at the ;.
        - t: "15"
          why: best refers to hit, which is alive.
        - t: "10"
          why: "A tie returns the first argument, hit."
        - t: "12"
          why: hit wins; best names a living variable.
      answer: 0
      hints:
        - "Which argument is a temporary?"
        - When does that temporary die?
      short: A reference to a returned temporary dangles after the ;.
      explain: "The literal 10 becomes a temporary that lives only until the end of the statement. When 10 is bigger, std::max returns a reference to that temporary, so best dangles. Lifetime extension only applies when a const reference binds DIRECTLY to a temporary, not through a function's return. GCC 13 warns with -Wdangling-reference. Fix: store a copy, `int best = std::max(hit, 10);`."
      sideBySide:
        unsafe: |-
          #include <algorithm>

          const int& best = std::max(hit, 10);   // may dangle
          std::cout << best << '\n';
        hardened: |-
          #include <algorithm>

          int best = std::max(hit, 10);   // a copy: always safe
          std::cout << best << '\n';
        prelude: int hit{3};
victory: "Nooo... all checked... I fade... to... nullptr..."
reward:
  xp: 250
  cosmetic: pointer-goggles
  bug: null-deref
