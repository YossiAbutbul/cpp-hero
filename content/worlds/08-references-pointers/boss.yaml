# World 8 boss: The Dangling Wraith

id: w8.boss
name: The Dangling Wraith
art: wraith
hp: 8
intro: "Ssss... I am the Dangling Wraith. Follow my arrows... into the void."
taunt:
  - Your local is gone, little hero. Its address is mine now.
  - Dereference me. I dare you. I am nullptr.
  - An uninitialized pointer points wherever I want.
  - It printed the right number? That's just my trick.
rounds:
  - id: w8.boss.r1
    type: predict
    tags: [ w8.ref, w8.deref ]
    prompt: The Wraith conjures two names and one arrow for the same box. What does this print?
    code: |-
      #include <iostream>

      int main() {
          int hp = 8;
          int& r = hp;
          int* p = &hp;
          r += 2;
          *p *= 3;
          std::cout << hp << '\n';
          return 0;
      }
    options:
      - t: |
          30
        why: "Correct: r and *p are both hp. (8 + 2) * 3 = 30."
      - t: |
          24
        why: r += 2 changes hp too, before the multiplication.
      - t: |
          10
        why: "*p *= 3 writes through the pointer into hp as well."
      - t: |
          8
        why: Neither r nor p is a copy; both change hp.
    answer: 0
    hints:
      - How many int boxes exist here?
      - Apply the changes in order.
    short: "r and *p both mean hp: (8 + 2) * 3 = 30."
    explain: "One box, three ways to reach it. `r += 2` makes hp 10; `*p *= 3` makes it 30. Output: \"30\" and a newline."
  - id: w8.boss.r2
    type: mcq
    tags: [ w8.ptr-vs-ref, w8.reseat ]
    prompt: The Wraith whispers four claims. Which one is TRUE?
    options:
      - t: A pointer can be reseated and can be null; a reference can be neither.
        why: "Correct: that's the core difference between them."
      - t: A reference can be reseated with r = other;
        why: That assigns other's value into what r already names.
      - t: A reference may be declared first and bound later.
        why: "References must be initialized: int& r; doesn't compile."
      - t: Dereferencing nullptr throws an exception you can catch.
        why: "It's undefined behavior, not an exception. Usually a crash, never guaranteed."
    answer: 0
    hints:
      - Think about "nothing" and "switching targets".
      - Only one of these ever needs a nullptr check.
    short: "Pointers: nullable and reseatable. References: neither."
    explain: "A reference is bound once and always names a real object (while it lives). A pointer can hold nullptr and can be pointed elsewhere, which is exactly why pointers need checks."
  - id: w8.boss.r3
    type: predict
    tags: [ w8.pointer, w8.byref, w6.params ]
    prompt: A swap done with pointers. What does this print?
    code: |-
      #include <iostream>

      void swapPtr(int* a, int* b) {
          int temp = *a;
          *a = *b;
          *b = temp;
      }

      int main() {
          int x = 3;
          int y = 7;
          swapPtr(&x, &y);
          std::cout << x << ' ' << y << '\n';
          return 0;
      }
    options:
      - t: |
          7 3
        why: "Correct: the function writes through both arrows into x and y."
      - t: |
          3 7
        why: The pointers are copies, but they point at the real x and y.
      - t: |
          7 7
        why: temp saves x's old value before it's overwritten.
      - t: |
          3 3
        why: "*a = *b copies y's 7 into x first."
    answer: 0
    hints:
      - The addresses of x and y are passed in.
      - "*a is x itself."
    short: Writing through the pointers swaps the real x and y.
    explain: "a and b hold x's and y's addresses, so `*a` and `*b` are x and y. The swap trades them: \"7 3\" and a newline. A reference version is simpler and can't be handed nullptr."
  - id: w8.boss.r4
    type: fill
    tags: [ w8.constref, w6.const-ref ]
    prompt: "`chant` only reads a long spell. Fill in the parameter type: no copy, no changes."
    code: |-
      #include <iostream>
      #include <string>

      void chant(___ spell) {
          std::cout << spell << '\n';
      }

      int main() {
          chant("Begone, Wraith!");
          return 0;
      }
    accept:
      - const std::string&
      - std::string const&
    placeholder: type
    hints:
      - "It's a std::string, passed by reference."
      - Add the promise not to change it.
    short: "`const std::string&` reads without copying and accepts literals."
    explain: "`const std::string&` avoids a copy and forbids changes. It can also bind to the temporary string made from \"Begone, Wraith!\"; a plain `std::string&` couldn't."
  - id: w8.boss.r5
    type: predict
    tags: [ w8.ptr-arith ]
    prompt: The Wraith walks an arrow backward. What does this print?
    code: |-
      #include <array>
      #include <iostream>

      int main() {
          std::array<int, 4> souls{2, 4, 6, 8};
          int* p = &souls[3];
          --p;
          std::cout << *p << ' ' << *(p - 2) << '\n';
          return 0;
      }
    options:
      - t: |
          6 2
        why: "Correct: --p moves to souls[2] (6); two more back is souls[0] (2)."
      - t: |
          8 4
        why: "--p really moves p one element back first."
      - t: |
          5 3
        why: Pointer arithmetic moves between elements; it doesn't subtract from values.
      - t: |
          6 4
        why: p - 2 from souls[2] is souls[0], not souls[1].
    answer: 0
    hints:
      - Where is p after --p?
      - p - 2 counts elements, not bytes or values.
    short: "p moves to souls[2] = 6; p - 2 is souls[0] = 2."
    explain: "p starts at souls[3]. `--p` moves it to souls[2] (6). `*(p - 2)` reads souls[0] (2). Every step stayed inside the array; one more step back from souls[0] would be UB. Output: \"6 2\" and a newline."
  - id: w8.boss.r6
    type: speed
    tags: [ w8.pointer, w8.ref, w8.const-ptr, w8.nullptr ]
    prompt: SPEED ROUND! The Wraith is swooping. Answer fast!
    seconds: 45
    items:
      - q: "What does *p mean in an expression?"
        options:
          - address of p
          - the value p points at
          - p is null
        answer: 1
      - q: "What does &x mean in an expression?"
        options:
          - reference to x
          - address of x
          - value of x
        answer: 1
      - q: Which can be null?
        options:
          - int& r
          - int* p
          - both
        answer: 1
      - q: "const int* p: what is locked?"
        options:
          - the int it points at
          - the pointer itself
          - both
        answer: 0
      - q: "int* const p: what is locked?"
        options:
          - the int it points at
          - the pointer itself
          - neither
        answer: 1
      - q: What value does p hold?
        code: int* p = nullptr;
        options:
          - garbage
          - nullptr, points nowhere
          - "the address of 0"
        answer: 1
      - q: What is x now?
        code: |-
          int x = 1;
          int& r = x;
          r = 5;
        options:
          - "1"
          - "5"
        answer: 1
    hints:
      - "* follows, & takes an address."
      - "Read const right to left."
    short: "* follows, & takes an address; only pointers can be null."
    explain: "In expressions, `*p` follows the pointer and `&x` gives an address. Only pointers can be null. `const int*` locks the target; `int* const` locks the pointer. Assigning through a reference changes the original."
  - id: w8.boss.r7
    type: bug
    tags: [ w8.dangling, w6.return ]
    bug: dangling-ref
    unsafe: true
    prompt: The Wraith hides in a return statement. Tap the dangerous line, then pick the fix.
    code: |-
      #include <iostream>

      int& summonHp() {
          int hp = 99;
          return hp;
      }

      int main() {
          int& wraith = summonHp();
          std::cout << wraith << '\n';
          return 0;
      }
    bugLine: 2
    options:
      - t: int summonHp() {
        why: "Correct: return by value. The caller gets its own copy of 99; nothing dangles."
      - t: const int& summonHp() {
        why: const doesn't extend a local's life. hp still dies at the }.
      - t: int* summonHp() {
        why: Returning a pointer to a local dangles just the same (and won't compile here).
      - t: int&& summonHp() {
        why: Still a reference to the dead local. Same bug, fancier spelling.
    answer: 0
    hints:
      - hp lives only inside summonHp.
      - What should the function hand back instead of a reference?
    short: Never return a reference to a local; return by value.
    explain: "hp is destroyed when summonHp returns, so the returned reference dangles, and reading wraith is UB. g++ warns: \"reference to local variable 'hp' returned\". Return `int` by value, and in main write `int wraith = summonHp();`."
    sideBySide:
      unsafe: |-
        #include <iostream>

        int& summonHp() {
            int hp = 99;
            return hp;   // dangling reference
        }

        int main() {
            int& wraith = summonHp();
            std::cout << wraith << '\n';   // UB
            return 0;
        }
      hardened: |-
        #include <iostream>

        int summonHp() {
            int hp = 99;
            return hp;   // a copy
        }

        int main() {
            int wraith = summonHp();
            std::cout << wraith << '\n';
            return 0;
        }
  - id: w8.boss.r8
    type: safe
    tags: [ w8.init-ptr, w8.nullcheck, w8.dangling ]
    prompt: Safe or unsafe? Banish the Wraith's arrows. Go fast!
    seconds: 30
    items:
      - code: |-
          int* p = &hp;
          std::cout << *p;
        prelude: int hp{8};
        safe: true
        why: p points at a living int.
      - code: |-
          int* p;
          std::cout << *p;
        safe: false
        why: "Uninitialized pointer: reading a garbage address is UB."
      - code: |-
          int* p = nullptr;
          if (p) {
              std::cout << *p;
          }
        safe: true
        why: "if (p) checks for null before following."
      - code: |-
          int* p = nullptr;
          *p = 3;
        safe: false
        why: Writing through nullptr is UB.
      - code: |-
          int& r = hp;
          std::cout << r;
        prelude: int hp{8};
        safe: true
        why: The reference names a living variable.
      - code: |-
          int* p = nullptr;
          {
              int ghost = 4;
              p = &ghost;
          }
          *p = 1;
        safe: false
        why: ghost is out of scope; p dangles.
      - code: |-
          const int& r = 5;
          std::cout << r;
        safe: true
        why: A const reference directly bound to a temporary extends its lifetime.
      - code: |-
          int x = 2;
          int* p = &x;
          delete p;
        safe: false
        why: x wasn't made with new. Deleting it is UB.
    hints:
      - Is every pointer set, checked, and pointing at something alive?
      - "Never delete what you didn't new."
    short: "Safe arrows are initialized, checked, and aimed at living things."
    explain: "Initialize every pointer, check nullptr before following it, don't keep pointers to out-of-scope locals, and never delete what you didn't new. A const reference bound directly to a temporary keeps that temporary alive; that rule has limits (see the defense phase!)."
  - id: w8.boss.r9
    type: edge
    tags: [ w8.nullcheck, w3.validate ]
    bug: null-deref
    unsafe: true
    prompt: "The player picks a target: 1 for the Knight, 2 for the Mage. Which inputs crash into the void? Select all."
    code: |-
      int* target = (choice == 1) ? &knight
                  : (choice == 2) ? &mage
                  : nullptr;
      std::cout << *target << '\n';
    prelude: int knight{30}; int mage{12}; int choice{1};
    options:
      - t: "1"
        why: Targets the Knight. Safe.
      - t: "2"
        why: Targets the Mage. Safe.
      - t: "0"
        why: "Exposes it: no match, target is nullptr, *target is UB."
      - t: "3"
        why: "Exposes it: also falls through to nullptr."
      - t: "-1"
        why: "Exposes it: negatives match nothing either."
    answers: [ 2, 3, 4 ]
    hints:
      - Which choices leave target as nullptr?
      - Test just outside the valid range, on both sides.
    short: Every choice other than 1 or 2 leaves target null.
    explain: "Any input that isn't 1 or 2 makes target nullptr, and the unchecked `*target` is UB. Good edge tests try both sides of the valid range. Fix: check `target == nullptr` before printing."
    sideBySide:
      unsafe: |-
        int* target = (choice == 1) ? &knight
                    : (choice == 2) ? &mage
                    : nullptr;
        std::cout << *target << '\n';   // UB for 0, 3, -1...
      hardened: |-
        int* target = (choice == 1) ? &knight
                    : (choice == 2) ? &mage
                    : nullptr;
        if (target == nullptr) {
            std::cout << "Pick 1 or 2\n";
            return 1;
        }
        std::cout << *target << '\n';
      prelude: int knight{30}; int mage{12}; int choice{1};
defense:
  - attack: nullptr
    label: A null hero!
    challenge:
      id: w8.boss.d1
      type: harden
      tags: [ w8.nullcheck, w6.params ]
      bug: null-deref
      prompt: "The Wraith calls heal(nullptr). Pick the first line of heal that blocks it."
      code: |-
        #include <iostream>

        void heal(int* hp) {
            ___
            *hp += 10;
        }

        int main() {
            int knight = 30;
            heal(&knight);
            heal(nullptr);
            std::cout << knight << '\n';
            return 0;
        }
      options:
        - t: "if (hp == nullptr) { return; }"
          why: "Correct: leaves before following a null pointer. (Even better: take int& so null is impossible.)"
        - t: "if (*hp == 0) { return; }"
          why: The check itself dereferences hp. With nullptr, that's UB.
        - t: "if (hp != nullptr) { return; }"
          why: "Inverted: skips every real hero and dereferences the null one."
        - t: hp = &hp[0];
          why: That's still nullptr (and pointer math on null is UB). Nothing is fixed.
      answer: 0
      hints:
        - Test the pointer before *hp.
        - Leave the function early if there's nothing to heal.
      short: Check for nullptr first, or take a reference so null can't happen.
      explain: "A pointer parameter accepts nullptr, so the function must check before `*hp`. When a missing hero never makes sense, `void heal(int& hp)` is better: the compiler rejects `heal(nullptr)` outright."
      sideBySide:
        unsafe: |-
          #include <iostream>

          void heal(int* hp) {
              *hp += 10;   // heal(nullptr): UB
          }

          int main() {
              int knight = 30;
              heal(&knight);
              std::cout << knight << '\n';
              return 0;
          }
        hardened: |-
          #include <iostream>

          void heal(int& hp) {   // can't be null
              hp += 10;
          }

          int main() {
              int knight = 30;
              heal(knight);
              std::cout << knight << '\n';
              return 0;
          }
  - attack: "&expired"
    label: An arrow to a fallen local!
    challenge:
      id: w8.boss.d2
      type: bug
      tags: [ w8.dangling, w6.return ]
      bug: dangling-pointer
      unsafe: true
      prompt: "summon hands back an address that's already dead. Tap the dangerous line, then pick the fix."
      code: |-
        #include <iostream>

        int* summon() {
            int minion = 7;
            return &minion;
        }

        int main() {
            int* m = summon();
            std::cout << *m << '\n';
            return 0;
        }
      bugLine: 4
      options:
        - t: "Return by value: int summon() { ...; return minion; }"
          why: "Correct: the caller gets its own copy, so there is no address to dangle."
        - t: return &minion + 0;
          why: Same dead address, just disguised.
        - t: "Make it: int* m = nullptr; m = summon();"
          why: m still receives the dead address.
        - t: "Add: delete m; at the end of main"
          why: UB twice over. minion was never made with new.
      answer: 0
      hints:
        - minion dies when summon returns.
        - Hand back the value itself, not where it used to live.
      short: Return a local by value, never by address.
      explain: "minion lives on summon's stack frame, which is gone once summon returns. The returned pointer dangles; reading `*m` is UB. g++ -Wall warns: \"function returns address of local variable\". AddressSanitizer can catch the bad read at run time."
      sideBySide:
        unsafe: |-
          #include <iostream>

          int* summon() {
              int minion = 7;
              return &minion;   // dangling
          }

          int main() {
              int* m = summon();
              std::cout << *m << '\n';   // UB
              return 0;
          }
        hardened: |-
          #include <iostream>

          int summon() {
              int minion = 7;
              return minion;
          }

          int main() {
              int m = summon();
              std::cout << m << '\n';
              return 0;
          }
  - attack: "int* curse;"
    label: An uninitialized pointer!
    challenge:
      id: w8.boss.d3
      type: harden
      tags: [ w8.init-ptr, w2.init ]
      prompt: "The Wraith plants an uninitialized pointer. Pick the declaration that makes the check below meaningful."
      code: |-
        ___;
        if (curse != nullptr) {
            *curse = 1;
        }
        std::cout << "Curse lifted\n";
      options:
        - t: int* curse = nullptr
          why: "Correct: a known \"nowhere\" value, so the nullptr check actually works."
        - t: int* curse
          why: Garbage address. It's almost certainly not nullptr, so the check passes and writes to junk.
        - t: int curse = 0
          why: Not a pointer; comparing an int with nullptr and *curse won't compile.
        - t: int& curse
          why: A reference must be bound at once; this doesn't compile.
      answer: 0
      hints:
        - A nullptr check only helps if the pointer starts at a known value.
        - Initialize at birth.
      short: Initialize pointers to nullptr so null checks mean something.
      explain: "An uninitialized pointer holds leftover bits: not nullptr, not valid. A check like `curse != nullptr` can't save you from that. Always initialize: `int* curse = nullptr;` or point it at a real object right away."
      sideBySide:
        unsafe: |-
          int* curse;   // garbage
          if (curse != nullptr) {
              *curse = 1;   // UB
          }
        hardened: |-
          int* curse = nullptr;
          if (curse != nullptr) {
              *curse = 1;
          }
          std::cout << "Curse lifted\n";
  - attack: "std::max(hit, 10)"
    label: A reference to a temporary that died!
    challenge:
      id: w8.boss.d4
      type: breakit
      tags: [ w8.dangling, w8.constref ]
      bug: dangling-ref
      unsafe: true
      prompt: "UNSAFE: std::max returns a reference to the bigger argument. Which hit value leaves `best` dangling?"
      code: |-
        #include <algorithm>

        const int& best = std::max(hit, 10);
        std::cout << best << '\n';
      prelude: int hit{3};
      options:
        - t: "3"
          why: "Correct: 10 wins, and best refers to the temporary 10, which dies at the ;."
        - t: "15"
          why: hit wins, so best refers to hit, which is still alive.
        - t: "10"
          why: "A tie: std::max returns its first argument, hit. Still alive."
        - t: "12"
          why: hit wins again. best names a living variable.
      answer: 0
      hints:
        - "Which argument is a temporary?"
        - When does a temporary inside a full expression die?
      short: A reference to a temporary returned from a function dangles after the ;.
      explain: "The literal 10 becomes a temporary that lives only until the end of the statement. When 10 is bigger, std::max returns a reference to that temporary, so best dangles. Lifetime extension only applies when a const reference binds DIRECTLY to a temporary, not through a function's return. GCC 13 warns with -Wdangling-reference. Fix: store a copy, `int best = std::max(hit, 10);`."
      sideBySide:
        unsafe: |-
          #include <algorithm>

          const int& best = std::max(hit, 10);   // may dangle
          std::cout << best << '\n';
        hardened: |-
          #include <algorithm>

          int best = std::max(hit, 10);   // a copy: always safe
          std::cout << best << '\n';
        prelude: int hit{3};
victory: "Nooo... my arrows... all checked... I fade... to... nullptr..."
reward:
  xp: 250
  cosmetic: pointer-goggles
  bug: null-deref
