# World 8 · Lesson 5: Shield: No null, no dangling (Shield lesson)

id: w8.l5
title: "Shield: No null, no dangling"
skill: defense
shield: true
concept:
  short: "Initialize every pointer, check nullptr before following it, and never keep an arrow to something that's gone."
  analogy: "Following a pointer is walking to an address: check the house exists before you knock, or you knock on the void."
  body:
    - "**Always initialize pointers**: `int* p = nullptr;` or `int* p = &hp;`. An uninitialized pointer holds a garbage address; dereferencing it is undefined behavior."
    - "**Check before you follow**: when a pointer may be null (a search with no match), test `if (p != nullptr)` before `*p`. Dereferencing nullptr is UB: usually a crash, but not guaranteed."
    - "**Dangling pointers and references** point at something that no longer exists: a local variable whose scope ended, or a local returned by address (`return &local;`) or by reference. The memory gets reused, so reading it may show junk, crash, or seem fine for months."
    - "Rules: never return the address of, or a reference to, a local; return by value instead. When the target goes away, set the pointer to `nullptr` (or let the pointer go out of scope first). Use a reference when \"never null\" is intended."
    - "**Don't delete what you didn't `new`**: `delete &hp;` on a normal variable is UB. You'll meet `new` and `delete` (and why smart pointers beat both) in World 9."
    - "**Tools help**: `-Wall -Wextra` warn about many cases, like returning a local's address. At run time, AddressSanitizer (`g++ -fsanitize=address -g`) stops the program with a report when it touches stack memory that's out of scope. Neither catches everything: good habits come first."
  pitfall: "Common beginner mistake: \"it printed the right number, so it's fine\". Dangling memory often keeps its old value for a while. UB that seems to work is still UB."
demo:
  code: |-
    #include <iostream>

    int main() {
        int* target = nullptr;
        {
            int goblin = 12;
            target = &goblin;
            std::cout << *target << '\n';
            target = nullptr;
        }
        if (target != nullptr) {
            std::cout << *target << '\n';
        } else {
            std::cout << "No target\n";
        }
        return 0;
    }
  steps:
    - line: 3
      mem:
        cells:
          - { name: target, ptr: null, addr: "0x10" }
      note: "Born pointing nowhere: known and testable, never garbage."
    - line: 5
      mem:
        cells:
          - { name: goblin, value: "12", addr: "0x14" }
      note: A goblin lives only inside these braces.
    - line: 6
      mem:
        cells:
          - { name: target, ptr: goblin }
      note: target points at the goblin.
    - line: 7
      out: |
        12
      note: Safe to follow while the goblin exists.
    - line: 9
      mem:
        drop: [ goblin ]
      crash: "Dangling pointer: target aims at a dead goblin!"
      note: Without line 8, target would dangle right here.
    - line: 8
      mem:
        cells:
          - { name: goblin, value: "12" }
          - { name: target, ptr: null }
      shield: Pointer reset!
      note: "Back to reality: we let go before the goblin vanished."
    - line: 9
      mem:
        drop: [ goblin ]
      note: The goblin is gone, but target is safely null.
    - line: 10
      shield: nullptr check!
      note: Check before following. target is null, so skip.
    - line: 13
      out: |
        No target
      note: Handled cleanly. No void, no crash.
challenges:
  - id: w8.l5.c1
    type: breakit
    tags: [ w8.nullcheck, w7.vector, w2.string ]
    bug: null-deref
    unsafe: true
    prompt: UNSAFE code. The player types a hero name to damage. Pick the input that breaks it.
    code: |-
      #include <iostream>
      #include <string>
      #include <vector>

      int main() {
          std::vector<std::string> names{"Knight", "Mage"};
          std::vector<int> hp{30, 12};
          std::string who;
          std::cin >> who;
          int* target = nullptr;
          for (std::size_t i = 0; i < names.size(); ++i) {
              if (names[i] == who) {
                  target = &hp[i];
              }
          }
          *target -= 5;
          std::cout << *target << '\n';
          return 0;
      }
    options:
      - t: Knight
        why: Found. target points at 30; it prints 25.
      - t: Mage
        why: Found. target points at 12; it prints 7.
      - t: Bard
        why: "Correct: no match, so target stays nullptr, and *target is UB."
      - t: Mage Knight
        why: cin >> reads one word, "Mage", which is found. Prints 7.
    answer: 2
    hints:
      - What is target if the loop finds nothing?
      - The code never checks target before using it.
    short: No match leaves target null; dereferencing it is UB.
    explain: "Any name that isn't in the list (Bard, or even lowercase \"knight\") leaves target as nullptr, and `*target -= 5` dereferences null: undefined behavior. It usually crashes, but UB guarantees nothing. Check `target == nullptr` before following it."
    sideBySide:
      unsafe: |-
        *target -= 5;                  // null if not found: UB
        std::cout << *target << '\n';
      hardened: |-
        if (target == nullptr) {
            std::cout << "No hero named " << who << '\n';
            return 1;
        }
        *target -= 5;
        std::cout << *target << '\n';
      prelude: std::string who{"Bard"}; int* target = nullptr;
  - id: w8.l5.c2
    type: harden
    tags: [ w8.nullcheck, w8.deref ]
    bug: null-deref
    prompt: "`found` may be nullptr. Pick the condition that makes the print safe."
    code: |-
      if (___) {
          std::cout << "HP: " << *found << '\n';
      } else {
          std::cout << "Not found\n";
      }
    prelude: int hp{30}; int* found = &hp;
    options:
      - t: found != nullptr
        why: "Correct: only follows the pointer when it points somewhere."
      - t: "*found != 0"
        why: This dereferences to check, so a null pointer triggers UB inside the check itself.
      - t: found == nullptr
        why: "Inverted: follows the pointer exactly when it's null."
      - t: "&found != nullptr"
        why: That's the address of the pointer variable itself, which is never null. Always true.
    answer: 0
    hints:
      - Test the arrow, not the box it points at.
      - Compare the pointer itself with nullptr.
    short: Test found != nullptr before *found.
    explain: "Check the pointer itself: `found != nullptr` (or simply `if (found)`). Checking `*found` already dereferences it, which is the very UB we're guarding against."
    sideBySide:
      unsafe: |-
        std::cout << "HP: " << *found << '\n';   // UB if null
      hardened: |-
        if (found != nullptr) {
            std::cout << "HP: " << *found << '\n';
        } else {
            std::cout << "Not found\n";
        }
      prelude: int hp{30}; int* found = &hp;
  - id: w8.l5.c3
    type: harden
    tags: [ w8.dangling, w6.scope ]
    bug: dangling-pointer
    prompt: The goblin dies at the closing brace. What goes in the blank so `target` doesn't dangle?
    code: |-
      int* target = nullptr;
      {
          int goblin = 12;
          target = &goblin;
          std::cout << *target << '\n';
          ___;
      }
      if (target != nullptr) {
          std::cout << *target << '\n';
      }
    options:
      - t: target = nullptr
        why: "Correct: let go before the goblin vanishes; the later check then skips safely."
      - t: goblin = 0
        why: Changes the value, but goblin still dies at }, and target still points at it.
      - t: "*target = 0"
        why: Same thing through the pointer. The arrow still aims at a box that's about to vanish.
      - t: delete target
        why: "UB: never delete what you didn't new. goblin is a normal local."
    answer: 0
    hints:
      - The problem is the arrow, not the value.
      - What does the later if check for?
    short: Reset the pointer to nullptr before its target goes away.
    explain: "When goblin's scope ends, any pointer to it dangles. Setting `target = nullptr` first turns a dangling pointer into a testable \"nothing\". Even better: don't let a pointer outlive what it points at. And never `delete` something you didn't create with `new` (World 9)."
    sideBySide:
      unsafe: |-
        int* target = nullptr;
        {
            int goblin = 12;
            target = &goblin;
        }
        std::cout << *target << '\n';   // dangling: UB
      hardened: |-
        int* target = nullptr;
        {
            int goblin = 12;
            target = &goblin;
            std::cout << *target << '\n';
            target = nullptr;
        }
        if (target != nullptr) {
            std::cout << *target << '\n';
        }
  - id: w8.l5.c4
    type: review
    tags: [ w8.dangling, w6.return ]
    bug: dangling-pointer
    unsafe: true
    prompt: Code review! Tap every dangerous line, then submit.
    code: |-
      #include <iostream>

      int* makeBoost() {
          int boost = 5;
          return &boost;
      }

      int& strongest(int& a, int& b) {
          return (a > b) ? a : b;
      }

      int main() {
          int knight = 30;
          int mage = 12;
          int* boost = makeBoost();
          int& best = strongest(knight, mage);
          std::cout << best + *boost << '\n';
          return 0;
      }
    dangerous: [ 4, 16 ]
    lineNotes:
      "3": "boost is a local: it dies when makeBoost returns."
      "4": "Danger: returns the address of a local. The caller gets a dangling pointer. -Wall warns here."
      "8": "Fine: returns a reference to one of the CALLER's variables, which outlive the call."
      "14": "boost now dangles, though nothing has gone wrong yet."
      "15": "Fine: best names knight, which is alive in main."
      "16": "UB: *boost reads a dead local. It might print 35, junk, or crash."
    hints:
      - Which function returns an address of something that dies?
      - Where is that dead address finally followed?
    short: Returning a local's address creates a dangling pointer.
    explain: "makeBoost returns `&boost`, but boost is destroyed when the function returns, so the pointer dangles and `*boost` is UB. g++ warns (\"function returns address of local variable\"). strongest is fine: it returns a reference to the caller's own variables. Fix makeBoost by returning `int` by value."
    sideBySide:
      unsafe: |-
        #include <iostream>

        int* makeBoost() {
            int boost = 5;
            return &boost;   // dangling
        }

        int main() {
            int* boost = makeBoost();
            std::cout << *boost << '\n';   // UB
            return 0;
        }
      hardened: |-
        #include <iostream>

        int makeBoost() {
            int boost = 5;
            return boost;   // return a copy
        }

        int main() {
            int boost = makeBoost();
            std::cout << boost << '\n';
            return 0;
        }
  - id: w8.l5.c5
    type: mcq
    tags: [ w8.sanitizers, w1.warnings ]
    prompt: Your program sometimes reads a local through a pointer after its scope ended. Which tool reports that at run time?
    options:
      - t: "AddressSanitizer: g++ -fsanitize=address -g"
        why: "Correct: it instruments memory accesses and stops with a report on use of out-of-scope stack memory."
      - t: -Wall -Wextra alone
        why: Warnings catch some cases at compile time, but many dangling uses only show up at run time.
      - t: Turning on -O2
        why: Optimization changes how UB behaves, often hiding it. It detects nothing.
      - t: Nothing can; UB is invisible
        why: "UB is hard to spot by eye, but sanitizers exist exactly for this."
    answer: 0
    hints:
      - You want a checker that runs WITH the program.
      - Its flag starts with -fsanitize.
    short: AddressSanitizer catches use of dead stack memory at run time.
    explain: "Use both layers: `-Wall -Wextra` for compile-time warnings (like returning a local's address), and `-fsanitize=address -g` while testing, which aborts with a detailed report when a bad access happens. Neither replaces careful code: a sanitizer only sees the paths your tests actually run."
  - id: w8.l5.c6
    type: safe
    tags: [ w8.init-ptr, w8.nullcheck, w8.dangling ]
    prompt: Safe or unsafe? The Wraith's minions are coming. Go fast!
    seconds: 30
    items:
      - code: int* p = nullptr;
        safe: true
        why: Initialized to a known "nowhere" that can be tested.
      - code: |-
          int* p;
          *p = 5;
        safe: false
        why: "Uninitialized pointer: writes to a garbage address. UB."
      - code: |-
          if (p != nullptr) {
              std::cout << *p;
          }
        prelude: int hp{3}; int* p = &hp;
        safe: true
        why: Checked before following.
      - code: |-
          int* p = nullptr;
          std::cout << *p;
        safe: false
        why: Dereferencing nullptr is UB, usually a crash.
      - code: |-
          int* p = nullptr;
          {
              int x = 7;
              p = &x;
          }
          std::cout << *p;
        safe: false
        why: x died at the }, so p dangles. UB.
      - code: |-
          int& r = hp;
          r += 1;
        prelude: int hp{3};
        safe: true
        why: A reference to a living variable is always valid.
      - code: |-
          int hp = 5;
          int* p = &hp;
          delete p;
        safe: false
        why: hp wasn't created with new, so deleting it is UB.
      - code: |-
          int x = 7;
          int* p = &x;
          std::cout << *p;
        safe: true
        why: p points at x, which is alive in the same scope.
    hints:
      - Where does each pointer point right now?
      - Is the target still alive, and was it ever set?
    short: "Safe pointers are initialized, checked, and never outlive their target."
    explain: "Initialize pointers, check nullptr before following, never keep an arrow to something out of scope, and never delete what you didn't new."
recap:
  - "Initialize every pointer: nullptr or a real address."
  - Check nullptr before every dereference.
  - Never return a local's address or reference.
  - Prefer references when null makes no sense.
vault:
  - id: w8.nullguard
    title: Check before you follow
    code: |-
      int* found = nullptr;   // never leave it uninitialized
      // ... maybe point it at something ...
      if (found != nullptr) {
          std::cout << *found << '\n';
      } else {
          std::cout << "Not found\n";
      }
    note: Dereferencing nullptr or a garbage address is UB. It may not crash; it may lie.
    defense: true
  - id: w8.nodangle
    title: No dangling
    code: |-
      int makeBoost() {       // return by VALUE
          int boost = 5;
          return boost;
      }
      // NEVER: int* f() { int x = 5; return &x; }
      // NEVER: int& g() { int x = 5; return x; }
      // Don't let a pointer outlive its target.
      int main() {
          return makeBoost() > 0 ? 0 : 1;
      }
    note: Locals die at their closing brace. Anything still pointing at them dangles.
    defense: true
  - id: w8.ptrtools
    title: Let the tools hunt
    code: |-
      g++ -std=c++20 -Wall -Wextra -g -fsanitize=address main.cpp
    expect: skip
    note: Warnings catch some dangling at compile time; ASan catches bad accesses when they run.
    defense: true
reviewTags: [ w6.scope, w6.return, w7.vector, w8.pointer, w8.nullptr, w8.ptr-vs-ref ]
