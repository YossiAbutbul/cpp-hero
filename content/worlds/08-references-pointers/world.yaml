# World 8: References & Pointers. Lessons are lesson-NN.yaml (played in file order).

id: w8
num: 8
title: References & Pointers
icon: arrow
blurb: "Second names, the real thing instead of copies, and safe arrows to memory."
story:
  intro:
    - The shelves are tidy, but look! Arrows pointing at... nothing?
    - Some point at boxes that vanished long ago. Spooky {o_o}
    - "Let's learn references and pointers: names and arrows to real data."
  bossIntro:
    - Brr! The Dangling Wraith haunts addresses whose owners are gone.
    - Check every pointer before you follow it!
  victory:
    - The Wraith faded to nullptr, and we checked first! {^_^}
    - "But below, something grabs memory and never gives it back..."
    - The heap awaits in World 9. Bring your goggles!
