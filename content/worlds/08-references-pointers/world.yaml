# World 8: References & Pointers. Lessons are lesson-NN.yaml (played in file order).

id: w8
num: 8
title: References & Pointers
icon: arrow
blurb: "Give a variable a second name, pass the real thing instead of a copy, and follow arrows to memory addresses, without ever following one into the void."
story:
  intro:
    - The Codebase shelves are tidy again, but look! Arrows everywhere, pointing at... nothing?
    - Some arrows point at boxes that vanished long ago. Spooky {o_o}
    - "Let's learn references and pointers: names and arrows that lead to real data."
  bossIntro:
    - Brr! The Dangling Wraith haunts every address whose owner has gone.
    - Its arrows point into the void. Check every pointer before you follow it!
  victory:
    - The Wraith faded to nullptr, and we checked before touching it! {^_^}
    - "But deep below, something is grabbing memory and never giving it back..."
    - The heap awaits in World 9. Bring your goggles!
