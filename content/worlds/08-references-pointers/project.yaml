# World 8 mini-project: Party Swap

id: w8.p
title: Party Swap
intro: "Swap hero stats, point at the active hero, and never follow null."
steps:
  - id: w8.p.s1
    type: fill
    tags: [ w8.byref, w6.params ]
    prompt: "Fill in the type of `a` so the swap changes the caller's real values, like `b`."
    code: |-
      #include <iostream>

      void swapStats(___ a, int& b) {
          int temp = a;
          a = b;
          b = temp;
      }

      int main() {
          int knightHp = 30;
          int mageHp = 12;
          swapStats(knightHp, mageHp);
          std::cout << knightHp << ' ' << mageHp << '\n';   // 12 30
          return 0;
      }
    accept:
      - int&
    placeholder: type
    hints:
      - A plain int would be a copy.
    short: "`int& a` is the caller's variable, so the swap sticks."
    explain: "With `int& a, int& b`, a and b are other names for knightHp and mageHp. The three-line swap then trades the real values: 12 30. With plain `int`, only copies would be swapped."
  - id: w8.p.s2
    type: predict
    tags: [ w8.byref, w7.vector ]
    prompt: What does this print?
    code: |-
      #include <iostream>
      #include <vector>

      void swapStats(int& a, int& b) {
          int temp = a;
          a = b;
          b = temp;
      }

      int main() {
          std::vector<int> hp{30, 12, 20};
          std::vector<int> mana{5, 40, 15};
          swapStats(hp[0], hp[1]);
          swapStats(mana[0], mana[2]);
          std::cout << hp[0] << ' ' << hp[1] << ' ' << mana[0] << ' ' << mana[2] << '\n';
          return 0;
      }
    options:
      - t: |
          12 30 15 5
        why: Each swap trades the real elements.
      - t: |
          30 12 5 15
        why: hp[0] binds to the real element, so swaps stick.
      - t: |
          12 30 40 5
        why: The second swap uses mana[2], not mana[1].
      - t: |
          12 12 15 15
        why: temp saves the old value, so nothing duplicates.
    answer: 0
    hints:
      - hp[0] is a reference to the element.
    short: Vector elements can be passed by reference too.
    explain: "`hp[0]` returns a reference to the element, so `int& a` binds straight to it. hp becomes {12, 30, 20} and mana becomes {15, 40, 5}. Output: \"12 30 15 5\" and a newline."
  - id: w8.p.s3
    type: write
    tags: [ w8.pointer, w8.addressof ]
    prompt: "Write one line declaring an int pointer named `active` that points at hp[0]."
    code: |-
      #include <vector>

      std::vector<int> hp{12, 30, 20};   // Knight, Mage, Rogue
      // your line: active points at the Knight's hp, hp[0]
    accept:
      - int* active = &hp[0];
      - int* active{&hp[0]};
      - auto* active = &hp[0];
      - auto active = &hp[0];
    acceptRe:
      - ^(int\*|auto\*|auto )active(=&hp\[0\]|\{&hp\[0\]\});$
    placeholder: int* active ...
    hints:
      - "A pointer to int has type int*."
    short: "`int* active = &hp[0];` points at the Knight."
    explain: "`&hp[0]` is the address of the first element; storing it in an `int*` gives an arrow to the Knight's hp. A pointer (not a reference) because the active hero must be able to switch."
  - id: w8.p.s4
    type: predict
    tags: [ w8.pointer, w8.deref ]
    prompt: What does this print?
    code: |-
      #include <vector>

      std::vector<int> hp{12, 30, 20};
      int* active = &hp[0];
      *active -= 2;
      active = &hp[2];
      *active += 5;
      std::cout << hp[0] << ' ' << hp[2] << ' ' << *active << '\n';
    options:
      - t: |
          10 25 25
        why: Knight lost 2; then the Rogue got +5.
      - t: |
          10 20 10
        why: "After active = &hp[2], *active is the Rogue."
      - t: |
          15 20 15
        why: Moving the arrow carries no value along.
      - t: |
          12 25 25
        why: "*active -= 2 hit hp[0] first."
    answer: 0
    hints:
      - Where does active point before each change?
    short: Each write hits whatever active points at right then.
    explain: "active starts at hp[0]: 12 - 2 = 10. Then it's reseated to hp[2]: 20 + 5 = 25. *active is the Rogue's 25. Output: \"10 25 25\" and a newline."
  - id: w8.p.s5
    type: fill
    tags: [ w8.nullptr, w6.return ]
    prompt: "Fill in what findHero returns when no name matches."
    code: |-
      #include <iostream>
      #include <string>
      #include <vector>

      int* findHero(const std::vector<std::string>& names, std::vector<int>& hp,
                    const std::string& who) {
          for (std::size_t i = 0; i < names.size() && i < hp.size(); ++i) {
              if (names[i] == who) {
                  return &hp[i];
              }
          }
          return ___;   // no hero by that name
      }

      int main() {
          std::vector<std::string> names{"Knight", "Mage", "Rogue"};
          std::vector<int> hp{10, 30, 25};
          int* found = findHero(names, hp, "Bard");
          std::cout << (found == nullptr) << '\n';   // 1
          return 0;
      }
    accept:
      - nullptr
    placeholder: value
    hints:
      - There's a special value for "points nowhere".
    short: "nullptr means \"no hero\", and callers can test it."
    explain: "`nullptr` says \"no result\" in a way callers can test. That's exactly why findHero returns a pointer instead of a reference: a reference can't be \"nothing\". The price: every caller must check before using it."
  - id: w8.p.s6
    type: mcq
    tags: [ w7.invalidation, w8.dangling ]
    prompt: "active points at hp[2]. Then `hp.push_back(18);` runs. What is true of active now?"
    options:
      - t: It may now dangle
        why: push_back may move elements, leaving the old address.
      - t: It automatically follows the Rogue
        why: Pointers never update themselves.
      - t: It now points at the new hero
        why: Nothing reseats active.
      - t: push_back won't compile while a pointer exists
        why: It compiles fine. The risk is yours.
    answer: 0
    hints:
      - Growing a vector can move its elements.
    short: Growing a vector can leave pointers into it dangling.
    explain: "When a vector grows beyond its capacity, it moves its elements to a bigger block of memory. Pointers, references and iterators to the old elements dangle. Re-fetch the pointer after adding heroes (or store an index instead)."
program: |-
  #include <iostream>
  #include <string>
  #include <vector>

  void swapStats(int& a, int& b) {
      int temp = a;
      a = b;
      b = temp;
  }

  int* findHero(const std::vector<std::string>& names, std::vector<int>& hp,
                const std::string& who) {
      for (std::size_t i = 0; i < names.size() && i < hp.size(); ++i) {
          if (names[i] == who) {
              return &hp[i];
          }
      }
      return nullptr;
  }

  int main() {
      std::vector<std::string> names{"Knight", "Mage", "Rogue"};
      std::vector<int> hp{30, 12, 20};
      std::vector<int> mana{5, 40, 15};

      swapStats(hp[0], hp[1]);
      swapStats(mana[0], mana[1]);
      std::cout << "Knight: " << hp[0] << " hp, " << mana[0] << " mana\n";
      std::cout << "Mage: " << hp[1] << " hp, " << mana[1] << " mana\n";

      int* active = &hp[0];
      std::cout << "Active hero hp: " << *active << '\n';
      active = &hp[2];
      std::cout << "Switched! Active hero hp: " << *active << '\n';

      std::string who;
      std::cout << "Heal which hero? ";
      if (!(std::cin >> who)) {
          std::cout << "No name given.\n";
          return 1;
      }
      int* found = findHero(names, hp, who);
      if (found == nullptr) {
          std::cout << "No hero named " << who << ".\n";
          return 1;
      }
      *found += 10;
      std::cout << who << " now has " << *found << " hp.\n";
      return 0;
  }
programStdin: "Mage\n"
stress:
  intro: "Boo! I'm the Wraith. Will your arrows survive?"
  attacks:
    - input: Bard
      label: A hero who isn't in the party!
      challenge:
        id: w8.p.a1
        type: harden
        tags: [ w8.nullcheck, w8.nullptr ]
        bug: null-deref
        prompt: "findHero returns nullptr for Bard. Pick the condition that exits before *found."
        code: |-
          int* found = findHero(who);
          if (___) {
              std::cout << "No hero named " << who << ".\n";
              return 1;
          }
          *found += 10;
        prelude: 'std::string who{"Bard"}; auto findHero = [](const std::string& w) -> int* { static int knightHp{30}; return w == "Knight" ? &knightHp : nullptr; };'
        options:
          - t: found == nullptr
            why: Exits before following null.
          - t: "*found == 0"
            why: The check itself dereferences null. UB.
          - t: found != nullptr
            why: "Inverted: exits for real heroes, heals null."
          - t: who.empty()
            why: The name is fine; the null result is the danger.
        answer: 0
        hints:
          - What does findHero return for Bard?
        short: Check a returned pointer for nullptr before following it.
        explain: "A function that returns a pointer is telling you \"this might be nothing\". Test the result against nullptr before dereferencing. `*found += 10` on nullptr is UB: usually a crash, never something to rely on."
        sideBySide:
          unsafe: |-
            int* found = findHero(who);
            *found += 10;   // nullptr for "Bard": UB
          hardened: |-
            int* found = findHero(who);
            if (found == nullptr) {
                std::cout << "No hero named " << who << ".\n";
                return 1;
            }
            *found += 10;
          prelude: 'std::string who{"Bard"}; auto findHero = [](const std::string& w) -> int* { static int knightHp{30}; return w == "Knight" ? &knightHp : nullptr; };'
    - input: guest
      label: A guest hero leaves mid-battle!
      challenge:
        id: w8.p.a2
        type: harden
        tags: [ w8.dangling, w6.scope ]
        bug: dangling-pointer
        prompt: "guestHp dies at the closing brace. Fill the blank so the later lines stay safe."
        code: |-
          int* active = &knightHp;
          {
              int guestHp = 25;
              active = &guestHp;
              std::cout << "Guest fights with " << *active << " hp\n";
              ___;
          }
          *active -= 5;
          std::cout << "Active hero hp: " << *active << '\n';
        prelude: int knightHp{30};
        options:
          - t: active = &knightHp
            why: Points back at a hero who stays alive.
          - t: active = nullptr
            why: "Then *active -= 5 follows nullptr: still UB."
          - t: guestHp = 0
            why: active still points at the dying guestHp.
          - t: delete active
            why: "UB: guestHp wasn't made with new."
        answer: 0
        hints:
          - After the }, which heroes still exist?
        short: Re-point active at a living hero before the guest leaves.
        explain: "guestHp dies at the closing brace. If active still points there, `*active -= 5` touches dead stack memory: UB, which might even seem to work. Re-point active at a hero that outlives the block (or set it to nullptr AND check it before use)."
        sideBySide:
          unsafe: |-
            int* active = &knightHp;
            {
                int guestHp = 25;
                active = &guestHp;
            }
            *active -= 5;   // guestHp is gone: UB
          hardened: |-
            int* active = &knightHp;
            {
                int guestHp = 25;
                active = &guestHp;
                std::cout << "Guest fights with " << *active << " hp\n";
                active = &knightHp;
            }
            *active -= 5;
            std::cout << "Active hero hp: " << *active << '\n';
          prelude: int knightHp{30};
    - input: "3"
      label: A menu choice that matches nobody!
      challenge:
        id: w8.p.a3
        type: bug
        tags: [ w8.init-ptr, w3.validate ]
        unsafe: true
        prompt: "Choice 3 leaves target unset. Tap the root cause line, then pick the fix."
        code: |-
          int choice{};
          if (!(std::cin >> choice)) {
              return 1;
          }
          int* target;
          if (choice == 1) {
              target = &knightHp;
          } else if (choice == 2) {
              target = &mageHp;
          }
          *target -= 3;
        prelude: int knightHp{30}; int mageHp{12};
        bugLine: 4
        options:
          - t: int* target = nullptr;   // and check it before *target
            why: Starts known-null; the check handles choice 3.
          - t: int* target = &choice;
            why: "Choice 3 would then \"damage\" the menu choice."
          - t: int& target;
            why: An unbound reference doesn't compile.
          - t: int target;
            why: Not a pointer; later lines won't compile.
        answer: 0
        hints:
          - What does target hold when choice is 3?
        short: Start pointers at nullptr, then check before dereferencing.
        explain: "`int* target;` holds a garbage address. For choice 3 neither branch runs, and `*target -= 3` writes to that garbage address: UB that may corrupt something unrelated and stay hidden. Initialize to nullptr and check before use."
        sideBySide:
          unsafe: |-
            int* target;               // garbage address
            if (choice == 1) {
                target = &knightHp;
            }
            *target -= 3;              // choice 3: UB
          hardened: |-
            int* target = nullptr;
            if (choice == 1) {
                target = &knightHp;
            } else if (choice == 2) {
                target = &mageHp;
            }
            if (target == nullptr) {
                std::cout << "Pick 1 or 2.\n";
                return 1;
            }
            *target -= 3;
          prelude: int knightHp{30}; int mageHp{12}; int choice{3};
