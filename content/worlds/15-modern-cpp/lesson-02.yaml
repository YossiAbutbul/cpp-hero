# World 15 · Lesson 2: auto & structured bindings

id: w15.l2
title: auto & structured bindings
skill: toolkit
shield: false
concept:
  short: "auto copies unless you add &; structured bindings unpack a pair into names."
  analogy: "auto is a photocopier: you get a copy unless you add &."
  body:
    - "`auto` asks the compiler to deduce the type from the initializer. It deduces a **plain value type**: `const` and `&` on the initializer are dropped. So `auto x = someRef;` makes a **copy**."
    - "In range-for loops this matters a lot: `for (auto h : hp)` works on copies (changes are lost), `for (auto& h : hp)` works on the real elements, and `for (const auto& h : hp)` reads without copying and without changing."
    - "Rule of thumb: `const auto&` to read, `auto&` to modify, plain `auto` for small values you want a private copy of (ints, doubles)."
    - "**Structured bindings** (C++17) unpack an object into names: `auto [name, hp] = hero;` for a `std::pair` or a struct with public members. The number of names must match the number of parts."
    - "The same copy rule applies: `auto [a, b] = p;` works on a copy, `auto& [a, b] = p;` binds to the original parts, `const auto& [a, b]` reads them."
    - "The classic use: looping over a map. `for (const auto& [name, coins] : bank)` gives you each key and value by name, instead of `.first` and `.second`."
  pitfall: "Common beginner mistake: `for (auto x : v) { x = 0; }` and wondering why v didn't change. Plain auto is a copy."
demo:
  code: |-
    #include <iostream>
    #include <map>
    #include <string>
    #include <vector>

    int main() {
        std::vector<int> hp{10, 20};
        for (auto h : hp) { h += 5; }
        for (auto& h : hp) { h += 1; }
        std::cout << hp[0] << ' ' << hp[1] << '\n';
        std::map<std::string, int> gold{{"Ana", 7}, {"Bo", 3}};
        for (const auto& [name, coins] : gold) {
            std::cout << name << ": " << coins << '\n';
        }
        return 0;
    }
  steps:
    - line: 6
      vars:
        hp: "{10, 20}"
      note: Two heroes, 10 and 20 hp.
    - line: 7
      vars:
        hp: "{10, 20}"
      note: "auto h is a copy: the +5 vanishes with it."
    - line: 8
      vars:
        hp: "{11, 21}"
      note: "auto& h is the real element: +1 sticks."
    - line: 9
      out: |
        11 21
    - line: 10
      vars:
        gold: "{Ana: 7, Bo: 3}"
      note: A map from name to coins.
    - line: 11
      vars:
        name: "\"Ana\""
        coins: "7"
      note: Each pair unpacks into two names.
    - line: 12
      out: |
        Ana: 7
    - line: 11
      vars:
        name: "\"Bo\""
        coins: "3"
      note: Next pair, keys in sorted order.
    - line: 12
      out: |
        Bo: 3
    - line: 14
      vars:
        name: null
        coins: null
      note: Loop done. Neat names, no .first or .second.
challenges:
  - id: w15.l2.c1
    type: bug
    tags: [ w15.auto, w7.ref-loop ]
    prompt: Each hero should lose 10 hp, but nobody does. Tap the buggy line, then pick the fix.
    code: |-
      #include <iostream>
      #include <vector>

      struct Hero {
          int hp;
      };

      int main() {
          std::vector<Hero> party{{30}, {50}};
          for (auto hero : party) {
              hero.hp -= 10;
          }
          std::cout << party[0].hp << '\n';
          return 0;
      }
    bugLine: 9
    options:
      - t: "for (auto& hero : party) {"
        why: "hero names each real element, so the damage sticks."
      - t: "for (const auto& hero : party) {"
        why: No copy, but const forbids the change. Compile error.
      - t: "for (auto hero : party) { party[0].hp -= 10;"
        why: That hits only the first hero, twice.
      - t: "for (Hero hero : party) {"
        why: Spelling the type doesn't help. It's still a copy.
    answer: 0
    hints:
      - What does plain auto deduce in a range-for?
    short: "Plain auto copies each element; auto& changes the real ones."
    explain: "`auto hero` deduces `Hero`: a fresh copy every iteration. The damage lands on the copy and is thrown away. `auto& hero` binds to each element, so party[0].hp becomes 20."
    sideBySide:
      unsafe: |-
        for (auto hero : party) {
            hero.hp -= 10;   // changes a copy
        }
      hardened: |-
        for (auto& hero : party) {
            hero.hp -= 10;   // changes the real hero
        }
      prelude: "struct Hero { int hp; }; std::vector<Hero> party{{30}, {50}};"
  - id: w15.l2.c2
    type: predict
    tags: [ w15.bindings, w15.auto ]
    prompt: One binding copies, one refers. What does this print?
    code: |-
      #include <iostream>
      #include <string>
      #include <utility>

      int main() {
          std::pair<std::string, int> hero{"Ana", 10};
          auto [name, hp] = hero;
          hp = 99;
          auto& [rname, rhp] = hero;
          rhp += 1;
          std::cout << hero.second << ' ' << hp << '\n';
          return 0;
      }
    options:
      - t: |
          11 99
        why: "hp is in a copy; rhp is hero.second itself: 11."
      - t: |
          100 99
        why: "auto [name, hp] unpacks a copy. hp = 99 never touches hero."
      - t: |
          11 11
        why: hp belongs to the copy and was set to 99.
      - t: |
          10 99
        why: "auto& binds to hero's real parts, so rhp += 1 counts."
    answer: 0
    hints:
      - Which binding has an &? Only that one can change hero.
    short: "auto [..] unpacks a copy; auto& [..] binds to the original."
    explain: "`auto [name, hp] = hero;` copies hero, then names the copy's parts: hp = 99 changes only the copy. `auto& [rname, rhp]` names hero's own parts: rhp += 1 makes hero.second 11. Output: \"11 99\" and a newline."
  - id: w15.l2.c3
    type: mcq
    tags: [ w15.auto ]
    prompt: What type does x get?
    code: |-
      int hp = 50;
      const int& view = hp;
      auto x = view;
    options:
      - t: int, a separate copy
        why: "auto drops both const and &, so x is a plain int."
      - t: const int&
        why: "Plain auto never deduces a reference. Write const auto& x."
      - t: const int
        why: auto drops top-level const too.
      - t: int&, another name for hp
        why: That needs auto& x. Plain auto always copies.
    answer: 0
    hints:
      - Does plain auto ever deduce a reference?
    short: auto drops const and &, so x is a plain int copy.
    explain: "Plain `auto` deduces a value type: the reference and top-level const are dropped, so `x` is an `int` holding a copy (50). Changing x doesn't touch hp. Write `auto&` or `const auto&` when you want a reference."
  - id: w15.l2.c4
    type: fill
    tags: [ w15.bindings, w15.auto, w14.map-iterate ]
    prompt: Fill in the structured binding so the loop body's name and coins work.
    code: |-
      #include <iostream>
      #include <map>
      #include <string>

      int main() {
          std::map<std::string, int> bank{{"Ana", 7}, {"Bo", 3}};
          for (const auto& ___ : bank) {
              std::cout << name << ": " << coins << '\n';
          }
          return 0;
      }
    accept:
      - "[name, coins]"
    placeholder: "[..., ...]"
    hints:
      - Square brackets unpack an element into names.
    short: "[name, coins] names each key and value."
    explain: "Each map element is a pair of key and value. `const auto& [name, coins]` binds `name` to the key and `coins` to the value, without copying and without allowing changes."
  - id: w15.l2.c5
    type: speed
    tags: [ w15.auto, w2.auto ]
    prompt: Speed round! What type does auto deduce?
    seconds: 45
    items:
      - q: What type is a?
        code: auto a = 7;
        options: [ int, double, long ]
        answer: 0
      - q: What type is b?
        code: auto b = 7.5;
        options: [ float, double, int ]
        answer: 1
      - q: What type is c?
        code: |-
          const int k = 1;
          auto c = k;
        options: [ const int, int, "const int&" ]
        answer: 1
      - q: What type is d?
        code: |-
          std::string s = "hi";
          auto& d = s;
        options: [ std::string, "std::string&", "const char*" ]
        answer: 1
      - q: What type is e?
        code: auto e{3};
        options: [ int, "std::initializer_list<int>", "int&" ]
        answer: 0
      - q: What type is f?
        code: |-
          std::vector<int> v{1, 2};
          const auto& f = v;
        options: [ "std::vector<int>", "const std::vector<int>&", "std::vector<int>&" ]
        answer: 1
    hints:
      - "Plain auto copies and drops const; & only if written."
    short: Plain auto gives a value type; & and const only if written.
    explain: "7 is int, 7.5 is double, a copy of a const int is plain int, auto& on a string is std::string&, auto e{3} is int (since C++17), and const auto& on a vector is const std::vector<int>&."
recap:
  - auto copies; & and const only if written.
  - "Read: const auto&. Modify: auto&."
  - "auto [a, b] = pair; unpacks into names."
  - "Map loop: for (const auto& [k, v] : m)."
vault:
  - id: w15.auto-loops
    title: auto in loops
    code: |-
      std::vector<int> hp{10, 20};
      for (auto h : hp) { std::cout << h; }        // copy (fine for ints)
      for (auto& h : hp) { h += 1; }               // modify the real elements
      for (const auto& h : hp) { std::cout << h; } // read, no copy, no change
    note: auto drops const and &. Say what you mean.
    defense: false
  - id: w15.bindings
    title: Structured bindings
    code: |-
      std::pair<std::string, int> hero{"Ana", 10};
      auto [name, hp] = hero;       // copies
      auto& [rname, rhp] = hero;    // refers to hero's parts

      std::map<std::string, int> bank{{"Ana", 7}};
      for (const auto& [who, coins] : bank) {
          std::cout << who << ": " << coins << '\n';
      }
    note: Works on pairs, tuples and structs with public members. Names must match the part count.
    defense: false
reviewTags: [ w14.map-iterate, w7.ref-loop, w8.ref, w15.lambda ]
