# World 15 · Lesson 4: std::optional: maybe a value

id: w15.l4
title: "std::optional: maybe a value"
skill: toolkit
shield: false
concept:
  short: "std::optional<T> holds a T or nothing. Check it before unwrapping; value_or gives a safe fallback."
  analogy: "An optional is a gift box: check whether something's inside before you reach in."
  body:
    - "Some answers might not exist: a name not in the list, a file not found. Old code used **magic values** like `-1` or `nullptr` to mean \"nothing\", and callers forgot to check. `std::optional<T>` (from `<optional>`) makes \"maybe\" part of the type."
    - "Return a value normally (`return 7;`) or return **nothing** with `return std::nullopt;` (or `return {};`)."
    - "Check before using: `if (gold)` or `gold.has_value()` is true when there's a value."
    - "Get the value three ways: `*gold` (fast, **undefined behavior if empty**), `gold.value()` (throws `std::bad_optional_access` if empty), `gold.value_or(0)` (returns the fallback if empty, never fails)."
    - "C++17 lets you declare and test in one line: `if (auto gold = findGold(name); gold) { use *gold }`. The variable only exists inside the if."
    - "An empty optional isn't 0: `std::optional<int>` holding `0` **has** a value. That's exactly why it beats magic numbers."
  pitfall: "Common beginner mistake: writing `*findGold(name)` without checking. On an empty optional that's UB, and it may quietly print garbage instead of crashing."
demo:
  code: |-
    #include <iostream>
    #include <optional>
    #include <string>

    std::optional<int> findGold(const std::string& name) {
        if (name == "Ana") {
            return 7;
        }
        return std::nullopt;
    }

    int main() {
        std::optional<int> a = findGold("Ana");
        std::optional<int> z = findGold("Zed");
        if (a) {
            std::cout << "Ana has " << *a << '\n';
        }
        std::cout << "Zed has " << z.value_or(0) << '\n';
        return 0;
    }
  steps:
    - line: 12
      note: "Ask for Ana's gold."
    - line: 4
      push:
        name: findGold
        vars:
          name: "\"Ana\""
    - line: 6
      note: "Found: the 7 goes into the optional."
    - line: 12
      pop: true
      vars:
        a: "7"
      note: a holds a value.
    - line: 13
      note: "Now ask about Zed."
    - line: 4
      push:
        name: findGold
        vars:
          name: "\"Zed\""
    - line: 8
      note: "Not found: return an empty optional."
    - line: 13
      pop: true
      vars:
        z: "(empty)"
      note: z holds nothing at all. Not 0, nothing.
    - line: 14
      note: "Check first: a has a value."
    - line: 15
      out: |
        Ana has 7
      note: "*a unwraps it: safe, because we checked."
    - line: 17
      out: |
        Zed has 0
      note: value_or gives a fallback when empty.
challenges:
  - id: w15.l4.c1
    type: predict
    tags: [ w15.optional ]
    prompt: What does this print?
    code: |-
      #include <iostream>
      #include <optional>

      int main() {
          std::optional<int> a;
          std::optional<int> b = 4;
          std::cout << a.has_value() << b.has_value() << ' '
                    << a.value_or(9) + *b << '\n';
          return 0;
      }
    options:
      - t: |
          01 13
        why: "Correct: a is empty (0), b has 4 (1); the fallback 9 plus 4 is 13."
      - t: |
          01 4
        why: a is empty, so value_or(9) returns 9, not 0.
      - t: |
          00 13
        why: b was given 4, so b.has_value() is true.
      - t: |
          false true 13
        why: Without std::boolalpha, bools print as 0 and 1.
    answer: 0
    hints:
      - A default-constructed optional is empty.
      - value_or returns its argument when empty.
    short: "a is empty, b holds 4: prints 01, then 9 + 4 = 13."
    explain: "`std::optional<int> a;` starts empty, so has_value() prints 0; b holds 4, so it prints 1. a.value_or(9) is 9, plus *b (4) is 13. Output: \"01 13\" and a newline."
  - id: w15.l4.c2
    type: breakit
    tags: [ w15.optional, w8.nullcheck ]
    unsafe: true
    prompt: UNSAFE code. The player types a name. Pick the input that breaks it.
    code: |-
      #include <iostream>
      #include <optional>
      #include <string>

      std::optional<int> findGold(const std::string& name) {
          if (name == "Ana") { return 7; }
          if (name == "Bo") { return 0; }
          return std::nullopt;
      }

      int main() {
          std::string who;
          std::cin >> who;
          std::cout << *findGold(who) << '\n';
          return 0;
      }
    options:
      - t: Zed
        why: "Correct: no match, so the optional is empty, and * on an empty optional is UB."
      - t: Ana
        why: Found, holds 7. Unwrapping is safe.
      - t: Bo
        why: Bo holds 0, and 0 is a real value. The optional isn't empty.
    answer: 0
    hints:
      - Which name returns std::nullopt?
      - Holding 0 isn't the same as holding nothing.
    short: Unknown names give an empty optional; unwrapping it with * is UB.
    explain: "`*` doesn't check. On an empty optional it's undefined behavior: it may print leftover garbage, crash, or seem fine. Check with if, or use value_or when a fallback makes sense."
    sideBySide:
      unsafe: std::cout << *findGold(who) << '\n';
      hardened: |-
        if (auto gold = findGold(who); gold) {
            std::cout << *gold << '\n';
        } else {
            std::cout << "No such hero\n";
        }
      prelude: 'auto findGold = [](const std::string& name) -> std::optional<int> { if (name == "Ana") { return 7; } return std::nullopt; }; std::string who;'
  - id: w15.l4.c3
    type: fill
    tags: [ w15.optional ]
    prompt: The item wasn't found. Fill in the return so the caller gets an empty optional.
    code: |-
      #include <optional>
      #include <string>

      std::optional<int> priceOf(const std::string& item) {
          if (item == "potion") {
              return 25;
          }
          return ___;
      }

      int main() {
          return priceOf("sword").value_or(0);
      }
    accept:
      - std::nullopt
      - "{}"
      - std::optional<int>{}
      - std::optional<int>()
    placeholder: empty optional
    hints:
      - There's a special value that means "no value".
      - It lives in std and starts with null.
    short: return std::nullopt; means "no value here".
    explain: "`return std::nullopt;` (or `return {};`) gives the caller an empty optional. Unlike -1, it can't be mistaken for a real price."
  - id: w15.l4.c4
    type: mcq
    tags: [ w15.optional ]
    prompt: gold is an empty std::optional<int>. What does gold.value() do?
    options:
      - t: Throws std::bad_optional_access
        why: "Correct: value() checks, and throws if the optional is empty."
      - t: Returns 0
        why: "That's value_or(0). value() has no fallback."
      - t: Undefined behavior, like *gold
        why: "* doesn't check; value() does, and throws a clear exception instead."
      - t: Compile error
        why: The compiler can't know it will be empty at run time. It compiles.
    answer: 0
    hints:
      - Of *, value() and value_or(), one throws.
      - value() is the checked way to unwrap.
    short: "value() checks and throws std::bad_optional_access when empty."
    explain: "Three ways to unwrap: `*gold` doesn't check (UB if empty), `gold.value()` checks and throws std::bad_optional_access, `gold.value_or(x)` returns x when empty. Pick value_or when a fallback makes sense, and an if check otherwise."
  - id: w15.l4.c5
    type: write
    tags: [ w15.optional ]
    prompt: "found is a std::optional<int>. Write one line: int gold holds its value, or 0 if empty."
    prelude: std::optional<int> found{};
    accept:
      - int gold = found.value_or(0);
      - int gold{found.value_or(0)};
    acceptRe:
      - '^(int|auto) gold ?(=found\.value_or\(0\)|\{found\.value_or\(0\)\});$'
    placeholder: int gold = ...
    hints:
      - One member function takes a fallback.
      - found.value_or(...)
    short: int gold = found.value_or(0); never fails.
    explain: "`found.value_or(0)` returns the stored value, or 0 when the optional is empty. No check needed, no UB, no exception."
recap:
  - "std::optional<T>: a T, or nothing."
  - "Return std::nullopt for \"not found\"."
  - Check with if before *; * on empty is UB.
  - value_or(fallback) never fails.
vault:
  - id: w15.optional
    title: std::optional
    code: |-
      #include <optional>

      std::optional<int> findGold(const std::string& name) {
          if (name == "Ana") {
              return 7;
          }
          return std::nullopt;             // "no value"
      }

      void report(const std::string& name) {
          if (auto gold = findGold(name); gold) {
              std::cout << *gold << '\n';  // safe: checked
          }
          std::cout << findGold(name).value_or(0) << '\n';  // fallback
      }
    note: "* = unchecked (UB if empty), value() = throws, value_or(x) = fallback."
    defense: false
reviewTags: [ w8.nullcheck, w8.nullptr, w6.return, w15.bindings ]
