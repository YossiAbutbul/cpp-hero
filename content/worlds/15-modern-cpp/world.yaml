blurb: "Lambdas, auto, structured bindings, enum class, std::optional and move: the modern toolkit, used without leaving hollow husks or dangling leeches behind."
story:
  intro:
    - The Iterator Wraith is gone and the STL shelves are safe. Brace-tastic!
