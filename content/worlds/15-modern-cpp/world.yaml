    - "Let's learn the modern toolkit: lambdas, auto, enum class, optional and move."
  bossIntro:
    - That's the Move Gremlin! It steals an object's insides and leaves a hollow husk.
    - Never read what it moved from. Refill it first, and capture by value!
  victory:
    - The Gremlin moved itself right out of the Codebase! {^_^}
    - "But every bug we beat hatched from one nest, deep in the Codebase core..."
    - "The Undefined Dragon awaits in World 16. Final boss. Brace yourself!"
