# World 10 mini-project: Hero Card

id: w10.p
title: Hero Card
intro: "Build a Hero that takes hits and drinks potions, but never breaks."
steps:
  - id: w10.p.s1
    type: order
    tags: [ w10.access, w10.class-vs-struct ]
    prompt: "Order the lines: a class with a public getter and private hp_."
    lines:
      - "class Hero {"
      - "public:"
      - "    int hp() const { return hp_; }"
      - "private:"
      - "    int hp_{10};"
      - "};"
    distractors:
      - "private public:"
    hints:
      - Public first, private after.
      - "Every class ends with };"
    short: Public interface first, private data after.
    explain: "Put the public interface first (what callers use), then the private data. The getter is const because it only reads."
  - id: w10.p.s2
    type: fill
    tags: [ w10.validate-ctor, w10.init-list ]
    prompt: "Fill in the blank so maxHp_ is maxHp, but at least 1."
    code: |-
      class Hero {
      public:
          Hero(const std::string& name, int maxHp)
              : name_{name}, maxHp_{___}, hp_{maxHp_} {}

      private:
          std::string name_;
          int maxHp_;
          int hp_;
      };
    accept:
      - std::max(maxHp, 1)
      - std::max(1, maxHp)
    placeholder: expression
    hints:
      - The larger of maxHp and 1.
      - "From <algorithm>: std::m..."
    short: "std::max(maxHp, 1) turns bad values into 1."
    explain: "`std::max(maxHp, 1)` turns 0 and negatives into 1. Since maxHp_ is declared before hp_, `hp_{maxHp_}` then starts the hero at full, validated health."
  - id: w10.p.s3
    type: write
    tags: [ w10.invariant, w10.method ]
    prompt: "Write one line that lowers hp_ by amount, but never below 0."
    code: |-
      class Hero {
      public:
          void takeDamage(int amount) {
              if (amount > 0) {
                  // your line
              }
          }

      private:
          int hp_{10};
      };
    accept:
      - hp_ = std::max(hp_ - amount, 0);
      - hp_ = std::max(0, hp_ - amount);
    acceptRe:
      - ^hp_=std::max\((hp_-amount,0|0,hp_-amount)\);$
    placeholder: hp_ = ...
    hints:
      - Subtract, then keep the larger of that and 0.
      - "Shape: std::max(result, 0)"
    short: Subtract, then floor the result at 0.
    explain: "`hp_ = std::max(hp_ - amount, 0);` subtracts and then floors the result at 0, so the rule 0 <= hp_ always holds. (hp_ - amount can't overflow here: hp_ >= 0 and amount > 0.)"
  - id: w10.p.s4
    type: harden
    tags: [ w10.const-method, w10.getter ]
    prompt: "printCard takes a const Hero&. Pick the keyword so it can call hp()."
    code: |-
      class Hero {
      public:
          int hp() ___ { return hp_; }

      private:
          int hp_{10};
      };

      void printCard(const Hero& h) {
          std::cout << h.hp() << '\n';
      }
    options:
      - t: const
        why: A const method promises to only read.
      - t: static
        why: A static function has no object, so no hp_.
      - t: explicit
        why: explicit is for constructors.
      - t: mutable
        why: mutable never goes after a function's ().
    answer: 0
    hints:
      - h is a const reference.
      - Which keyword after () means read-only?
    short: Only const methods work through a const reference.
    explain: "Through `const Hero&`, only const member functions can be called. `int hp() const` promises (and the compiler enforces) that the getter never changes the Hero."
    sideBySide:
      unsafe: |-
        class Hero {
        public:
            int hp() { return hp_; }   // not const
        private:
            int hp_{10};
        };

        void printCard(const Hero& h) {
            std::cout << h.hp() << '\n';   // error
        }
      hardened: |-
        class Hero {
        public:
            int hp() const { return hp_; }

        private:
            int hp_{10};
        };

        void printCard(const Hero& h) {
            std::cout << h.hp() << '\n';
        }
      expect: error
  - id: w10.p.s5
    type: predict
    tags: [ w10.method, w10.invariant ]
    prompt: What does this test run print?
    code: |-
      #include <algorithm>
      #include <iostream>
      #include <string>

      class Hero {
      public:
          Hero(const std::string& name, int maxHp)
              : name_{name}, maxHp_{std::max(maxHp, 1)}, hp_{maxHp_} {}

          void takeDamage(int amount) {
              if (amount > 0) {
                  hp_ = std::max(hp_ - amount, 0);
              }
          }
          void heal(int amount) {
              if (amount <= 0) {
                  return;
              }
              if (amount >= maxHp_ - hp_) {
                  hp_ = maxHp_;
              } else {
                  hp_ += amount;
              }
          }
          int hp() const { return hp_; }

      private:
          std::string name_;
          int maxHp_;
          int hp_;
      };

      int main() {
          Hero ada{"Ada", 30};
          ada.takeDamage(12);
          std::cout << ada.hp() << ' ';
          ada.heal(50);
          std::cout << ada.hp() << '\n';
          return 0;
      }
    options:
      - t: |
          18 30
        why: Damage leaves 18, and healing caps at 30.
      - t: |
          18 68
        why: heal caps hp_ at maxHp_.
      - t: |
          -12 30
        why: Ada starts at full health, 30.
      - t: |
          18 50
        why: The potion is capped at max HP 30.
    answer: 0
    hints:
      - Ada starts at 30.
      - heal never goes above maxHp_.
    short: heal never pushes hp_ past maxHp_.
    explain: "Ada starts at 30. takeDamage(12) gives 18, printed with a space. heal(50): 50 >= 30 - 18, so hp_ becomes maxHp_ (30). Output: \"18 30\" and a newline."
program: |-
  #include <algorithm>
  #include <iostream>
  #include <string>

  class Hero {
  public:
      Hero(const std::string& name, int maxHp)
          : name_{name.empty() ? "Nameless" : name},
            maxHp_{std::max(maxHp, 1)},
            hp_{maxHp_} {}

      void takeDamage(int amount) {
          if (amount > 0) {
              hp_ = std::max(hp_ - amount, 0);
          }
      }
      void heal(int amount) {
          if (amount <= 0) {
              return;
          }
          if (amount >= maxHp_ - hp_) {
              hp_ = maxHp_;
          } else {
              hp_ += amount;
          }
      }
      const std::string& name() const { return name_; }
      int hp() const { return hp_; }
      int maxHp() const { return maxHp_; }
      bool isAlive() const { return hp_ > 0; }

  private:
      std::string name_;   // rule: never empty
      int maxHp_;          // rule: at least 1
      int hp_;             // rule: 0 <= hp_ <= maxHp_
  };

  int main() {
      std::string name;
      int maxHp{};
      std::cout << "Name and max HP: ";
      if (!(std::cin >> name >> maxHp)) {
          std::cout << "Bad input.\n";
          return 1;
      }
      Hero hero{name, maxHp};

      int damage{};
      int potion{};
      std::cout << "Damage and potion: ";
      if (!(std::cin >> damage >> potion)) {
          std::cout << "Bad input.\n";
          return 1;
      }
      hero.takeDamage(damage);
      hero.heal(potion);

      std::cout << hero.name() << ": " << hero.hp() << '/' << hero.maxHp()
                << (hero.isAlive() ? " (alive)" : " (down)") << '\n';
      return 0;
  }
programStdin: |
  Ada 30
  12 5
stress:
  intro: Brace yourself! I'll poke your Hero with nasty numbers!
  attacks:
    - input: "-15"
      label: Negative damage!
      challenge:
        id: w10.p.a1
        type: harden
        tags: [ w10.invariant, w10.validate ]
        bug: broken-invariant
        prompt: "takeDamage(-15) would heal hp_ to 45. Pick the guard."
        code: |-
          class Hero {
          public:
              void takeDamage(int amount) {
                  if (___) {
                      hp_ = std::max(hp_ - amount, 0);
                  }
              }

          private:
              int hp_{30};
          };
        options:
          - t: amount > 0
            why: Only real damage gets through.
          - t: amount != 0
            why: -15 is not 0, so it still heals.
          - t: amount < 0
            why: Blocks real damage, lets the attack in.
          - t: hp_ > 0
            why: Wrong check. A healthy hero still reaches 45.
        answer: 0
        hints:
          - Which amounts make sense as damage?
          - Subtracting a negative adds.
        short: "Only positive damage counts."
        explain: "Subtracting a negative number adds, so takeDamage(-15) would push hp_ to 45, above maxHp_ 30: invariant broken. Guard the input: only `amount > 0` is real damage."
        sideBySide:
          unsafe: |-
            class Hero {
            public:
                void takeDamage(int amount) {
                    hp_ = std::max(hp_ - amount, 0);   // -15 heals!
                }
            private:
                int hp_{30};
            };
          hardened: |-
            class Hero {
            public:
                void takeDamage(int amount) {
                    if (amount > 0) {
                        hp_ = std::max(hp_ - amount, 0);
                    }
                }

            private:
                int hp_{30};
            };
    - input: "2147483647"
      label: A potion the size of an ocean!
      challenge:
        id: w10.p.a2
        type: harden
        tags: [ w10.invariant, w3.overflow ]
        bug: overflow
        prompt: "heal(2147483647) overflows hp_ + amount. Pick a check that can't overflow."
        code: |-
          class Hero {
          public:
              void heal(int amount) {
                  if (amount <= 0) {
                      return;
                  }
                  if (___) {
                      hp_ = maxHp_;
                  } else {
                      hp_ += amount;
                  }
              }

          private:
              int maxHp_{30};
              int hp_{18};
          };
        options:
          - t: amount >= maxHp_ - hp_
            why: The room left can't overflow; hp_ stays in range.
          - t: hp_ + amount >= maxHp_
            why: The addition overflows (UB) before comparing.
          - t: amount > std::numeric_limits<int>::max()
            why: No int is bigger than the max. Always false.
          - t: hp_ > maxHp_
            why: The invariant says this never happens.
        answer: 0
        hints:
          - Don't do the risky addition to test it.
          - "Compare amount with the room left."
        short: Compare with the room left; it cannot overflow.
        explain: "hp_ + 2147483647 overflows: signed overflow is UB (World 3), and it may silently wrap to a negative hp. Move the math to the safe side: maxHp_ - hp_ is the room left and can't overflow, because the invariant keeps hp_ between 0 and maxHp_."
        sideBySide:
          unsafe: |-
            class Hero {
            public:
                void heal(int amount) {
                    hp_ = std::min(hp_ + amount, maxHp_);   // overflow: UB
                }
            private:
                int maxHp_{30};
                int hp_{18};
            };
          hardened: |-
            class Hero {
            public:
                void heal(int amount) {
                    if (amount <= 0) {
                        return;
                    }
                    if (amount >= maxHp_ - hp_) {
                        hp_ = maxHp_;
                    } else {
                        hp_ += amount;
                    }
                }

            private:
                int maxHp_{30};
                int hp_{18};
            };
    - input: "0"
      label: A hero with 0 max HP!
      challenge:
        id: w10.p.a3
        type: bug
        tags: [ w10.validate-ctor, w10.invariant ]
        bug: broken-invariant
        unsafe: true
        prompt: "Max HP 0 or -5 gets in. Tap the buggy line, then pick the fix."
        code: |-
          class Hero {
          public:
              Hero(const std::string& name, int maxHp)
                  : name_{name},
                    maxHp_{maxHp},
                    hp_{maxHp_} {}

          private:
              std::string name_;
              int maxHp_;
              int hp_;
          };
        bugLine: 4
        options:
          - t: "maxHp_{std::max(maxHp, 1)},"
            why: Every hero starts with at least 1 max HP.
          - t: "maxHp_{maxHp + 1},"
            why: "Fixes 0, but -5 becomes -4."
          - t: "hp_{maxHp},"
            why: Wrong line. maxHp is still unchecked.
          - t: "maxHp_{std::min(maxHp, 1)},"
            why: "Backwards: caps every hero at 1."
        answer: 0
        hints:
          - The constructor copies maxHp blindly.
          - "At least 1: the larger of maxHp and 1."
        short: Validate in the constructor, the only door in.
        explain: "The constructor is the only door into existence. Copying maxHp blindly lets 0 and negatives in, breaking 1 <= maxHp_ and 0 <= hp_. `std::max(maxHp, 1)` fixes every bad value at once. The final program also swaps an empty name for \"Nameless\"."
        sideBySide:
          unsafe: |-
            class Hero {
            public:
                Hero(const std::string& name, int maxHp)
                    : name_{name}, maxHp_{maxHp}, hp_{maxHp_} {}   // 0 or -5 get in
            private:
                std::string name_;
                int maxHp_;
                int hp_;
            };
          hardened: |-
            class Hero {
            public:
                Hero(const std::string& name, int maxHp)
                    : name_{name.empty() ? "Nameless" : name},
                      maxHp_{std::max(maxHp, 1)},
                      hp_{maxHp_} {}

            private:
                std::string name_;
                int maxHp_;
                int hp_;
            };
