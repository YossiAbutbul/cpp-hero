# World 10 · Lesson 1: Structs: bundle your data

id: w10.l1
title: "Structs: bundle your data"
skill: structure
shield: false
concept:
  short: A struct bundles related variables into one type. Reach members with a dot.
  analogy: "A struct is a character sheet: name, hp and level on one card."
  body:
    - "Three loose variables `name`, `hp` and `level` are easy to mix up between heroes. A **struct** groups them into one new type: `struct Hero { std::string name; int hp; int level; };`. Note the `;` after the closing brace."
    - "Each variable inside is a **member**. Create an object with `Hero ada{\"Ada\", 12, 3};` (members are filled in the order they are declared) and reach members with a dot: `ada.hp`, `ada.name`."
    - "Give members **default member initializers**: `int hp{10};`. Then `Hero rookie{};` starts with known values. A member with no default and no value is zero-filled by `{}`, but left as garbage by a plain `Hero h;`. World 2's rule still applies: always initialize."
    - "Structs are values, like ints: `Hero b = a;` copies every member, and changing `b` never touches `a`. Pass big structs by `const Hero&` (World 8) to skip the copy."
    - "A struct is only a **blueprint**. No memory is used until you create an object from it, and you can create as many objects as you like."
  pitfall: "Common beginner mistake: forgetting the `;` after the struct's closing `}`. The error message often points at the NEXT line, which makes it confusing."
demo:
  code: |-
    #include <iostream>
    #include <string>

    struct Hero {
        std::string name{"Nobody"};
        int hp{10};
        int level{1};
    };

    int main() {
        Hero ada{"Ada", 12, 3};
        Hero rookie{};
        rookie.name = "Rex";
        ada.hp -= 2;
        std::cout << ada.name << ' ' << ada.hp << '\n';
        std::cout << rookie.name << ' ' << rookie.hp << ' ' << rookie.level << '\n';
        return 0;
    }
  steps:
    - line: 3
      note: "A blueprint: no object exists yet."
    - line: 10
      mem:
        cells:
          - { name: ada.name, value: "Ada", group: ada }
          - { name: ada.hp, value: "12", group: ada }
          - { name: ada.level, value: "3", group: ada }
      note: "Filled in order: name, hp, level."
    - line: 11
      mem:
        cells:
          - { name: rookie.name, value: "Nobody", group: rookie }
          - { name: rookie.hp, value: "10", group: rookie }
          - { name: rookie.level, value: "1", group: rookie }
      note: "{} uses every default: Nobody, 10, 1."
    - line: 12
      mem:
        cells:
          - { name: rookie.name, value: "Rex" }
      note: The dot reaches one member.
    - line: 13
      mem:
        cells:
          - { name: ada.hp, value: "10" }
      note: Only ada changes.
    - line: 14
      out: |
        Ada 10
    - line: 15
      out: |
        Rex 10 1
      note: Rex kept the default hp and level.
    - line: 16
      note: Two objects, one blueprint.
challenges:
  - id: w10.l1.c1
    type: mcq
    tags: [ w10.struct, w10.member-init ]
    prompt: After this runs, what are p.power and p.uses?
    code: |-
      struct Potion {
          int power{5};
          int uses;
      };

      Potion p{};
    options:
      - t: 5 and 0
        why: power keeps 5; uses becomes 0.
      - t: 5 and garbage
        why: "That's `Potion p;` without braces."
      - t: 0 and 0
        why: "{} doesn't override defaults."
      - t: Compile error
        why: Empty braces are valid here.
    answer: 0
    hints:
      - Members with a default keep it.
      - "What does {} do to a bare int?"
    short: "{} keeps defaults and zero-fills the rest."
    explain: "`Potion p{};` value-initializes: power gets its default member initializer (5), and uses, which has none, is zero-filled. Without the braces (`Potion p;`), uses would hold garbage, and reading it is UB. Safest habit: give every member a default."
  - id: w10.l1.c2
    type: predict
    tags: [ w10.struct, w10.member ]
    prompt: What does this print?
    code: |-
      #include <iostream>

      struct Point {
          int x{};
          int y{};
      };

      int main() {
          Point a{2, 5};
          Point b{a.y, a.x};
          b.x += 1;
          std::cout << b.x << ',' << b.y << '\n';
          return 0;
      }
    options:
      - t: |
          6,2
        why: "b starts as {5, 2}, then x becomes 6."
      - t: |
          3,5
        why: "b got a.y first, so it's swapped."
      - t: |
          5,2
        why: b.x += 1 runs before printing.
      - t: |
          2,6
        why: The code prints b.x first, then b.y.
    answer: 0
    hints:
      - Braces fill in declaration order.
      - b.x gets a.y, which is 5.
    short: Braces fill members in declaration order.
    explain: "`Point b{a.y, a.x}` fills x with 5 and y with 2 (declaration order). `b.x += 1` makes x 6. Output: \"6,2\" and a newline."
  - id: w10.l1.c3
    type: fill
    tags: [ w10.member ]
    prompt: "Type the operator that reaches p's power member."
    prelude: "struct Potion { std::string name; int power{}; };"
    code: |-
      Potion p{"Heal", 5};
      std::cout << p___power << '\n';
    accept:
      - "."
    placeholder: operator
    hints:
      - "Object, operator, member name."
      - One punctuation character.
    short: "The dot reaches a member: p.power."
    explain: "The dot (member access) operator reaches a member of an object: `p.power` is 5. (Through a pointer you'd use `->`: `ptr->power`.)"
  - id: w10.l1.c4
    type: predict
    tags: [ w10.struct, w10.copy ]
    prompt: What does this print?
    code: |-
      #include <iostream>

      struct Hero {
          int hp{10};
      };

      int main() {
          Hero a{};
          Hero b = a;
          b.hp = 3;
          a.hp += 1;
          std::cout << a.hp << ' ' << b.hp << '\n';
          return 0;
      }
    options:
      - t: |
          11 3
        why: b is a separate copy.
      - t: |
          4 4
        why: "b = a copies; it's not a second name."
      - t: |
          11 11
        why: b.hp was set to 3 after the copy.
      - t: |
          10 3
        why: a.hp += 1 makes a 11.
    answer: 0
    hints:
      - "Copy, or second name?"
      - a and b each have their own hp.
    short: "Hero b = a copies every member."
    explain: "Copying a struct copies each member, just like copying an int. b.hp becomes 3 and a.hp becomes 11. Output: \"11 3\" and a newline. (Want a second name instead? That's a reference, `Hero& b = a;`.)"
  - id: w10.l1.c5
    type: bug
    tags: [ w10.struct ]
    expect: error
    prompt: This won't compile. Tap the buggy line, then pick the fix.
    code: |-
      #include <iostream>

      struct Gem {
          int value{100};
      }

      int main() {
          Gem g{};
          std::cout << g.value << '\n';
          return 0;
      }
    bugLine: 4
    options:
      - t: "};"
        why: A struct definition ends with a semicolon.
      - t: "} Gem;"
        why: This declares a variable Gem that hides the type.
      - t: Change struct to class
        why: "Still missing the ;."
      - t: "int main(); {"
        why: The struct above main lacks the ;.
    answer: 0
    hints:
      - The error mentions main. Look above it.
      - How must a struct definition end?
    short: "A struct definition ends with };"
    explain: "`struct Gem { ... }` must be followed by `;`. Without it, the compiler thinks the next line continues the declaration, so the error points at `int main()`. Classic!"
    sideBySide:
      unsafe: |-
        struct Gem {
            int value{100};
        }   // missing ;
      hardened: |-
        struct Gem {
            int value{100};
        };
      expect: error
  - id: w10.l1.c6
    type: write
    tags: [ w10.struct, w10.member ]
    prompt: 'Write one line creating Hero `boss`: name "Golem", hp 50, level 9.'
    prelude: "struct Hero { std::string name; int hp{10}; int level{1}; };"
    accept:
      - Hero boss{"Golem", 50, 9};
      - Hero boss = {"Golem", 50, 9};
    acceptRe:
      - ^Hero boss=?\{"Golem",50,9\};$
    placeholder: Hero boss ...
    hints:
      - "Type, name, values in braces."
      - "Order: name, hp, level."
    short: Values fill members in declaration order.
    explain: 'Brace init fills members in declaration order: `Hero boss{"Golem", 50, 9};`. Then boss.name is "Golem", boss.hp is 50, boss.level is 9.'
recap:
  - A struct bundles related members into one type.
  - "End every struct definition with };"
  - "Reach members with a dot: hero.hp."
  - "Give defaults; {} zero-fills the rest."
vault:
  - id: w10.struct
    title: A struct
    code: |-
      struct Hero {
          std::string name{"Nobody"};
          int hp{10};
          int level{1};
      };

      Hero ada{"Ada", 12, 3};   // in declaration order
      Hero rookie{};            // all defaults
      ada.hp -= 2;              // dot reaches a member
    note: "Don't forget the ; after }. Copies are independent: Hero b = a; copies every member."
    defense: false
reviewTags: [ w2.init, w7.vector, w8.constref, w9.unique ]
