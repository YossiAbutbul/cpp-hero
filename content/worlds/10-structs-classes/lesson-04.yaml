# World 10 · Lesson 4: Classes: public and private

id: w10.l4
title: "Classes: public and private"
skill: structure
shield: false
concept:
  short: "private members can only be touched by the class's own functions; public functions are the only doorway."
  analogy: "A class is a vending machine: the buttons are public, the coins inside stay locked away."
  body:
    - "Access labels split a class in two: everything after `public:` can be used by anyone; everything after `private:` only by the class's own member functions."
    - "`class` and `struct` are the same thing except for the default: a `class` starts out private, a `struct` starts out public. Convention: use `struct` for a plain bundle with no rules, `class` when there are rules to protect."
    - "Outside code that touches a private member doesn't compile: `v.gold_ = 1000000;` is an error. The compiler becomes your guard, for free."
    - "This is **encapsulation**: hide the data, and offer a small set of public operations (`deposit`, `gold()`) that each keep the object valid. Callers use what the class does, not how it stores things."
    - "A **getter** like `int gold() const { return gold_; }` lets others read without writing. The trailing `_` is a common naming habit for private members, so the getter can use the plain name. The `const` means \"only reads\" (more in the Shield lesson)."
    - "Don't add a setter for every member on autopilot. `void setGold(int g) { gold_ = g; }` accepts anything, so the member might as well be public."
  pitfall: "Common beginner mistake: forgetting `public:` in a `class`. Then everything, even the constructor, is private, and `Timer t{30};` fails to compile."
demo:
  code: |-
    #include <iostream>

    class Vault {
    public:
        void deposit(int amount) {
            if (amount > 0) {
                gold_ += amount;
            }
        }
        int gold() const {
            return gold_;
        }

    private:
        int gold_{0};
    };

    int main() {
        Vault v{};
        v.deposit(30);
        v.deposit(-500);
        std::cout << v.gold() << '\n';
        return 0;
    }
  steps:
    - line: 13
      note: "private: only Vault's own functions touch gold_."
    - line: 18
      mem:
        cells:
          - { name: v.gold_, value: "0" }
      note: v starts with 0 gold, locked inside.
    - line: 19
      push: { name: deposit, vars: { amount: "30" } }
      note: The only way in is a public function.
    - line: 6
      mem:
        cells:
          - { name: v.gold_, value: "30" }
      note: "Positive amount: accepted."
    - line: 8
      pop: true
    - line: 20
      push: { name: deposit, vars: { amount: "-500" } }
      note: Someone tries to deposit a negative amount!
    - line: 5
      shield: Negative deposit blocked!
      note: The class checks every change to its own data.
    - line: 8
      pop: true
    - line: 21
      out: |
        30
      note: Read through the public getter. Still 30.
    - line: 22
      note: "Nobody can write v.gold_ = -500 from outside."
challenges:
  - id: w10.l4.c1
    type: mcq
    tags: [ w10.access, w10.class-vs-struct ]
    prompt: What's the ONLY difference between `class` and `struct` in C++?
    options:
      - t: "The default access: class members start private, struct members start public"
        why: "Correct: add labels, and they behave identically."
      - t: Only classes can have member functions
        why: Structs can have methods, constructors and destructors too.
      - t: Structs can't have private members
        why: "A struct can use private: just like a class."
      - t: Classes live on the heap, structs on the stack
        why: Where an object lives depends on how you create it, not the keyword.
    answer: 0
    hints:
      - Both can have methods and constructors.
      - Think about what you get before writing any label.
    short: "Only the default differs: class is private, struct is public."
    explain: "`class` and `struct` are the same feature. The only difference is the default access (and the default for inheritance, World 11). Convention: struct for plain data, class when there are rules to guard."
  - id: w10.l4.c2
    type: bug
    tags: [ w10.access, w10.ctor ]
    expect: error
    prompt: This won't compile. Tap the line that needs a change, then pick the fix.
    code: |-
      #include <iostream>

      class Timer {
          int seconds_{0};
          Timer(int s) : seconds_{s} {}
      };

      int main() {
          Timer t{30};
          std::cout << "Tick tock\n";
          return 0;
      }
    bugLine: 4
    options:
      - t: "public: Timer(int s) : seconds_{s} {}"
        why: "Correct: the constructor must be public so main can create a Timer. seconds_ stays private."
      - t: "private: Timer(int s) : seconds_{s} {}"
        why: It's already private (class default). That's the problem.
      - t: "Timer(int s) : seconds_{s} {} // public"
        why: A comment changes nothing for the compiler.
      - t: "Timer(int s) { seconds_ = s; }"
        why: Still private. How it initializes doesn't matter if nobody can call it.
    answer: 0
    hints:
      - What's the default access in a class?
      - main is outside the class.
    short: "A class starts private. Put public: before the constructor."
    explain: "Everything in a class is private until a label says otherwise, including the constructor. main can't call it, so `Timer t{30};` fails. Add `public:` before the constructor and keep seconds_ private."
    sideBySide:
      unsafe: |-
        class Timer {
            int seconds_{0};
            Timer(int s) : seconds_{s} {}   // private!
        };
      hardened: |-
        class Timer {
        public:
            Timer(int s) : seconds_{s} {}
            int seconds() const { return seconds_; }

        private:
            int seconds_{0};
        };
      expect: clean
  - id: w10.l4.c3
    type: review
    tags: [ w10.access, w10.encapsulation, w10.invariant ]
    bug: broken-invariant
    unsafe: true
    prompt: "Rules: balance is never negative, and owner is never empty. Tap every line that lets outside code break them."
    code: |-
      struct Account {
          std::string owner;
          int balance{0};
      };

      void withdraw(Account& acc, int amount) {
          acc.balance -= amount;
      }

      void renameOwner(Account& acc, const std::string& name) {
          acc.owner = name;
      }
    dangerous: [ 6, 10 ]
    lineNotes:
      "2": "Public data: anyone, anywhere, can write any value here."
      "6": "No check: withdrawing 250 from 100 gives -150."
      "10": "No check: an empty name slips right in."
    hints:
      - Look for writes that never check the new value.
      - Two functions change the account. Do they check anything?
    short: Public data plus unchecked writes means nothing guards the rules.
    explain: "With public members, the rules are only true if EVERY piece of code remembers them. Here withdraw and renameOwner write without checking. Make the members private and let the class's own functions check every change."
    sideBySide:
      unsafe: |-
        struct Account {
            std::string owner;
            int balance{0};
        };

        void withdraw(Account& acc, int amount) {
            acc.balance -= amount;
        }
      hardened: |-
        class Account {
        public:
            explicit Account(const std::string& owner)
                : owner_{owner.empty() ? "Unknown" : owner} {}

            bool withdraw(int amount) {
                if (amount <= 0 || amount > balance_) {
                    return false;
                }
                balance_ -= amount;
                return true;
            }
            int balance() const { return balance_; }

        private:
            std::string owner_;
            int balance_{0};
        };
  - id: w10.l4.c4
    type: predict
    tags: [ w10.encapsulation, w10.getter, w3.modulo ]
    prompt: The Dial keeps its level between 0 and 9. What does this print?
    code: |-
      #include <iostream>

      class Dial {
      public:
          void turn(int steps) {
              level_ = (level_ + steps) % 10;
              if (level_ < 0) {
                  level_ += 10;
              }
          }
          int level() const { return level_; }

      private:
          int level_{0};
      };

      int main() {
          Dial d{};
          d.turn(7);
          d.turn(5);
          std::cout << d.level() << ' ';
          d.turn(-4);
          std::cout << d.level() << '\n';
          return 0;
      }
    options:
      - t: |
          2 8
        why: "Correct: 12 % 10 = 2; then 2 - 4 = -2, % 10 is -2, plus 10 is 8."
      - t: |
          12 8
        why: turn applies % 10 every time, so the level can't reach 12.
      - t: |
          2 -2
        why: -2 % 10 is -2, but the if adds 10 to fix negatives.
      - t: |
          2 2
        why: turn(-4) really turns backward from 2.
    answer: 0
    hints:
      - "% keeps the sign of the left side (World 3)."
      - The if repairs negative results.
    short: "2, then -2 repaired to 8. The class keeps level in 0..9."
    explain: "turn(7): 7. turn(5): 12 % 10 = 2, printed with a space. turn(-4): (2 - 4) % 10 = -2, which is negative, so +10 gives 8. Output: \"2 8\" and a newline. Because level_ is private, turn is the only way to change it, so 0..9 always holds."
  - id: w10.l4.c5
    type: fill
    tags: [ w10.access, w10.private ]
    prompt: Fill in the label that hides value_ from outside code.
    code: |-
      class Score {
      public:
          int value() const { return value_; }

      ___:
          int value_{0};
      };
    accept:
      - private
    placeholder: access label
    hints:
      - It's the opposite of public.
      - Only the class's own functions will be able to touch value_.
    short: "private: hides value_; only Score's own functions can touch it."
    explain: "After `private:`, members can only be used inside the class. Outside code reads the score through the public `value()` getter and can't overwrite it."
  - id: w10.l4.c6
    type: edge
    tags: [ w10.setter, w10.invariant ]
    bug: broken-invariant
    unsafe: true
    prompt: "The rule: age is 0 to 150. Pick ALL calls that break it."
    code: |-
      class Pet {
      public:
          void setAge(int a) { age_ = a; }
          int age() const { return age_; }

      private:
          int age_{0};
      };
    options:
      - t: setAge(-1)
        why: "Correct: a negative age goes straight in. private alone doesn't check anything."
      - t: setAge(0)
        why: A newborn pet. 0 is inside the range.
      - t: setAge(42)
        why: A wise old pet, but inside the range.
      - t: setAge(150)
        why: The upper edge is still allowed.
      - t: setAge(9000)
        why: "Correct: way over 150, and the setter accepts it blindly."
    answers: [ 0, 4 ]
    hints:
      - Test just outside both ends of the range.
      - The setter copies whatever it gets.
    short: A setter that checks nothing makes private pointless.
    explain: "age_ is private, but setAge copies any int, so -1 and 9000 get in. Private only helps if the public functions guard the door. Check (or clamp) in the setter, and test just outside each edge: -1 and 151."
    sideBySide:
      unsafe: |-
        void setAge(int a) { age_ = a; }   // anything goes
      hardened: |-
        class Pet {
        public:
            bool setAge(int a) {
                if (a < 0 || a > 150) {
                    return false;
                }
                age_ = a;
                return true;
            }
            int age() const { return age_; }

        private:
            int age_{0};
        };
      prelude: "int age_{0};"
recap:
  - "private: only the class's own functions touch it."
  - "class starts private; struct starts public."
  - Offer a few public operations, not raw data.
  - A setter must check, or it's a hole.
vault:
  - id: w10.class
    title: A class with private data
    code: |-
      class Vault {
      public:
          void deposit(int amount) {
              if (amount > 0) {
                  gold_ += amount;
              }
          }
          int gold() const { return gold_; }

      private:
          int gold_{0};
      };
    note: "Data private, operations public. Only the class's own functions can change gold_."
    defense: false
reviewTags: [ w8.ref, w6.validate, w10.method, w10.ctor ]
